<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#05080d"><title>Ver · ★ UADAV STREAM</title><script src="/uadav-api-config.js?v=928"></script><style>
:root{--bg:#05080d;--surface:#0d141e;--line:rgba(255,255,255,.09);--muted:#94a3b7;--accent:#00e5ff}*{box-sizing:border-box}body{margin:0;background:#05080d;color:#fff;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}a{color:inherit;text-decoration:none}button,select{font:inherit}.hero{min-height:620px;position:relative;background:#111 center/cover no-repeat;display:flex;align-items:flex-end}.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.95),rgba(0,0,0,.57) 52%,rgba(0,0,0,.18)),linear-gradient(0deg,#05080d,transparent 52%)}.copy{position:relative;z-index:2;width:min(1180px,92vw);margin:auto;padding:86px 0 60px}.top{position:absolute;z-index:4;top:18px;left:4vw;right:4vw;display:flex;justify-content:space-between}.btn{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);background:rgba(255,255,255,.07);color:#fff;padding:10px 14px;border-radius:12px;font-weight:850;cursor:pointer}.btn.primary{background:#fff;color:#061018}.eyebrow{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#9defff;font-weight:950}.hero h1{font-size:clamp(42px,7vw,90px);line-height:.92;letter-spacing:-.055em;margin:10px 0}.meta{display:flex;gap:8px;flex-wrap:wrap;color:#d0dae6}.pill{border:1px solid var(--line);border-radius:999px;padding:6px 9px;background:rgba(255,255,255,.06);font-size:11px}.desc{max-width:760px;line-height:1.6;color:#d3dce7}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.main{width:min(1180px,92vw);margin:auto;padding:22px 0 80px}.season-tabs{display:flex;gap:8px;overflow:auto;margin:18px 0}.tab{border:1px solid var(--line);background:rgba(255,255,255,.04);color:#fff;border-radius:999px;padding:9px 12px;cursor:pointer}.tab.active{background:#fff;color:#061018}.episodes{display:grid;gap:10px}.episode{display:grid;grid-template-columns:220px 1fr auto;gap:14px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:10px}.episode img{width:220px;aspect-ratio:16/9;object-fit:cover;border-radius:11px;background:#111}.episode h3{margin:0 0 6px}.episode p{margin:0;color:var(--muted);line-height:1.45;font-size:12px}.player{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.94);display:none;align-items:center;justify-content:center;padding:20px}.player.active{display:flex}.player-card{width:min(1100px,96vw);background:#0b1017;border:1px solid var(--line);border-radius:22px;overflow:hidden}.frame{aspect-ratio:16/9;background:#000;display:grid;place-items:center}.frame iframe,.frame video{width:100%;height:100%;border:0}.player-foot{padding:14px;display:flex;justify-content:space-between;align-items:center;gap:10px}.empty{padding:28px;border:1px dashed var(--line);border-radius:16px;color:var(--muted)}@media(max-width:720px){.hero{min-height:560px}.episode{grid-template-columns:1fr}.episode img{width:100%}.episode .btn{width:100%}}
</style><link rel="stylesheet" href="/uadav-ui-v8.4.css?v=928"><script src="/uadav-content-player-v928.js" defer></script></head><body><section id="hero" class="hero"><div class="top"><button class="btn" onclick="goBack()">← Volver</button><a class="btn" href="/peliculas-series.html">Catálogo</a></div><div class="copy"><div id="type" class="eyebrow"></div><h1 id="title">Cargando…</h1><div id="meta" class="meta"></div><p id="desc" class="desc"></p><div class="actions"><button id="playMain" class="btn primary">▶ Reproducir</button><button id="trailer" class="btn">Trailer</button></div></div></section><main class="main"><div id="seriesArea" hidden><h2>Temporadas y episodios</h2><div id="seasonTabs" class="season-tabs"></div><div id="episodes" class="episodes"></div></div></main><div id="player" class="player"><div class="player-card"><div id="frame" class="frame"></div><div class="player-foot"><strong id="playerTitle">Contenido</strong><button class="btn" onclick="closePlayer()">Cerrar</button></div></div></div><script>
const API=window.UADAV_API_BASE||'https://uadav-api.uadavstream.workers.dev/api/',$=id=>document.getElementById(id),id=new URLSearchParams(location.search).get('id')||'';let data=null,currentSeason=1;function goBack(){if(history.length>1)history.back();else location.href='/peliculas-series.html'}async function api(path){const r=await fetch(API+path+(path.includes('?')?'&':'?')+'_='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function detect(url){const s=String(url||'');if(/youtube|youtu\.be/i.test(s))return'youtube';if(/spotify/i.test(s))return'spotify';if(/vimeo/i.test(s))return'vimeo';if(/soundcloud/i.test(s))return'soundcloud';if(/drive\.google/i.test(s))return'drive';if(/ok\.ru/i.test(s))return'okru';return'custom'}function openPlayer(url,title,provider){if(!url)return;const item={url,titulo:title||'Contenido',provider:provider||detect(url),content_type:'video'};if(window.UADAVContentPlayer){window.UADAVContentPlayer.open(item);return}window.open(url,'_blank','noopener')}function closePlayer(){window.UADAVContentPlayer?.close()}function renderSeason(n){currentSeason=n;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',Number(b.dataset.s)===n));const eps=(data.episodes||[]).filter(e=>Number(e.season_number||1)===n);$('episodes').innerHTML=eps.length?eps.map(e=>`<article class="episode"><img src="${esc(e.thumbnail||data.title.backdrop||data.title.poster||'')}" alt=""><div><div class="eyebrow">T${n} · E${e.episode_number||1}</div><h3>${esc(e.titulo||e.title||'Episodio')}</h3><p>${esc(e.sinopsis||'')}</p></div><button class="btn primary" onclick='openPlayer(${JSON.stringify(e.url||'')},${JSON.stringify(e.titulo||e.title||'Episodio')},${JSON.stringify(e.provider||'')})'>▶ Ver</button></article>`).join(''):'<div class="empty">No hay episodios en esta temporada.</div>'}function render(){const t=data.title;document.title=(t.titulo||t.title||'Título')+' · ★ UADAV STREAM';$('hero').style.backgroundImage=`url("${String(t.backdrop||t.poster||'').replace(/"/g,'%22')}")`;$('type').textContent=(t.media_type||t.tipo)==='series'?'SERIE':'PELÍCULA';$('title').textContent=t.titulo||t.title||'Sin título';$('desc').textContent=t.sinopsis||'';$('meta').innerHTML=[t.year,...(Array.isArray(t.generos)?t.generos:[])].filter(Boolean).map(x=>`<span class="pill">${esc(x)}</span>`).join('');$('playMain').onclick=()=>{const first=(data.episodes||[])[0];openPlayer((t.media_type||t.tipo)==='series'?(first?.url||''):t.source_url,(t.media_type||t.tipo)==='series'?(first?.titulo||'Primer episodio'):(t.titulo||'Película'),(t.media_type||t.tipo)==='series'?first?.provider:t.provider)};$('trailer').hidden=!t.trailer_url;$('trailer').onclick=()=>openPlayer(t.trailer_url,'Trailer',detect(t.trailer_url));if((t.media_type||t.tipo)==='series'){$('seriesArea').hidden=false;const nums=[...new Set((data.seasons||[]).map(s=>Number(s.season_number||1)).concat((data.episodes||[]).map(e=>Number(e.season_number||1))))].sort((a,b)=>a-b);$('seasonTabs').innerHTML=nums.map(n=>`<button class="tab" data-s="${n}" onclick="renderSeason(${n})">Temporada ${n}</button>`).join('');renderSeason(nums[0]||1)}}async function load(){try{data=await api('media/title?id='+encodeURIComponent(id));render()}catch(e){document.body.innerHTML='<div class="empty" style="margin:25vh auto;width:min(560px,90vw)">Título no disponible.</div>'}}load();
</script><script src="/uadav-shell-bridge-v928.js"></script><script src="/uadav-ui-v8.4.js?v=928"></script></body></html>
