<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Podcast · ★ UADAV STREAM</title><script src="/uadav-api-config.js?v=928"></script><style>body{margin:0;background:#05080d;color:#fff;font-family:Inter,system-ui}.shell{width:min(1300px,92vw);margin:auto;padding:24px 0}.top{display:flex;gap:10px;align-items:center}.btn{border:1px solid #ffffff18;background:#ffffff0b;color:#fff;padding:10px 13px;border-radius:12px;text-decoration:none;font-weight:800}.list{display:grid;gap:10px;margin-top:22px}.item{display:grid;grid-template-columns:100px 1fr auto;gap:14px;align-items:center;border:1px solid #ffffff18;background:#0d141e;border-radius:18px;padding:10px}.item img{width:100px;height:100px;object-fit:cover;border-radius:12px;background:#111}.muted{color:#94a3b7;font-size:12px}@media(max-width:600px){.item{grid-template-columns:72px 1fr}.item img{width:72px;height:72px}.item .btn{grid-column:1/-1}}</style><link rel="stylesheet" href="/uadav-ui-v8.4.css?v=928"><script src="/uadav-content-player-v928.js" defer></script></head><body><main class="shell"><div class="top"><button class="btn" onclick="history.back()">← Volver</button><a class="btn" href="/index.html">★ UADAV STREAM</a></div><h1>Podcast</h1><p class="muted">Programas y episodios relacionados con artistas y la comunidad.</p><div id="list" class="list"></div></main><script>const API=window.UADAV_API_BASE||'https://uadav-api.uadavstream.workers.dev/api/',$=id=>document.getElementById(id);async function load(){try{const a=await fetch(API+'content?_='+Date.now()).then(r=>r.json());const list=(Array.isArray(a)?a:[]).filter(x=>/podcast|episode|rss/i.test(String(x.content_type||x.tipo||x.categoria||'')));$('list').innerHTML=list.map((x,i)=>`<article class="item"><img src="${x.thumbnail||''}" alt=""><div><strong>${x.titulo||'Episodio'}</strong><div class="muted">${x.descripcion||x.provider||''}</div></div><button class="btn" type="button" data-i="${i}">Escuchar</button></article>`).join('')||'<p class="muted">Todavía no hay podcasts.</p>';$('list').querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>window.UADAVContentPlayer?.open(list[Number(b.dataset.i)||0]))}catch{$('list').innerHTML='<p class="muted">No disponible.</p>'}}load()</script><script src="/uadav-ui-v8.4.js?v=928"></script><script src="/uadav-app-bridge-v10.js?v=103"></script>
</body></html>
