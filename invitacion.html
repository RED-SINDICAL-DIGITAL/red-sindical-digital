<!doctype html><html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="same-origin"><title>Invitación · UADAV STREAM</title>
<style>*{box-sizing:border-box}body{margin:0;background:#091321;color:white;font:1rem/1.5 system-ui}main{margin:clamp(2rem,10vh,6rem) auto;padding:1.5rem;width:min(100%,30rem)}input,button{font:inherit;width:100%;padding:.8rem;border-radius:.7rem;margin:.4rem 0 1rem;border:0}button{background:#31c5ec;font-weight:700;cursor:pointer}a{color:#8ce4fc}form{margin-top:1.25rem}details{margin:1.5rem 0}summary{cursor:pointer}</style>
</head>
<body>
<main><a href="/promo.html">Volver a la portada</a><h1>Probá UADAV STREAM</h1>
<form id="request" method="post" action="/demo/solicitar"><label for="email">¿A qué correo te enviamos la invitación?</label><input id="email" name="email" type="email" autocomplete="email" maxlength="254" required><button>Solicitar invitación</button></form>
<form id="redeem" method="post" action="/demo/canjear" hidden><input type="hidden" name="ticket"><button>Entrar con mi invitación</button></form>
<details id="tester"><summary>Ya tengo un código</summary><form method="post" action="/demo/entrar"><label for="code">Código de invitación</label><input id="code" name="code" required type="password" maxlength="128"><button>Entrar a la demo</button></form></details>
<p id="status" role="status"></p></main>
<script>
const form=document.getElementById('request'),redeem=document.getElementById('redeem'),statusText=document.getElementById('status');
if(location.hash.length>1){redeem.elements.ticket.value=location.hash.slice(1);history.replaceState(null,'',location.pathname);form.hidden=true;redeem.hidden=false;document.getElementById('tester').hidden=true}
if(location.search==='?codigo')document.getElementById('tester').open=true;
if(location.search==='?estado=espera')statusText.textContent='El acceso a la demo está en pausa o tu invitación venció.';
form.addEventListener('submit',async event=>{
  event.preventDefault();const button=form.querySelector('button');button.disabled=true;
  try{const r=await fetch(form.action,{method:'POST',body:new FormData(form)});statusText.textContent=await r.text();if(r.ok)form.hidden=true}
  catch{statusText.textContent='No se pudo enviar. Volvé a intentar.'}
  finally{button.disabled=false}
});
</script>
</body>
</html>
