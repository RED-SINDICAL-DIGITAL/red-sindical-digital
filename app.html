<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#05080d"><meta name="uadav-build" content="9.2.8">
<title>★ UADAV STREAM</title>
<style>
:root{--bg:#05080d;--line:rgba(255,255,255,.11);--accent:#00e5ff;--muted:#91a1b5}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--bg);color:#fff;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;overflow:hidden}.frame{width:100%;height:100%;border:0;background:var(--bg)}.player{position:fixed;z-index:100;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(1080px,calc(100% - 28px));display:none;grid-template-columns:68px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border:1px solid rgba(0,229,255,.3);border-radius:20px;background:rgba(9,14,22,.96);box-shadow:0 22px 60px rgba(0,0,0,.42);backdrop-filter:blur(18px)}.player.active{display:grid}.art{width:68px;height:68px;border-radius:13px;object-fit:cover;background:#111}.copy{min-width:0}.kicker{font-size:9px;color:#8cefff;font-weight:900;letter-spacing:.1em;text-transform:uppercase}.title{font-weight:950;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.artist{color:var(--muted);font-size:12px;margin-top:3px}.actions{display:flex;gap:7px;align-items:center}.actions input[type=range]{width:90px;accent-color:var(--accent)}.btn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:#ffffff0c;color:#fff;cursor:pointer;font-weight:900}.btn.main{background:#fff;color:#061018}.bar{height:3px;background:#ffffff16;border-radius:99px;margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--accent),#7c5cff);animation:pulse 1.4s ease-in-out infinite alternate}.player.paused .bar i{animation:none;opacity:.25}@keyframes pulse{to{opacity:.45}}@media(max-width:620px){.player{grid-template-columns:52px minmax(0,1fr) auto;bottom:max(8px,env(safe-area-inset-bottom));padding:8px}.art{width:52px;height:52px}.title{font-size:14px}.actions .secondary,.actions input[type=range]{display:none}}
</style>
<script src="/uadav-api-config.js?v=927"></script>
<script src="/uadav-content-player-v928.js"></script>
</head>
<body>
<iframe id="view" class="frame" title="UADAV STREAM" allow="autoplay; encrypted-media; fullscreen; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin"></iframe>
<div id="player" class="player" aria-live="polite">
  <img id="art" class="art" alt="" onerror="this.onerror=null;this.src='/radio-fallback.svg'">
  <div class="copy"><div class="kicker" id="station">RADIO ★ UADAV STREAM</div><div class="title" id="title">Radio en vivo</div><div class="artist" id="artist"></div><div class="bar"><i></i></div></div>
  <div class="actions"><button id="mute" class="btn secondary" title="Silenciar">🔊</button><input id="volume" type="range" min="0" max="1" step="0.05" value="1" aria-label="Volumen"><button id="pause" class="btn main" title="Reproducir / pausar">▶</button><button id="open" class="btn secondary" title="Abrir perfil">↗</button><button id="close" class="btn" title="Cerrar radio">×</button></div>
</div>
<audio id="audio" preload="none"></audio>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id),view=$('view'),audio=$('audio');
const API=window.UADAV_API_BASE||'https://uadav-api.uadavstream.workers.dev/api/';
const RADIO_KEY='uadav_shell_radio_v928',PREF_KEY='uadav_shell_audio_prefs_v928';
let radio=null,metaSource=null,metaTimer=null,currentMeta=null,metaSeq=0;
const params=new URLSearchParams(location.search);
function cleanView(v){try{const u=new URL(v||'/index.html',location.origin);return u.origin===location.origin?u.pathname+u.search+u.hash:'/index.html'}catch{return'/index.html'}}
function embeddedView(v){const u=new URL(cleanView(v),location.origin);u.searchParams.set('embed','1');u.searchParams.set('build','928');if(params.get('tv')==='1')u.searchParams.set('tv','1');return u.pathname+u.search+u.hash}
function nav(href,push=true){const v=cleanView(href);view.src=embeddedView(v);if(push)history.pushState({view:v},'', '/app.html?view='+encodeURIComponent(v))}
window.addEventListener('popstate',e=>nav(e.state?.view||new URLSearchParams(location.search).get('view')||'/index.html',false));
function radioStream(r){return String(r?.stream_url||r?.url||'').trim()}
function radioName(r){return r?.name||r?.nombre||'Radio'}
function radioArt(r){return r?.logo||r?.imagen||r?.portada||r?.fondo||'/radio-fallback.svg'}
function radioId(r){return String(r?.id||r?.name||r?.nombre||radioStream(r)||'')}
function publicRadio(r){if(!r)return null;return{id:radioId(r),name:radioName(r),nombre:radioName(r),stream_url:radioStream(r),logo:radioArt(r),imagen:radioArt(r),metadata_url:r.metadata_url||r.meta_url||'',programa:r.programa||'',locutor:r.locutor||'',horario:r.horario||''}}
function statePayload(){return{type:'uadav:radio-state',playing:!audio.paused&&!!audio.currentSrc,volume:audio.volume,muted:audio.muted,radio_id:radioId(radio),stream_url:radioStream(radio),radio:publicRadio(radio)}}
function broadcastState(){try{view.contentWindow?.postMessage(statePayload(),location.origin)}catch{}}
function broadcastMeta(m=currentMeta){if(!m)return;try{view.contentWindow?.postMessage({type:'uadav:radio-meta',...m,radio_id:radioId(radio),stream_url:radioStream(radio),station:radioName(radio)},location.origin)}catch{}}
function savePrefs(){try{localStorage.setItem(PREF_KEY,JSON.stringify({volume:audio.volume,muted:audio.muted}))}catch{}}
function saveRadio(){try{if(radio)sessionStorage.setItem(RADIO_KEY,JSON.stringify({radio:publicRadio(radio),meta:currentMeta}));else sessionStorage.removeItem(RADIO_KEY)}catch{}}
function stopMeta(){try{metaSource?.close?.()}catch{}metaSource=null;if(metaTimer)clearInterval(metaTimer);metaTimer=null;metaSeq++}
function parse(raw){const x=raw?.data||raw?.metadata||raw?.now_playing||raw||{},value=String(x.streamTitle||x.title||x.song||x.track||x.songtitle||x.currentSong||'').trim();let artist=String(x.artist||x.author||x.artistName||x.artist_name||'').trim(),title=value;if(!artist&&value.includes(' - ')){const p=value.split(' - ');artist=p.shift().trim();title=p.join(' - ').trim()}return{title:title||radioName(radio)||'Radio en vivo',artist,artwork:String(x.artwork||x.cover||x.album_art||x.image||'').trim()}}
function metadataUrl(r){if(r?.metadata_url||r?.meta_url)return String(r.metadata_url||r.meta_url).trim();const z=radioStream(r).match(/(?:stream(?:-[a-z0-9]+)?\.)?zeno\.fm\/([^/?#]+)/i);return z?`https://api.zeno.fm/mounts/metadata/subscribe/${encodeURIComponent(z[1].replace(/\/source$/i,''))}`:''}
async function coverFor(m,fallback){if(m.artwork)return m.artwork;if(!m.title)return fallback||'';try{const u=API+'radio/cover?artist='+encodeURIComponent(m.artist||'')+'&title='+encodeURIComponent(m.title||'')+'&fallback='+encodeURIComponent(fallback||'')+'&_='+Date.now();const r=await fetch(u,{cache:'no-store'});if(r.ok){const d=await r.json();return d?.artwork||fallback||''}}catch{}return fallback||''}
function mediaSession(m){if(!('mediaSession' in navigator)||!radio)return;try{const art=m?.artwork||radioArt(radio);navigator.mediaSession.metadata=new MediaMetadata({title:m?.title||'Radio en vivo',artist:m?.artist||radioName(radio),album:radioName(radio),artwork:art?[{src:art}]:[]});navigator.mediaSession.playbackState=audio.paused?'paused':'playing';navigator.mediaSession.setActionHandler('play',resume);navigator.mediaSession.setActionHandler('pause',pause);navigator.mediaSession.setActionHandler('stop',closeRadio)}catch{}}
async function setMeta(raw,{fromChild=false}={}){if(!radio)return;const seq=metaSeq,m=parse(raw),fallback=radioArt(radio);m.artwork=await coverFor(m,fallback);if(seq!==metaSeq)return;currentMeta=m;$('title').textContent=m.title||'Radio en vivo';$('artist').textContent=m.artist||radioName(radio);$('station').textContent=radioName(radio)+' · AHORA SUENA';if(m.artwork)$('art').src=m.artwork;mediaSession(m);saveRadio();if(!fromChild)broadcastMeta(m)}
function startMeta(){stopMeta();if(!radio)return;const u=metadataUrl(radio);if(!u){setMeta({title:'Radio en vivo',artist:'',artwork:radioArt(radio)});return}const seq=metaSeq;if(/^https:\/\/api\.zeno\.fm\/mounts\/metadata\/subscribe\//i.test(u)&&window.EventSource){try{const es=new EventSource(u);es.onmessage=e=>{if(seq!==metaSeq)return;try{setMeta(JSON.parse(e.data||'{}'))}catch{}};metaSource=es;return}catch{}}const poll=async()=>{if(seq!==metaSeq)return;try{const r=await fetch(u,{cache:'no-store'});if(r.ok)await setMeta(await r.json())}catch{}};poll();metaTimer=setInterval(poll,15000)}
function updateDock(){if(!radio){$('player').classList.remove('active','paused');return}$('player').classList.add('active');$('player').classList.toggle('paused',audio.paused);$('art').src=currentMeta?.artwork||radioArt(radio)||'';$('station').textContent=radioName(radio)+(audio.paused?' · PAUSADA':' · EN VIVO');$('title').textContent=currentMeta?.title||(audio.paused?'Lista para continuar':'Radio en vivo');$('artist').textContent=currentMeta?.artist||radioName(radio);$('pause').textContent=audio.paused?'▶':'❚❚';$('volume').value=String(audio.volume);$('mute').textContent=audio.muted?'🔇':'🔊'}
function play(r){const incoming=r?{...r}:radio;if(!incoming)return;const stream=radioStream(incoming);if(!stream)return;const same=radio&&radioStream(radio)===stream;radio=incoming;if(!same||!audio.src){audio.src=stream;audio.load();currentMeta=null}audio.play().catch(()=>{});updateDock();startMeta();saveRadio();broadcastState()}
function pause(){if(!audio.src)return;audio.pause();stopMeta();updateDock();mediaSession(currentMeta||{});saveRadio();broadcastState()}
function resume(){if(!radio)return;const stream=radioStream(radio);if(!audio.src&&stream){audio.src=stream;audio.load()}audio.play().catch(()=>{});startMeta();updateDock();broadcastState()}
function closeRadio(){stopMeta();try{audio.pause();audio.removeAttribute('src');audio.load()}catch{}radio=null;currentMeta=null;saveRadio();updateDock();if('mediaSession' in navigator){try{navigator.mediaSession.metadata=null;navigator.mediaSession.playbackState='none'}catch{}}broadcastState()}

function dispatch(d={}){
  if(d.type==='uadav:navigate')nav(d.href);
  else if(d.type==='uadav:radio-state-request'){broadcastState();broadcastMeta();}
  else if(d.type==='uadav:content-play'){pause();window.UADAVContentPlayer?.open(d.item||{}, {local:true});}
  else if(d.type==='uadav:content-close')window.UADAVContentPlayer?.close();
  else if(d.type==='uadav:radio-play')play(d.radio);
  else if(d.type==='uadav:radio-pause')pause();
  else if(d.type==='uadav:radio-close')closeRadio();
  else if(d.type==='uadav:radio-volume'){audio.volume=Math.max(0,Math.min(1,Number(d.value??audio.volume)));audio.muted=false;savePrefs();updateDock();broadcastState()}
  else if(d.type==='uadav:radio-mute'){audio.muted=typeof d.value==='boolean'?d.value:!audio.muted;savePrefs();updateDock();broadcastState()}
  else if(d.type==='uadav:radio-meta')setMeta(d,{fromChild:true});
}
// API síncrona same-origin: conserva el gesto del usuario para audio/video.
// postMessage queda como respaldo para compatibilidad.
window.UADAVShellHost={dispatch,navigate:nav,playRadio:play,pauseRadio:pause,closeRadio,playContent(item){window.__UADAV_LAST_PLAY={at:Date.now(),item};return dispatch({type:'uadav:content-play',item})}};
window.addEventListener('message',e=>{if(e.origin!==location.origin)return;dispatch(e.data||{})});
view.addEventListener('load',()=>{broadcastState();broadcastMeta()});
$('mute').onclick=()=>{audio.muted=!audio.muted;savePrefs();updateDock();broadcastState()};
$('volume').oninput=e=>{audio.volume=Math.max(0,Math.min(1,Number(e.target.value)));audio.muted=false;savePrefs();updateDock();broadcastState()};
$('pause').onclick=()=>audio.paused?resume():pause();
$('open').onclick=()=>{if(radio)nav('/radio.html?v=928&id='+encodeURIComponent(radioId(radio)))};
$('close').onclick=closeRadio;
audio.addEventListener('play',()=>{updateDock();mediaSession(currentMeta||{});broadcastState()});
audio.addEventListener('pause',()=>{updateDock();mediaSession(currentMeta||{});broadcastState()});
audio.addEventListener('volumechange',()=>{updateDock();savePrefs()});
try{const p=JSON.parse(localStorage.getItem(PREF_KEY)||'null');if(p){if(Number.isFinite(Number(p.volume)))audio.volume=Math.max(0,Math.min(1,Number(p.volume)));audio.muted=!!p.muted}}catch{}
try{const saved=JSON.parse(sessionStorage.getItem(RADIO_KEY)||'null');if(saved?.radio){radio=saved.radio;currentMeta=saved.meta||null;updateDock()}}catch{}
nav(params.get('view')||'/index.html',false);
})();
</script>
</body></html>
