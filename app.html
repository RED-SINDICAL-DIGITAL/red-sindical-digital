<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#05080d"><title>★ UADAV STREAM</title><style>
:root{--bg:#05080d;--line:rgba(255,255,255,.11);--accent:#00e5ff;--muted:#91a1b5}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--bg);color:#fff;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;overflow:hidden}.frame{width:100%;height:100%;border:0;background:var(--bg)}.player{position:fixed;z-index:100;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(1080px,calc(100% - 28px));display:none;grid-template-columns:68px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border:1px solid rgba(0,229,255,.3);border-radius:20px;background:rgba(9,14,22,.96);box-shadow:0 22px 60px rgba(0,0,0,.42);backdrop-filter:blur(18px)}.player.active{display:grid}.art{width:68px;height:68px;border-radius:13px;object-fit:cover;background:#111}.copy{min-width:0}.kicker{font-size:9px;color:#8cefff;font-weight:900;letter-spacing:.1em;text-transform:uppercase}.title{font-weight:950;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.artist{color:var(--muted);font-size:12px;margin-top:3px}.actions{display:flex;gap:7px;align-items:center}.actions input[type=range]{width:90px;accent-color:var(--accent)}.btn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:#ffffff0c;color:#fff;cursor:pointer;font-weight:900}.btn.main{background:#fff;color:#061018}.bar{height:3px;background:#ffffff16;border-radius:99px;margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--accent),#7c5cff);animation:pulse 1.4s ease-in-out infinite alternate}@keyframes pulse{to{opacity:.45}}@media(max-width:620px){.player{grid-template-columns:52px minmax(0,1fr) auto;bottom:max(8px,env(safe-area-inset-bottom));padding:8px}.art{width:52px;height:52px}.title{font-size:14px}.actions .secondary{display:none}}
</style></head><body><iframe id="view" class="frame" title="UADAV STREAM"></iframe><div id="player" class="player"><img id="art" class="art" alt=""><div class="copy"><div class="kicker" id="station">RADIO ★ UADAV STREAM</div><div class="title" id="title">Radio en vivo</div><div class="artist" id="artist"></div><div class="bar"><i></i></div></div><div class="actions"><button id="mute" class="btn secondary" title="Silenciar">🔊</button><input id="volume" type="range" min="0" max="1" step="0.05" value="1" aria-label="Volumen"><button id="pause" class="btn main">❚❚</button><button id="open" class="btn secondary">↗</button><button id="close" class="btn">×</button></div></div><audio id="audio" preload="none"></audio><script>
const $=id=>document.getElementById(id),view=$('view'),audio=$('audio');let radio=null,metaSource=null,metaTimer=null;const params=new URLSearchParams(location.search);function cleanView(v){try{const u=new URL(v||'/index.html',location.origin);return u.origin===location.origin?u.pathname+u.search+u.hash:'/index.html'}catch{return'/index.html'}}function nav(href,push=true){const v=cleanView(href);view.src=v+(v.includes('?')?'&':'?')+'embed=1';if(push)history.pushState({view:v},'', '/app.html?view='+encodeURIComponent(v))}window.onpopstate=e=>nav(e.state?.view||new URLSearchParams(location.search).get('view')||'/index.html',false);nav(params.get('view')||'/index.html',false);
function broadcastState(){try{view.contentWindow?.postMessage({type:'uadav:radio-state',playing:!audio.paused&&!!audio.src,volume:audio.volume,muted:audio.muted},location.origin)}catch{}}function stopMeta(){try{metaSource?.close?.()}catch{}metaSource=null;if(metaTimer)clearInterval(metaTimer);metaTimer=null}function parse(d){const x=d?.data||d?.metadata||d?.now_playing||d||{},raw=String(x.streamTitle||x.title||x.song||x.track||'').trim();let artist=String(x.artist||x.author||'').trim(),title=raw;if(!artist&&raw.includes(' - ')){const p=raw.split(' - ');artist=p.shift().trim();title=p.join(' - ').trim()}return{title:title||radio?.name||radio?.nombre||'Radio en vivo',artist,artwork:String(x.artwork||x.cover||x.album_art||x.image||'')}}function setMeta(m){$('title').textContent=m.title||radio?.name||radio?.nombre||'Radio en vivo';$('artist').textContent=m.artist||radio?.name||radio?.nombre||'';$('station').textContent=(radio?.name||radio?.nombre||'Radio')+' · AHORA SUENA';if(m.artwork)$('art').src=m.artwork}function startMeta(){stopMeta();const u=radio?.metadata_url||'';if(!u)return;if(/^https:\/\/api\.zeno\.fm\/mounts\/metadata\/subscribe\//i.test(u)&&window.EventSource){try{const es=new EventSource(u);es.onmessage=e=>{try{setMeta(parse(JSON.parse(e.data||'{}')))}catch{}};metaSource=es;return}catch{}}const poll=async()=>{try{const r=await fetch(u,{cache:'no-store'});if(r.ok)setMeta(parse(await r.json()))}catch{}};poll();metaTimer=setInterval(poll,15000)}function play(r){radio=r||radio;if(!radio?.stream_url)return;audio.src=radio.stream_url;audio.play().catch(()=>{});$('player').classList.add('active');$('art').src=radio.logo||'';$('station').textContent=(radio.name||radio.nombre||'Radio')+' · EN VIVO';$('title').textContent='Radio en vivo';$('artist').textContent=radio.name||'';startMeta();sessionStorage.setItem('uadav_shell_radio',JSON.stringify(radio))}function pause(){audio.pause();$('pause').textContent='▶';broadcastState()}function resume(){audio.play().catch(()=>{});$('pause').textContent='❚❚';broadcastState()}window.addEventListener('message',e=>{if(e.origin!==location.origin)return;const d=e.data||{};if(d.type==='uadav:navigate')nav(d.href);if(d.type==='uadav:radio-play')play(d.radio);if(d.type==='uadav:radio-pause')pause();if(d.type==='uadav:radio-close'){audio.pause();audio.removeAttribute('src');audio.load();stopMeta();radio=null;$('player').classList.remove('active');sessionStorage.removeItem('uadav_shell_radio')}if(d.type==='uadav:radio-volume'){audio.volume=Math.max(0,Math.min(1,Number(d.value||0)));audio.muted=false;$('volume').value=String(audio.volume);$('mute').textContent='🔊'}if(d.type==='uadav:radio-mute'){audio.muted=typeof d.value==='boolean'?d.value:!audio.muted;$('mute').textContent=audio.muted?'🔇':'🔊'}if(d.type==='uadav:radio-meta')setMeta(d)});$('mute').onclick=()=>{audio.muted=!audio.muted;$('mute').textContent=audio.muted?'🔇':'🔊';broadcastState()};$('volume').oninput=e=>{audio.volume=Number(e.target.value);audio.muted=false;$('mute').textContent='🔊';broadcastState()};$('pause').onclick=()=>audio.paused?resume():pause();audio.onplay=()=>{$('pause').textContent='❚❚';broadcastState()};audio.onpause=()=>{$('pause').textContent='▶';broadcastState()};$('open').onclick=()=>{if(radio)nav('/radio.html?id='+encodeURIComponent(radio.id||radio.name||radio.nombre||''))};$('close').onclick=()=>{audio.pause();audio.removeAttribute('src');stopMeta();radio=null;$('player').classList.remove('active');sessionStorage.removeItem('uadav_shell_radio')};try{const saved=JSON.parse(sessionStorage.getItem('uadav_shell_radio')||'null');if(saved){radio=saved;$('player').classList.add('active');$('art').src=radio.logo||'';$('station').textContent=(radio.name||radio.nombre||'Radio')+' · LISTA';$('title').textContent='Tocá ▶ para continuar';$('artist').textContent=radio.name||''}}catch{}
</script></body></html>
