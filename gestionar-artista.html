<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="site-page" content="gestionar"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mi espacio · UADAV STREAM</title><style>
:root{--bg:#05070a;--panel:rgba(13,18,26,.88);--line:rgba(255,255,255,.09);--text:#f6fbff;--muted:#8fa0b6;--accent:#00e5ff;--purple:#8b5cf6;--ok:#6de3a0}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0%,rgba(0,229,255,.10),transparent 35%),radial-gradient(circle at 90% 0%,rgba(139,92,246,.10),transparent 30%),#05070a;color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.shell{width:min(1180px,95vw);margin:0 auto;padding:24px 0 70px}.top{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:18px}.brand{display:flex;gap:10px;align-items:center;font-weight:900}.mark{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--purple));color:#061018}.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);border-radius:12px;padding:11px 15px;color:#fff;background:rgba(255,255,255,.05);font-weight:850;cursor:pointer;text-decoration:none}.btn.primary{background:#fff;color:#071018}.btn.primary:hover{background:var(--accent)}.btn.danger{background:rgba(239,68,68,.10);border-color:rgba(239,68,68,.25)}.layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:18px}.side,.panel{background:var(--panel);border:1px solid var(--line);border-radius:24px;backdrop-filter:blur(18px)}.side{padding:16px;position:sticky;top:14px;height:max-content}.avatar{width:90px;height:90px;border-radius:24px;object-fit:cover;border:1px solid var(--line);background:#0b1118}.name{font-size:20px;font-weight:900;margin-top:12px}.meta{color:var(--muted);font-size:12px;margin-top:4px}.badge{display:inline-flex;margin-top:8px;padding:6px 9px;border-radius:999px;border:1px solid rgba(0,229,255,.18);background:rgba(0,229,255,.06);color:#a7f7ff;font-size:11px;font-weight:850}.nav{display:grid;gap:7px;margin-top:18px}.nav button{padding:11px 12px;text-align:left;border-radius:12px;border:1px solid transparent;background:transparent;color:#afbac9;font-weight:800;cursor:pointer}.nav button.active,.nav button:hover{background:rgba(255,255,255,.05);border-color:var(--line);color:#fff}.private-note{margin-top:18px;padding:12px;border:1px solid rgba(0,229,255,.13);background:rgba(0,229,255,.03);border-radius:14px;font-size:11px;color:#91a2b7;line-height:1.5}.panel{padding:24px}.hero{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;padding:20px;border-radius:18px;background:linear-gradient(135deg,rgba(255,255,255,.05),rgba(0,229,255,.04));border:1px solid rgba(255,255,255,.07)}.hero h1{margin:0;font-size:clamp(30px,5vw,48px);letter-spacing:-.04em}.hero p{margin:8px 0 0;color:var(--muted);line-height:1.5}.section{margin-top:18px;padding:18px;border:1px solid var(--line);border-radius:18px;background:rgba(255,255,255,.018)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.field{display:grid;gap:6px}.field.wide{grid-column:1/-1}label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#aab7c9;font-weight:850}input,textarea,select{width:100%;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.04);color:#fff;padding:12px 13px;outline:none}textarea{min-height:120px;resize:vertical}.status{min-height:22px;color:var(--muted);margin-top:10px;font-size:13px}.ok{color:var(--ok)}.cards{display:grid;gap:10px}.job{padding:14px;border:1px solid var(--line);border-radius:15px;background:rgba(255,255,255,.025)}.job h3{margin:0 0 6px}.job p{color:#a5b2c5;line-height:1.45}.rights-note{color:#8d9db2;font-size:12px;line-height:1.5}.hidden{display:none!important}@media(max-width:850px){.layout{grid-template-columns:1fr}.side{position:relative;top:auto}.nav{grid-template-columns:repeat(5,minmax(0,1fr));overflow:auto}.nav button{white-space:nowrap;text-align:center}.grid{grid-template-columns:1fr}.hero{flex-direction:column}}

<script src="/uadav-api-config.js"></script>
<link rel="stylesheet" href="/uadav-ui-v8.4.css"></head><body><div class="shell" id="app"><div class="status">Cargando espacio privado…</div></div><script>
const API_REMOTE=window.UADAV_API_BASE||'https://uadav-api.uadavstream.workers.dev/api/';const API_BASES=[API_REMOTE,...(window.UADAV_USE_LOCAL_API===true?[location.origin+'/api/']:[])];
async function apiFetch(path,opt={}){let last;for(const base of API_BASES){try{const r=await fetch(base+path,{...opt,cache:opt.cache||'no-store'});const ct=r.headers.get('content-type')||'';if(base!==API_REMOTE&&(r.status===404||!ct.includes('json')))continue;const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||`HTTP ${r.status}`);return d}catch(e){last=e}}throw last||new Error('No se pudo conectar')};const token=new URLSearchParams(location.search).get('token')||'';const initialTab=new URLSearchParams(location.search).get('tab')||'perfil';const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));let artist=null, access=null;
async function get(path){return apiFetch(path)}
async function post(path,body){return apiFetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})}
function render(){const app=document.getElementById('app');const verified=artist?.afiliado_verificado===true;app.innerHTML=`<div class="top"><a class="brand" href="/index.html"><span class="mark">★</span><span>★ UADAV STREAM · Mi espacio</span></a><div><a class="btn" href="/artista.html?id=${encodeURIComponent(artist.id)}">Ver perfil público</a></div></div><div class="layout"><aside class="side"><img class="avatar" src="${esc(artist.foto||'https://via.placeholder.com/180x180?text=ARTISTA')}" alt=""><div class="name">${esc(artist.nombre)}</div><div class="meta">${esc(artist.rubro||'Artista')} · ${esc(artist.ciudad||'')}</div><div class="badge">${verified?'✓ Afiliado UADAV':'Artista UADAV STREAM'}</div><div class="nav"><button data-tab="perfil">Perfil</button><button data-tab="contenido">Contenido</button>${verified?'<button data-tab="bolsa">Bolsa de trabajo</button><button data-tab="derechos">Derechos</button>':''}<button data-tab="estado">Estado</button></div><div class="private-note">Este espacio es privado. Los cambios públicos sensibles pueden quedar sujetos a revisión UADAV.</div></aside><main class="panel"><div id="view"></div></main></div>`;document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>showTab(b.dataset.tab));showTab(initialTab)}
function showTab(tab){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));const v=document.getElementById('view');const verified=artist.afiliado_verificado===true;if(tab==='perfil'){v.innerHTML=`<div class="hero"><div><h1>Mi perfil</h1><p>Editá tu presencia en UADAV STREAM. Podés actualizar tus datos, redes, Live y condiciones de contratación.</p></div><span class="badge">${verified?'Beneficios afiliado activos':'Perfil público'}</span></div><section class="section"><form id="profileForm"><div class="grid"><div class="field"><label>Nombre artístico</label><input name="nombre_artistico" value="${esc(artist.nombre||'')}"></div><div class="field"><label>Rubro</label><input name="rubro" value="${esc(artist.rubro||'')}"></div><div class="field"><label>Ciudad</label><input name="ciudad" value="${esc(artist.ciudad||'')}"></div><div class="field"><label>Foto URL</label><input name="foto" value="${esc(artist.foto||'')}"></div><div class="field"><label>YouTube / canal</label><input name="canal" value="${esc(artist.canal||'')}"></div><div class="field"><label>Live URL</label><input name="live_url" value="${esc(artist.live_url||'')}"></div><div class="field"><label>Honorario desde</label><input name="honorario_desde" value="${esc(artist.honorario_desde||'')}"></div><div class="field"><label>Disponibilidad</label><input name="disponibilidad" value="${esc(artist.disponibilidad||'')}"></div><div class="field"><label>Donación URL</label><input name="donation_url" value="${esc(artist.donation_url||'')}"></div><div class="field"><label>Web</label><input name="web" value="${esc(artist.web||'')}"></div><div class="field wide"><label>Biografía pública</label><textarea name="bio">${esc(artist.bio||'')}</textarea></div></div><div class="actions" style="margin-top:14px"><button class="btn primary" type="submit">Guardar cambios</button></div><div id="profileStatus" class="status"></div></form></section>`;document.getElementById('profileForm').onsubmit=async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target));data.token=token;try{const d=await post('artista/access',data);artist=d.artist;document.getElementById('profileStatus').textContent='✓ Cambios guardados. Los datos sensibles pueden requerir revisión UADAV.';document.getElementById('profileStatus').className='status ok';render()}catch(err){document.getElementById('profileStatus').textContent=err.message;document.getElementById('profileStatus').className='status'}}}
else if(tab==='contenido'){v.innerHTML=`<div class="hero"><div><h1>Mi contenido</h1><p>UADAV STREAM no aloja tus archivos. Publicá el contenido en tu servicio de confianza y cargá solamente la URL.</p></div></div><section class="section"><form id="contentForm"><div class="grid"><div class="field"><label>Título</label><input name="titulo" required></div><div class="field"><label>Tipo</label><select name="tipo"><option>video</option><option>short</option><option>live</option><option>audio</option></select></div><div class="field wide"><label>URL</label><input name="url" placeholder="https://youtube.com/..." required></div><div class="field"><label>Miniatura URL</label><input name="thumbnail"></div><div class="field"><label>Descripción</label><input name="descripcion"></div></div><div class="actions" style="margin-top:14px"><button class="btn primary" type="submit">Enviar a revisión</button></div><div id="contentStatus" class="status"></div></form></section><section class="section"><h2>Lo que ya enviaste</h2><div id="contentList" class="cards">Cargando…</div></section>`;document.getElementById('contentForm').onsubmit=async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target));data.token=token;try{await post('artista/content',data);document.getElementById('contentStatus').textContent='✓ Contenido enviado a revisión.';document.getElementById('contentStatus').className='status ok';e.target.reset();loadContent()}catch(err){document.getElementById('contentStatus').textContent=err.message}};loadContent()}
else if(tab==='bolsa'){v.innerHTML=`<div class="hero"><div><h1>Bolsa de trabajo</h1><p>Como afiliado UADAV, podés participar de oportunidades y postularte.</p></div><span class="badge">✓ Beneficio afiliado</span></div><section class="section"><div id="jobs" class="cards">Cargando oportunidades…</div></section>`;loadJobs()}
else if(tab==='derechos'){v.innerHTML=`<div class="hero"><div><h1>Derechos y documentación</h1><p>Espacio privado para tu información vinculada a SADAIC, AADI y CAPIF. Esta información no se publica en tu perfil.</p></div><span class="badge">Privado</span></div><section class="section"><form id="rightsForm"><div class="grid"><div class="field"><label>SADAIC</label><input name="sadaic" id="sadaic"></div><div class="field"><label>AADI</label><input name="aadi" id="aadi"></div><div class="field"><label>CAPIF</label><input name="capif" id="capif"></div><div class="field"><label>Estado</label><select name="estado"><option>pendiente</option><option>en_revision</option><option>completo</option></select></div><div class="field wide"><label>Links a documentación</label><textarea name="documentos" placeholder="Un enlace por línea"></textarea></div><div class="field wide"><label>Notas</label><textarea name="notas"></textarea></div></div><div class="actions" style="margin-top:14px"><button class="btn primary" type="submit">Guardar información privada</button></div><div id="rightsStatus" class="status"></div></form><p class="rights-note">La plataforma registra la información que UADAV decida administrar. No sustituye los trámites o validaciones de las entidades correspondientes.</p></section>`;loadRights();document.getElementById('rightsForm').onsubmit=async e=>{e.preventDefault();const f=e.target;const data=Object.fromEntries(new FormData(f));data.token=token;data.documentos=String(data.documentos||'').split(/\n+/).map(x=>x.trim()).filter(Boolean);try{await post('artist/rights',data);document.getElementById('rightsStatus').textContent='✓ Información actualizada.';document.getElementById('rightsStatus').className='status ok'}catch(err){document.getElementById('rightsStatus').textContent=err.message}}}
else{v.innerHTML=`<div class="hero"><div><h1>Estado de mi perfil</h1><p>Este espacio muestra qué beneficios y controles están activos.</p></div></div><section class="section"><div class="cards"><div class="job"><strong>Perfil público</strong><p>${artist.visible!==false?'Visible':'Oculto'}</p></div><div class="job"><strong>Afiliación</strong><p>${verified?'✓ Verificada — Live, chat, donaciones, contratación y Bolsa habilitados.':'Aún no verificada — el perfil puede existir, pero los beneficios gremiales no están activos.'}</p></div><div class="job"><strong>Acceso privado</strong><p>Vence: ${access?.expires?new Date(access.expires).toLocaleString('es-AR'):'—'}</p></div></div></section>`}}
async function loadContent(){try{const arr=await get('artista/content?artist_id='+encodeURIComponent(artist.id));document.getElementById('contentList').innerHTML=arr.length?arr.map(x=>`<div class="job"><strong>${esc(x.titulo)}</strong><p>${esc(x.tipo)} · ${esc(x.estado)}</p><a class="btn" href="${esc(x.url)}" target="_blank">Abrir</a></div>`).join(''):'<div class="job">Todavía no hay contenido enviado.</div>'}catch(e){document.getElementById('contentList').textContent=e.message}}
async function loadJobs(){try{const d=await get('artist/jobs?token='+encodeURIComponent(token));const box=document.getElementById('jobs');box.innerHTML=(d.enabled&&d.items?.length)?d.items.map(x=>`<div class="job"><h3>${esc(x.titulo)}</h3><p>${esc(x.rubro||'')} · ${esc(x.ciudad||'')} ${x.fecha?'· '+esc(x.fecha):''}</p><p>${esc(x.descripcion||'')}</p><button class="btn primary" onclick='applyJob(${JSON.stringify(x).replace(/</g,'\u003c')})'>Postularme</button></div>`).join(''):'<div class="job">No hay oportunidades disponibles para este perfil en este momento.</div>'}catch(e){document.getElementById('jobs').textContent=e.message}}
async function applyJob(job){const nombre=prompt('Nombre / nombre artístico')||artist.nombre;const email=prompt('Email')||'';if(!nombre||!email)return;try{await apiFetch('bolsa_trabajo/postular',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({job_id:job.id,artist_token:token,nombre,email,whatsapp:'',mensaje:''})});alert('Postulación enviada.')}catch(e){alert(e.message||'No se pudo enviar')}}
async function loadRights(){try{const d=await get('artist/rights?token='+encodeURIComponent(token));if(d.enabled){const r=d.rights||{};document.getElementById('sadaic').value=r.sadaic||'';document.getElementById('aadi').value=r.aadi||'';document.getElementById('capif').value=r.capif||'';document.querySelector('[name=estado]').value=r.estado||'pendiente';document.querySelector('[name=documentos]').value=(r.documentos||[]).join('\\n');document.querySelector('[name=notas]').value=r.notas||''}}catch(e){document.getElementById('rightsStatus').textContent=e.message}}
get('artista/access?token='+encodeURIComponent(token)).then(d=>{artist=d.artist;access=d.access;render()}).catch(e=>document.getElementById('app').innerHTML='<div class="shell"><div class="panel"><h1>Acceso no disponible</h1><p>'+esc(e.message)+'</p></div></div>');
</script><script src="/site-page-config.js"></script><script src="/uadav-shell-bridge.js"></script><script src="/uadav-ui-v8.4.js"></script></body></html>
