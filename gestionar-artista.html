const API_REMOTE=window.UADAV_API_BASE||'https://uadav-api.uadavstream.workers.dev/api/';const API_BASES=[API_REMOTE,...(window.UADAV_USE_LOCAL_API===true?[location.origin+'/api/']:[])];
async function apiFetch(path,opt={}){let last;for(const base of API_BASES){try{const r=await fetch(base+path,{...opt,cache:opt.cache||'no-store'});const ct=r.headers.get('content-type')||'';if(base!==API_REMOTE&&(r.status===404||!ct.includes('json')))continue;const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||`HTTP ${r.status}`);return d}catch(e){last=e}}throw last||new Error('No se pudo conectar')};const token=new URLSearchParams(location.search).get('token')||'';const initialTab=new URLSearchParams(location.search).get('tab')||'perfil';const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));let artist=null, access=null;
async function get(path){return apiFetch(path)}
async function post(path,body){return apiFetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})}
function render(){const app=document.getElementById('app');const verified=artist?.afiliado_verificado===true;app.innerHTML=`<div class="top"><a class="brand" href="/index.html"><span class="mark">★</span><span>★ UADAV STREAM · Mi espacio profesional</span></a><div><a class="btn" href="/artista.html?id=${encodeURIComponent(artist.id)}">Ver perfil público</a></div></div><div class="layout"><aside class="side"><img class="avatar" src="${esc(artist.foto||'https://via.placeholder.com/180x180?text=ARTISTA')}" alt=""><div class="name">${esc(artist.nombre)}</div><div class="meta">${esc(artist.rubro||'Artista')} · ${esc(artist.ciudad||'')}</div><div class="badge">${verified?'✓ Afiliado UADAV':'Artista UADAV STREAM'}</div><div class="nav"><button data-tab="perfil">Perfil</button><button data-tab="contenido">Contenido</button>${verified?'<button data-tab="bolsa">Bolsa de trabajo</button><button data-tab="comunidad">Comunidad y apoyo</button><button data-tab="derechos">Derechos</button>':''}<button data-tab="estado">Estado</button></div><div class="private-note">Este espacio es privado. Los cambios públicos sensibles pueden quedar sujetos a revisión UADAV.</div></aside><main class="panel"><div id="view"></div></main></div>`;document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>showTab(b.dataset.tab));showTab(initialTab)}
function showTab(tab){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));const v=document.getElementById('view');const verified=artist.afiliado_verificado===true;if(tab==='perfil'){v.innerHTML=`<div class="hero"><div><h1>Mi perfil</h1><p>Editá tu presencia en UADAV STREAM. Podés actualizar tus datos, redes, Live y condiciones de contratación.</p></div><span class="badge">${verified?'Beneficios afiliado activos':'Perfil público'}</span></div><section class="section"><form id="profileForm"><div class="grid"><div class="field"><label>Nombre artístico</label><input name="nombre_artistico" value="${esc(artist.nombre||'')}"></div><div class="field"><label>Rubro</label><input name="rubro" value="${esc(artist.rubro||'')}"></div><div class="field"><label>Ciudad</label><input name="ciudad" value="${esc(artist.ciudad||'')}"></div><div class="field"><label>Foto URL</label><input name="foto" value="${esc(artist.foto||'')}"></div><div class="field"><label>YouTube / canal</label><input name="canal" value="${esc(artist.canal||'')}"></div><div class="field"><label>Live URL</label><input name="live_url" value="${esc(artist.live_url||'')}"></div><div class="field"><label>Honorario desde</label><input name="honorario_desde" value="${esc(artist.honorario_desde||'')}"></div><div class="field"><label>Disponibilidad</label><input name="disponibilidad" value="${esc(artist.disponibilidad||'')}"></div><div class="field"><label>Donación URL</label><input name="donation_url" value="${esc(artist.donation_url||'')}"></div><div class="field"><label>Web</label><input name="web" value="${esc(artist.web||'')}"></div><div class="field wide"><label>Biografía pública</label><textarea name="bio">${esc(artist.bio||'')}</textarea></div></div><div class="actions" style="margin-top:14px"><button class="btn primary" type="submit">Guardar cambios</button></div><div id="profileStatus" class="status"></div></form></section>`;document.getElementById('profileForm').onsubmit=async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target));data.token=token;try{const d=await post('artista/access',data);artist=d.artist;document.getElementById('profileStatus').textContent='✓ Cambios guardados. Los datos sensibles pueden requerir revisión UADAV.';document.getElementById('profileStatus').className='status ok';render()}catch(err){document.getElementById('profileStatus').textContent=err.message;document.getElementById('profileStatus').className='status'}}}
else if(tab==='contenido'){v.innerHTML=`<div class="hero"><div><h1>Mi contenido</h1><p>UADAV STREAM no aloja tus archivos. Publicá el contenido en tu servicio de confianza y cargá solamente la URL.</p></div></div><section class="section"><form id="contentForm"><div class="grid"><div class="field"><label>Título</label><input name="titulo" required></div><div class="field"><label>Tipo</label><select name="tipo"><option>video</option><option>short</option><option>live</option><option>audio</option></select></div><div class="field wide"><label>URL</label><input name="url" placeholder="https://youtube.com/..." required></div><div class="field"><label>Miniatura URL</label><input name="thumbnail"></div><div class="field"><label>Descripción</label><input name="descripcion"></div></div><div class="actions" style="margin-top:14px"><button class="btn primary" type="submit">Enviar a revisión</button></div><div id="contentStatus" class="status"></div></form></section><section class="section"><h2>Lo que ya enviaste</h2><div id="contentList" class="cards">Cargando…</div></section>`;document.getElementById('contentForm').onsubmit=async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target));data.token=token;try{await post('artista/content',data);document.getElementById('contentStatus').textContent='✓ Contenido enviado a revisión.';document.getElementById('contentStatus').className='status ok';e.target.reset();loadContent()}catch(err){document.getElementById('contentStatus').textContent=err.message}};loadContent()}
else if(tab==='comunidad'){const links=Array.isArray(artist.support_links)?artist.support_links:[];const by=p=>links.find(x=>String(x.provider||'').toLowerCase()===p)?.url||'';v.innerHTML=`<div class="hero"><div><h1>Comunidad y apoyo</h1><p>Beneficios para afiliados UADAV: chat de audiencia, apoyo externo, Press Kit y presencia en marketplace. La cuota sindical es independiente de estos aportes.</p></div><span class="badge">✓ Beneficio afiliado</span></div><section class="section"><form id="communityForm"><div class="grid"><div class="field"><label>Ko-fi</label><input id="supKofi" value="${esc(by('kofi'))}" placeholder="https://ko-fi.com/..."></div><div class="field"><label>Cafecito</label><input id="supCafecito" value="${esc(by('cafecito'))}" placeholder="https://cafecito.app/..."></div><div class="field"><label>Mercado Pago</label><input id="supMercadoPago" value="${esc(by('mercadopago'))}" placeholder="https://link.mercadopago.com.ar/..."></div><div class="field"><label>PayPal / apoyo internacional</label><input id="supPaypal" value="${esc(by('paypal'))}" placeholder="https://paypal.me/..."></div><div class="field"><label>Tienda / merchandising</label><input id="supMerch" value="${esc(by('merch'))}" placeholder="https://..."></div><div class="field"><label>Fan club / membresía propia</label><input id="supFanclub" value="${esc(by('fanclub'))}" placeholder="https://..."></div><div class="field"><label><input id="supportEnabled" type="checkbox" ${artist.support_enabled!==false?'checked':''}> Mostrar ❤️ Apoyar</label></div><div class="field"><label><input id="chatEnabled" type="checkbox" ${artist.audience_chat_enabled===true?'checked':''}> Habilitar chat de audiencia</label></div><div class="field"><label><input id="presskitEnabled" type="checkbox" ${artist.presskit_enabled!==false?'checked':''}> Habilitar Press Kit</label></div><div class="field"><label><input id="marketEnabled" type="checkbox" ${artist.marketplace_enabled!==false?'checked':''}> Recibir consultas de contratación</label></div></div><div class="actions" style="margin-top:14px"><button class="btn primary" type="submit">Guardar beneficios</button><a class="btn" href="/presskit.html?id=${encodeURIComponent(artist.id)}" target="_blank">Ver Press Kit</a></div><div id="communityStatus" class="status"></div></form></section>`;document.getElementById('communityForm').onsubmit=async e=>{e.preventDefault();const defs=[['kofi','Ko-fi','supKofi'],['cafecito','Cafecito','supCafecito'],['mercadopago','Mercado Pago','supMercadoPago'],['paypal','PayPal','supPaypal'],['merch','Tienda / Merch','supMerch'],['fanclub','Fan club','supFanclub']];const support_links=defs.map(([provider,label,id])=>({provider,label,url:(document.getElementById(id).value||'').trim(),active:true})).filter(x=>/^https?:\/\//i.test(x.url));const data={token,support_links,support_enabled:document.getElementById('supportEnabled').checked,audience_chat_enabled:document.getElementById('chatEnabled').checked,presskit_enabled:document.getElementById('presskitEnabled').checked,marketplace_enabled:document.getElementById('marketEnabled').checked};try{const d=await post('artista/access',data);artist=d.artist;document.getElementById('communityStatus').textContent='✓ Beneficios actualizados.';document.getElementById('communityStatus').className='status ok'}catch(err){document.getElementById('communityStatus').textContent=err.message}}}
else if(tab==='bolsa'){v.innerHTML=`<div class="hero"><div><h1>Bolsa de trabajo</h1><p>Como afiliado UADAV, podés participar de oportunidades y postularte.</p></div><span class="badge">✓ Beneficio afiliado</span></div><section class="section"><div id="jobs" class="cards">Cargando oportunidades…</div></section>`;loadJobs()}
else if(tab==='derechos'){v.innerHTML=`<div class="hero"><div><h1>Derechos, CCT y documentación</h1><p>Beneficio privado para afiliados UADAV: orientación CCT 340/75, control contractual y seguimiento de SADAIC/AADI cuando corresponda.</p></div><span class="badge">✓ Beneficio afiliado</span></div><section class="section"><h2>Asistente CCT 340/75 · ¿Qué me corresponde?</h2><p class="rights-note">El resultado es orientativo y queda disponible para revisión gremial. Las escalas históricas del convenio no se usan como valores actuales.</p><div id="cctArtistForm" class="grid"><div class="field wide"><label>Categoría / especialidad CCT</label><select id="acCategory"></select></div><div class="field"><label>Establecimiento</label><select id="acVenue"></select></div><div class="field"><label>Día</label><select id="acDay"><option value="weekday">Hábil</option><option value="weekend_holiday">Sábado / domingo / feriado / víspera</option></select></div><div class="field"><label>Funciones</label><input id="acFunctions" type="number" min="1" value="1"></div><div class="field"><label>Monto contractual bruto</label><input id="acAmount" type="number" min="0" step="0.01"></div><div class="field"><label>Valor de una función</label><input id="acPerFunction" type="number" min="0" step="0.01"></div><div class="field"><label>Horas de permanencia</label><input id="acHours" type="number" min="0" step="0.5"></div><div class="field"><label>Distancia (km)</label><input id="acDistance" type="number" min="0"></div><div class="field wide"><label><input id="acRegistered" type="checkbox"> Contrato registrado UADAV</label><label><input id="acDays" type="checkbox"> El contrato indica días/horarios</label><label><input id="acPay" type="checkbox"> El contrato indica remuneración</label><label><input id="acPlace" type="checkbox"> El contrato indica lugar</label><label><input id="acRecord" type="checkbox"> Habrá grabación/retransmisión</label><label><input id="acRecordClause" type="checkbox"> El contrato prevé esa grabación/retransmisión</label><label><input id="acThird" type="checkbox"> Interviene tercero/contratista</label><label><input id="acTour" type="checkbox"> Es gira</label></div><div class="field wide"><strong>Derechos musicales (si aplica)</strong><label><input id="acComposer" type="checkbox"> Soy autor/compositor</label><label><input id="acSadaic" type="checkbox"> SADAIC regularizado</label><label><input id="acSetlist" type="checkbox"> Planilla de ejecución preparada</label><label><input id="acPerformer" type="checkbox"> Soy intérprete en fonogramas</label><label><input id="acAadi" type="checkbox"> AADI regularizado</label><label><input id="acPhono" type="checkbox"> Fonogramas declarados</label></div></div><div class="actions" style="margin-top:14px"><button class="btn primary" onclick="runArtistCct()">Resolver mi caso</button></div><div id="artistCctResult" class="status"></div></section><section class="section"><h2>SADAIC / AADI / CAPIF · seguimiento privado</h2><form id="rightsForm"><div class="grid"><div class="field"><label>SADAIC</label><input name="sadaic" id="sadaic"></div><div class="field"><label>AADI</label><input name="aadi" id="aadi"></div><div class="field"><label>CAPIF</label><input name="capif" id="capif"></div><div class="field"><label>Estado</label><select name="estado"><option>pendiente</option><option>en_revision</option><option>completo</option></select></div><div class="field wide"><label>Links a documentación</label><textarea name="documentos" placeholder="Un enlace por línea"></textarea></div><div class="field wide"><label>Notas</label><textarea name="notas"></textarea></div></div><div class="actions" style="margin-top:14px"><button class="btn primary" type="submit">Guardar información privada</button></div><div id="rightsStatus" class="status"></div></form><p class="rights-note">UADAV STREAM organiza la información y orientación. Los trámites, liquidaciones y validaciones definitivas corresponden a UADAV y/o a las entidades competentes.</p></section>`;loadRights();loadArtistCct();document.getElementById('rightsForm').onsubmit=async e=>{e.preventDefault();const f=e.target;const data=Object.fromEntries(new FormData(f));data.token=token;data.documentos=String(data.documentos||'').split(/\n+/).map(x=>x.trim()).filter(Boolean);try{await post('artist/rights',data);document.getElementById('rightsStatus').textContent='✓ Información actualizada.';document.getElementById('rightsStatus').className='status ok'}catch(err){document.getElementById('rightsStatus').textContent=err.message}}}
else{v.innerHTML=`<div class="hero"><div><h1>Estado de mi perfil</h1><p>Este espacio muestra qué beneficios y controles están activos.</p></div></div><section class="section"><div class="cards"><div class="job"><strong>Perfil público</strong><p>${artist.visible!==false?'Visible':'Oculto'}</p></div><div class="job"><strong>Afiliación</strong><p>${verified?'✓ Verificada — Live, chat, donaciones, contratación y Bolsa habilitados.':'Aún no verificada — el perfil puede existir, pero los beneficios gremiales no están activos.'}</p></div><div class="job"><strong>Acceso privado</strong><p>Vence: ${access?.expires?new Date(access.expires).toLocaleString('es-AR'):'—'}</p></div></div></section>`}}
async function loadContent(){try{const arr=await get('artista/content?artist_id='+encodeURIComponent(artist.id));document.getElementById('contentList').innerHTML=arr.length?arr.map(x=>`<div class="job"><strong>${esc(x.titulo)}</strong><p>${esc(x.tipo)} · ${esc(x.estado)}</p><a class="btn" href="${esc(x.url)}" target="_blank">Abrir</a></div>`).join(''):'<div class="job">Todavía no hay contenido enviado.</div>'}catch(e){document.getElementById('contentList').textContent=e.message}}
async function loadJobs(){try{const d=await get('artist/jobs?token='+encodeURIComponent(token));const box=document.getElementById('jobs');box.innerHTML=(d.enabled&&d.items?.length)?d.items.map(x=>`<div class="job"><h3>${esc(x.titulo)}</h3><p>${esc(x.rubro||'')} · ${esc(x.ciudad||'')} ${x.fecha?'· '+esc(x.fecha):''}</p><p>${esc(x.descripcion||'')}</p><button class="btn primary" onclick='applyJob(${JSON.stringify(x).replace(/</g,'\u003c')})'>Postularme</button></div>`).join(''):'<div class="job">No hay oportunidades disponibles para este perfil en este momento.</div>'}catch(e){document.getElementById('jobs').textContent=e.message}}
async function applyJob(job){const nombre=prompt('Nombre / nombre artístico')||artist.nombre;const email=prompt('Email')||'';if(!nombre||!email)return;try{await apiFetch('bolsa_trabajo/postular',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({job_id:job.id,artist_token:token,nombre,email,whatsapp:'',mensaje:''})});alert('Postulación enviada.')}catch(e){alert(e.message||'No se pudo enviar')}}
async function loadArtistCct(){try{const d=await get('cct/categories');const c=document.getElementById('acCategory'),v=document.getElementById('acVenue');if(c)c.innerHTML=(d.categories||[]).map(x=>`<option value="${esc(x.code)}">${esc(x.group)} · ${esc(x.label)}</option>`).join('');if(v)v.innerHTML=(d.venues||[]).map(x=>`<option value="${esc(x.code)}">${esc(x.label)}</option>`).join('')}catch(e){const box=document.getElementById('artistCctResult');if(box)box.textContent=e.message}}
async function runArtistCct(){const box=document.getElementById('artistCctResult');box.textContent='Calculando…';try{const d=await post('artist/cct/resolve',{token,category_code:document.getElementById('acCategory').value,venue_type:document.getElementById('acVenue').value,day_type:document.getElementById('acDay').value,functions:Number(document.getElementById('acFunctions').value||1),contract_amount:Number(document.getElementById('acAmount').value||0),base_function_amount:Number(document.getElementById('acPerFunction').value||0),hours:Number(document.getElementById('acHours').value||0),distance_km:Number(document.getElementById('acDistance').value||0),contract_registered:document.getElementById('acRegistered').checked,contract_has_days_hours:document.getElementById('acDays').checked,contract_has_compensation:document.getElementById('acPay').checked,contract_has_place:document.getElementById('acPlace').checked,recording_or_retransmission:document.getElementById('acRecord').checked,recording_clause:document.getElementById('acRecordClause').checked,third_party_contract:document.getElementById('acThird').checked,is_tour:document.getElementById('acTour').checked,is_composer:document.getElementById('acComposer').checked,sadaic_registered:document.getElementById('acSadaic').checked,sadaic_setlist:document.getElementById('acSetlist').checked,is_recorded_performer:document.getElementById('acPerformer').checked,aadi_registered:document.getElementById('acAadi').checked,phonograms_declared:document.getElementById('acPhono').checked});const r=d.result||{};box.innerHTML=`<div class="job"><strong>Checklist ${esc(r.compliance_score||0)}%</strong><p>Total estimado: ${esc(r.calculation?.total_estimated||0)} · Aporte sindical estimado 3%: ${esc(r.calculation?.union_contribution_estimated||0)}</p><p>${esc((r.actions||[]).join(' · ')||'Sin acciones pendientes')}</p><p>${esc([...(r.alerts||[]),...(r.contract_checks||[])].join(' · ')||'Sin alertas')}</p></div>`;box.className='status ok'}catch(e){box.textContent=e.message;box.className='status'}}

get('artista/access?token='+encodeURIComponent(token)).then(d=>{artist=d.artist;access=d.access;render()}).catch(e=>document.getElementById('app').innerHTML='<div class="shell"><div class="panel"><h1>Acceso no disponible</h1><p>'+esc(e.message)+'</p></div></div>');
