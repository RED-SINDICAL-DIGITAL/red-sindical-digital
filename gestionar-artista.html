const API_REMOTE=window.UADAV_API_BASE||'https://uadav-api.uadavstream.workers.dev/api/';const API_BASES=[API_REMOTE,...(window.UADAV_USE_LOCAL_API===true?[location.origin+'/api/']:[])];
async function apiFetch(path,opt={}){let last;for(const base of API_BASES){try{const r=await fetch(base+path,{...opt,cache:opt.cache||'no-store'});const ct=r.headers.get('content-type')||'';if(base!==API_REMOTE&&(r.status===404||!ct.includes('json')))continue;const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||`HTTP ${r.status}`);return d}catch(e){last=e}}throw last||new Error('No se pudo conectar')};const ACCESS_KEY='uadav_artist_access_token_v1',params=new URLSearchParams(location.search),queryToken=params.get('token')||'';if(queryToken){try{localStorage.setItem(ACCESS_KEY,queryToken)}catch{}params.delete('token');const qs=params.toString();history.replaceState({},'',location.pathname+(qs?'?'+qs:'')+location.hash)}let token=queryToken||(()=>{try{return localStorage.getItem(ACCESS_KEY)||''}catch{return''}})();let currentTab=params.get('tab')||'perfil',profileDirty=false;const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));let artist=null, access=null;

alue="Mentalista"></option><option value="Humorista"></option><option value="Stand up"></option><option value="Imitador"></option><option value="Transformista"></option><option value="Ventrílocuo"></option><option value="Animador"></option><option value="Actor / Actriz"></option><option value="Bailarín / Bailarina"></option><option value="Malabarista"></option><option value="Acróbata"></option><option value="Trapecista"></option><option value="Payaso / Clown"></option><option value="Artista circense"></option><option value="Titiretero"></option><option value="Performance"></option><option value="Otra especialidad"></option></datalist><small style="color:#8fa0b6">Vos elegís cómo presentarte. Podés escribir una o varias especialidades.</small></div><div class="field"><label>Ciudad</label><input name="ciudad" value="${esc(artist.ciudad||'')}"></div><div class="field"><label>Foto URL</label><input name="foto" value="${esc(artist.foto||'')}"></div><div class="field wide"><label>YouTube · opcional</label><input name="canal" value="${esc(artist.canal||'')}" placeholder="Canal, @usuario o URL de YouTube"><small style="display:block;color:#8f96a3;margin-top:6px">Si tenés un canal propio, podés vincularlo. Tu perfil también funciona sin videos ni canal de YouTube.</small></div><div class="field"><label>Twitch</label><input name="twitch" value="${esc(artist.twitch||artist.redes?.twitch||'')}" placeholder="usuario o URL"></div><div class="field"><label>Kick</label><input name="kick" value="${esc(artist.kick||artist.redes?.kick||'')}" placeholder="usuario o URL"></div><div class="field"><label>Honorario desde</label><input name="honorario_desde" value="${esc(artist.honorario_desde||'')}"></div><div class="field"><label>Disponibilidad</label><input name="disponibilidad" value="${esc(artist.disponibilidad||'')}"></div><div class="field"><label>Apoyar · URL externa</label><input name="donation_url" value="${esc(artist.donation_url||'')}"></div><div class="field"><label>Web</label><input name="web" value="${esc(artist.web||'')}"></div><div class="field wide"><label>Biografía pública</label><textarea name="bio">${esc(artist.bio||'')}</textarea></div></div>${window.UADAVProfileDisplay.form(artist.profile_display)}<div class="actions" style="margin-top:14px"><button class="btn primary" type="submit">Guardar cambios</button></div><div id="profileStatus" class="status"></div></form></section>`;UADAVArtistHandleUI.mount(document.getElementById('artistHandle'),{token,artistId:artist.id,api:API_REMOTE});document.getElementById('profileForm').onsubmit=async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target));data.token=token;data.nombre=data.nombre_artistico;data.profile_display=window.UADAVProfileDisplay.read(e.target);try{if(JSON.stringify(data.profile_display)!==JSON.stringify(window.UADAVProfileDisplay.normalize(artist.profile_display))){const health=await apiFetch('health');if(!(Number(health.build)>=11731))throw Error('Esta opción está preparada. Falta activar la actualización del servidor para guardarla.');}const d=await post('artista/access',data);artist=d.artist;render();document.getElementById('profileStatus').textContent='✓ Cambios guardados. Los datos sensibles pueden requerir revisión UADAV.';document.getElementById('profileStatus').className='status ok'}catch(err){document.getElementById('profileStatus').textContent=err.message;document.getElementById('profileStatus').className='status'}}}

else if(tab==='plan'){v.innerHTML=`<div class="hero"><div><h1>Plan / Artista PRO</h1><p>Tu perfil y su gestión básica siguen siendo gratuitos. PRO agrega herramientas profesionales.</p></div><span class="badge ${pro?'pro':''}">${pro?'★ PRO activo':'Plan Gratis'}</span></div><section class="section"><h2>Transferencia directa</h2><p class="rights-note">UADAV STREAM genera una orden UAD-XXXXX. Transferís desde tu banco o billetera compatible y luego informás el pago. PRO se activa al confirmar el ingreso. La confirmación automática requiere una conexión bancaria configurada; mientras tanto se verifica desde Administración.</p><div id="proOrderBox" class="status">Consultando orden…</div><div class="actions" style="margin-top:14px">${pro?'':'<button class="btn primary" id="createProOrder">Elegir mi PRO</button>'}</div></section>`;loadProOrder();if(!pro)setTimeout(()=>{const b=document.getElementById('createProOrder');if(b)b.onclick=createProOrder},0)}

else if(tab==='derechos'){v.innerHTML=`<div class="hero"><div><h1>Derechos, CCT y documentación</h1><p>Beneficio privado para afiliados UADAV: orientación CCT 340/75, control contractual y seguimiento de SADAIC/AADI cuando corresponda.</p></div><span class="badge">✓ Beneficio afiliado</span></div><section class="section"><h2>Asistente CCT 340/75 · ¿Qué me corresponde?</h2><p class="rights-note">El resultado es orientativo y queda disponible para revisión gremial. Las escalas históricas del convenio no se usan como valores actuales.</p><div id="cctArtistForm" class="grid"><div class="field wide"><label>Categoría / especialidad CCT</label><select id="acCategory"></select></div><div class="field"><label>Establecimiento</label><select id="acVenue"></select></div><div class="field"><label>Día</label><select id="acDay"><option value="weekday">Hábil</option><option value="weekend_holiday">Sábado / domingo / feriado / víspera</option></select></div><div class="field"><label>Funciones</label><input id="acFunctions" type="number" min="1" value="1"></div><div class="field"><label>Monto contractual bruto</label><input id="acAmount" type="number" min="0" step="0.01"></div><div class="field"><label>Valor de una función</label><input id="acPerFunction" type="number" min="0" step="0.01"></div><div class="field"><label>Horas de permanencia</label><input id="acHours" type="number" min="0" step="0.5"></div><div class="field"><label>Distancia (km)</label><input id="acDistance" type="number" min="0"></div><div class="field wide"><label><input id="acRegistered" type="checkbox"> Contrato registrado UADAV</label><label><input id="acDays" type="checkbox"> El contrato indica días/horarios</label><label><input id="acPay" type="checkbox"> El contrato indica remuneración</label><label><input id="acPlace" type="checkbox"> El contrato indica lugar</label><label><input id="acRecord" type="checkbox"> Habrá grabación/retransmisión</label><label><input id="acRecordClause" type="checkbox"> El contrato prevé esa grabación/retransmisión</label><label><input id="acThird" type="checkbox"> Interviene tercero/contratista</label><label><input id="acTour" type="checkbox"> Es gira</label></div><div class="field wide"><strong>Derechos musicales (si aplica)</strong><label><input id="acComposer" type="checkbox"> Soy autor/compositor</label><label><input id="acSadaic" type="checkbox"> SADAIC regularizado</label><label><input id="acSetlist" type="checkbox"> Planilla de ejecución preparada</label><label><input id="acPerformer" type="checkbox"> Soy intérprete en fonogramas</label><label><input id="acAadi" type="checkbox"> AADI regularizado</label><label><input id="acPhono" type="checkbox"> Fonogramas declarados</label></div></div><div class="actions" style="margin-top:14px"><button class="btn primary" onclick="runArtistCct()">Resolver mi caso</button></div><div id="artistCctResult" class="status"></div></section><section class="section"><h2>SADAIC / AADI / CAPIF · seguimiento privado</h2><form id="rightsForm"><div class="grid"><div class="field"><label>SADAIC</label><input name="sadaic" id="sadaic"></div><div class="field"><label>AADI</label><input name="aadi" id="aadi"></div><div class="field"><label>CAPIF</label><input name="capif" id="capif"></div><div class="field"><label>Estado</label><select name="estado"><option>pendiente</option><option>en_revision</option><option>completo</option></select></div><div class="field wide"><label>Links a documentación</label><textarea name="documentos" placeholder="Un enlace por línea"></textarea></div><div class="field wide"><label>Notas</label><textarea name="notas"></textarea></div></div><div class="actions" style="margin-top:14px"><button class="btn primary" type="submit">Guardar información privada</button></div><div id="rightsStatus" class="status"></div></form><p class="rights-note">UADAV STREAM organiza la información y orientación. Los trámites, liquidaciones y validaciones definitivas corresponden a UADAV y/o a las entidades competentes.</p></section>`;loadRights();loadArtistCct();document.getElementById('rightsForm').onsubmit=async e=>{e.preventDefault();const f=e.target;const data=Object.fromEntries(new FormData(f));data.token=token;data.documentos=String(data.documentos||'').split(/\n+/).map(x=>x.trim()).filter(Boolean);try{await post('artist/rights',data);document.getElementById('rightsStatus').textContent='✓ Información actualizada.';document.getElementById('rightsStatus').className='status ok'}catch(err){document.getElementById('rightsStatus').textContent=err.message}}}
else{v.innerHTML=`<div class="hero"><div><h1>Estado de mi perfil</h1><p>Este espacio muestra qué beneficios y controles están activos.</p></div></div><section class="section"><div class="cards"><div class="job"><strong>Perfil público</strong><p>${artist.visible!==false?'Visible':'Oculto'}</p></div><div class="job"><strong>Afiliación</strong><p>${verified?'✓ Afiliación verificada. Los beneficios sindicales son independientes de PRO.':'Aún no verificada — el perfil puede existir, pero los beneficios gremiales no están activos.'}</p></div><div class="job"><strong>Acceso privado</strong><p>Vence: ${access?.expires?new Date(access.expires).toLocaleString('es-AR'):'—'}</p></div></div></section>`}}
let myContent=[];
async function loadContent(){try{myContent=await apiFetch('artista/content',{headers:{Authorization:'Bearer '+token}});const box=document.getElementById('contentList');if(!box)return;box.innerHTML=myContent.length?myContent.map((x,i)=>`<div class="job"><strong>${esc(x.titulo)}</strong><p>${esc(x.tipo)} · ${esc(x.estado)} · Orden ${esc(x.orden||0)}</p><button class="btn" data-content-edit="${i}">Editar</button> ${/^https?:\/\//i.test(x.url)?`<a class="btn" href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">Abrir</a>`:''}</div>`).join(''):'<div class="job">Agregá tu primer video o audio.</div>';box.querySelectorAll('[data-content-edit]').forEach(btn=>btn.onclick=()=>{const x=myContent[+btn.dataset.contentEdit],form=document.getElementById('contentForm');for(const key of ['id','titulo','tipo','url','thumbnail','descripcion','orden'])if(form.elements[key])form.elements[key].value=x[key]||'';form.scrollIntoView({behavior:'smooth'});document.getElementById('contentStatus').textContent='Editando '+x.titulo})}catch(e){const box=document.getElementById('contentList');if(box)box.textContent=e.message}}
function inlineForm(title,fields,onSubmit){let dialog=document.getElementById('inlineDialog');if(!dialog){dialog=document.createElement('dialog');dialog.id='inlineDialog';dialog.style.cssText='background:#111826;color:white;border:1px solid #334155;border-radius:18px;width:min(600px,94vw)';document.body.append(dialog)}dialog.innerHTML=`<form><h2>${esc(title)}</h2><div class="grid">${fields.map(([key,label,value,type='text',required=false])=>`<div class="field"><label for="inline_${key}">${esc(label)}</label><input id="inline_${key}" name="${key}" type="${type}" value="${esc(value)}" ${required?'required':''}></div>`).join('')}</div><p role="status" id="inlineStatus"></p><button class="btn" type="button" id="inlineCancel">Cancelar</button> <button class="btn primary">Enviar</button></form>`;dialog.querySelector('#inlineCancel').onclick=()=>dialog.close();dialog.querySelector('form').onsubmit=async e=>{e.preventDefault();const button=e.target.querySelector('[type="submit"]')||e.target.querySelector('.primary');button.disabled=true;try{await onSubmit(Object.fromEntries(new FormData(e.target)));dialog.close()}catch(err){dialog.querySelector('#inlineStatus').textContent=err.message}finally{button.disabled=false}};dialog.showModal()}
async function loadJobs(){try{const d=await get('artist/jobs?token='+encodeURIComponent(token));const box=document.getElementById('jobs');box.innerHTML=(d.enabled&&d.items?.length)?d.items.map(x=>`<div class="job"><h3>${esc(x.titulo)}</h3><p>${esc(x.rubro||'')} · ${esc(x.ciudad||'')} ${x.fecha?'· '+esc(x.fecha):''}</p><p>${esc(x.descripcion||'')}</p><button class="btn primary" onclick='applyJob(${JSON.stringify(x).replace(/</g,'\u003c')})'>Postularme</button></div>`).join(''):'<div class="job">No hay oportunidades disponibles para este perfil en este momento.</div>'}catch(e){document.getElementById('jobs').textContent=e.message}}
async function applyJob(job){inlineForm('Postularme · '+job.titulo,[['nombre','Nombre artístico',artist.nombre,'text',true],['email','Email',artist.email||'','email',true],['whatsapp','WhatsApp','','tel'],['mensaje','Presentación breve','']],async values=>{await post('bolsa_trabajo/postular',{job_id:job.id,artist_token:token,...values});document.getElementById('jobs').insertAdjacentHTML('afterbegin','<p role="status">Postulación enviada.</p>')})}
async function loadArtistCct(){try{const d=await get('cct/categories');const c=document.getElementById('acCategory'),v=document.getElementById('acVenue');if(c)c.innerHTML=(d.categories||[]).map(x=>`<option value="${esc(x.code)}">${esc(x.group)} · ${esc(x.label)}</option>`).join('');if(v)v.innerHTML=(d.venues||[]).map(x=>`<option value="${esc(x.code)}">${esc(x.label)}</option>`).join('')}catch(e){const box=document.getElementById('artistCctResult');if(box)box.textContent=e.message}}
async function runArtistCct(){const box=document.getElementById('artistCctResult');box.textContent='Calculando…';try{const d=await post('artist/cct/resolve',{token,category_code:document.getElementById('acCategory').value,venue_type:document.getElementById('acVenue').value,day_type:document.getElementById('acDay').value,functions:Number(document.getElementById('acFunctions').value||1),contract_amount:Number(document.getElementById('acAmount').value||0),base_function_amount:Number(document.getElementById('acPerFunction').value||0),hours:Number(document.getElementById('acHours').value||0),distance_km:Number(document.getElementById('acDistance').value||0),contract_registered:document.getElementById('acRegistered').checked,contract_has_days_hours:document.getElementById('acDays').checked,contract_has_compensation:document.getElementById('acPay').checked,contract_has_place:document.getElementById('acPlace').checked,recording_or_retransmission:document.getElementById('acRecord').checked,recording_clause:document.getElementById('acRecordClause').checked,third_party_contract:document.getElementById('acThird').checked,is_tour:document.getElementById('acTour').checked,is_composer:document.getElementById('acComposer').checked,sadaic_registered:document.getElementById('acSadaic').checked,sadaic_setlist:document.getElementById('acSetlist').checked,is_recorded_performer:document.getElementById('acPerformer').checked,aadi_registered:document.getElementById('acAadi').checked,phonograms_declared:document.getElementById('acPhono').checked});const r=d.result||{};box.innerHTML=`<div class="job"><strong>Checklist ${esc(r.compliance_score||0)}%</strong><p>Total estimado: ${esc(r.calculation?.total_estimated||0)} · Aporte sindical estimado 3%: ${esc(r.calculation?.union_contribution_estimated||0)}</p><p>${esc((r.actions||[]).join(' · ')||'Sin acciones pendientes')}</p><p>${esc([...(r.alerts||[]),...(r.contract_checks||[])].join(' · ')||'Sin alertas')}</p></div>`;box.className='status ok'}catch(e){box.textContent=e.message;box.className='status'}}
async function loadProOrder(){const box=document.getElementById('proOrderBox');if(!box)return;try{const [d,pay]=await Promise.all([get('pro/payment-orders/current?token='+encodeURIComponent(token)),get('pro/payment-settings').catch(()=>({enabled:false}))]),o=d.order;const destination=o?await get('pro/payment-destination?token='+encodeURIComponent(token)).catch(()=>({enabled:false})):pay;if(!o){const opts=[['monthly','1 mes',pay.monthly_amount],['quarterly','3 meses',pay.quarterly_amount],['semiannual','6 meses',pay.semiannual_amount],['annual','12 meses',pay.annual_amount]].filter(x=>Number(x[2])>0);box.innerHTML=pay.enabled&&opts.length?'<b>Elegí cómo activar PRO</b><br><select id="proPeriod" style="margin-top:10px;padding:10px;border-radius:10px;background:#111827;color:#fff;border:1px solid #334155">'+opts.map(x=>'<option value="'+x[0]+'">'+x[1]+' · '+esc(pay.currency)+' '+Number(x[2]).toLocaleString('es-AR')+'</option>').join('')+'</select><br><small>La Administración define qué períodos están disponibles y sus importes.</small>':'<b>Cobro PRO todavía no habilitado.</b> Administración está terminando la configuración de transferencia.';const create=document.getElementById('createProOrder');if(create)create.disabled=!(pay.enabled&&opts.length);return}box.className='status ok';const bank=destination.enabled&&['pending','reported'].includes(o.status)?'<br><br><b>Transferir a:</b><br>Titular: '+esc(destination.account_holder||'—')+(destination.alias?'<br>Alias: '+esc(destination.alias):'')+(destination.cbu_cvu?'<br>CBU/CVU: '+esc(destination.cbu_cvu):'')+(destination.instructions?'<br><small>'+esc(destination.instructions)+'</small>':''):'';box.innerHTML='<b>Orden '+esc(o.id)+'</b><br>Estado: '+esc(({pending:'Pendiente de transferencia',reported:'Transferencia informada · Falta confirmar el ingreso',approved:'PRO activado',rejected:'Pago rechazado'})[o.status]||o.status)+' · '+Number(o.duration_days||365)+' días'+(o.amount?' · '+esc(o.currency)+' '+Number(o.amount).toLocaleString('es-AR'):'')+bank+(o.status==='pending'?'<div class="actions" style="margin-top:12px"><button class="btn primary" id="reportProPayment">Ya transferí · Informar pago</button></div>':o.status==='approved'?'<br>Tu PRO está activo en esta cuenta. Entrá a Mi espacio de artista desde Mi perfil.':o.status==='rejected'?'<br>La transferencia fue rechazada. Consultá con Administración.':'<br>Tu aviso quedó guardado. PRO se activa cuando se confirma el ingreso. No necesitás otro enlace para acceder.');const b=document.getElementById('reportProPayment');if(b)b.onclick=()=>reportProPayment(o.id)}catch(e){box.textContent=e.message}}
async function createProOrder(){try{const health=await get('health');if(Number(health.build)<11739)throw Error('Administración debe actualizar el servidor a 11739 antes de crear pedidos PRO vinculados a la cuenta.');token=await UADAVArtistAccount.preparePayment(token);const period=document.getElementById('proPeriod')?.value||'annual';await post('pro/payment-orders',{token,plan_period:period});await loadProOrder()}catch(e){const box=document.getElementById('proOrderBox');if(box)box.textContent=e.message}}
async function reportProPayment(id){inlineForm('Informar transferencia',[['payment_reference','Titular o referencia de transferencia','','text',true],['payer_note','Observación opcional','']],async values=>{await post('pro/payment-orders/report',{token,order_id:id,...values});await loadProOrder()})}
async function loadRights(){try{const d=await get('artist/rights?token='+encodeURIComponent(token));if(d.enabled){const r=d.rights||{};document.getElementById('sadaic').value=r.sadaic||'';document.getElementById('aadi').value=r.aadi||'';document.getElementById('capif').value=r.capif||'';document.querySelector('[name=estado]').value=r.estado||'pendiente';document.querySelector('[name=documentos]').value=(r.documentos||[]).join('\\n');document.querySelector('[name=notas]').value=r.notas||''}}catch(e){document.getElementById('rightsStatus').textContent=e.message}}
UADAVArtistAccount.restore(token,!!queryToken).then(t=>{token=t;if(!token)throw Error('Abrí tu enlace privado de artista o entrá desde Mi cuenta.');return get('artista/access?token='+encodeURIComponent(token))}).then(async d=>{if(params.get('artist_id')&&String(d.artist?.id)!==params.get('artist_id'))throw Error('Este acceso corresponde a otro artista. Volvé a Mi cuenta y elegí su perfil.');artist=d.artist;access=d.access;if(!params.has('tab'))try{currentTab=sessionStorage.getItem('uadav_artist_tab_v130_'+artist.id)||currentTab}catch{};try{const p=await get('artist/plan?token='+encodeURIComponent(token));if(p?.plan){artist.plan=p.plan;artist.pro_active=p.plan==='pro';artist.pro_expires_at=p.pro_expires_at||artist.pro_expires_at}}catch(_){}render()}).catch(e=>document.getElementById('app').innerHTML='<div class="shell"><div class="panel"><h1>Recuperá tu acceso de artista</h1><p>'+esc(e.message)+'</p><p>Si ya vinculaste tu artista, abrí Mi perfil e ingresá a la misma cuenta. Una ventana privada o un navegador distinto necesitan vincularse también.</p><div class="actions"><a class="btn primary" href="/usuario.html">Abrir Mi perfil</a><button class="btn" onclick="location.reload()">Volver a comprobar</button><a class="btn" href="/para-artistas.html">Crear o reclamar un perfil</a></div></div></div>');
</script><script src="/site-page-config.js"></script><script src="/uadav-ui-v8.4.js"></script><script src="/uadav-app-bridge-v104.js"></script>
