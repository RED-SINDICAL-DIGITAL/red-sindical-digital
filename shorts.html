<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#05070b"><meta name="uadav-build" content="10.11"><title>Shorts · ★ UADAV STREAM</title><script src="/uadav-api-config.js?v=1011"></script><style>
:root{--bg:#05070b;--line:rgba(255,255,255,.12);--accent:#2f6df6;--muted:#b7c3d2;--live:#ff3654}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:#fff;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;height:100%;overflow:hidden}button{font:inherit}.feed{height:100dvh;overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior-y:contain;scrollbar-width:none}.feed::-webkit-scrollbar{display:none}.short{height:100dvh;scroll-snap-align:start;scroll-snap-stop:always;display:grid;place-items:center;position:relative}.stage{height:min(100dvh,920px);aspect-ratio:9/16;max-width:100vw;position:relative;overflow:hidden;background:#0b1017}.poster,.player{position:absolute;inset:0;width:100%;height:100%;border:0;object-fit:cover}.poster{z-index:1}.player{z-index:2;background:#000}.shade{position:absolute;z-index:3;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.88),transparent 48%),linear-gradient(180deg,rgba(0,0,0,.45),transparent 20%);pointer-events:none}.copy{position:absolute;z-index:4;left:18px;right:78px;bottom:max(34px,env(safe-area-inset-bottom));text-shadow:0 2px 16px #000}.copy h2{font-size:20px;line-height:1.15;margin:8px 0 5px}.copy p{font-size:12px;color:#e1e8f1;margin:0;line-height:1.4}.badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 9px;background:#101824d9;border:1px solid var(--line);font-size:10px;font-weight:950;letter-spacing:.05em}.badge.live{background:rgba(255,54,84,.9)}.badge.member{background:rgba(47,109,246,.9);color:#041017}.actions{position:absolute;z-index:5;right:8px;bottom:max(34px,env(safe-area-inset-bottom));display:grid;gap:9px;width:62px;justify-items:center}.round{width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:#101824dc;color:#fff;font-size:20px;font-weight:950;cursor:pointer;backdrop-filter:blur(12px)}.round span{display:block;font-size:7px;line-height:1;margin-top:1px;max-width:58px;overflow:hidden;text-overflow:ellipsis}.hint{position:absolute;z-index:6;top:max(14px,env(safe-area-inset-top));left:14px;font-size:11px;font-weight:900;background:#05070b99;border:1px solid var(--line);border-radius:999px;padding:7px 10px;backdrop-filter:blur(10px)}.empty{height:100%;display:grid;place-items:center;text-align:center;color:var(--muted);padding:30px}@media(min-width:700px){.stage{height:min(92dvh,920px);border-radius:24px;border:1px solid var(--line);box-shadow:0 30px 100px #000a}.short{padding:4dvh 0}}@media(prefers-reduced-motion:reduce){.feed{scroll-behavior:auto}}
</style></head><body><main id="feed" class="feed"><div class="empty">Cargando Shorts…</div></main><script>
const API=window.UADAV_API_BASE||'https://uadav-api.uadavstream.workers.dev/api/',$=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));let items=[],observer=null,active=-1;
async function api(path){const r=await fetch(API+path+(path.includes('?')?'&':'?')+'_='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}
function vid(x){const u=String(x.url||x.youtube_url||'');const m=u.match(/[?&]v=([\w-]{11})/)||u.match(/youtu\.be\/([\w-]{11})/)||u.match(/\/(?:shorts|embed|live)\/([\w-]{11})/);return x.external_id||x.youtube_id||x.videoId||m?.[1]||''}
function artistId(x){return x.artist_id||x.artista_id||x.owner_artist_id||''}
function isLive(x){return x.live===true||x.en_vivo===true||/live|en vivo/i.test(String(x.estado||x.content_type||''))}
function score(x){let s=0;if(isLive(x))s+=1000;if(x.afiliado_verificado===true||x.artist_affiliated===true)s+=500;if(x.claimed===true||x.artist_claimed===true)s+=160;s+=Math.min(300,Number(x.trending_score||x.score||x.views_24h||0));const ts=Date.parse(x.published_at||x.fecha||x.created_at||0);if(ts)s+=Math.max(0,100-(Date.now()-ts)/86400000);return s+Math.random()*15}
function card(x,i){const id=vid(x),thumb=x.thumbnail||(id?`https://i.ytimg.com/vi/${id}/maxresdefault.jpg`:'');const live=isLive(x),aff=x.afiliado_verificado===true||x.artist_affiliated===true;return `<section class="short" data-i="${i}"><article class="stage"><img class="poster" src="${esc(thumb)}" alt="${esc(x.titulo||'Short')}" onerror="this.src='https://i.ytimg.com/vi/${esc(id)}/hqdefault.jpg'"><div class="player-slot"></div><div class="shade"></div><div class="hint">↑ Deslizá para descubrir</div><div class="copy"><div>${live?'<span class="badge live">● EN VIVO</span> ':''}${aff?'<span class="badge member">★ AFILIADO UADAV</span> ':''}${!aff?'<span class="badge">DESCUBRIMIENTO</span>':''}</div><h2>${esc(x.titulo||'Short')}</h2><p>${esc(x.artist_name||x.autor||x.descripcion||x.categoria||'★ UADAV STREAM')}</p></div><div class="actions"><button class="round" onclick="toggle(${i})" aria-label="Reproducir o pausar">▶</button><button class="round" onclick="profile(${i})">★<span>PERFIL</span></button><button class="round" onclick="share(${i})">↗<span>COMPARTIR</span></button></div></article></section>`}
function stop(i){const s=document.querySelector(`.short[data-i="${i}"] .player-slot`);if(s)s.replaceChildren();const b=document.querySelector(`.short[data-i="${i}"] .round`);if(b)b.firstChild.nodeValue='▶'}
function play(i){if(i<0||i>=items.length)return;if(active>=0&&active!==i)stop(active);active=i;const x=items[i],id=vid(x),slot=document.querySelector(`.short[data-i="${i}"] .player-slot`);if(!slot||!id)return;slot.innerHTML=`<iframe class="player" src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(id)}?autoplay=1&mute=1&playsinline=1&controls=1&rel=0&loop=1&playlist=${encodeURIComponent(id)}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen title="${esc(x.titulo||'Short')}"></iframe>`;const b=document.querySelector(`.short[data-i="${i}"] .round`);if(b)b.firstChild.nodeValue='❚❚'}
function toggle(i){if(active===i&&document.querySelector(`.short[data-i="${i}"] iframe`)){stop(i);active=-1}else play(i)}
function profile(i){const x=items[i],id=artistId(x);location.href=id?'/artista.html?id='+encodeURIComponent(id):'/artistas.html'}
async function share(i){const x=items[i],url=x.url||(vid(x)?'https://www.youtube.com/shorts/'+vid(x):location.href);try{if(navigator.share)await navigator.share({title:x.titulo||'Short',url});else await navigator.clipboard.writeText(url)}catch{}}
function observe(){observer?.disconnect();observer=new IntersectionObserver(es=>{for(const e of es){if(e.isIntersecting&&e.intersectionRatio>=.72){const i=Number(e.target.dataset.i);setTimeout(()=>{if(e.target.getBoundingClientRect().top<innerHeight*.3)play(i)},120)}}},{root:document.getElementById('feed'),threshold:[.72,.9]});document.querySelectorAll('.short').forEach(x=>observer.observe(x))}
async function boot(){try{let all=await api('content');if(!Array.isArray(all))all=[];items=all.filter(x=>/short|clip|reel|vertical/i.test(String(x.content_type||x.tipo||x.categoria||''))).sort((a,b)=>score(b)-score(a)).slice(0,100);if(!items.length){const d=await api('youtube/search?q='+encodeURIComponent('artistas variedades shorts')+'&maxResults=30');items=(Array.isArray(d)?d:(d.items||[])).map(x=>({...x,external_id:x.id||x.videoId,thumbnail:x.thumbnail||x.thumbnails?.medium?.url,content_type:'short'}))}$('feed').innerHTML=items.length?items.map(card).join(''):'<div class="empty">Todavía no hay Shorts publicados.</div>';observe()}catch(e){$('feed').innerHTML='<div class="empty">No pudimos cargar Shorts.</div>'}}boot();
</script><script src="/uadav-app-bridge-v104.js?v=1011"></script></body></html>
