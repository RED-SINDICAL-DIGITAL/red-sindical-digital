const API=window.UADAV_API_BASE||'https://uadav-api.uadavstream.workers.dev/api/',$=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));let items=[];
async function api(path){const r=await fetch(API+path+(path.includes('?')?'&':'?')+'_='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}
function videoId(x){const u=String(x.url||'');const m=u.match(/[?&]v=([^&]+)/)||u.match(/youtu\.be\/([^?]+)/)||u.match(/\/(?:shorts|embed)\/([^?]+)/);return x.external_id||x.id||m?.[1]||''}
function card(x,i){const id=videoId(x),thumb=x.thumbnail||(id?`https://i.ytimg.com/vi/${id}/hqdefault.jpg`:'');return `<section class="short"><article class="stage"><img src="${esc(thumb)}" alt="${esc(x.titulo||'Short')}" onerror="this.style.opacity=.2"><button class="play" aria-label="Reproducir" onclick="play(${i},this)">▶</button><div class="shade"></div><div class="copy"><h2>${esc(x.titulo||'Short')}</h2><p>${esc(x.descripcion||x.autor||x.categoria||'★ UADAV STREAM')}</p></div><div class="actions"><button class="round" onclick="share(${i})">↗</button><button class="round" onclick="location.href='/mi-perfil.html'">＋</button></div></article></section>`}
function play(i,b){const x=items[i],id=videoId(x);if(!id&&!x.url)return;const item={...x,id:id||x.id,external_id:id||x.external_id,provider:x.provider||'youtube',url:x.url||(id?'https://www.youtube.com/watch?v='+id:''),content_type:'short'};if(window.UADAVContentPlayer){window.UADAVContentPlayer.open(item);return}if(item.url)window.open(item.url,'_blank','noopener')}
async function share(i){const x=items[i];try{if(navigator.share)await navigator.share({title:x.titulo||'Short',url:location.href});else await navigator.clipboard.writeText(location.href)}catch{}}
async function boot(){try{let all=await api('content');if(!Array.isArray(all))all=[];items=all.filter(x=>/short|clip|reel|vertical/i.test(String(x.content_type||x.tipo||x.categoria||''))).slice(0,80);if(!items.length){const d=await api('youtube/search?q='+encodeURIComponent('artistas variedades shorts')+'&maxResults=24');items=(Array.isArray(d)?d:(d.items||[])).map(x=>({...x,external_id:x.id||x.videoId,thumbnail:x.thumbnail||x.thumbnails?.medium?.url,content_type:'short'}))}$('feed').innerHTML=items.length?items.map(card).join(''):'<div class="empty">Todavía no hay Shorts publicados.</div>'}catch(e){$('feed').innerHTML='<div class="empty">No pudimos cargar Shorts.</div>'}}boot();
