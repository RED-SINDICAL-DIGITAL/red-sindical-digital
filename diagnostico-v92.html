<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Diagnóstico V9.2.4 · UADAV STREAM</title><script src="/uadav-api-config.js?v=924"></script><style>body{margin:0;background:#05080d;color:#fff;font:15px system-ui;padding:24px}.wrap{max-width:920px;margin:auto}.card{border:1px solid #ffffff18;background:#0d141e;border-radius:18px;padding:18px;margin:12px 0}.ok{color:#79f2ad}.bad{color:#ff8d9b}code{color:#8cefff}.row{display:flex;gap:10px;flex-wrap:wrap}.btn{padding:10px 13px;border-radius:12px;background:#00e5ff;color:#001018;text-decoration:none;font-weight:800}.muted{color:#94a3b7}</style></head><body><main class="wrap"><h1>★ UADAV STREAM · Diagnóstico V9.2.4</h1><p class="muted">Comprueba que producción cargó el player directo, Worker y Service Worker de estabilización.</p><div id="out"></div><div class="row"><a class="btn" href="/index.html">Inicio</a><a class="btn" href="/artistas.html">Artistas</a><a class="btn" href="/cartelera.html">Cartelera</a></div></main><script>
const API=window.UADAV_API_BASE||'https://uadav-api.uadavstream.workers.dev/api/';const out=document.getElementById('out');const card=(a,b,ok)=>`<div class="card"><b>${a}</b><div class="${ok?'ok':'bad'}">${b}</div></div>`;
(async()=>{let html=card('HTML diagnóstico','V9.2.4 cargado',true);try{const h=await fetch(API+'health?_='+Date.now(),{cache:'no-store'}).then(r=>r.json());html+=card('Worker',h.version||'sin versión',h.version==='V9.2.4')}catch(e){html+=card('Worker','No responde: '+e.message,false)}try{const txt=await fetch('/uadav-content-player.js?v=924',{cache:'no-store'}).then(r=>r.text());html+=card('Player universal',txt.includes("api.build='9.2.4'")&&txt.includes('www.youtube.com/embed/')?'V9.2.4 · YouTube embed directo':'Archivo viejo o incorrecto',txt.includes("api.build='9.2.4'")&&txt.includes('www.youtube.com/embed/'))}catch(e){html+=card('Player universal',e.message,false)}try{const sw=await fetch('/service-worker.js?v=924',{cache:'no-store'}).then(r=>r.text());html+=card('Service Worker',sw.includes('v9-2-4-stabilization')?'V9.2.4 · sin interceptación fetch':'Archivo viejo o incorrecto',sw.includes('v9-2-4-stabilization'))}catch(e){html+=card('Service Worker',e.message,false)}if('serviceWorker'in navigator){const reg=await navigator.serviceWorker.getRegistration();html+=card('SW activo',reg?.active?.scriptURL||'sin controlador',!!reg)}out.innerHTML=html;})();
</script></body></html>
