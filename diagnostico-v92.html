<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Diagnóstico V9.2 · UADAV STREAM</title><script src="/uadav-api-config.js?v=92"></script><style>body{margin:0;background:#05080d;color:#fff;font:15px system-ui;padding:24px}.wrap{max-width:900px;margin:auto}.card{border:1px solid #ffffff18;background:#0d141e;border-radius:18px;padding:18px;margin:12px 0}.ok{color:#79f2ad}.bad{color:#ff8d9b}code{color:#8cefff}.row{display:flex;gap:10px;flex-wrap:wrap}.btn{padding:10px 13px;border-radius:12px;background:#00e5ff;color:#001018;text-decoration:none;font-weight:800}</style></head><body><main class="wrap"><h1>★ UADAV STREAM · Diagnóstico V9.2</h1><p>Esta página comprueba que los archivos nuevos realmente están publicados.</p><div id="out"></div><div class="row"><a class="btn" href="/index.html">Inicio</a><a class="btn" href="/artistas.html">Artistas</a><a class="btn" href="/cartelera.html">Cartelera</a><a class="btn" href="/radio.html">Radio</a></div></main><script>
const out=document.getElementById('out'),API=window.UADAV_API_BASE||'https://uadav-api.uadavstream.workers.dev/api/';
const card=(t,v,ok=true)=>`<section class="card"><b>${t}</b><div class="${ok?'ok':'bad'}">${v}</div></section>`;
(async()=>{let html=card('HTML diagnóstico','V9.2 cargado',true);try{const h=await fetch(API+'health?_='+Date.now(),{cache:'no-store'}).then(r=>r.json());html+=card('Worker',h.version||'sin versión',h.version==='V9.2.0')}catch(e){html+=card('Worker','No responde: '+e.message,false)}try{const r=await fetch('/uadav-content-player.js?v=92',{cache:'no-store'});html+=card('Player universal',r.ok?'OK':'HTTP '+r.status,r.ok)}catch(e){html+=card('Player universal',e.message,false)}if('serviceWorker'in navigator){const reg=await navigator.serviceWorker.getRegistration();html+=card('Service Worker',reg?.active?.scriptURL||'sin controlador',!!reg)}out.innerHTML=html;})();
</script></body></html>
