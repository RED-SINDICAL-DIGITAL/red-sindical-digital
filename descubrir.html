<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Descubrir · ★ UADAV STREAM</title><script src="/uadav-api-config.js?v=11707"></script><style>:root{--bg:#04070b;--panel:#0b1119;--line:#ffffff18;--muted:#96a2b3}*{box-sizing:border-box}body{margin:0;background:#04070b;color:#fff;font-family:Inter,system-ui,sans-serif}.shell{width:min(1450px,94vw);margin:auto;padding:42px 0 90px}.hero{padding:35px 0}.hero small{color:#79a7ff;font-weight:900;letter-spacing:.16em}.hero h1{font-size:clamp(42px,7vw,92px);letter-spacing:-.055em;line-height:.92;margin:12px 0}.hero p{color:#b8c1ce;max-width:760px;line-height:1.6}.tabs{display:flex;gap:8px;overflow:auto;padding:10px 0 26px}.tabs button{white-space:nowrap;border:1px solid var(--line);background:#0b1119;color:#fff;border-radius:999px;padding:10px 14px;font-weight:800;cursor:pointer}.tabs button.on{background:#fff;color:#05080c}.status{color:var(--muted);font-size:12px;margin:4px 0 15px}.rail{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.card{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--panel);cursor:pointer}.thumb{aspect-ratio:16/9;background:#111 center/cover no-repeat;position:relative}.play{position:absolute;left:10px;bottom:10px;width:38px;height:38px;border-radius:50%;background:#fff;color:#000;display:grid;place-items:center}.meta{padding:12px}.meta b,.meta span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta span{color:var(--muted);font-size:11px;margin-top:5px}@media(max-width:900px){.rail{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.rail{grid-template-columns:1fr}.shell{width:92vw}}</style></head><body><main class="shell"><section class="hero"><small>★ UADAV STREAM · DESCUBRIR</small><h1 id="title">Todo el espectáculo, en un solo lugar.</h1><p id="copy">Elegí un universo. La búsqueda es única; nosotros organizamos los resultados para que no tengas que saltar entre buscadores.</p></section><nav class="tabs"><button data-kind="escena">Teatro & Espectáculos</button><button data-kind="musica">Música & Shows</button><button data-kind="cine">Cine & Historias</button><button data-kind="talento">Talento & Industria</button></nav><div id="status" class="status">Cargando…</div><section id="grid" class="rail"></section></main><script>const API=window.UADAV_API_BASE||'https://uadav-api.uadavstream.workers.dev/api/',$=x=>document.getElementById(x),P={escena:{t:'Teatro & Espectáculos',q:'teatro circo magia humor danza espectáculos'},musica:{t:'Música & Shows',q:'conciertos DJ sets música en vivo recital festival'},cine:{t:'Cine & Historias',q:'películas series documentales cine independiente'},talento:{t:'Talento & Industria',q:'artistas casting productores entretenimiento'}};function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function yid(x){let id=x.videoId||x.video_id||x.external_id||'',u=x.url||x.youtube_url||'';if(/^[\w-]{11}$/.test(id))return id;let m=String(u).match(/[?&]v=([\w-]{11})/)||String(u).match(/youtu\.be\/([\w-]{11})/)||String(u).match(/\/(?:shorts|embed|live)\/([\w-]{11})/);return m?.[1]||''}function shell(){try{return parent!==window&&(parent.UADAVShellHost||parent.UADAV_APP||parent.UADAVShell)}catch{return null}}function play(x){let h=shell(),item={...x,videoId:yid(x),video_id:yid(x),external_id:yid(x),titulo:x.titulo||x.title||x.nombre||'Contenido',provider:x.provider||'youtube'};if(h?.playContent)return h.playContent(item);if(parent!==window)return parent.postMessage({type:'uadav:content-play',item},location.origin)}async function search(q){for(const u of [API+'youtube/search?q='+encodeURIComponent(q),API+'search?q='+encodeURIComponent(q)])try{let r=await fetch(u);if(!r.ok)continue;let d=await r.json(),a=Array.isArray(d)?d:(d.items||d.results||d.videos||[]);if(a.length)return a.slice(0,24)}catch{}return[]}async function load(kind){kind=P[kind]?kind:'escena';document.querySelectorAll('[data-kind]').forEach(b=>b.classList.toggle('on',b.dataset.kind===kind));$('title').textContent=P[kind].t;$('status').textContent='Buscando contenido…';let a=await search(P[kind].q);$('status').textContent=a.length?a.length+' contenidos para descubrir':'No encontramos contenido por el momento';$('grid').innerHTML=a.map((x,i)=>{let id=yid(x),img=x.thumbnail||x.imagen||x.image||(id?'https://i.ytimg.com/vi/'+id+'/hqdefault.jpg':''),t=x.title||x.titulo||x.nombre||'Contenido',s=x.author||x.channelTitle||x.tipo||'★ UADAV STREAM';return '<article class="card" data-i="'+i+'"><div class="thumb" style="background-image:url(\''+esc(img)+'\')"><span class="play">▶</span></div><div class="meta"><b>'+esc(t)+'</b><span>'+esc(s)+'</span></div></article>'}).join('');document.querySelectorAll('[data-i]').forEach(el=>el.onclick=()=>play(a[+el.dataset.i]));history.replaceState(null,'','?kind='+kind)}document.querySelectorAll('[data-kind]').forEach(b=>b.onclick=()=>load(b.dataset.kind));load(new URLSearchParams(location.search).get('kind')||'escena');</script></body></html>
