<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Explorar · UADAV STREAM</title><link rel="stylesheet" href="/uadav-design-v118.css?v=12001"><style>*{box-sizing:border-box}body{margin:0;background:#05080e;color:#fff;font:15px/1.5 Inter,system-ui,sans-serif}button,a{font:inherit}button{cursor:pointer}.explore{width:min(1120px,100%);margin:auto;padding:24px 20px 110px}.intro h1{font-size:clamp(32px,5vw,60px);letter-spacing:-.045em;margin:0}.intro p{color:#9caec6;margin:8px 0 22px}.filters{display:flex;gap:8px;overflow:auto;padding:0 0 12px}.filters button,.action{flex:none;padding:10px 16px;border:1px solid #ffffff22;border-radius:999px;color:white;background:#101724;text-decoration:none}.filters button[aria-pressed=true],.primary{background:#2f6df6!important;border-color:#2f6df6!important}.feed{display:grid;gap:24px}.moment{position:relative;min-height:min(700px,76svh);overflow:hidden;border:1px solid #ffffff16;border-radius:28px;display:flex;align-items:flex-end;background:#101724;scroll-snap-align:start}.moment>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.moment::after{content:'';position:absolute;inset:0;background:linear-gradient(0deg,#030810 0%,#030810b3 40%,#0308101a 80%)}.moment-copy{position:relative;z-index:1;width:100%;padding:32px}.moment h2{max-width:780px;font-size:clamp(25px,4vw,46px);letter-spacing:-.03em;line-height:1.15;margin:8px 0 14px;text-wrap:balance}.moment small{color:#bed2ee}.actions{display:flex;gap:10px;flex-wrap:wrap}.status{color:#a2b3cb;padding:16px 0}.more{text-align:center;padding:26px}@media(max-width:720px){.explore{padding:20px 12px 110px}.moment{min-height:68svh;border-radius:20px}.moment-copy{padding:22px}.filters{position:sticky;top:0;z-index:3;background:#05080ef2;padding:10px 0}.intro p{font-size:14px}.action{padding:10px 13px;font-size:13px}}@media(min-width:900px){.feed{max-width:900px;margin:auto}}</style><link rel="stylesheet" href="/uadav-responsive-v119.css?v=12001"></head><body data-page="descubrir"><main class="explore"><header class="intro"><h1>Explorar</h1><p>Música, presentaciones y eventos. Deslizá para descubrir; vos elegís qué reproducir.</p></header><nav class="filters" aria-label="Elegir contenido"><button data-kind="musica" aria-pressed="true">Música</button><button data-kind="clips" aria-pressed="false">Clips</button><button data-kind="escena" aria-pressed="false">En escena</button><button data-kind="eventos" aria-pressed="false">Eventos</button><button data-kind="cine" aria-pressed="false">Cine</button></nav><div class="status" id="status" role="status" aria-live="polite"></div><section class="feed" id="feed" aria-label="Contenido para explorar"></section><div class="more"><button class="action" id="more" hidden>Descubrir más</button></div></main><script>
const API=window.PLATFORM_API_BASE||window.UADAV_API_BASE||'https://uadav-api.uadavstream.workers.dev/api/',$=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const queries={musica:'música conciertos sesiones en vivo',clips:'shorts música magia danza artistas',escena:'magia circo humor danza espectáculo'};let kind='musica',items=[],cursor=null,version=0,busy=false;
function host(){try{return parent!==window&&(parent.UADAVShellHost||parent.UADAV_APP||parent.UADAVShell)}catch{return null}}function nav(href){const h=host();if(h?.navigate)return h.navigate(href);if(parent!==window)return parent.postMessage({type:'uadav:navigate',href},location.origin);location.href=href}
async function api(path){const ctl=new AbortController(),timer=setTimeout(()=>ctl.abort(),10000);try{const r=await fetch(API+path,{cache:'no-store',signal:ctl.signal});if(!r.ok)throw Error('HTTP '+r.status);return await r.json()}finally{clearTimeout(timer)}}function arr(d){return Array.isArray(d)?d:d?.items||d?.content||d?.results||d?.videos||[]}
function mediaKey(x){return String(x.external_id||x.youtube_id||x.videoId||x.id||x.url||'')}function favs(){try{const a=JSON.parse(localStorage.getItem('uadav_favorites_v1')||'[]');return Array.isArray(a)?a:[]}catch{return[]}}
function render(){const saved=favs();$('feed').innerHTML=items.map((x,i)=>{const event=kind==='eventos',id=x.videoId||x.youtube_id||x.external_id||'',image=x.thumbnail||x.imagen||x.portada||x.poster||(String(id).length===11?'https://i.ytimg.com/vi/'+id+'/hqdefault.jpg':'/media-fallback.svg'),title=x.titulo||x.title||x.nombre||'Contenido',on=saved.some(v=>mediaKey(v)===mediaKey(x));return '<article class="moment" tabindex="0"><img loading="lazy" src="'+esc(image)+'" alt="" onerror="this.onerror=null;this.src=\'/media-fallback.svg\'"><div class="moment-copy"><small>'+esc(event?[x.fecha,x.ciudad,x.lugar].filter(Boolean).join(' · '):x.author||x.channelTitle||'Para descubrir')+'</small><h2>'+esc(title)+'</h2><div class="actions"><button class="action primary" data-open="'+i+'">'+(event?'Ver evento':kind==='cine'?'Ver título':'▶ Reproducir')+'</button>'+(!event&&kind!=='cine'?'<button class="action" data-save="'+i+'" aria-pressed="'+on+'">'+(on?'♥ Guardado':'♡ Guardar')+'</button>':'')+'<a class="action" href="/buscar.html?q='+encodeURIComponent(x.author||title)+'">Ver más</a></div></div></article>'}).join('');$('feed').querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{const x=items[+b.dataset.open];if(kind==='eventos')return nav('/evento.html?id='+encodeURIComponent(x.id));if(kind==='cine')return nav('/media.html?id='+encodeURIComponent(x.id));const h=host(),item={...x,titulo:x.titulo||x.title||x.nombre,videoId:x.videoId||x.youtube_id||x.external_id||''};if(h?.playContent)return h.playContent(item);if(parent!==window)return parent.postMessage({type:'uadav:content-play',item},location.origin);window.UADAVContentPlayer?.open?.(item)});$('feed').querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>{try{const x=items[+b.dataset.save];let a=favs();const i=a.findIndex(v=>mediaKey(v)===mediaKey(x)),on=i<0;if(on)a.unshift({...x,saved_at:Date.now()});else a.splice(i,1);localStorage.setItem('uadav_favorites_v1',JSON.stringify(a.slice(0,250)));b.textContent=on?'♥ Guardado':'♡ Guardar';b.setAttribute('aria-pressed',String(on))}catch{$('status').textContent='No pudimos guardar en este navegador.'}});$('feed').querySelectorAll('a').forEach(a=>a.onclick=e=>{e.preventDefault();nav(a.getAttribute('href'))});$('more').hidden=!cursor;$('status').textContent=items.length?'Elegí un contenido o seguí deslizando.':'No hay contenido disponible por ahora.'}
async function load(next=false){const token=next?version:++version;if(next&&busy)return;busy=true;$('more').disabled=true;if(!next){items=[];cursor=null;$('feed').replaceChildren();$('more').hidden=true}$('status').textContent='Buscando nuevas propuestas…';try{let d;if(kind==='eventos')d=await api('cartelera');else if(kind==='cine')d=await api('media');else{try{d=await api('public/search?q='+encodeURIComponent(queries[kind])+(next&&cursor?'&cursor='+encodeURIComponent(cursor):''))}catch(e){if(next)throw e;d=[]}if(!arr(d).length&&!next)d=await api('youtube/search?q='+encodeURIComponent(queries[kind]))}if(token!==version)return;let a=arr(d);if(kind==='eventos')a=a.filter(x=>x.visible!==false&&!['hidden','cancelado','rejected'].includes(String(x.estado||'').toLowerCase()));if(kind==='cine')a=a.filter(x=>x.visible!==false);const seen=new Set(items.map(mediaKey));items=[...items,...a.filter(x=>{const k=mediaKey(x);if(!k||seen.has(k))return false;seen.add(k);return true})];cursor=d?.has_more?d.cursor:null;render();history.replaceState(null,'',location.pathname+'?kind='+kind)}catch(e){if(token!==version)return;$('status').textContent='No pudimos cargar estas propuestas. Podés reintentar.';$('more').hidden=false;$('more').textContent='Reintentar'}finally{if(token===version){busy=false;$('more').disabled=false}}}
$('more').onclick=()=>load(!!cursor);document.querySelectorAll('[data-kind]').forEach(b=>b.onclick=()=>{kind=b.dataset.kind;document.querySelectorAll('[data-kind]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));$('more').textContent='Descubrir más';load()});const initial=new URLSearchParams(location.search).get('kind');if(initial&&(queries[initial]||['eventos','cine'].includes(initial)))kind=initial;document.querySelectorAll('[data-kind]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.kind===kind)));load();
</script><script src="/uadav-app-bridge-v104.js?v=11719"></script></body></html>
