<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Radio Studio · UADAV STREAM</title><script src="/uadav-account-sync.js" defer></script><style>
*{box-sizing:border-box}body{margin:0;background:#070b12;color:#eef4ff;font:16px system-ui,sans-serif}main{max-width:1080px;margin:auto;padding:24px 18px 60px}a{color:#a6caff}header,.actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap}header{justify-content:space-between}h1{font-size:clamp(28px,4vw,40px);margin-bottom:6px}p{line-height:1.6;color:#acb9cc}button,select{font:inherit;color:inherit;background:#151e2e;border:1px solid #34435a;border-radius:12px;padding:12px;min-height:44px}button{cursor:pointer}button:disabled{opacity:.5;cursor:wait}button:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid #83b9ff;outline-offset:3px}.primary{background:#2466dc}.toolbar{display:flex;gap:16px;flex-wrap:wrap;margin:24px 0}.toolbar label{display:grid;gap:8px;flex:1;min-width:200px}.card{padding:20px;margin:14px 0;background:#101825;border:1px solid #28374c;border-radius:18px}.card h2{font-size:22px;margin:0 0 8px}.badge{color:#a6caff}#status{min-height:28px}small{color:#acb9cc}[hidden]{display:none!important}@media(max-width:560px){.toolbar{display:block}.toolbar label{margin:16px 0}.actions button{flex:1}.card{padding:16px}}
</style></head><body><main><header><div><h1>Radio Studio</h1><p>Los pedidos de tu audiencia, en un solo lugar.</p></div><a href="/usuario.html">Mi perfil</a></header><p id="status" role="status" aria-live="polite">Comprobando tu acceso…</p><button id="refresh" type="button">Actualizar</button><section id="studio" hidden><div class="toolbar"><label>Emisora<select id="station"></select></label><label>Mostrar<select id="filter"><option value="">Todos</option><option value="pending">Nuevos</option><option value="queued">En cola</option><option value="played">Sonaron</option><option value="rejected">Descartados</option></select></label></div><p id="count" role="status"></p><div id="requests"></div><p>Estos estados organizan tus pedidos. No envían mensajes al oyente ni reproducen canciones automáticamente.</p></section></main><script>
(()=>{'use strict';
const $=id=>document.getElementById(id),base=(window.PLATFORM_API_BASE||window.UADAV_API_BASE||'https://uadav-api.uadavstream.workers.dev/api/').replace(/\/?$/,'/'),labels={pending:'Nuevo',queued:'En cola',played:'Sonó',rejected:'Descartado',done:'Completado'};
let generation=0,busy=false,items=[],stations=[];
const credential=()=>window.UADAVAccount?.code?.()||'';
const text=(tag,value)=>{const n=document.createElement(tag);n.textContent=value;return n};
function lock(on){busy=on;document.querySelectorAll('button,select').forEach(n=>n.disabled=on)}
async function api(path,options={}){const secret=credential();if(!secret)throw Error('Ingresá a Mi perfil con tu cuenta para abrir Radio Studio.');const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),15000);try{const r=await fetch(base+path,{...options,headers:{'Content-Type':'application/json',Authorization:'Bearer '+secret},cache:'no-store',signal:controller.signal});let d;try{d=await r.json()}catch{throw Error('No pudimos leer la respuesta. Volvé a actualizar.')};if(secret!==credential())throw Error('La cuenta cambió. Volvé a actualizar.');if(!r.ok)throw Error(r.status===403?'Ya no tenés permiso para esta emisora.':d.error||'No se pudo completar la operación.');return d}finally{clearTimeout(timer)}}
function render(){const host=$('requests');host.replaceChildren();const rows=items.filter(x=>!$('filter').value||x.status===$('filter').value);$('count').textContent=rows.length+' pedidos visibles · últimos '+items.length+' recibidos';for(const item of rows){const card=text('article','');card.className='card';card.append(text('h2',[item.artist,item.title].filter(Boolean).join(' — ')),text('small',item.listener_name||'Oyente'));if(item.dedication)card.append(text('p',item.dedication));const badge=text('p',labels[item.status]||'Sin clasificar');badge.className='badge';card.append(badge);const actions=text('div','');actions.className='actions';for(const [state,label] of [['queued','En cola'],['played','Sonó'],['rejected','Descartar']]){const button=text('button',label);button.type='button';button.disabled=busy;button.onclick=()=>update(item.id,state);actions.append(button)}card.append(actions);host.append(card)}if(!rows.length)host.append(text('p','No hay pedidos con este filtro.'))}
async function inbox(turn){const rid=$('station').value,d=await api('radio-studio/requests?radio_id='+encodeURIComponent(rid));if(turn!==generation)return;if(d.radio_id!==rid||!Array.isArray(d.items))throw Error('La bandeja llegó incompleta.');items=d.items;render();$('status').textContent='Bandeja actualizada.'}
async function load(){if(busy)return;const turn=++generation;lock(true);$('status').textContent='Actualizando…';try{const d=await api('radio-studio');if(turn!==generation)return;if(!Array.isArray(d.items))throw Error('La lista de emisoras llegó incompleta.');stations=d.items;const previous=$('station').value;$('station').replaceChildren();for(const r of stations){const o=text('option',r.name);o.value=r.id;$('station').append(o)}if(stations.some(r=>r.id===previous))$('station').value=previous;$('studio').hidden=!stations.length;if(!stations.length){items=[];$('requests').replaceChildren();$('status').textContent='Tu cuenta todavía no tiene una emisora habilitada. La administración debe verificar y habilitar tu acceso.';return}await inbox(turn)}catch(e){if(turn===generation){items=[];$('requests').replaceChildren();$('studio').hidden=true;$('status').textContent=e.name==='AbortError'?'La conexión demoró demasiado. Volvé a actualizar.':e.message}}finally{if(turn===generation)lock(false)}}
async function update(id,status){if(busy)return;const turn=++generation,rid=$('station').value;lock(true);$('status').textContent='Guardando estado…';try{const d=await api('radio-studio/requests?radio_id='+encodeURIComponent(rid),{method:'PATCH',body:JSON.stringify({id,status})});if(turn!==generation)return;if(d.success!==true||d.id!==id||d.radio_id!==rid||d.status!==status)throw Error('No pudimos confirmar el cambio. Actualizá antes de reintentar.');const item=items.find(x=>x.id===id);if(item)item.status=status;render();$('status').textContent='Estado guardado.'}catch(e){if(turn===generation)$('status').textContent=e.name==='AbortError'?'No pudimos confirmar el cambio. Actualizá la bandeja.':e.message}finally{if(turn===generation)lock(false)}}
$('refresh').onclick=load;$('station').onchange=load;$('filter').onchange=render;
function changed(){generation++;items=[];stations=[];$('requests').replaceChildren();$('studio').hidden=true;lock(false);$('status').textContent='La cuenta cambió. Pulsá Actualizar para comprobar el acceso.'}
let observedCredential=credential();window.addEventListener('uadav:account',()=>{const next=credential();if(next!==observedCredential){observedCredential=next;changed()}});window.addEventListener('storage',e=>{if(e.key==='uadav_account_access_v1')changed()});
window.addEventListener('load',load,{once:true});
})();
</script></body></html>
