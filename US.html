<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UADAV STREAM | La Plataforma del Artista Argentino</title>
<!-- Favicon para evitar error 404 -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎵</text></svg>">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root {
    --primary: #2563EB;
    --primary-glow: rgba(37, 99, 235, 0.4);
    --bg-dark: #020617;
    --bg-card: #0F172A;
    --bg-card-hover: #162032;
    --text-main: #F8FAFC;
    --text-muted: #94A3B8;
    --border: #1E293B;
    --gold: #F59E0B;
    --red: #DC2626;
}
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; }
body { background: var(--bg-dark); color: var(--text-main); line-height: 1.6; overflow-x: hidden; padding-bottom: 100px; }
a { text-decoration: none; color: inherit; transition: 0.3s; }
img { max-width: 100%; display: block; }

/* HEADER */
header {
    position: fixed; top: 0; width: 100%; z-index: 100;
    background: rgba(2, 6, 23, 0.95); backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border); padding: 1rem 5%;
    display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;
}
.logo { font-size: 1.4rem; font-weight: 800; display: flex; align-items: center; gap: 0.5rem; }
.logo i { color: var(--primary); }
.logo span { color: var(--primary); }
.nav-links { display: flex; gap: 1rem; flex-wrap: wrap; }
.nav-links button {
    background: transparent; border: none; color: var(--text-muted);
    padding: 0.5rem 1rem; border-radius: 6px; cursor: pointer; font-weight: 500; font-size: 0.95rem;
}
.nav-links button:hover, .nav-links button.active { color: var(--text-main); background: var(--bg-card); }
.nav-cta {
    background: var(--primary); color: white; padding: 0.6rem 1.2rem;
    border-radius: 8px; font-weight: 600; font-size: 0.9rem; border: none; cursor: pointer;
}
.nav-cta:hover { background: #1D4ED8; box-shadow: 0 0 15px var(--primary-glow); }

/* SEARCH BAR */
.search-container { padding: 6rem 5% 2rem; max-width: 800px; margin: 0 auto; }
.search-box {
    display: flex; gap: 0.5rem; background: var(--bg-card);
    padding: 0.5rem; border-radius: 12px; border: 1px solid var(--border);
}
.search-box input {
    flex: 1; background: transparent; border: none; color: white;
    padding: 1rem; font-size: 1.1rem; outline: none;
}
.search-box button {
    background: var(--primary); color: white; border: none;
    padding: 1rem 2rem; border-radius: 8px; font-weight: 600; cursor: pointer;
}
.search-box button:hover { background: #1D4ED8; }

/* SECTIONS */
.section { padding: 3rem 5%; max-width: 1400px; margin: 0 auto; }
.section-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 1.5rem; border-left: 4px solid var(--primary); padding-left: 1rem;
}
.section-header h2 { font-size: 1.5rem; }

/* GRIDS */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem; }
.card {
    background: var(--bg-card); border-radius: 10px; overflow: hidden;
    cursor: pointer; border: 1px solid transparent; transition: 0.3s;
}
.card:hover { transform: translateY(-5px); border-color: var(--primary); box-shadow: 0 10px 30px rgba(37, 99, 235, 0.15); }
.card-img { position: relative; aspect-ratio: 16/9; overflow: hidden; background: #000; }
.card-img img { width: 100%; height: 100%; object-fit: cover; transition: 0.3s; }
.card:hover .card-img img { transform: scale(1.05); }
.card-badge {
    position: absolute; top: 10px; left: 10px; background: var(--primary);
    color: white; padding: 0.2rem 0.6rem; border-radius: 4px; font-size: 0.75rem; font-weight: bold;
}
.card-body { padding: 1rem; }
.card-title { font-weight: 600; margin-bottom: 0.4rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-meta { font-size: 0.85rem; color: var(--text-muted); display: flex; justify-content: space-between; }

/* SHORTS */
.shorts-grid { display: flex; gap: 1rem; overflow-x: auto; padding-bottom: 1rem; }
.short-card {
    flex-shrink: 0; width: 200px; background: var(--bg-card); border-radius: 10px;
    overflow: hidden; cursor: pointer; border: 1px solid transparent; transition: 0.3s;
}
.short-card:hover { border-color: var(--primary); }
.short-card .card-img { aspect-ratio: 9/16; }

/* RADIOS */
.radios-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 1.5rem; }
.radio-card {
    background: var(--bg-card); padding: 1.5rem; border-radius: 12px;
    border: 1px solid var(--border); text-align: center; cursor: pointer; transition: 0.3s;
}
.radio-card:hover { border-color: var(--primary); }
.radio-card i { font-size: 3rem; color: var(--primary); margin-bottom: 1rem; }
.radio-card h3 { margin-bottom: 0.5rem; }
.radio-card p { color: var(--text-muted); font-size: 0.9rem; }
.radio-live {
    display: inline-flex; align-items: center; gap: 0.5rem;
    background: var(--red); color: white; padding: 0.3rem 0.8rem;
    border-radius: 20px; font-size: 0.8rem; font-weight: bold; margin-top: 1rem;
}

/* VIDEO PLAYER MODAL */
.modal {
    display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.95); z-index: 200; justify-content: center; align-items: center; padding: 2rem;
}
.modal.active { display: flex; }
.modal-content { width: 100%; max-width: 1000px; position: relative; }
.close-modal {
    position: absolute; top: -40px; right: 0; color: white;
    font-size: 2rem; cursor: pointer; background: none; border: none;
}
.video-wrapper { position: relative; padding-bottom: 56.25%; height: 0; border-radius: 12px; overflow: hidden; background: #000; }
.video-wrapper iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }

/* RADIO PLAYER BAR */
.radio-bar {
    position: fixed; bottom: 0; left: 0; width: 100%;
    background: var(--bg-card); border-top: 2px solid var(--primary);
    padding: 1rem 5%; display: none; align-items: center; justify-content: space-between;
    z-index: 150;
}
.radio-bar.active { display: flex; }
.radio-info { display: flex; align-items: center; gap: 1rem; }
.radio-info i { font-size: 2rem; color: var(--primary); }
.radio-controls { display: flex; align-items: center; gap: 1rem; }
.radio-controls button {
    background: var(--primary); color: white; border: none;
    width: 50px; height: 50px; border-radius: 50%; cursor: pointer; font-size: 1.2rem;
}
.radio-controls button:hover { background: #1D4ED8; }

/* LOADING & FALLBACK */
.loading { text-align: center; padding: 3rem; color: var(--text-muted); }
.spinner {
    display: inline-block; width: 40px; height: 40px;
    border: 4px solid var(--border); border-top: 4px solid var(--primary);
    border-radius: 50%; animation: spin 1s linear infinite;
}
@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
.fallback-box { grid-column: 1/-1; text-align: center; padding: 2rem; background: var(--bg-card); border-radius: 12px; border: 1px solid var(--primary); }

/* FOOTER */
footer { padding: 3rem 5%; text-align: center; border-top: 1px solid var(--border); color: var(--text-muted); }
.powered-by { margin-top: 1rem; font-size: 0.8rem; color: #475569; letter-spacing: 1px; }

@media (max-width: 768px) {
    .nav-links { display: none; }
    .grid { grid-template-columns: 1fr; }
    .shorts-grid { flex-direction: column; }
    .short-card { width: 100%; }
}
</style>
</head>
<body>

<header>
    <div class="logo"><i class="fas fa-play-circle"></i> UADAV <span>STREAM</span></div>
    <nav class="nav-links">
        <button class="active" onclick="showSection('trending', this)">Trending AR</button>
        <button onclick="showSection('shorts', this)">Shorts</button>
        <button onclick="showSection('conciertos', this)">Conciertos</button>
        <button onclick="showSection('teatros', this)">Teatros</button>
        <button onclick="showSection('radios', this)">Radios</button>
    </nav>
    <button class="nav-cta" onclick="document.querySelector('.search-container').scrollIntoView({behavior: 'smooth'})">Buscar</button>
</header>

<!-- SEARCH -->
<div class="search-container">
    <div class="search-box">
        <input type="text" id="search-input" placeholder="Buscá artistas, canciones, conciertos, teatros...">
        <button onclick="searchMusic()"><i class="fas fa-search"></i> Buscar</button>
    </div>
</div>

<!-- TRENDING SECTION -->
<section id="section-trending" class="section">
    <div class="section-header">
        <h2><i class="fas fa-fire" style="color: var(--red);"></i> Trending Argentina</h2>
    </div>
    <div class="grid" id="trending-grid"></div>
</section>

<!-- SHORTS SECTION -->
<section id="section-shorts" class="section" style="display:none;">
    <div class="section-header">
        <h2><i class="fas fa-bolt" style="color: var(--gold);"></i> Shorts - Detrás de Escena</h2>
    </div>
    <div class="shorts-grid" id="shorts-grid"></div>
</section>

<!-- CONCIERTOS SECTION -->
<section id="section-conciertos" class="section" style="display:none;">
    <div class="section-header">
        <h2><i class="fas fa-music" style="color: var(--primary);"></i> Conciertos y Recitales</h2>
    </div>
    <div class="grid" id="conciertos-grid"></div>
</section>

<!-- TEATROS SECTION -->
<section id="section-teatros" class="section" style="display:none;">
    <div class="section-header">
        <h2><i class="fas fa-theater-masks" style="color: var(--gold);"></i> Teatros y Productoras</h2>
    </div>
    <div class="grid" id="teatros-grid"></div>
</section>

<!-- RADIOS SECTION -->
<section id="section-radios" class="section" style="display:none;">
    <div class="section-header">
        <h2><i class="fas fa-broadcast-tower" style="color: var(--primary);"></i> Radios en Vivo</h2>
    </div>
    <div class="radios-grid" id="radios-grid"></div>
</section>

<!-- SEARCH RESULTS -->
<section id="section-results" class="section" style="display:none;">
    <div class="section-header">
        <h2>Resultados de Búsqueda</h2>
    </div>
    <div class="grid" id="results-grid"></div>
</section>

<!-- VIDEO MODAL -->
<div id="video-modal" class="modal">
    <div class="modal-content">
        <button class="close-modal" onclick="closeModal()">&times;</button>
        <div class="video-wrapper">
            <iframe id="video-iframe" src="" allow="autoplay; encrypted-media" allowfullscreen></iframe>
        </div>
        <h3 id="video-title" style="margin-top: 1rem;"></h3>
    </div>
</div>

<!-- RADIO BAR -->
<div id="radio-bar" class="radio-bar">
    <div class="radio-info">
        <i class="fas fa-broadcast-tower"></i>
        <div>
            <div id="radio-name" style="font-weight: bold;">Radio</div>
            <div style="font-size: 0.85rem; color: var(--text-muted);">En vivo</div>
        </div>
    </div>
    <div class="radio-controls">
        <button onclick="toggleRadio()"><i class="fas fa-pause" id="radio-icon"></i></button>
        <button onclick="closeRadio()" style="background: var(--red);"><i class="fas fa-stop"></i></button>
    </div>
    <audio id="radio-audio" preload="none"></audio>
</div>

<footer>
    <p>© 2024 UADAV STREAM - Unión Argentina de Artistas de Variedades</p>
    <div class="powered-by">POWERED BY BEAT DIGITAL MEDIOS</div>
</footer>

<script>
// ==========================================
// DATOS DE DEMO (IDs de YouTube reales y estables)
// ==========================================
const trendingVideos = [
    { id: 'kXYiU_JCYtU', title: 'Duki x Bizarrap - BZRP Music Sessions #50', artist: 'Duki', views: '89M' },
    { id: 'jfKfPfyJRdk', title: 'Emilia - La_Original.mp3', artist: 'Emilia', views: '67M' },
    { id: '9bZkp7q19f0', title: 'Lit Killah x Tiago PZK - Entre Nosotros', artist: 'Lit Killah', views: '54M' },
    { id: '2lXVbN8zJ4A', title: 'Maria Becerra x TINI - High', artist: 'Maria Becerra', views: '43M' },
    { id: 'dQw4w9WgXcQ', title: 'L-Gante x Bizarrap - BZRP Session #38', artist: 'L-Gante', views: '38M' },
    { id: 'fJ9rUzIMcZQ', title: 'Nicki Nicole - Parte de Mí', artist: 'Nicki Nicole', views: '30M' }
];

const shortsVideos = [
    { id: 'kXYiU_JCYtU', title: 'Backstage: Grabación del nuevo álbum', artist: 'Artista A' },
    { id: '9bZkp7q19f0', title: 'Saludos desde la gira por Córdoba', artist: 'Banda Z' },
    { id: 'fJ9rUzIMcZQ', title: 'Entrevista exclusiva post-show', artist: 'Cantante X' },
    { id: '2lXVbN8zJ4A', title: 'Teaser: Próximo lanzamiento', artist: 'Productora Y' }
];

const conciertosVideos = [
    { id: 'jfKfPfyJRdk', title: 'Live at Estadio River Plate - Full Concert', artist: 'Banda Principal', duration: '2:15:00' },
    { id: 'kXYiU_JCYtU', title: 'Festival Cosquín 2024 - Día 1', artist: 'Varios Artistas', duration: '4:30:00' },
    { id: '9bZkp7q19f0', title: 'Sesión Acústica en Estudios', artist: 'Artista Invitado', duration: '45:00' },
    { id: '2lXVbN8zJ4A', title: 'Recital en Teatro Gran Rex - Completo', artist: 'Cantante Popular', duration: '1:45:00' }
];

const teatrosVideos = [
    { id: 'fJ9rUzIMcZQ', title: 'Obra: El Lago de los Cisnes - Teatro Colón', artist: 'Ballet Nacional', duration: '2:30:00' },
    { id: 'dQw4w9WgXcQ', title: 'Stand Up Comedy - Teatro Maipo', artist: 'Comediante Argentino', duration: '1:20:00' },
    { id: 'kXYiU_JCYtU', title: 'Opera: La Traviata - Teatro Cervantes', artist: 'Compañía Lírica', duration: '2:45:00' },
    { id: 'jfKfPfyJRdk', title: 'Documental: 100 años del Teatro Colón', artist: 'Productora Cultural', duration: '55:00' }
];

const radios = [
    { name: 'Radio Nacional', url: 'https://sa.mp3.icecast.magma.edge-access.net:7200/sc_rad32', genre: 'General' },
    { name: 'Rock & Pop', url: 'https://stream.zeno.fm/ezh5mb8q61zuv', genre: 'Rock' },
    { name: 'Radio La 100', url: 'https://streamingv2.shoutcast.com/streaming/296', genre: 'Pop/Rock' },
    { name: 'Radio Metro', url: 'https://playerservices.streamtheworld.com/api/livestream-redirect/85d1e8dd-3f2f-4f0e-8f0e-8f0e8f0e8f0e', genre: 'Variados' }
];

// ==========================================
// FUNCIONES DE RENDERIZADO (Con fallback de imagen)
// ==========================================
function createCardHTML(video, badgeText, badgeColor = 'var(--primary)') {
    return `
        <div class="card" onclick="playVideo('${video.id}', '${video.title.replace(/'/g, "\\'")}')">
            <div class="card-img">
                <img src="https://img.youtube.com/vi/${video.id}/mqdefault.jpg" 
                     onerror="this.src='https://via.placeholder.com/320x180/0F172A/2563EB?text=UADAV+STREAM'" 
                     alt="${video.title}">
                <span class="card-badge" style="background: ${badgeColor};">${badgeText}</span>
            </div>
            <div class="card-body">
                <div class="card-title">${video.title}</div>
                <div class="card-meta">
                    <span>${video.artist}</span>
                    <span>${video.views || video.duration || ''}</span>
                </div>
            </div>
        </div>
    `;
}

function renderAll() {
    document.getElementById('trending-grid').innerHTML = trendingVideos.map(v => createCardHTML(v, 'MÚSICA')).join('');
    document.getElementById('shorts-grid').innerHTML = shortsVideos.map(v => createCardHTML(v, 'SHORT', 'var(--gold)')).join('');
    document.getElementById('conciertos-grid').innerHTML = conciertosVideos.map(v => createCardHTML(v, 'LIVE', 'var(--red)')).join('');
    document.getElementById('teatros-grid').innerHTML = teatrosVideos.map(v => createCardHTML(v, 'TEATRO', 'var(--gold)')).join('');
    
    document.getElementById('radios-grid').innerHTML = radios.map(radio => `
        <div class="radio-card" onclick="playRadio('${radio.name}', '${radio.url}')">
            <i class="fas fa-broadcast-tower"></i>
            <h3>${radio.name}</h3>
            <p>${radio.genre}</p>
            <div class="radio-live"><i class="fas fa-circle"></i> EN VIVO</div>
        </div>
    `).join('');
}

// ==========================================
// FUNCIONES DE REPRODUCCIÓN (Con try/catch para evitar AbortError)
// ==========================================
function playVideo(videoId, title) {
    document.getElementById('video-iframe').src = `https://www.youtube.com/embed/${videoId}?autoplay=1&rel=0&modestbranding=1`;
    document.getElementById('video-title').textContent = title;
    document.getElementById('video-modal').classList.add('active');
}

function closeModal() {
    document.getElementById('video-iframe').src = '';
    document.getElementById('video-modal').classList.remove('active');
}

async function playRadio(name, url) {
    const radioBar = document.getElementById('radio-bar');
    const audio = document.getElementById('radio-audio');
    document.getElementById('radio-name').textContent = name;
    document.getElementById('radio-icon').className = 'fas fa-pause';
    
    audio.src = url;
    try {
        await audio.play(); // Try/catch evita el AbortError si el navegador bloquea autoplay
        radioBar.classList.add('active');
    } catch (err) {
        console.warn("Autoplay bloqueado por el navegador. El usuario debe hacer clic en Play.", err);
        radioBar.classList.add('active');
    }
}

function toggleRadio() {
    const audio = document.getElementById('radio-audio');
    const icon = document.getElementById('radio-icon');
    if (audio.paused) {
        audio.play().catch(e => console.log(e));
        icon.className = 'fas fa-pause';
    } else {
        audio.pause();
        icon.className = 'fas fa-play';
    }
}

function closeRadio() {
    const audio = document.getElementById('radio-audio');
    audio.pause();
    audio.src = '';
    document.getElementById('radio-bar').classList.remove('active');
}

// ==========================================
// BÚSQUEDA (Con Proxy CORS y Fallback de Emergencia)
// ==========================================
async function searchMusic() {
    const query = document.getElementById('search-input').value.trim();
    if (!query) return;
    
    const grid = document.getElementById('results-grid');
    grid.innerHTML = '<div class="loading"><div class="spinner"></div><p>Buscando en la plataforma...</p></div>';
    showSection('results', document.querySelector('.nav-links button')); // Hack para ocultar otras secciones

    try {
        // Usamos corsproxy.io para evitar el bloqueo CORS de byethost7.com hacia APIs externas
        const targetUrl = `https://invidious.fdn.fr/api/v1/search?q=${encodeURIComponent(query)}&type=video`;
        const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(targetUrl)}`;
        
        const response = await fetch(proxyUrl);
        if (!response.ok) throw new Error('Network response was not ok');
        const data = await response.json();
        
        const videos = data.filter(item => item.type === 'video').slice(0, 12);
        
        if (videos.length > 0) {
            grid.innerHTML = videos.map(item => `
                <div class="card" onclick="playVideo('${item.videoId}', '${item.title.replace(/'/g, "\\'")}')">
                    <div class="card-img">
                        <img src="https://img.youtube.com/vi/${item.videoId}/mqdefault.jpg" 
                             onerror="this.src='https://via.placeholder.com/320x180/0F172A/2563EB?text=UADAV'" 
                             alt="${item.title}">
                        <span class="card-badge">MÚSICA</span>
                    </div>
                    <div class="card-body">
                        <div class="card-title">${item.title}</div>
                        <div class="card-meta">${item.author}</div>
                    </div>
                </div>
            `).join('');
        } else {
            grid.innerHTML = '<p style="text-align:center; color: var(--text-muted); grid-column: 1/-1;">No se encontraron resultados. Intenta con otro término.</p>';
        }
    } catch (error) {
        console.error('Error en búsqueda (CORS o Red):', error);
        // FALLBACK ELEGANTE: Si la API falla, mostramos datos de demo para que la presentación NO se arruine.
        grid.innerHTML = `
            <div class="fallback-box">
                <i class="fas fa-wifi" style="font-size: 2rem; color: var(--primary); margin-bottom: 1rem;"></i>
                <h3>Conexión restringida por el proveedor de hosting</h3>
                <p style="color: var(--text-muted); margin-bottom: 1.5rem;">El servidor está bloqueando la búsqueda externa temporalmente. Mostrando resultados de demostración para que puedas continuar la presentación.</p>
                <div class="grid" style="margin-top: 1rem;">
                    ${createCardHTML({id: 'dQw4w9WgXcQ', title: `Búsqueda Demo: ${query}`, artist: 'Artista Demo', views: 'Demo'}, 'DEMO', 'var(--gold)')}
                    ${createCardHTML({id: '9bZkp7q19f0', title: `Búsqueda Demo: ${query} (Live)`, artist: 'Banda Demo', views: 'Demo'}, 'DEMO', 'var(--gold)')}
                </div>
            </div>
        `;
    }
}

// ==========================================
// NAVEGACIÓN
// ==========================================
function showSection(sectionName, btnElement) {
    document.querySelectorAll('.section').forEach(s => s.style.display = 'none');
    document.querySelectorAll('.nav-links button').forEach(b => b.classList.remove('active'));
    
    const section = document.getElementById(`section-${sectionName}`);
    if (section) {
        section.style.display = 'block';
        if(sectionName !== 'results') {
            section.scrollIntoView({ behavior: 'smooth' });
        }
    }
    if (btnElement && btnElement.classList) {
        btnElement.classList.add('active');
    }
}

// ==========================================
// INICIALIZACIÓN
// ==========================================
document.addEventListener('DOMContentLoaded', () => {
    renderAll();
});

// Cerrar modal al hacer clic fuera
document.getElementById('video-modal').addEventListener('click', (e) => {
    if (e.target.id === 'video-modal') closeModal();
});
</script>

</body>
</html>
