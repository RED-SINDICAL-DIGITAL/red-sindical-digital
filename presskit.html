<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Presentación artística</title><link rel="stylesheet" href="/uadav-presskit-v138.css?v=12028"><script src="/platform-brand-runtime.js" defer></script><script src="/uadav-presskit-v138.js?v=20261018-show-safe"></script><script src="/uadav-share-v136.js?v=20261029-safe-links"></script><link rel="stylesheet" href="/uadav-share-v132.css?v=20261029-mobile-share"><meta property="og:title" content="★ UADAV STREAM · Artistas"><meta property="og:description" content="Descubrí artistas, espectáculos y propuestas para tu evento."><meta property="og:image" content="https://uadavstream.com.ar/assets/uadav-share-card.png"><meta name="twitter:card" content="summary_large_image"></head><body data-page="presskit"><main><nav class="kit-toolbar" aria-label="Presentación"><a id="profile" href="/artistas.html">Ver perfil artístico</a><button id="print" hidden>Imprimir / guardar PDF</button><button id="share" hidden>Compartir presentación</button></nav><p id="status" role="status" aria-live="polite">Cargando presentación…</p><button id="retry" class="kit-button" type="button" hidden>Volver a cargar presentación</button><article id="app"></article></main><script>
const $=id=>document.getElementById(id),id=new URLSearchParams(location.search).get('artist_id');
if(id)$('profile').href='/artista.html?id='+encodeURIComponent(id);
let presentationBusy=false;
async function loadPresentation(){
 if(presentationBusy)return;
 presentationBusy=true;$('app').innerHTML='';$('print').onclick=null;$('share').onclick=null;$('retry').hidden=true;$('retry').disabled=true;$('print').hidden=true;$('share').hidden=true;
 $('status').className='';$('status').textContent='Cargando presentación…';
 const c=new AbortController(),timer=setTimeout(()=>c.abort(),15000);
 try{
  if(!id)throw Error('Elegí un artista para ver su presentación.');
  const r=await fetch((window.PLATFORM_API_BASE||window.UADAV_API_BASE||'https://uadav-api.uadavstream.workers.dev/api/')+'public/presskit?artist_id='+encodeURIComponent(id),{cache:'no-store',signal:c.signal});
  let d;try{d=await r.json()}catch{throw Error('No pudimos leer la presentación. Volvé a intentarlo.')}
  if(!r.ok)throw Error(d.error||'Presentación no disponible');
  if(!d||String(d.artist_id||'')!==id||!d.kit||typeof d.kit!=='object'||Array.isArray(d.kit)||typeof d.kit.name!=='string'||!d.kit.name.trim()||typeof d.kit.bio!=='string'||!d.kit.bio.trim())throw Error('La presentación llegó incompleta. Volvé a intentarlo.');
  document.title=(d.kit.name||'Artista')+' · Presentación artística';
  $('app').innerHTML=UADAVPressKit.render({...d,artist_id:id});
  $('app').querySelectorAll('img').forEach(img=>img.onerror=()=>{img.hidden=true});
  $('status').textContent='';$('print').hidden=false;
  $('print').onclick=()=>window.print();
  if(window.UADAVShare&&typeof UADAVShare.open==='function'){
   try{if(typeof UADAVShare.prepare==='function')UADAVShare.prepare('kit',{...d.kit,artist_id:id})}catch{}
   $('share').hidden=false;$('share').onclick=()=>UADAVShare.open('kit',{...d.kit,artist_id:id});
  }
 }catch(e){
  $('status').className='kit-message';$('status').textContent=e.name==='AbortError'?'La carga demoró demasiado. Podés volver a intentarlo.':e.message;
  $('retry').hidden=!id;
 }finally{presentationBusy=false;$('retry').disabled=false;clearTimeout(timer)}
}
$('retry').onclick=loadPresentation;
loadPresentation();
</script></body></html>
