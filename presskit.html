<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Presentación artística</title><style>body{margin:0;background:#080d18;color:#fff;font:17px/1.6 system-ui}main{max-width:960px;margin:auto;padding:40px 24px}h1{font-size:clamp(34px,7vw,64px);line-height:1.1}p{white-space:pre-wrap}section{padding:24px;border:1px solid #293751;border-radius:20px;margin:20px 0;background:#111d31}img{width:180px;border-radius:20px}a{color:#98bdff}button{background:#2f6df6;color:white;border:0;padding:12px;border-radius:12px;cursor:pointer}@media print{body{background:white;color:black}section{background:white;border-color:#ddd}.no-print{display:none}a{color:black}}</style><link rel="stylesheet" href="/uadav-design-v118.css?v=11802"></head><body><main id="app"><p>Cargando presentación…</p></main><script>
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const safe=v=>/^https?:\/\//i.test(String(v||''))?v:'';
(async()=>{try{const id=new URLSearchParams(location.search).get('artist_id');if(!id)throw Error('Presentación no disponible');const c=new AbortController(),timer=setTimeout(()=>c.abort(),15000);let r;try{r=await fetch((window.PLATFORM_API_BASE||'https://uadav-api.uadavstream.workers.dev/api/')+'public/presskit?artist_id='+encodeURIComponent(id),{cache:'no-store',signal:c.signal})}finally{clearTimeout(timer)}const d=await r.json();if(!r.ok)throw Error(d.error||'Presentación no disponible');const k=d.kit;document.title=k.name+' · Presentación artística';document.getElementById('app').innerHTML=`<div class="no-print"><a href="/artista.html?id=${encodeURIComponent(d.artist_id)}">Ver perfil artístico</a> · <button id="print">Guardar PDF / imprimir</button></div>${safe(k.photo)?`<img src="${esc(k.photo)}" alt="${esc(k.name)}">`:''}<h1>${esc(k.name)}</h1><p>${esc(k.discipline)} · ${esc(k.city)}</p><section><h2>Presentación</h2><p>${esc(k.bio)}</p>${k.trajectory?`<h2>Trayectoria</h2><p>${esc(k.trajectory)}</p>`:''}${safe(k.video)?`<a href="${esc(k.video)}" target="_blank" rel="noopener">Ver video de presentación</a>`:''}</section>${d.shows.map(x=>`<section><h2>${esc(x.name)}</h2><p>Duración: ${esc(x.duration)}<br>Público: ${esc(x.audience)}<br>Integrantes: ${esc(x.members)}</p><h3>Necesidades técnicas</h3><p>${esc(x.requirements)}</p><p>Montaje: ${esc(x.setup)}</p></section>`).join('')}<section><h2>Contacto</h2><p>${esc(k.contact)}</p></section><small>Información publicada por el artista. No acredita contratación ni condiciones técnicas certificadas.</small>`;document.getElementById('print').onclick=()=>window.print()}catch(e){document.getElementById('app').textContent=e.message}})();
</script></body></html>
