<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Presentación artística</title><link rel="stylesheet" href="/uadav-presskit-v138.css?v=12028"><script src="/platform-brand-runtime.js" defer></script><script src="/uadav-presskit-v138.js?v=12028"></script><script src="/uadav-share-v136.js?v=12022"></script><link rel="stylesheet" href="/uadav-share-v132.css?v=12022"><meta property="og:title" content="★ UADAV STREAM · Artistas"><meta property="og:description" content="Descubrí artistas, espectáculos y propuestas para tu evento."><meta property="og:image" content="https://uadavstream.com.ar/assets/uadav-share-card.png"><meta name="twitter:card" content="summary_large_image"></head><body data-page="presskit"><main><nav class="kit-toolbar" aria-label="Presentación"><a id="profile" href="/artistas.html">Ver perfil artístico</a><button id="print" hidden>Imprimir / guardar PDF</button><button id="share" hidden>Compartir presentación</button></nav><p id="status" role="status" aria-live="polite">Cargando presentación…</p><article id="app"></article></main><script>
const $=id=>document.getElementById(id),id=new URLSearchParams(location.search).get('artist_id');
if(id)$('profile').href='/artista.html?id='+encodeURIComponent(id);
(async()=>{const c=new AbortController(),timer=setTimeout(()=>c.abort(),15000);try{if(!id)throw Error('Elegí un artista para ver su presentación.');const r=await fetch((window.PLATFORM_API_BASE||window.UADAV_API_BASE||'https://uadav-api.uadavstream.workers.dev/api/')+'public/presskit?artist_id='+encodeURIComponent(id),{cache:'no-store',signal:c.signal});const d=await r.json();if(!r.ok)throw Error(d.error||'Presentación no disponible');document.title=(d.kit?.name||'Artista')+' · Presentación artística';$('app').innerHTML=UADAVPressKit.render({...d,artist_id:id});$('app').querySelectorAll('img').forEach(img=>img.onerror=()=>{img.hidden=true});$('status').textContent='';$('print').hidden=false;$('share').hidden=false;$('print').onclick=()=>window.print();UADAVShare.prepare('kit',{...d.kit,artist_id:id});$('share').onclick=()=>UADAVShare.open('kit',{...d.kit,artist_id:id})}catch(e){$('status').className='kit-message';$('status').textContent=e.name==='AbortError'?'La carga demoró demasiado. Volvé a intentarlo.':e.message}finally{clearTimeout(timer)}})();
</script></body></html>
