const BASE=window.UADAV_API_BASE||'https://uadav-api.uadavstream.workers.dev/api/',id=new URLSearchParams(location.search).get('id')||'';const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));async function api(p){const r=await fetch(BASE+p+(p.includes('?')?'&':'?')+'_='+Date.now(),{cache:'no-store'});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'No disponible');return d}function card(x){return `<article class="card"><img src="${esc(x.thumbnail||x.imagen||x.poster||'')}" alt=""><div><strong>${esc(x.titulo||x.title||'Contenido')}</strong></div></article>`}async function boot(){try{const [a,c,e]=await Promise.all([api('public/artista?id='+encodeURIComponent(id)),api('content?artist_id='+encodeURIComponent(id)).catch(()=>[]),api('cartelera').catch(()=>[])]);if(!a.afiliado_verificado||a.presskit_enabled===false)throw new Error('Press Kit disponible para artistas afiliados que lo habiliten.');const ev=(Array.isArray(e)?e:[]).filter(x=>String(x.artista_id||'')===String(a.id)||String(x.titulo||'').toLowerCase().includes(String(a.nombre||'').toLowerCase())).slice(0,8),content=(Array.isArray(c)?c:[]).slice(0,9),socials=Object.entries(a.redes||{}).filter(([,v])=>v);document.title='Press Kit · '+a.nombre+' · ★ UADAV STREAM';document.getElementById('app').className='';document.getElementById('app').innerHTML=`<section class="hero">${a.foto?`<img class="photo" src="${esc(a.foto)}" alt="${esc(a.nombre)}">`:''}<div><div class="eyebrow">✓ ARTISTA AFILIADO UADAV · PRESS KIT OFICIAL</div><h1 class="title">${esc(a.nombre)}</h1><div class="meta">${esc(a.rubro||'Artista')} · ${esc([a.ciudad,a.provincia,a.pais].filter(Boolean).join(', '))}</div><p class="bio">${esc(a.bio||'')}</p></div></section><div class="grid"><section class="panel"><h2>Contenido seleccionado</h2><div class="rail">${content.length?content.map(card).join(''):'<div class="empty">Sin contenido seleccionado.</div>'}</div><h2 style="margin-top:24px">Próximas fechas</h2><div class="list">${ev.length?ev.map(x=>`<div class="item"><strong>${esc(x.titulo||x.nombre)}</strong><small>${esc([x.fecha_inicio||x.fecha,x.lugar,x.ciudad].filter(Boolean).join(' · '))}</small></div>`).join(''):'<div class="item">Sin eventos publicados.</div>'}</div></section><aside class="panel"><h2>Ficha rápida</h2><div class="list"><div class="item"><strong>Rubro</strong><small>${esc(a.rubro||'—')}</small></div><div class="item"><strong>Disponibilidad</strong><small>${esc(a.disponibilidad||'A consultar')}</small></div><div class="item"><strong>Honorario desde</strong><small>${esc(a.honorario_desde||'A convenir')}</small></div></div><h2 style="margin-top:22px">Redes y fuentes</h2><div class="socials">${socials.map(([k,v])=>`<a class="pill" href="${esc(v)}" target="_blank" rel="noopener">${esc(k)}</a>`).join('')}${a.web?`<a class="pill" href="${esc(a.web)}" target="_blank">web</a>`:''}</div><p style="color:var(--muted);font-size:11px;line-height:1.5;margin-top:22px">Generado por ★ UADAV STREAM. La afiliación sindical, contratación y condiciones profesionales se verifican por los canales correspondientes.</p></aside></div>`}catch(e){document.getElementById('app').innerHTML='<h2>Press Kit no disponible</h2><p>'+esc(e.message)+'</p>'}}boot();
</script><script src="/uadav-ui-v8.4.js?v=924"></script><script src="/uadav-app-bridge-v10.js?v=103"></script>
