<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#05080d"><title>Películas y Series · ★ UADAV STREAM</title><script src="/uadav-api-config.js"></script><style>
:root{--bg:#05080d;--surface:#0d141e;--line:rgba(255,255,255,.09);--text:#fff;--muted:#93a2b5;--accent:#00e5ff}*{box-sizing:border-box}body{margin:0;background:#05080d;color:#fff;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}a{color:inherit;text-decoration:none}button,input{font:inherit}.shell{width:min(1480px,94vw);margin:auto;padding:16px 0 90px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:30;padding:8px 0 14px;background:linear-gradient(#05080d 75%,transparent)}.left,.actions{display:flex;align-items:center;gap:8px}.brand{display:flex;align-items:center;gap:10px;font-weight:950}.mark{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:var(--accent);color:#041017}.btn{border:1px solid var(--line);background:rgba(255,255,255,.05);color:#fff;padding:10px 14px;border-radius:12px;font-weight:850;cursor:pointer}.back{width:40px;height:40px;border-radius:50%;padding:0}.hero{height:clamp(360px,48vw,620px);border-radius:28px;overflow:hidden;position:relative;background:#10161f center/cover no-repeat;display:flex;align-items:flex-end}.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.93),rgba(0,0,0,.52) 48%,rgba(0,0,0,.15)),linear-gradient(0deg,#05080d,transparent 48%)}.hero-copy{position:relative;z-index:2;padding:clamp(28px,5vw,64px);max-width:760px}.eyebrow{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#9defff;font-weight:950}.hero h1{font-size:clamp(42px,6vw,84px);line-height:.94;letter-spacing:-.055em;margin:8px 0 12px}.hero p{color:#d0d9e4;line-height:1.55}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:20px 0}.search{flex:1;min-width:240px;background:#0b1119;border:1px solid var(--line);border-radius:12px;color:#fff;padding:12px 14px}.chip{border:1px solid var(--line);background:rgba(255,255,255,.04);color:#cdd6e1;border-radius:999px;padding:9px 12px;cursor:pointer;font-weight:800}.chip.active{background:#fff;color:#061018}.section{margin-top:28px}.section h2{font-size:28px;margin:0 0 12px}.rail{display:flex;gap:14px;overflow:auto;scrollbar-width:none;padding:2px 0 10px}.rail::-webkit-scrollbar{display:none}.card{flex:0 0 210px;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--surface);transition:.18s}.card:hover{transform:translateY(-3px);border-color:rgba(0,229,255,.4)}.poster{aspect-ratio:2/3;background:#111}.poster img{width:100%;height:100%;object-fit:cover}.copy{padding:12px}.copy strong{display:block;font-size:14px}.copy small{display:block;color:var(--muted);margin-top:5px}.empty{padding:28px;border:1px dashed var(--line);border-radius:18px;color:var(--muted)}@media(max-width:700px){.shell{width:min(100% - 20px,1480px)}.actions .btn{display:none}.hero{height:500px}.card{flex-basis:160px}.hero h1{font-size:45px}}.tv-mode .card{flex-basis:260px}.tv-mode .hero{height:62vh}.tv-mode :focus-visible{outline:4px solid #fff;outline-offset:3px}
</style></head><body><main class="shell"><header class="top"><div class="left"><button class="btn back" onclick="goBack()">←</button><a class="brand" href="/index.html"><span class="mark">★</span><span>UADAV STREAM</span></a></div><div class="actions"><a class="btn" href="/playlists.html">Playlists</a><a class="btn" href="/podcasts.html">Podcast</a></div></header><section id="hero" class="hero"><div class="hero-copy"><div class="eyebrow">PELÍCULAS Y SERIES</div><h1 id="heroTitle">Catálogo audiovisual</h1><p id="heroDesc">Películas, series, temporadas y episodios seleccionados para UADAV STREAM.</p><div><a id="heroOpen" class="btn" href="#">Ver título</a></div></div></section><div class="toolbar"><input id="q" class="search" placeholder="Buscar película, serie o género…"><button class="chip active" data-type="">Todo</button><button class="chip" data-type="movie">Películas</button><button class="chip" data-type="series">Series</button></div><section class="section"><h2>Destacados</h2><div id="featured" class="rail"></div></section><section class="section"><h2 id="sectionTitle">Todo el catálogo</h2><div id="catalog" class="rail"></div></section></main><script>
const API=window.UADAV_API_BASE||'https://uadav-api.uadavstream.workers.dev/api/',$=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));let all=[],type='';const FALLBACK='data:image/svg+xml;charset=UTF-8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900"><rect width="100%" height="100%" fill="#111923"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" fill="#74869c" font-size="28" font-family="Arial">★ UADAV STREAM</text></svg>');function goBack(){if(history.length>1)history.back();else location.href='/index.html'}async function api(path){const r=await fetch(API+path+(path.includes('?')?'&':'?')+'_='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}function card(x){return `<article class="card" tabindex="0"><a href="/media.html?id=${encodeURIComponent(x.id)}"><div class="poster"><img loading="lazy" src="${esc(x.poster||FALLBACK)}" onerror="this.src=FALLBACK" alt="${esc(x.titulo||x.title||'Título')}"></div><div class="copy"><strong>${esc(x.titulo||x.title||'Sin título')}</strong><small>${esc([(x.media_type||x.tipo)==='series'?'Serie':'Película',x.year,Array.isArray(x.generos)?x.generos.slice(0,2).join(' · '):x.generos].filter(Boolean).join(' · '))}</small></div></a></article>`}function render(){const q=$('q').value.trim().toLowerCase(),filtered=all.filter(x=>(!type||String(x.media_type||x.tipo)===type)&&(!q||[x.titulo,x.title,x.sinopsis,(x.generos||[]).toString()].join(' ').toLowerCase().includes(q)));$('catalog').innerHTML=filtered.length?filtered.map(card).join(''):'<div class="empty">No hay títulos para estos filtros.</div>';$('featured').innerHTML=(all.filter(x=>x.featured).slice(0,12).map(card).join('')||'<div class="empty">Todavía no hay destacados.</div>');const hero=all.find(x=>x.featured)||all[0];if(hero){$('hero').style.backgroundImage=`url("${String(hero.backdrop||hero.poster||'').replace(/"/g,'%22')}")`;$('heroTitle').textContent=hero.titulo||hero.title||'Catálogo audiovisual';$('heroDesc').textContent=hero.sinopsis||'Películas y series en UADAV STREAM.';$('heroOpen').href='/media.html?id='+encodeURIComponent(hero.id)}}async function load(){try{all=await api('media');if(!Array.isArray(all))all=[];render()}catch(e){$('catalog').innerHTML='<div class="empty">No se pudo cargar el catálogo.</div>'}}$('q').oninput=render;document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));b.classList.add('active');type=b.dataset.type||'';render()});if(new URLSearchParams(location.search).get('tv')==='1')document.body.classList.add('tv-mode');load();
</script><script src="/uadav-shell-bridge.js"></script></body></html>
