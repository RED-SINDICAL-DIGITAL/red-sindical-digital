learTimeout(timer)}}function arr(x){return Array.isArray(x)?x:(x?.items||x?.artistas||x?.results||[])}function artistHref(a){return(a.discovered||a.generated)?'/artista.html?discover='+encodeURIComponent(a.nombre||a.name||a.title||''):'/artista.html?id='+encodeURIComponent(a.id||a.slug||a.nombre||'')}function card(a){return`<a class="card" href="${artistHref(a)}"><img loading="lazy" src="${esc(a.foto||a.avatar||a.thumbnail||a.portada||'/radio-fallback.svg')}" onerror="this.src='/radio-fallback.svg'"><div class="copy"><div class="name">${esc(a.nombre||a.title||'Artista')}</div><div class="type">${esc(a.rubro||a.actividad||a.categoria||'Artista')}</div></div></a>`}function render(a){$('count').textContent=a.length?a.length+' artistas':'';$('grid').innerHTML=a.length?a.map(card).join(''):'<div class="empty">No encontramos artistas con ese criterio.</div>'}async function load(){try{all=arr(await api('public/artistas'))}catch{try{all=arr(await api('artistas'))}catch{all=[]}}render(all)}function navigateArtist(href){try{const h=window.parent!==window&&(window.parent.UADAVShellHost||window.parent.UADAV_APP||window.parent.UADAVShell);if(h?.navigate)return h.navigate(href)}catch(_){}if(window.parent!==window){window.parent.postMessage({type:'uadav:navigate',href},location.origin);return}location.href=href}async function search(){let q=$('q').value.trim();if(!q){let x=cat?all.filter(a=>norm([a.rubro,a.actividad,a.categoria].join(' ')).includes(cat)):all;render(x);return}let local=all.filter(a=>norm([a.nombre,a.nombre_artistico,a.rubro,a.actividad].join(' ')).includes(norm(q)));if(local.length){render(local);if(local.length===1)setTimeout(()=>navigateArtist(artistHref(local[0])),80);return}$('grid').innerHTML='<div class="empty">Descubriendo '+esc(q)+'…</div>';try{let d=await api('public/discover-artist?q='+encodeURIComponent(q)),p=d?.data||d?.artist||d;if(p&&(p.nombre||p.name||p.title)){p.nombre=p.nombre||p.name||p.title;p.discovered=true;render([p]);setTimeout(()=>navigateArtist(artistHref(p)),80);return}}catch(e){console.warn('discover-artist',e)}try{const [yd,pd]=await Promise.all([api('youtube/search?q='+encodeURIComponent(q+' official channel')).catch(()=>[]),api('public/search?q='+encodeURIComponent(q)).catch(()=>({}))]);let v=[...arr(yd),...arr(pd?.content)];if(v.length){let b=v.find(x=>norm(x.author||x.channelTitle||x.channel_name||'')===norm(q))||v.find(x=>norm(x.author||x.channelTitle||x.channel_name||'').includes(norm(q)))||v[0],n=b.author||b.channelTitle||b.channel_name||q,p={nombre:n,foto:b.author_thumbnail||b.channelThumbnail||b.thumbnail||'',rubro:'Perfil descubierto',discovered:true,generated:true};render([p]);setTimeout(()=>navigateArtist(artistHref(p)),80);return}}catch(e){console.warn(e)}render([])}$('form').onsubmit=e=>{e.preventDefault();search()};let t;$('q').oninput=()=>{clearTimeout(t);t=setTimeout(search,450)};document.querySelectorAll('[data-cat]').forEach(b=>b.addEventListener('click',()=>{cat=b.dataset.cat;search()}));load();document.addEventListener('click',e=>{const x=e.target.closest('a[href^="/"]');if(!x||window.parent===window)return;e.preventDefault();const href=x.getAttribute('href');try{const h=window.parent.UADAVShellHost||window.parent.UADAV_APP||window.parent.UADAVShell;if(h?.navigate){h.navigate(href);return}}catch(_){}window.parent.postMessage({type:'uadav:navigate',href},location.origin)});</script><script src="/uadav-app-bridge-v104.js?v=11719"></script></body></html>
