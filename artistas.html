<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="site-page" content="artistas"><meta name="theme-color" content="#07090d"><title>Artistas · ★ UADAV STREAM</title><style>:root{--bg:#07090d;--line:rgba(255,255,255,.1);--muted:#93a0b2;--accent:#2f6df6}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0%,rgba(47,109,246,.09),transparent 30%),var(--bg);color:#fff;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}a{color:inherit;text-decoration:none}button,input{font:inherit}.wrap{width:min(1280px,94vw);margin:auto;padding:18px 0 60px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0 18px}.brand{display:flex;align-items:center;gap:10px;font-weight:950}.star{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--accent)}.btn{border:1px solid var(--line);background:rgba(255,255,255,.04);padding:10px 14px;border-radius:12px;color:#fff;font-weight:850;cursor:pointer}.btn.primary{background:#fff;color:#061018}.hero{padding:34px;border:1px solid var(--line);border-radius:28px;background:linear-gradient(110deg,rgba(47,109,246,.14),rgba(10,13,19,.94) 58%,rgba(255,255,255,.025));margin-bottom:18px}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.16em;color:#8fb0ff;font-weight:900}.hero h1{font-size:clamp(38px,6vw,72px);line-height:.95;letter-spacing:-.05em;margin:10px 0}.hero p{max-width:760px;color:#c1cad8;line-height:1.55}.searchbar{display:flex;gap:10px;margin-top:22px}.searchbar input{flex:1;background:#0b1017;border:1px solid var(--line);color:#fff;border-radius:14px;padding:14px 16px;outline:none}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.card{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:#0d1015;transition:.18s}.card:hover{transform:translateY(-3px);border-color:rgba(47,109,246,.48)}.card-media{aspect-ratio:1/1;background:#0b1017}.card-media img{width:100%;height:100%;object-fit:cover}.card-body{padding:14px}.name{font-size:18px;font-weight:900}.meta{color:var(--muted);font-size:12px;margin-top:5px}.pill{display:inline-flex;margin-top:9px;font-size:10px;padding:5px 8px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid var(--line)}.empty{padding:36px 10px;text-align:center;color:var(--muted)}.footer{margin-top:36px;padding-top:18px;border-top:1px solid var(--line);color:var(--muted);font-size:12px}@media(min-width:1180px){.wrap{width:min(1540px,calc(100vw - 64px));padding-top:22px}.hero{padding:48px 52px}.hero h1{font-size:clamp(58px,5.2vw,82px)}.searchbar{max-width:1050px}.grid{grid-template-columns:repeat(6,minmax(0,1fr));gap:16px}}@media(max-width:980px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:700px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));}.hero{padding:24px}.searchbar{flex-direction:column}.searchbar .btn{width:100%}}</style><script src="/site-page-config.js" defer></script><link rel="stylesheet" href="/uadav-design-v7.2.css"><script src="/uadav-brand-v7.2.js" defer></script><script src="/uadav-api-config.js?v=10254"></script></head><body><div class="wrap"><header class="top"><a class="brand" href="/index.html"><span class="star">★</span><span>UADAV STREAM</span></a><a class="btn" href="/para-artistas.html">Para artistas</a></header><section class="hero"><div class="eyebrow">ARTISTAS</div><h1>¿A quién querés encontrar?</h1><p>Buscá por nombre. Primero buscamos perfiles de UADAV STREAM; si todavía no existe, podés descubrir al artista desde su contenido público.</p><form id="searchForm" class="searchbar"><input id="q" autocomplete="off" placeholder="Nombre del artista…"><button class="btn primary">Buscar</button></form></section><section><div style="display:flex;justify-content:space-between;align-items:end;gap:10px"><div><div class="eyebrow">DESCUBRIR</div><h2 style="margin:5px 0 0;font-size:30px">Artistas y perfiles</h2></div><div id="count" class="meta"></div></div><div id="searchHint" class="meta" style="margin-top:12px;display:none"></div><div id="grid" class="grid" style="margin-top:16px"></div></section><div class="footer">★ UADAV STREAM · Artistas</div></div><script>
const API=window.UADAV_API_BASE||'https://uadav-api.uadavstream.workers.dev/api/';async function get(path){const r=await fetch(API+path,{cache:'no-store'}),d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'HTTP '+r.status);return d}const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const norm=v=>String(v||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');let all=[],q='';function score(a){const n=norm(a.nombre_artistico||a.nombre),s=norm(q);if(!s)return 0;if(n===s)return 100;if(n.startsWith(s))return 80;if(n.includes(s))return 60;return norm([a.nombre,a.rubro,a.ciudad,a.provincia].join(' ')).includes(s)?20:0}function card(a){const generated=a.discovered||a.generated;return `<article class="card"><a href="${generated?'/artista.html?discover='+encodeURIComponent(a.nombre||q):'/artista.html?id='+encodeURIComponent(a.id||a.canal||a.nombre)}"><div class="card-media"><img src="${esc(a.foto||a.thumbnail||a.portada||'/radio-fallback.svg')}" onerror="this.src='/radio-fallback.svg'"></div><div class="card-body"><div class="name">${esc(a.nombre||q)}</div><div class="meta">${esc(a.rubro||'Artista / creador')}</div>${generated?'<span class="pill">✦ Descubrir perfil público</span>':''}</div></a></article>`}function render(items){document.getElementById('count').textContent=q?items.length+' resultado'+(items.length===1?'':'s'):(items.length?items.length+' perfiles UADAV':'');const h=document.getElementById('searchHint');h.style.display=q?'block':'none';h.textContent=q?(items.length?'Resultados para “'+q+'”':'Buscando fuentes públicas para “'+q+'”…'):'';document.getElementById('grid').innerHTML=items.length?items.map(card).join(''):(q?'<div class="empty" style="grid-column:1/-1">Buscando artista…</div>':'<div class="empty" style="grid-column:1/-1">Todavía no hay perfiles públicos disponibles.</div>')}async function load(){try{const d=await get('public/artistas');all=Array.isArray(d)?d:(d.items||d.artistas||d.results||[])}catch(e){console.warn(e);all=[]}render(all)}function ytItems(d){if(Array.isArray(d))return d;if(Array.isArray(d?.items))return d.items;if(Array.isArray(d?.content))return d.content;if(Array.isArray(d?.results))return d.results;return []}async function discover(q){let videos=[];try{videos=ytItems(await get('youtube/search?q='+encodeURIComponent(q+' official')))}catch(e){console.warn('[youtube artist discovery]',e)}if(!videos.length){try{const d=await get('public/search?q='+encodeURIComponent(q));videos=ytItems(d)}catch(e){console.warn('[public discovery]',e)}}if(!videos.length)return null;const best=videos.find(v=>norm(v.author||v.channelTitle||v.channel_name||v.canal||'').includes(norm(q)))||videos[0];return{id:'discover:'+q,nombre:q,rubro:'Artista · perfil público',foto:best.author_thumbnail||best.channelThumbnail||best.channel_thumbnail||best.thumbnail||'',portada:best.thumbnail||'',discovered:true,generated:true,auto_content:videos}}async function search(){q=document.getElementById('q').value.trim();if(q.length<2){render(all);return}const local=all.map(a=>({a,s:score(a)})).filter(x=>x.s>0).sort((a,b)=>b.s-a.s).map(x=>x.a);if(local.length){render(local);return}render([]);const found=await discover(q);if(found){render([found]);return}document.getElementById('grid').innerHTML=`<div class="empty" style="grid-column:1/-1"><strong style="display:block;color:#fff;font-size:18px;margin-bottom:8px">No encontramos contenido público para “${esc(q)}”</strong><span>Probá con el nombre artístico completo.</span></div>`;document.getElementById('count').textContent='0 resultados'}document.getElementById('searchForm').addEventListener('submit',e=>{e.preventDefault();search()});let t;document.getElementById('q').addEventListener('input',()=>{clearTimeout(t);t=setTimeout(search,450)});const iq=new URLSearchParams(location.search).get('q')||'';if(iq)document.getElementById('q').value=iq;load().then(()=>{if(iq)search()});
</script><script src="/uadav-app-bridge-v104.js?v=10254"></script></body></html>
