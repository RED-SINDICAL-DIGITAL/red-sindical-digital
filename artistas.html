<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Artistas · ★ UADAV STREAM</title>
<style>
:root{--bg:#07090d;--panel:#10151d;--line:rgba(255,255,255,.1);--text:#fff;--muted:#93a0b2;--accent:#2f6df6;--gold:#ffd866}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0%,rgba(47,109,246,.09),transparent 30%),var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}a{color:inherit;text-decoration:none}button,input{font:inherit}.wrap{width:min(1280px,94vw);margin:auto;padding:18px 0 60px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;position:sticky;top:0;z-index:20;padding:10px 0 18px;background:linear-gradient(var(--bg) 65%,transparent)}.brand{display:flex;align-items:center;gap:10px;font-weight:950;letter-spacing:-.03em}.star{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--accent);color:#031017;font-size:19px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:rgba(255,255,255,.04);padding:10px 14px;border-radius:12px;color:#fff;font-weight:850;cursor:pointer}.btn.primary{background:#fff;color:#061018}.hero{padding:34px;border:1px solid var(--line);border-radius:28px;background:linear-gradient(110deg,rgba(47,109,246,.14),rgba(10,13,19,.94) 58%,rgba(255,255,255,.025));margin-bottom:18px}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.16em;color:#8fb0ff;font-weight:900}.hero h1{font-size:clamp(38px,6vw,72px);line-height:.95;letter-spacing:-.05em;margin:10px 0}.hero p{max-width:760px;color:#c1cad8;line-height:1.55}.searchbar{display:flex;gap:10px;margin-top:22px}.searchbar input{flex:1;background:#0b1017;border:1px solid var(--line);color:#fff;border-radius:14px;padding:14px 16px;outline:none}.searchbar input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(47,109,246,.12)}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.chip{border:1px solid var(--line);background:rgba(255,255,255,.03);color:#d7deea;border-radius:999px;padding:8px 12px;cursor:pointer}.chip.active{background:rgba(47,109,246,.12);border-color:rgba(47,109,246,.45);color:#dffbff}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.card{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:#0d1015;transition:.18s}.card-media{position:relative}.card-media:after{content:"";position:absolute;inset:auto 0 0;height:34%;background:linear-gradient(transparent,rgba(0,0,0,.32));pointer-events:none}.card:hover{transform:translateY(-3px);border-color:rgba(47,109,246,.48)}.card-media{aspect-ratio:1/1;background:#0b1017}.card-media img{width:100%;height:100%;object-fit:cover}.card-body{padding:14px}.name{font-size:18px;font-weight:900}.meta{color:var(--muted);font-size:12px;margin-top:5px}.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.pill{font-size:10px;padding:5px 8px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid var(--line)}.verified{color:#86f2b0}.empty{padding:36px 10px;text-align:center;color:var(--muted)}.footer{margin-top:36px;padding-top:18px;border-top:1px solid var(--line);color:var(--muted);font-size:12px}
/* V10.10 · PC / Notebook artists directory */
@media(min-width:1180px){
 .wrap{width:min(1540px,calc(100vw - 64px));padding-top:22px}
 .top{padding:12px 0 22px}.star{width:44px;height:44px}
 .hero{padding:48px 52px;border-radius:30px;margin-bottom:26px;background:linear-gradient(110deg,rgba(47,109,246,.13),rgba(10,13,19,.9) 58%,rgba(255,255,255,.025))}
 .hero h1{font-size:clamp(58px,5.2vw,82px);max-width:950px}.hero p{max-width:880px;font-size:16px}
 .searchbar{max-width:1050px}.searchbar input{min-height:50px;font-size:15px}.searchbar .btn{padding-left:24px;padding-right:24px}
 .filters{max-width:1200px;gap:9px;margin-top:20px}.chip{padding:9px 14px}
 .grid{grid-template-columns:repeat(6,minmax(0,1fr));gap:16px}.card{border-radius:18px}.card-body{padding:15px}.name{font-size:17px}
}
@media(min-width:1500px){.grid{grid-template-columns:repeat(7,minmax(0,1fr))}}
@media(max-width:980px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:700px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{padding:24px}.searchbar{flex-direction:column}.searchbar .btn{width:100%}}@media(max-width:440px){.grid{grid-template-columns:1fr 1fr}.card-body{padding:11px}.name{font-size:15px}}
</style>
<script src="/site-page-config.js" defer></script><link rel="stylesheet" href="/uadav-design-v7.2.css">
<script src="/uadav-brand-v7.2.js" defer></script>
<script src="/uadav-api-config.js?v=928"></script>
<link rel="stylesheet" href="/uadav-ui-v8.4.css?v=928"></head>
<body>
<div class="wrap">
  <header class="top"><a class="brand" href="/index.html"><span class="star">★</span><span>UADAV STREAM</span></a><div class="actions"><a class="btn" href="/para-artistas.html">Para artistas</a></div></header>
  <section class="hero">
    <div class="eyebrow">ARTISTAS</div>
    <h1>¿A quién querés encontrar?</h1>
    <p>Buscá por nombre. Si el artista tiene un perfil en UADAV STREAM, entrás directamente a su espacio con su información, contenido y actividad.</p>
    <form id="searchForm" class="searchbar"><input id="q" autocomplete="off" placeholder="Nombre del artista…"><button class="btn primary">Buscar</button></form>
  </section>
  <section><div style="display:flex;justify-content:space-between;align-items:end;gap:10px"><div><div class="eyebrow">RESULTADOS</div><h2 style="margin:5px 0 0;font-size:30px">Perfiles</h2></div><div id="count" class="meta"></div></div><div id="searchHint" class="meta" style="margin-top:12px;display:none"></div><div id="grid" class="grid" style="margin-top:16px"></div></section>
  <div class="footer">★ UADAV STREAM · Artistas · <a href="/terminos.html">Términos</a> · <a href="/privacidad.html">Privacidad</a></div>
</div>
<script>
const API_REMOTE=window.UADAV_API_BASE||'https://uadav-api.uadavstream.workers.dev/api/';const API_BASES=[API_REMOTE,...(window.UADAV_USE_LOCAL_API===true?[location.origin+'/api/']:[])];
async function apiFetch(path,opt={}){let last;for(const base of API_BASES){try{const r=await fetch(base+path,{...opt,cache:opt.cache||'no-store'});const ct=r.headers.get('content-type')||'';if(base!==API_REMOTE&&(r.status===404||!ct.includes('json')))continue;const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||`HTTP ${r.status}`);return d}catch(e){last=e}}throw last||new Error('No se pudo conectar')}
const ART_CACHE_KEY='uadav_artists_catalog_v928',ART_CACHE_TTL=30*60*1000;
function readArtistCache(){for(const store of [sessionStorage,localStorage]){try{const x=JSON.parse(store.getItem(ART_CACHE_KEY)||'null');if(x&&Array.isArray(x.items)&&Date.now()-Number(x.ts||0)<ART_CACHE_TTL)return x.items}catch{}}return null}
function writeArtistCache(items){const v=JSON.stringify({ts:Date.now(),items});try{sessionStorage.setItem(ART_CACHE_KEY,v)}catch{}try{localStorage.setItem(ART_CACHE_KEY,v)}catch{}}
const categories=['Todos','Música','Bandas / grupos','Circo','Humor','Magia','Danza','Teatro','Animación','Locución / conducción','Compañías / elencos','Salas / espacios','Productoras','Creadores / YouTubers','Variedades','Otros'];
let state={q:'',category:'Todos',items:[]};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const norm=v=>String(v||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
function renderFilters(){document.getElementById('filters').innerHTML=categories.map(c=>`<button class="chip ${c===state.category?'active':''}" type="button" onclick="setCategory(${JSON.stringify(c)})">${esc(c)}</button>`).join('')}
function artistText(a){return norm([a.nombre,a.nombre_artistico,a.rubro,a.categoria,a.ciudad,a.provincia,a.pais,a.bio,a.descripcion,a.genero,a.tags,Array.isArray(a.etiquetas)?a.etiquetas.join(' '):a.etiquetas].filter(Boolean).join(' '))}
function tokens(v){return norm(v).split(/\s+/).filter(Boolean)}
function scoreArtist(a,q){const qs=tokens(q);if(!qs.length)return 1;const name=norm(a.nombre_artistico||a.nombre),rubro=norm(a.rubro||a.categoria),place=norm([a.ciudad,a.provincia,a.pais].join(' ')),all=artistText(a);let score=0;for(const t of qs){if(name===t)score+=12;else if(name.startsWith(t))score+=8;else if(name.includes(t))score+=6;if(rubro.includes(t))score+=4;if(place.includes(t))score+=3;if(all.includes(t))score+=1}return score}
function matches(a){const cok=state.category==='Todos'||norm(a.rubro||a.categoria).includes(norm(state.category));return cok&&(!state.q||scoreArtist(a,state.q)>0)}
function render(){const arr=state.items.filter(matches).sort((a,b)=>(state.q?scoreArtist(b,state.q)-scoreArtist(a,state.q):0)||Number(b.afiliado_verificado===true)-Number(a.afiliado_verificado===true)||String(a.nombre||'').localeCompare(String(b.nombre||''),'es'));document.getElementById('count').textContent=state.q?`${arr.length} resultado${arr.length===1?'':'s'}`:'';const hint=document.getElementById('searchHint');if(hint){hint.style.display=state.q?'block':'none';hint.textContent=state.q?(arr.length?`Perfiles encontrados para “${state.q}”`:`No hay un perfil cargado para “${state.q}”.`):'';}const grid=document.getElementById('grid');if(!state.q){grid.innerHTML='<div class="empty" style="grid-column:1/-1"><strong style="display:block;color:#fff;font-size:18px;margin-bottom:7px">Buscá un artista por su nombre</strong><span>Los perfiles aparecerán acá.</span></div>';return}grid.innerHTML=arr.length?arr.map(a=>{const img=a.foto||a.imagen||a.thumbnail||'/radio-fallback.svg';return `<article class="card"><a href="/artista.html?id=${encodeURIComponent(a.id||a.canal||a.nombre)}"><div class="card-media"><img loading="lazy" src="${esc(img)}" alt="${esc(a.nombre||'Artista')}" onerror="this.src='/radio-fallback.svg'"></div><div class="card-body"><div class="name">${esc(a.nombre||'Artista')}</div><div class="meta">${esc(a.rubro||'Artista')}${a.ciudad?' · '+esc(a.ciudad):''}</div>${a.afiliado_verificado?'<div class="badges"><span class="pill verified">✓ Afiliado UADAV</span></div>':''}</div></a></article>`}).join(''):`<div class="empty" style="grid-column:1/-1"><strong style="display:block;color:#fff;font-size:18px;margin-bottom:7px">No encontramos “${esc(state.q)}”</strong><span style="display:block;margin-bottom:16px">Ese artista todavía no tiene un perfil público cargado en UADAV STREAM.</span><a class="btn" href="/buscar.html?q=${encodeURIComponent(state.q)}">Buscar música y videos</a></div>`}
async function load(force=false){
  const cached=!force&&readArtistCache();
  if(cached){state.items=cached;render()}
  else document.getElementById('grid').innerHTML='<div class="empty" style="grid-column:1/-1">Cargando catálogo…</div>';
  try{
    const d=await apiFetch('public/artistas');
    const items=Array.isArray(d)?d:[];
    state.items=items;writeArtistCache(items);render();
  }catch(e){
    if(!cached)document.getElementById('grid').innerHTML='<div class="empty" style="grid-column:1/-1">No pudimos cargar el catálogo ahora.</div>';
  }
}
function setCategory(c){state.category=c;renderFilters();render()}
let searchTimer;
let discoverySeq=0;async function applySearch(){state.q=document.getElementById('q').value.trim();render();const q=state.q,seq=++discoverySeq;if(q.length<2||state.items.some(matches))return;const grid=document.getElementById('grid');if(grid)grid.innerHTML='<div class="empty" style="grid-column:1/-1">Buscando el perfil público de “'+esc(q)+'”…</div>';try{const a=await apiFetch('public/discover-artist?q='+encodeURIComponent(q));if(seq!==discoverySeq||state.q!==q)return;if(a?.id){state.items=[a,...state.items.filter(x=>String(x.id)!==String(a.id))];render()}}catch(_){if(seq===discoverySeq)render()}}
document.getElementById('searchForm').addEventListener('submit',e=>{e.preventDefault();applySearch()});
document.getElementById('q').addEventListener('input',()=>{clearTimeout(searchTimer);searchTimer=setTimeout(applySearch,180)});
document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Escape'){e.currentTarget.value='';state.q='';render()}});

const urlParams=new URLSearchParams(location.search);const initialQ=urlParams.get('q')||'';const artistMode=urlParams.get('modo')==='artista';
if(initialQ){document.getElementById('q').value=initialQ;state.q=initialQ}
renderFilters();load();
</script>
<script src="/uadav-ui-v8.4.js?v=928"></script><script src="/uadav-app-bridge-v104.js?v=10112"></script>
</body></html>
