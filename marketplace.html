<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05080d"><title>Marketplace · ★ UADAV STREAM</title><style>
:root{--bg:#05080d;--panel:#101722;--line:rgba(255,255,255,.1);--text:#fff;--muted:#95a4b8;--accent:#00e5ff;--green:#7df0a6}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}.shell{width:min(1240px,94vw);margin:auto;padding:20px 0 80px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-weight:950}.btn{border:1px solid var(--line);background:#ffffff0b;color:#fff;padding:10px 14px;border-radius:12px;font-weight:850;text-decoration:none;cursor:pointer}.btn.primary{background:#fff;color:#061018}.hero{padding:34px 0 20px}.hero h1{font-size:clamp(42px,7vw,82px);margin:0;letter-spacing:-.05em}.hero p{color:var(--muted);max-width:760px;line-height:1.6}.filters{display:grid;grid-template-columns:1fr 220px;gap:10px;margin:16px 0 20px}.filters input,.filters select{background:#0a1018;color:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{border:1px solid var(--line);border-radius:20px;overflow:hidden;background:#ffffff05}.card img{width:100%;aspect-ratio:1/1;object-fit:cover;background:#111;display:block}.body{padding:14px}.body h3{margin:0 0 6px}.meta{color:var(--muted);font-size:12px;min-height:36px}.badge{display:inline-block;margin-top:8px;padding:5px 8px;border-radius:999px;border:1px solid rgba(125,240,166,.24);color:var(--green);font-size:10px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.empty{padding:50px;text-align:center;color:var(--muted)}@media(max-width:980px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:720px){.grid{grid-template-columns:repeat(2,1fr)}.filters{grid-template-columns:1fr}}@media(max-width:460px){.grid{grid-template-columns:1fr}}
</style><script src="/uadav-api-config.js"></script><link rel="stylesheet" href="/uadav-ui-v8.4.css?v=924"></head><body><main class="shell"><header class="top"><div class="brand">★ UADAV STREAM · MARKETPLACE</div><a class="btn" href="/index.html">← Inicio</a></header><section class="hero"><h1>Contratá talento</h1><p>Artistas y profesionales afiliados UADAV que habilitaron consultas desde la plataforma. La solicitud no reemplaza el contrato ni las condiciones laborales aplicables.</p></section><div class="filters"><input id="q" placeholder="Buscar artista, rubro o ciudad"><select id="cat"><option value="">Todos los rubros</option></select></div><div id="grid" class="grid"></div></main><script>
const BASE=window.UADAV_API_BASE||'https://uadav-api.uadavstream.workers.dev/api/';const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));let all=[];async function api(p){const r=await fetch(BASE+p+(p.includes('?')?'&':'?')+'_='+Date.now(),{cache:'no-store'});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'No disponible');return d}function render(){const q=(document.getElementById('q').value||'').toLowerCase(),cat=document.getElementById('cat').value;const rows=all.filter(a=>a.afiliado_verificado&&a.marketplace_enabled!==false).filter(a=>!q||[a.nombre,a.rubro,a.ciudad,a.provincia].join(' ').toLowerCase().includes(q)).filter(a=>!cat||a.rubro===cat);document.getElementById('grid').innerHTML=rows.length?rows.map(a=>`<article class="card"><img src="${esc(a.foto||'')}" alt="${esc(a.nombre)}"><div class="body"><h3>${esc(a.nombre)}</h3><div class="meta">${esc(a.rubro||'Artista')} · ${esc([a.ciudad,a.provincia].filter(Boolean).join(', '))}</div><span class="badge">✓ Afiliado UADAV</span><div class="actions"><a class="btn" href="/artista.html?id=${encodeURIComponent(a.id)}">Ver perfil</a><a class="btn primary" href="/contratar-artista.html?id=${encodeURIComponent(a.id)}">Solicitar presupuesto</a></div></div></article>`).join(''):'<div class="empty">No encontramos perfiles con esos filtros.</div>'}async function boot(){try{all=await api('public/artistas');const cats=[...new Set(all.filter(a=>a.afiliado_verificado&&a.marketplace_enabled!==false).map(a=>a.rubro).filter(Boolean))].sort();document.getElementById('cat').innerHTML='<option value="">Todos los rubros</option>'+cats.map(x=>`<option>${esc(x)}</option>`).join('');render()}catch(e){document.getElementById('grid').innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}document.getElementById('q').oninput=render;document.getElementById('cat').onchange=render;boot();
</script><script src="/uadav-ui-v8.4.js?v=924"></script></body></html>
