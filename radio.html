async function applyRadioSiteConfig(){try{const a=await apiJson('site_pages');const c=a?.radio;if(!c||c.enabled===false)return;if(c.browser_title)document.title=(radio?.nombre?radio.nombre+' · ':'')+c.browser_title;if(c.description){const copy=document.querySelector('.hero-copy');if(copy)copy.textContent=c.description;}}catch{}}
load().then(()=>applyRadioSiteConfig?.());
</script>
