<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="site-page" content="radio"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#05070a"><title>Radio · ★ UADAV STREAM</title><style>:root{--bg:#05070a;--panel:#10151d;--line:#ffffff17;--text:#f7fbff;--muted:#94a4b8;--accent:#2f6df6;--live:#ff3654}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}.shell{max-width:1280px;margin:auto;padding:20px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-weight:950}.btn{border:1px solid var(--line);background:#ffffff0d;color:#fff;border-radius:999px;padding:11px 15px;font-weight:850;cursor:pointer}.btn.primary{background:#fff;color:#061018}.hero{margin-top:18px;min-height:430px;border-radius:28px;padding:clamp(28px,6vw,70px);display:flex;align-items:flex-end;background:linear-gradient(90deg,#000e,#0008 48%,#0002),var(--hero);background-size:cover;background-position:center}.hero h1{font-size:clamp(42px,8vw,90px);line-height:.92;margin:10px 0 16px}.muted{color:var(--muted)}.live{font-size:11px;font-weight:900;letter-spacing:.12em;color:#ff9cad}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}.now{margin:-34px 24px 0;position:relative;background:#0d121aea;border:1px solid var(--line);backdrop-filter:blur(18px);border-radius:22px;padding:14px;display:grid;grid-template-columns:88px 1fr auto;align-items:center;gap:14px}.now img{width:88px;height:88px;object-fit:cover;border-radius:15px}.now h2{margin:4px 0;font-size:22px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-top:30px}.card{border:1px solid var(--line);border-radius:18px;background:#ffffff08;padding:16px}.hub{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-top:24px}.station{border:1px solid var(--line);border-radius:20px;padding:14px;color:#fff;text-decoration:none;background:#ffffff08}.station img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:16px}.station strong{display:block;margin-top:10px}.status{font-size:12px;color:#8eeef8;margin-top:8px}@media(max-width:700px){.shell{padding:12px}.hero{min-height:440px;border-radius:22px}.now{margin:-24px 4px 0;grid-template-columns:68px 1fr}.now img{width:68px;height:68px}.now .controls{grid-column:1/-1}.hero h1{font-size:46px}}</style></head><body><main class="shell"><div class="top"><div class="brand">★ UADAV STREAM · RADIO</div><button class="btn" id="back">← Volver</button></div><div id="app"></div></main><script src="/radio-shell-v117.js?v=11702"></script><script>
'use strict';
const API='https://uadav-api.uadavstream.workers.dev/api/';
const app=document.getElementById('app');
const qs=new URLSearchParams(location.search), wanted=qs.get('id')||'';
let radio=null,playing=false;
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const api=async p=>{const r=await fetch(API+p,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);return r.json()};
const listOf=d=>Array.isArray(d)?d:(Array.isArray(d?.items)?d.items:Array.isArray(d?.data)?d.data:Array.isArray(d?.radios)?d.radios:[]);
function norm(r,i=0){return {...r,id:r.id||r.slug||r.nombre||('radio-'+i),nombre:r.nombre||r.name||'Radio',stream_url:r.stream_url||r.stream||r.url||'',logo:r.logo||r.imagen||r.portada||'',portada:r.portada||r.fondo||r.logo||r.imagen||'',metadata_url:r.metadata_url||r.meta_url||''}}
function shell(type,data={}){const b=window.UADAVRadioShell;if(!b)return false;if(type==='play')return b.play(data);if(type==='pause')return b.pause();if(type==='close')return b.close();if(type==='mute')return b.mute();if(type==='volume')return b.volume(data);if(type==='state')return b.state();return false}
function goBack(){if(window.parent!==window){try{const h=window.parent.UADAVShellHost||window.parent.UADAV_APP;if(h?.navigate){h.navigate('/index-v117.html');return}window.parent.postMessage({type:'uadav:navigate',href:'/index-v117.html'},location.origin);return}catch{}}if(history.length>1)history.back();else location.href='/index-v117.html'}
document.getElementById('back').onclick=goBack;
function setState(on){playing=!!on;const p=document.getElementById('play'),m=document.getElementById('mini');if(p)p.textContent=playing?'❚❚ Pausar':'▶ Escuchar en vivo';if(m)m.textContent=playing?'❚❚':'▶';const s=document.getElementById('state');if(s)s.textContent=playing?'● REPRODUCIENDO EN EL PLAYER GLOBAL':'● LISTO PARA ESCUCHAR'}
function toggle(){if(!radio)return;if(window.parent!==window){if(playing)shell('pause');else shell('play',radio);setState(!playing);return}const a=document.getElementById('localAudio');if(!a)return;if(a.paused)a.play().then(()=>setState(true)).catch(()=>{});else{a.pause();setState(false)}}
function renderHub(list){app.innerHTML='<section style="padding:40px 0"><div class="live">RADIO EN VIVO</div><h1 style="font-size:clamp(36px,6vw,68px);margin:8px 0">Elegí una radio</h1><p class="muted">Programación, música, comunidad y transmisión persistente dentro de ★ UADAV STREAM.</p><div class="hub">'+list.map(r=>'<a class="station" href="/radio.html?id='+encodeURIComponent(r.id)+'"><img src="'+esc(r.logo||'/radio-fallback.svg')+'" alt=""><strong>'+esc(r.nombre)+'</strong><span class="muted">'+esc(r.programa||r.ubicacion||'En vivo')+'</span></a>').join('')+'</div></section>'}
function render(){const art=radio.logo||'/radio-fallback.svg',hero=radio.portada||art;app.innerHTML='<section class="hero" style="--hero:url(&quot;'+esc(hero)+'&quot;)"><div><div class="live">● RADIO EN VIVO · ★ UADAV STREAM</div><h1>'+esc(radio.nombre)+'</h1><p class="muted" style="max-width:700px;font-size:17px">'+esc(radio.descripcion||'Escuchá la emisora y seguí navegando: el audio continúa en el reproductor global.')+'</p><div class="actions"><button class="btn primary" id="play">▶ Escuchar en vivo</button><button class="btn" id="share">↗ Compartir</button></div></div></section><section class="now"><img src="'+esc(art)+'" alt=""><div><div class="live">AHORA SUENA</div><h2 id="track">'+esc(radio.programa||'Radio en vivo')+'</h2><div class="muted" id="artist">'+esc(radio.locutor||radio.nombre)+'</div><div class="status" id="state">● LISTO PARA ESCUCHAR</div></div><div class="controls"><button class="btn primary" id="mini">▶</button><button class="btn" id="mute">🔊</button><input id="vol" type="range" min="0" max="1" step=".05" value="1" aria-label="Volumen"></div></section><div class="grid"><section class="card"><strong>Programa</strong><p class="muted">'+esc(radio.programa||'—')+'</p></section><section class="card"><strong>Conducción</strong><p class="muted">'+esc(radio.locutor||'—')+'</p></section><section class="card"><strong>Horario</strong><p class="muted">'+esc(radio.horario||'—')+'</p></section><section class="card"><strong>Ubicación</strong><p class="muted">'+esc(radio.ubicacion||'—')+'</p></section></div>'+(window.parent===window?'<audio id="localAudio" preload="none" src="'+esc(radio.stream_url)+'"></audio>':'');document.getElementById('play').onclick=toggle;document.getElementById('mini').onclick=toggle;document.getElementById('mute').onclick=()=>window.parent!==window?shell('mute'):(document.getElementById('localAudio').muted=!document.getElementById('localAudio').muted);document.getElementById('vol').oninput=e=>window.parent!==window?shell('volume',Number(e.target.value)):(document.getElementById('localAudio').volume=Number(e.target.value));document.getElementById('share').onclick=()=>navigator.share?navigator.share({title:radio.nombre,text:'Escuchá '+radio.nombre+' en ★ UADAV STREAM',url:location.href}).catch(()=>{}):navigator.clipboard?.writeText(location.href);if(window.parent!==window)shell('state')}
window.addEventListener('message',e=>{if(e.origin!==location.origin||!radio)return;const d=e.data||{};if(d.type==='uadav:radio-state'){const same=!d.stream_url||String(d.stream_url)===String(radio.stream_url)||String(d.radio_id||'')===String(radio.id);setState(same&&!!d.playing);const v=document.getElementById('vol');if(v&&Number.isFinite(Number(d.volume)))v.value=String(d.volume)}if(d.type==='uadav:radio-meta'){const same=!d.stream_url||String(d.stream_url)===String(radio.stream_url)||String(d.radio_id||'')===String(radio.id);if(same){if(d.title)document.getElementById('track').textContent=d.title;if(d.artist)document.getElementById('artist').textContent=d.artist}}});
(async()=>{try{const list=listOf(await api('radios?_='+Date.now())).map(norm).filter(r=>r.stream_url&&r.activa!==false&&r.visible!==false);if(!wanted){renderHub(list);return}radio=list.find(r=>String(r.id)===String(wanted)||String(r.nombre)===String(wanted));if(!radio)throw new Error('Radio no encontrada o no disponible');render()}catch(e){app.innerHTML='<section class="card" style="margin-top:30px"><h1>No pudimos cargar Radio</h1><p class="muted">'+esc(e.message)+'</p><button class="btn primary" onclick="goBack()">Volver</button></section>'}})();
</script></body></html>
