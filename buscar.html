<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Buscar · UADAV STREAM</title><script src="/uadav-api-config.js"></script><style>*{box-sizing:border-box}html,body{margin:0;background:#050608;color:#f7f8fa;font-family:Outfit,Inter,system-ui,sans-serif}.shell{width:min(1460px,calc(100% - 40px));margin:auto;padding:24px 0 100px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:30px}.brand{display:flex;align-items:center;gap:12px;font-weight:950;font-size:22px}.mark{width:44px;height:44px;border-radius:14px;background:#2f6df6;display:grid;place-items:center;font-size:24px}.back{border:1px solid #ffffff18;background:#ffffff08;color:#fff;border-radius:999px;padding:11px 16px;text-decoration:none}.eyebrow{color:#6f96ff;font-size:11px;font-weight:950;letter-spacing:.18em}.hero h1{font-size:clamp(42px,7vw,84px);line-height:.9;letter-spacing:-.055em;margin:10px 0 16px}.hero p,.status{color:#98a5b7}.search{display:grid;grid-template-columns:1fr auto;gap:10px;margin:28px 0;position:sticky;top:0;z-index:10;background:#050608;padding:10px 0}.search input{min-height:58px;border:1px solid #ffffff18;border-radius:18px;background:#0b1017;color:#fff;padding:0 18px;font-size:18px}.search button{border:0;border-radius:18px;background:#2f6df6;color:#fff;padding:0 28px;font-weight:950}.section{margin:30px 0}.section h2{font-size:25px}.rail{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.card{border:1px solid #ffffff12;background:#0b1017;border-radius:20px;padding:14px;color:#fff;text-decoration:none}.card img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:14px}.card.artist img{aspect-ratio:1;border-radius:50%}.card b,.card small{display:block;margin-top:9px}.card small{color:#8493a8}.empty{border:1px dashed #ffffff18;border-radius:18px;padding:28px;color:#7f8ca0}@media(max-width:760px){.shell{width:100%;padding:18px 14px 110px}.top{margin-bottom:22px}.brand{font-size:18px}.mark{width:38px;height:38px}.hero h1{font-size:46px}.search{grid-template-columns:1fr}.search button{min-height:50px}.rail{display:flex;overflow-x:auto;scroll-snap-type:x proximity}.card{flex:0 0 72vw;scroll-snap-align:start}.card.artist{flex-basis:44vw}}</style></head><body><main class="shell"><header class="top"><div class="brand"><span class="mark">★</span><span>UADAV STREAM</span></div><a class="back" href="/index.html">← Inicio</a></header><section class="hero"><div class="eyebrow">DESCUBRIR</div><h1>Buscá todo UADAV STREAM.</h1><p>Artistas, videos, espectáculos, radios y oportunidades desde un solo lugar.</p></section><form class="search" id="form"><input id="q" autocomplete="off" placeholder="Artista, espectáculo, canción, radio…" autofocus><button>Buscar</button></form><div class="status" id="status">Escribí algo para empezar.</div><div id="results"></div></main><script>const API=window.UADAV_API_BASE||'https://uadav-api.uadavstream.workers.dev/api/',$=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));async function api(p){const r=await fetch(API+p+(p.includes('?')?'&':'?')+'_='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);return r.json()}function arr(x){return Array.isArray(x)?x:(Array.isArray(x?.items)?x.items:[])}function title(x){return x.titulo||x.nombre||x.title||'Contenido'}function meta(x){return x.categoria||x.actividad||x.ciudad||x.ubicacion||x.author||''}function image(x){return x.thumbnail||x.imagen||x.foto||x.avatar||x.logo||x.portada||'/radio-fallback.svg'}function href(x,t){if(t==='Artistas')return x.discovered?('/artista.html?discover='+encodeURIComponent(x.nombre||x.title||'')):('/artista.html?id='+encodeURIComponent(x.id||x.slug||''));if(t==='Cartelera')return'/cartelera.html?id='+encodeURIComponent(x.id||'');if(t==='Radios')return'/radio.html?id='+encodeURIComponent(x.id||'');return x.url||x.youtube_url||'#'}function section(n,a,t){if(!a.length)return'';return'<section class="section"><h2>'+esc(n)+'</h2><div class="rail">'+a.slice(0,12).map(x=>'<a class="card '+(t==='Artistas'?'artist':'')+'" href="'+esc(t==='Contenido'?'#':href(x,t))+'" '+(t==='Contenido'?'data-play="'+esc(x.url||x.youtube_url||x.external_id||x.id||'')+'" data-title="'+esc(title(x))+'"':'')+'><img loading="lazy" src="'+esc(image(x))+'"><b>'+esc(title(x))+'</b><small>'+esc(meta(x))+'</small></a>').join('')+'</div></section>'}async function search(){const q=$('q').value.trim();if(q.length<2)return;$('status').textContent='Buscando…';try{let d={};try{d=await api('public/search?q='+encodeURIComponent(q))}catch(e){console.warn('public/search fallback:',e)}let content=arr(d?.content),artists=arr(d?.artists),events=arr(d?.events),radios=arr(d?.radios);if(!content.length){try{content=arr(await api('youtube/search?q='+encodeURIComponent(q)))}catch(e){console.warn('youtube/search:',e)}}if(!artists.length){try{const all=arr(await api('artistas'));const z=q.toLowerCase();artists=all.filter(x=>String(x.nombre||x.name||x.actividad||'').toLowerCase().includes(z)).slice(0,12)}catch(_){}}if(!events.length){try{const all=arr(await api('cartelera'));const z=q.toLowerCase();events=all.filter(x=>String([x.titulo,x.nombre,x.ciudad,x.lugar].filter(Boolean).join(' ')).toLowerCase().includes(z)).slice(0,12)}catch(_){}}if(!radios.length){try{const all=arr(await api('radios'));const z=q.toLowerCase();radios=all.filter(x=>String([x.nombre,x.name,x.ubicacion,x.programa].filter(Boolean).join(' ')).toLowerCase().includes(z)).slice(0,12)}catch(_){}}$('results').innerHTML=section('Videos y música',content,'Contenido')+section('Artistas',artists,'Artistas')+section('Cartelera',events,'Cartelera')+section('Radios',radios,'Radios')||'<div class="empty">No encontramos resultados para “'+esc(q)+'”.</div>';$('status').textContent=(content.length+artists.length+events.length+radios.length)+' resultados.'}catch(e){console.warn('Buscar:',e);$('results').innerHTML='<div class="empty">No pudimos completar la búsqueda ahora. Intentá nuevamente.</div>';$('status').textContent='Búsqueda temporalmente no disponible.'}}$('form').onsubmit=e=>{e.preventDefault();search()};let t;$('q').oninput=()=>{clearTimeout(t);t=setTimeout(search,350)};const initial=new URLSearchParams(location.search).get('q')||'';if(initial){$('q').value=initial;search()}document.addEventListener('click',e=>{const a=e.target.closest('[data-play]');if(!a)return;e.preventDefault();const raw=a.dataset.play||'',id=/^[A-Za-z0-9_-]{11}$/.test(raw)?raw:'',url=id?('https://www.youtube.com/watch?v='+id):raw;try{const h=window.parent.UADAVShellHost;if(h?.playContent)h.playContent({url,provider:'youtube',tipo:'youtube',content_type:'video',titulo:a.dataset.title||'Contenido'})}catch(_){}});</script><script src="/uadav-app-bridge-v104.js?v=10247"></script></body></html>
