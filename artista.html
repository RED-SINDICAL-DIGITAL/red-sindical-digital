<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="site-page" content="artista"><meta name="theme-color" content="#07090d">
<title>Artista · ★ UADAV STREAM</title>
<style>
:root{--bg:#07090d;--panel:#10151d;--panel2:#151c25;--line:rgba(255,255,255,.1);--text:#fff;--muted:#94a1b1;--accent:#00e5ff;--green:#7df0a6;--purple:#8b5cf6}
*{box-sizing:border-box}html{scroll-behavior:smooth;background:var(--bg)}body{margin:0;background:radial-gradient(circle at 12% 0%,rgba(0,229,255,.08),transparent 32%),var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}a{color:inherit;text-decoration:none}button,input,textarea{font:inherit}.shell{min-height:100vh}.hero{min-height:610px;position:relative;overflow:hidden;background:#06080c}.hero-bg{position:absolute;inset:0;background:center/cover no-repeat;filter:brightness(.48) saturate(1.05);transform:scale(1.03)}.hero-overlay{position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.94),rgba(0,0,0,.65) 42%,rgba(0,0,0,.15)),linear-gradient(0deg,var(--bg),transparent 46%)}.top{position:absolute;left:0;right:0;top:0;z-index:4;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px clamp(16px,4vw,58px)}.brand{display:flex;align-items:center;gap:10px;font-weight:950}.brand-mark{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--accent);color:#061017}.top-actions{display:flex;gap:8px;flex-wrap:wrap}.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:#fff;padding:10px 14px;border-radius:12px;font-weight:850;cursor:pointer;backdrop-filter:blur(10px)}.btn.primary{background:#fff;color:#061018;border-color:#fff}.btn.secondary:hover,.btn:hover{border-color:rgba(255,255,255,.2);background:rgba(255,255,255,.1)}.hero-inner{position:relative;z-index:3;width:min(1180px,94vw);margin:auto;display:flex;align-items:flex-end;min-height:610px;padding:0 0 64px}.hero-copy{max-width:900px}.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#9defff;font-weight:900;margin-bottom:10px}.title{font-size:clamp(44px,7vw,92px);line-height:.92;letter-spacing:-.055em;margin:0}.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;color:#c9d4df}.pill{padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid var(--line);font-size:12px}.verified{color:var(--green)}.bio{max-width:820px;color:#d2d9e2;line-height:1.55;font-size:16px;margin:18px 0}.actions{display:flex;gap:9px;flex-wrap:wrap}.claim-note{margin-top:14px;color:#aebaca;font-size:12px}.tabs-wrap{position:sticky;top:0;z-index:20;background:rgba(7,9,13,.92);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}.tabs{width:min(1180px,94vw);margin:auto;display:flex;gap:4px;overflow:auto}.tab{border:0;background:transparent;color:#aeb8c7;padding:14px 14px;cursor:pointer;font-weight:800;white-space:nowrap;border-bottom:2px solid transparent}.tab.active{color:#fff;border-color:var(--accent)}.main{width:min(1180px,94vw);margin:auto;padding:22px 0 80px}.panel{margin-top:28px}.heading{display:flex;justify-content:space-between;align-items:end;gap:10px;margin-bottom:12px}.heading h2{margin:0;font-size:28px;letter-spacing:-.03em}.heading p{margin:0;color:var(--muted);font-size:12px}.rail{display:flex;gap:14px;overflow:auto;padding:2px 0 10px;scrollbar-width:none}.rail::-webkit-scrollbar{display:none}.tile{flex:0 0 250px;border:1px solid var(--line);background:rgba(255,255,255,.025);border-radius:18px;overflow:hidden}.tile-media{aspect-ratio:16/9;background:#0b1017}.tile-media img{width:100%;height:100%;object-fit:cover}.tile-body{padding:12px}.tile-title{font-size:14px;font-weight:900}.tile-meta{font-size:11px;color:var(--muted);margin-top:5px}.vertical .tile-media{aspect-ratio:9/16}.event{display:grid;grid-template-columns:150px 1fr;gap:16px;padding:14px;border:1px solid var(--line);border-radius:18px;background:rgba(255,255,255,.025);margin-bottom:10px}.event img{width:150px;height:100px;object-fit:cover;border-radius:12px;background:#0b1017}.event h3{margin:0 0 6px;font-size:17px}.event p{margin:4px 0;color:var(--muted);font-size:13px;line-height:1.45}.about{display:grid;grid-template-columns:1.4fr .8fr;gap:18px}.box{border:1px solid var(--line);border-radius:18px;background:rgba(255,255,255,.025);padding:20px}.box h3{margin:0 0 10px}.socials{display:flex;gap:8px;flex-wrap:wrap}.social{border:1px solid var(--line);border-radius:999px;padding:8px 12px;color:#d9e2ee;font-size:12px}.empty{padding:30px;border:1px dashed var(--line);border-radius:18px;color:var(--muted);text-align:center}.footer{border-top:1px solid var(--line);padding:28px 3vw;color:var(--muted);font-size:12px}.overlay{position:fixed;inset:0;background:rgba(0,0,0,.84);display:none;align-items:center;justify-content:center;padding:18px;z-index:100}.overlay.active{display:flex}.modal{width:min(600px,100%);background:#0f141b;border:1px solid var(--line);border-radius:22px;padding:22px;position:relative}.close{position:absolute;right:12px;top:12px;border:0;background:rgba(255,255,255,.08);color:#fff;width:36px;height:36px;border-radius:50%;cursor:pointer}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{display:block;font-size:10px;color:#8f9dae;text-transform:uppercase;letter-spacing:.08em;font-weight:900}.field input,.field textarea{width:100%;margin-top:6px;background:#0a0f15;color:#fff;border:1px solid var(--line);border-radius:12px;padding:11px;outline:none}.field.wide{grid-column:1/-1}.status{min-height:18px;margin-top:10px;color:var(--muted);font-size:12px}.ok{color:var(--green)}
@media(max-width:760px){.hero,.hero-inner{min-height:72vh}.hero-inner{padding-bottom:34px}.title{font-size:54px}.about{grid-template-columns:1fr}.event{grid-template-columns:1fr}.event img{width:100%;height:auto;aspect-ratio:16/9}.grid{grid-template-columns:1fr}.field.wide{grid-column:auto}.tile{flex-basis:230px}.top-actions .home{display:none}}
</style><script src="/site-page-config.js" defer></script><link rel="stylesheet" href="/uadav-design-v7.2.css">
<script src="/uadav-brand-v7.2.js" defer></script>
</head>
<body>
<div class="shell" id="app"><div class="empty" style="margin:30vh auto;width:min(500px,90vw)">Cargando perfil…</div></div>
<div id="claimModal" class="overlay"><div class="modal"><button class="close" onclick="closeClaim()">✕</button><div class="eyebrow">RECLAMAR PERFIL</div><h2 id="claimTitle" style="margin:4px 0 8px">Este perfil puede ser tuyo</h2><p style="color:var(--muted);line-height:1.5">La solicitud será revisada por administración nacional. Reclamar el perfil no implica afiliación sindical ni modifica su estado.</p><form id="claimForm" class="grid"><div class="field"><label>Nombre *</label><input name="name" required></div><div class="field"><label>Email *</label><input name="email" type="email" required></div><div class="field"><label>WhatsApp</label><input name="whatsapp"></div><div class="field"><label>Red social / web</label><input name="social_url" placeholder="https://..."></div><div class="field wide"><label>Cómo acreditás que sos este artista</label><input name="proof_url" placeholder="Sitio oficial, perfil, enlace, etc."></div><div class="field wide"><label>Mensaje</label><textarea name="note" rows="4"></textarea></div><div class="field wide"><button class="btn primary" type="submit">Enviar solicitud</button><div id="claimStatus" class="status"></div></div></form></div></div>
<script>
const API_REMOTE='https://uadav-api.uadavstream.workers.dev/api/';const API_BASES=[location.origin+'/api/',API_REMOTE];
async function apiFetch(path,opt={}){let last;for(const base of API_BASES){try{const r=await fetch(base+path,{...opt,cache:opt.cache||'no-store'});const ct=r.headers.get('content-type')||'';if(base!==API_REMOTE&&(r.status===404||!ct.includes('json')))continue;const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||`HTTP ${r.status}`);return d}catch(e){last=e}}throw last||new Error('No se pudo conectar')}
const id=new URLSearchParams(location.search).get('id')||'';
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const norm=v=>String(v||'').toLowerCase();
let artist=null, content=[], events=[];
async function api(path){try{return await apiFetch(path)}catch(e){throw new Error(e.message||'No pudimos cargar el perfil')}}
function tile(x, vertical=false){const img=x.thumbnail||x.imagen||x.foto||'https://via.placeholder.com/640x360/0b1017/ffffff?text=UADAV+STREAM';return `<article class="tile ${vertical?'vertical':''}"><a href="${esc(x.url||'#')}" target="_blank" rel="noopener"><div class="tile-media"><img loading="lazy" src="${esc(img)}" alt="${esc(x.titulo||x.nombre||'Contenido')}" onerror="this.src='https://via.placeholder.com/640x360/0b1017/ffffff?text=UADAV+STREAM'"></div><div class="tile-body"><div class="tile-title">${esc(x.titulo||x.nombre||'Contenido')}</div><div class="tile-meta">${esc(x.descripcion||x.tipo||x.categoria||'Contenido')}</div></div></a></article>`}
function section(id,title,subtitle,html){return `<section id="${id}" class="panel"><div class="heading"><div><h2>${title}</h2><p>${subtitle}</p></div></div>${html}</section>`}
function render(){
 const a=artist; const verified=a.afiliado_verificado===true; const claimed=a.claimed===true; const bg=a.foto||a.imagen||a.thumbnail||'';
 const live=verified&&a.live_url?`<a class="btn primary" href="${esc(a.live_url)}" target="_blank" rel="noopener">▶ En vivo</a>`:'';
 const donate=verified&&a.donation_url?`<a class="btn" href="${esc(a.donation_url)}" target="_blank" rel="noopener">♥ Apoyar</a>`:'';
 const book=verified?`<a class="btn" href="/contratar-artista.html?id=${encodeURIComponent(a.id)}">💼 Contratar</a>`:'';
 const manage='';
 const claim=!claimed?`<button class="btn" type="button" onclick="openClaim()">✓ ¿Sos este artista? Reclamar perfil</button>`:'';
 const eventsFor=events.filter(e=>String(e.artista_id||'')===String(a.id)||norm([e.titulo,e.descripcion].join(' ')).includes(norm(a.nombre)));
 const music=content.filter(x=>/audio|cancion|música|music|song/i.test(String(x.tipo||x.categoria||''))).concat(content.filter(x=>!x.tipo&&/music|cancion|single|album/i.test(String(x.titulo||''))));
 const clips=content.filter(x=>/short|clip|reel|vertical/i.test(String(x.tipo||'')));
 const videos=content.filter(x=>!music.includes(x)&&!clips.includes(x));
 app.innerHTML=`<section class="hero"><div class="hero-bg" style="background-image:url('${esc(bg)}')"></div><div class="hero-overlay"></div><div class="top"><a class="brand" href="/index.html"><span class="brand-mark">★</span><span>UADAV STREAM</span></a><div class="top-actions"><a class="btn home" href="/artistas.html">Todos los artistas</a><a class="btn" href="/sumate-artista.html">Crear perfil</a></div></div><div class="hero-inner"><div class="hero-copy"><div class="eyebrow">${verified?'✓ ARTISTA AFILIADO UADAV':'ARTISTA EN ★ UADAV STREAM'}</div><h1 class="title">${esc(a.nombre)}</h1><div class="meta"><span class="pill">${esc(a.rubro||'Artista de variedades')}</span>${a.ciudad?`<span class="pill">📍 ${esc(a.ciudad)}</span>`:''}${a.provincia?`<span class="pill">${esc(a.provincia)}</span>`:''}${a.pais?`<span class="pill">${esc(a.pais)}</span>`:''}${verified?'<span class="pill verified">✓ Afiliado verificado</span>':''}${claimed?'<span class="pill">✓ Perfil reclamado</span>':''}</div><p class="bio">${esc(a.bio||'Perfil artístico en ★ UADAV STREAM.')}</p><div class="actions">${live}${donate}${book}${claim}<button class="btn" onclick="shareProfile()">↗ Compartir</button></div>${!claimed?'<div class="claim-note">¿El perfil está publicado sin estar reclamado? El artista puede solicitar el control y conservaremos el control editorial de la plataforma.</div>':''}</div></div></section><nav class="tabs-wrap"><div class="tabs"><button class="tab active" data-tab="inicio">Inicio</button><button class="tab" data-tab="musica">Música</button><button class="tab" data-tab="videos">Videos</button><button class="tab" data-tab="clips">Clips</button><button class="tab" data-tab="eventos">Eventos</button><button class="tab" data-tab="about">Acerca de</button></div></nav><main class="main" id="main"><div id="tab-inicio">${section('destacado','★ Selección del artista','Contenido que merece estar primero',videos.slice(0,1).map(x=>tile(x)).join('')||'<div class="empty">Todavía no hay contenido destacado.</div>')}${section('ultimos','Últimos videos','Contenido público del artista',videos.slice(0,12).map(x=>tile(x)).join('')||'<div class="empty">Todavía no hay videos publicados.</div>')}</div><div id="tab-musica" hidden>${section('musica-list','Música','Canciones, lanzamientos y contenido musical',music.slice(0,16).map(x=>tile(x)).join('')||'<div class="empty">Todavía no hay contenido musical cargado.</div>')}</div><div id="tab-videos" hidden>${section('videos-list','Videos','Presentaciones y contenido visual',videos.slice(0,24).map(x=>tile(x)).join('')||'<div class="empty">Todavía no hay videos publicados.</div>')}</div><div id="tab-clips" hidden>${section('clips-list','Clips','Formato vertical para descubrimiento',clips.slice(0,18).map(x=>tile(x,true)).join('')||'<div class="empty">El artista todavía no tiene clips cargados.</div>')}</div><div id="tab-eventos" hidden>${section('eventos-list','Eventos','Próximas presentaciones y fechas',eventsFor.length?eventsFor.map(e=>`<article class="event"><img src="${esc(e.imagen||e.poster||e.thumbnail||'https://via.placeholder.com/640x360/0b1017/ffffff?text=Evento')}" alt=""><div><h3>${esc(e.titulo||e.nombre||'Evento')}</h3><p>📅 ${esc(e.fecha||e.fecha_inicio||'Fecha a confirmar')}</p><p>📍 ${esc(e.lugar||e.venue||'Lugar a confirmar')}${e.ciudad?' · '+esc(e.ciudad):''}</p><p>${esc(e.descripcion||'')}</p><div style="margin-top:10px"><a class="btn" href="/evento.html?id=${encodeURIComponent(e.id||'')}">Ver evento</a></div></div></article>`).join(''):'<div class="empty">No hay eventos relacionados cargados.</div>')}</div><div id="tab-about" hidden>${section('about','Acerca de','Información pública del artista',`<div class="about"><div class="box"><h3>Biografía</h3><p style="color:#cbd4df;line-height:1.65">${esc(a.bio||'Este artista todavía no agregó una biografía pública.')}</p></div><div class="box"><h3>Contacto y redes</h3><div class="socials">${Object.entries(a.redes||{}).filter(([,v])=>v).map(([k,v])=>`<a class="social" href="${esc(v)}" target="_blank" rel="noopener">${esc(k)}</a>`).join('')||'<span style="color:var(--muted)">No hay redes cargadas.</span>'}</div>${a.web?`<p style="margin-top:14px"><a class="btn" href="${esc(a.web)}" target="_blank" rel="noopener">Sitio web</a></p>`:''}${book?`<p style="margin-top:12px;color:var(--muted);font-size:12px">La contratación directa se habilita según las condiciones de UADAV.</p>`:''}</div></div>`)}</div></main><footer class="footer">★ UADAV STREAM · ${verified?'Artista afiliado UADAV':'Directorio de artistas'} · <a href="/terminos.html">Términos</a> · <a href="/privacidad.html">Privacidad</a></footer>`;
 document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>switchTab(b.dataset.tab)));
}
function switchTab(tab){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));['inicio','musica','videos','clips','eventos','about'].forEach(x=>{const el=document.getElementById('tab-'+x);if(el)el.hidden=x!==tab});}
function shareProfile(){if(navigator.share){navigator.share({title:artist.nombre,text:`${artist.nombre} en ★ UADAV STREAM`,url:location.href}).catch(()=>{});}else{navigator.clipboard?.writeText(location.href);}}
function openClaim(){document.getElementById('claimModal').classList.add('active');document.getElementById('claimTitle').textContent='Reclamar: '+artist.nombre}
function closeClaim(){document.getElementById('claimModal').classList.remove('active')}
document.getElementById('claimForm').addEventListener('submit',async e=>{e.preventDefault();const out=document.getElementById('claimStatus');const data=Object.fromEntries(new FormData(e.target));data.artist_id=artist.id;out.textContent='Enviando…';try{const r=await fetch(API+'artista/claim',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'No se pudo enviar');out.textContent='✓ Solicitud enviada. Te avisaremos por correo cuando sea revisada.';out.className='status ok';e.target.reset()}catch(err){out.textContent='❌ '+err.message;out.className='status'}});
async function loadMore(){try{const [legacy,universal,e,m]=await Promise.allSettled([api('artista/content?artist_id='+encodeURIComponent(artist.id)),api('content?artist_id='+encodeURIComponent(artist.id)),api('cartelera'),api('youtube/search?q='+encodeURIComponent(artist.nombre))]);const merged=[];for(const pack of [legacy,universal]){if(pack.status==='fulfilled'&&Array.isArray(pack.value))pack.value.forEach(x=>{if(!merged.some(y=>String(y.url||y.id)===String(x.url||x.id)))merged.push(x)})}events=e.status==='fulfilled'&&Array.isArray(e.value)?e.value:[];const yt=m.status==='fulfilled'&&Array.isArray(m.value)?m.value:[];yt.slice(0,20).forEach(x=>{if(!merged.some(y=>String(y.url||y.id)===String(x.id)))merged.push({...x,tipo:'video'});});content=merged;render()}catch{render()}}
async function boot(){try{artist=await api('public/artista?id='+encodeURIComponent(id));await loadMore()}catch(e){document.getElementById('app').innerHTML='<div class="empty" style="margin:25vh auto;width:min(560px,90vw)"><h2>Perfil no disponible</h2><p>'+esc(e.message)+'</p><p><a class="btn primary" href="/artistas.html">Volver al directorio</a></p></div>'}}
boot();
</script>
</body></html>
