<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#06070a"><title>Artista · UADAVSTREAM</title><style>
:root{--bg:#06070a;--text:#fff;--muted:#a6afbf;--line:rgba(255,255,255,.11);--accent:#00e5ff;--purple:#8b5cf6}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}a{color:inherit;text-decoration:none}button{font:inherit}.shell{min-height:100vh}.hero{min-height:72vh;position:relative;display:flex;align-items:flex-end;overflow:hidden;background:#06070a}.hero-bg{position:absolute;inset:0;background:center/cover no-repeat;filter:brightness(.55);transform:scale(1.03)}.hero-overlay{position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.92),rgba(0,0,0,.55) 46%,rgba(0,0,0,.12)),linear-gradient(0deg,var(--bg),transparent 42%)}.top{position:absolute;top:0;left:0;right:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:18px clamp(16px,4vw,58px)}.brand{display:flex;gap:10px;align-items:center;font-weight:900}.mark{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--purple));color:#061018}.top-actions{display:flex;gap:8px}.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);border-radius:12px;padding:11px 16px;background:rgba(255,255,255,.06);color:#fff;font-weight:850;cursor:pointer;backdrop-filter:blur(10px)}.btn.primary{background:#fff;color:#071018}.btn.primary:hover{background:var(--accent)}.btn.secondary:hover{background:rgba(255,255,255,.13)}.content{position:relative;z-index:3;width:min(1180px,94vw);margin:0 auto;padding:0 0 58px}.kicker{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#9defff;font-weight:850;margin-bottom:10px}.title{font-size:clamp(40px,7vw,82px);letter-spacing:-.045em;line-height:.94;margin:0 0 12px;font-weight:950}.meta{display:flex;gap:8px;flex-wrap:wrap;color:#cbd3df;font-size:14px}.pill{padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1)}.verified{color:#7ff0b0}.bio{max-width:760px;font-size:17px;line-height:1.55;color:#d2d8e2;margin:18px 0 22px}.actions{display:flex;gap:10px;flex-wrap:wrap}.main{width:min(1180px,94vw);margin:0 auto;padding:8px 0 80px}.section{margin-top:34px}.section h2{margin:0 0 14px;font-size:24px;letter-spacing:-.02em}.rail{display:flex;gap:14px;overflow-x:auto;padding:2px 0 12px;scroll-snap-type:x proximity}.tile{flex:0 0 220px;scroll-snap-align:start}.tile img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:14px;background:#0c1016}.tile strong{display:block;margin-top:8px;font-size:13px}.tile small{display:block;margin-top:4px;color:var(--muted)}.empty{color:var(--muted);padding:20px 0}.job-note{padding:18px;border:1px solid rgba(0,229,255,.16);background:rgba(0,229,255,.04);border-radius:18px;color:#bfccdc;line-height:1.5}.footer{border-top:1px solid var(--line);color:var(--muted);padding:26px 3vw}.loading{padding:50px 0;text-align:center;color:var(--muted)}
@media(max-width:700px){.hero{min-height:74vh}.content{padding-bottom:30px}.bio{font-size:15px}.tile{flex-basis:68vw}.title{font-size:52px}.top-actions .desktop-only{display:none}.btn{padding:10px 13px}.main{padding-bottom:50px}}
@media(min-width:1300px){.hero{min-height:78vh}.tile{flex-basis:260px}}
</style></head><body><div class="shell" id="app"><div class="loading">Cargando perfil…</div></div><script>
const API='https://uadav-api.uadavstream.workers.dev/api/';const id=new URLSearchParams(location.search).get('id')||'';const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
async function api(path){const r=await fetch(API+path,{cache:'no-store'});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'No pudimos cargar el perfil');return d}
async function boot(){const app=document.getElementById('app');try{const a=await api('public/artista?id='+encodeURIComponent(id));const verified=a.afiliado_verificado===true;const bg=a.foto||a.imagen||a.thumbnail||'';const live=verified&&a.live_url?`<a class="btn primary" href="${esc(a.live_url)}" target="_blank" rel="noopener">▶ Ver transmisión</a>`:'';const donate=verified&&a.donation_url?`<a class="btn secondary" href="${esc(a.donation_url)}" target="_blank" rel="noopener">❤️ Apoyar al artista</a>`:'';const book=verified?`<a class="btn secondary" href="/contratar-artista.html?id=${encodeURIComponent(a.id)}">💼 Contratar</a>`:'';const jobs=verified?`<a class="btn secondary" href="/bolsa-trabajo.html?artist=${encodeURIComponent(a.id)}">💼 Participar en Bolsa</a>`:'';app.innerHTML=`<section class="hero"><div class="hero-bg" style="background-image:url('${esc(bg)}')"></div><div class="hero-overlay"></div><div class="top"><a class="brand" href="/index.html"><span class="mark">★</span><span>UADAVSTREAM</span></a><div class="top-actions"><a class="btn secondary desktop-only" href="/index.html">Inicio</a><a class="btn secondary" href="/sumate-artista.html">Sumate</a></div></div><div class="content"><div class="kicker">${verified?'✓ ARTISTA AFILIADO UADAV':'✨ ARTISTA EN UADAVSTREAM'}</div><h1 class="title">${esc(a.nombre)}</h1><div class="meta"><span class="pill">${esc(a.rubro)}</span>${a.ciudad?`<span class="pill">📍 ${esc(a.ciudad)}</span>`:''}${verified?`<span class="pill verified">✓ Afiliado verificado</span>`:''}</div><p class="bio">${esc(a.bio||'Perfil artístico en UADAVSTREAM.')}</p><div class="actions">${live}${donate}${book}${jobs}<button class="btn secondary" onclick="navigator.share?navigator.share({title:${JSON.stringify(a.nombre)},url:location.href}):navigator.clipboard.writeText(location.href)">↗ Compartir</button></div></div></section><main class="main"><section class="section"><h2>Contenido del artista</h2><div class="rail" id="content"><div class="empty">Cargando contenido…</div></div></section><section class="section"><h2>💼 Bolsa de trabajo</h2><div class="job-note">${verified?'Como artista afiliado UADAV podés participar de oportunidades laborales y postularte desde tu perfil de gestión.':'La participación como artista en la Bolsa de Trabajo es un beneficio reservado para afiliados UADAV verificados.'}${verified?`<div style="margin-top:12px"><a class="btn secondary" href="/gestionar-artista.html?artist=${encodeURIComponent(a.id)}&tab=bolsa">Abrir mi Bolsa</a></div>`:''}</div></section></main><footer class="footer">UADAVSTREAM · ${verified?'Artista afiliado UADAV':'Artista UADAVSTREAM'} · <a href="/terminos.html">Términos</a></footer>`;loadContent(a.id)}catch(e){app.innerHTML=`<div class="main" style="padding-top:80px"><h1>Perfil no disponible</h1><p class="bio">${esc(e.message)}</p><a class="btn primary" href="/index.html">Volver</a></div>`}}
async function loadContent(aid){const box=document.getElementById('content');try{const arr=await api('artista/content?artist_id='+encodeURIComponent(aid));box.innerHTML=Array.isArray(arr)&&arr.length?arr.map(x=>`<article class="tile"><a href="${esc(x.url||'#')}" target="_blank" rel="noopener"><img src="${esc(x.thumbnail||'https://via.placeholder.com/640x360?text=UADAVSTREAM')}" alt="${esc(x.titulo||'Contenido')}"></a><strong>${esc(x.titulo||'Contenido')}</strong><small>${esc(x.tipo||'Contenido')}</small></article>`).join(''):'<div class="empty">Todavía no hay contenido publicado.</div>'}catch{box.innerHTML='<div class="empty">No pudimos cargar el contenido.</div>'}}boot();</script></body></html>
