<script>
const API_REMOTE=window.UADAV_API_BASE||'https://uadav-api.uadavstream.workers.dev/api/';const API_BASES=[API_REMOTE,...(window.UADAV_USE_LOCAL_API===true?[location.origin+'/api/']:[])];
async function apiFetch(path,opt={}){let last;for(const base of API_BASES){try{const r=await fetch(base+path,{...opt,cache:opt.cache||'no-store'});const ct=r.headers.get('content-type')||'';if(base!==API_REMOTE&&(r.status===404||!ct.includes('json')))continue;const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||`HTTP ${r.status}`);return d}catch(e){last=e}}throw last||new Error('No se pudo conectar')}
const params=new URLSearchParams(location.search);const id=params.get('id')||'';const discoverQuery=(params.get('discover')||'').trim();const artistMode=params.get('modo')==='artista';
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const decodeEntities=v=>{const t=document.createElement('textarea');t.innerHTML=String(v??'');return t.value};
const norm=v=>String(v||'').toLowerCase();
let artist=null, content=[], events=[], playerItems=[], autoLive=null, autoShorts=[];
async function api(path){try{return await apiFetch(path)}catch(e){throw new Error(e.message||'No pudimos cargar el perfil')}}
function cleanMediaTitle(v){let t=decodeEntities(v||'Contenido').replace(/\s+/g,' ').trim();return t.replace(/\s*[|•]\s*(official|video oficial|videoclip oficial)$/i,'').trim()||'Contenido'}
function tile(x, vertical=false){const image=x.thumbnail||x.imagen||x.foto||'https://via.placeholder.com/640x360/0b1017/ffffff?text=UADAV+STREAM';const normalized=normalizeClientMedia(x);const idx=playerItems.push(normalized)-1;return `<article class="tile ${vertical?'vertical':''}"><button type="button" onclick="openPlayer(${idx})"><div class="tile-media"><img loading="lazy" src="${esc(image)}" alt="${esc(x.titulo||x.nombre||'Contenido')}" onerror="this.src='https://via.placeholder.com/640x360/0b1017/ffffff?text=UADAV+STREAM'"><span class="play-badge">▶</span></div><div class="tile-body"><div class="tile-title">${esc(x.titulo||x.nombre||'Contenido')}</div><div class="tile-meta">${esc(x.descripcion||x.tipo||x.categoria||'Contenido')}</div><span class="provider-pill">${esc(x.provider||'contenido')}</span></div></button></article>`}
function section(id,title,subtitle,html){return `<section id="${id}" class="panel"><div class="heading"><div><h2>${title}</h2><p>${subtitle}</p></div></div><div class="rail">${html}</div></section>`}

let audienceTimer=null;
async function loadAudienceChat(){if(!artist?.audience_chat_enabled)return;const list=document.getElementById('artistChatList');if(!list)return;try{const rows=await api('artist/audience-chat?artist_id='+encodeURIComponent(artist.id));list.innerHTML=(Array.isArray(rows)?rows:[]).map(x=>`<div class="chat-msg"><b>${esc(x.alias||'Espectador')}</b><span>${esc(x.message||'')}</span></div>`).join('')||'<div class="empty">Todavía no hay mensajes. Podés ser el primero.</div>';list.scrollTop=list.scrollHeight}catch{list.innerHTML='<div class="empty">Chat temporalmente no disponible.</div>'}}
async function sendAudienceMessage(){const alias=(document.getElementById('artistChatAlias')?.value||'Espectador').trim(),message=(document.getElementById('artistChatText')?.value||'').trim(),st=document.getElementById('artistChatStatus');if(!message)return;try{await apiFetch('artist/audience-chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({artist_id:artist.id,alias,message})});document.getElementById('artistChatText').value='';if(st)st.textContent='✓ Mensaje enviado';await loadAudienceChat()}catch(e){if(st)st.textContent='No se pudo enviar: '+e.message}}

function normalizeClientMedia(x){return window.UADAVContentPlayer?.normalize?window.UADAVContentPlayer.normalize(x):x}
function mediaInfo(x){const n=normalizeClientMedia(x||{});return{provider:n.provider||'',type:n.content_type||n.tipo||'',url:n.url||'',external:n.external_id||n.youtube_id||n.videoId||''}}
function contentSourceURL(x){return window.UADAVContentPlayer?.source?window.UADAVContentPlayer.source(x):(mediaInfo(x).url||'')}
function embedHTML(x){return window.UADAVContentPlayer?.embed?window.UADAVContentPlayer.embed(x):''}
function openPlayer(i){const x=playerItems[i];if(!x)return;const n=normalizeClientMedia(x);if(window.UADAVContentPlayer){window.UADAVContentPlayer.open(n);return;}const html=embedHTML(n);document.getElementById('playerFrame').innerHTML=html||'<div class="empty"><h3>Contenido no disponible</h3><p>Este contenido no puede reproducirse en este momento.</p></div>';document.getElementById('playerTitle').textContent=cleanMediaTitle(n.titulo||n.nombre||'Contenido');document.getElementById('playerMeta').textContent=decodeEntities(n.descripcion||n.categoria||n.tipo||'');document.getElementById('playerProvider').textContent=(n.provider||'contenido').toUpperCase();document.getElementById('playerModal').classList.add('active');document.body.style.overflow='hidden'}

function goBack(){if(window.parent!==window&&window.UADAVAppBridge?.navigate){window.UADAVAppBridge.navigate('/artistas.html');return}if(history.length>1)history.back();else location.href='/artistas.html'}
function render(){

 const a=artist; const verified=a.afiliado_verificado===true; const claimed=a.claimed===true; const artistState=verified?'★ ARTISTA AFILIADO UADAV':(claimed?'✓ PERFIL RECLAMADO':(a.generated?'✦ PERFIL GENERADO DESDE FUENTES PÚBLICAS':'✦ ARTISTA DESCUBIERTO')); const confidenceNote=a.generated?`<span class="pill">Confianza ${Number(a.confidence||0)}% · ${a.review_level==='green'?'identificación alta':a.review_level==='yellow'?'revisión recomendada':'identificación insuficiente'}</span>`:''; const bg=a.portada||a.banner||a.foto||a.imagen||a.thumbnail||'';
 const live=autoLive?`<button class="btn primary" type="button" onclick="playAutoLive()">● EN VIVO AHORA</button>`:(a.live_url?`<a class="btn primary" href="${esc(a.live_url)}" target="_blank" rel="noopener">● En vivo</a>`:'');
 const hasSupport=verified&&a.support_enabled!==false&&supportLinks(a).length>0; const donate=hasSupport?`<button class="btn" type="button" onclick="switchTab('community');setTimeout(()=>document.getElementById('supportArea')?.scrollIntoView({behavior:'smooth'}),30)">♥ Apoyar</button>`:''; const presskit=verified&&a.presskit_enabled!==false?`<a class="btn" href="/presskit.html?id=${encodeURIComponent(a.id)}">▤ Press Kit</a>`:'';
 const book=`<a class="btn" href="/contratar-artista.html?id=${encodeURIComponent(a.id)}">💼 Contratar</a>`;
 const manage='';
 const claim='';
 const eventsFor=events.filter(e=>String(e.artista_id||'')===String(a.id)||norm([e.titulo,e.descripcion].join(' ')).includes(norm(a.nombre)));
 const music=content.filter(x=>/audio|cancion|música|music|song/i.test(String(x.tipo||x.categoria||''))).concat(content.filter(x=>!x.tipo&&/music|cancion|single|album/i.test(String(x.titulo||''))));

iv id="tab-clips" hidden>${section('clips-list','Clips','Formato vertical para descubrimiento',clips.slice(0,18).map(x=>tile(x,true)).join('')||'<div class="empty">El artista todavía no tiene clips cargados.</div>')}</div><div id="tab-eventos" hidden>${section('eventos-list','Eventos','Próximas presentaciones y fechas',eventsFor.length?eventsFor.map(e=>`<article class="event"><img src="${esc(e.imagen||e.poster||e.thumbnail||'https://via.placeholder.com/640x360/0b1017/ffffff?text=Evento')}" alt=""><div><h3>${esc(e.titulo||e.nombre||'Evento')}</h3><p>📅 ${esc(e.fecha||e.fecha_inicio||'Fecha a confirmar')}</p><p>📍 ${esc(e.lugar||e.venue||'Lugar a confirmar')}${e.ciudad?' · '+esc(e.ciudad):''}</p><p>${esc(e.descripcion||'')}</p><div style="margin-top:10px"><a class="btn" href="/evento.html?id=${encodeURIComponent(e.id||'')}">Ver evento</a></div></div></article>`).join(''):'<div class="empty">No hay eventos relacionados cargados.</div>')}</div><div id="tab-community" hidden><section id="supportArea" class="panel"><div class="heading"><div><h2>❤️ Apoyar al artista</h2><p>Aportes, entradas, merchandising y comunidad. La cuota sindical UADAV se gestiona por separado.</p></div></div>${hasSupport?`<div class="support-grid">${supportHTML(a)}</div>`:'<div class="empty">El artista todavía no habilitó medios de apoyo.</div>'}</section>${a.audience_chat_enabled?`<section class="panel"><div class="heading"><div><h2>💬 Chat de audiencia</h2><p>Espacio público moderable para conversar con la comunidad del artista.</p></div></div><div class="chat-wrap"><div class="chat-box"><div id="artistChatList" class="chat-list">Cargando…</div><div class="chat-form"><input id="artistChatAlias" placeholder="Tu nombre"><input id="artistChatText" placeholder="Escribí un mensaje" maxlength="800"><button class="btn primary" type="button" onclick="sendAudienceMessage()">Enviar</button></div><div id="artistChatStatus" class="status"></div></div><div class="member-note"><strong>✓ Beneficio de afiliación UADAV</strong><br><br>Este espacio forma parte de las herramientas profesionales del artista afiliado. El apoyo económico se realiza en servicios externos autorizados por el propio artista y no reemplaza ni se mezcla con la cuota sindical.</div></div></section>`:''}</div><div id="tab-about" hidden>${section('about','Acerca de','Información pública del artista',`<div class="about"><div class="box"><h3>Biografía</h3><p style="color:#cbd4df;line-height:1.65">${esc(a.bio||'Este artista todavía no agregó una biografía pública.')}</p></div><div class="box"><h3>Contacto y redes</h3><div class="socials">${Object.entries(a.redes||{}).filter(([,v])=>v).map(([k,v])=>`<a class="social" href="${esc(v)}" target="_blank" rel="noopener">${esc(k)}</a>`).join('')||'<span style="color:var(--muted)">No hay redes cargadas.</span>'}</div>${a.web?`<p style="margin-top:14px"><a class="btn" href="${esc(a.web)}" target="_blank" rel="noopener">Sitio web</a></p>`:''}${book?`<p style="margin-top:12px;color:var(--muted);font-size:12px">Este perfil puede recibir consultas de contratación desde UADAV STREAM. La afiliación sindical se gestiona por separado.</p>`:''}</div></div>`)}</div></main><footer class="footer">★ UADAV STREAM · Perfil público · <a href="/terminos.html">Términos</a> · <a href="/privacidad.html">Privacidad</a></footer>`;

function switchTab(tab){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));['inicio','musica','videos','playlists','podcast','clips','eventos','community','about'].forEach(x=>{const el=document.getElementById('tab-'+x);if(el)el.hidden=x!==tab});if(tab==='community'&&artist?.audience_chat_enabled){loadAudienceChat();clearInterval(audienceTimer);audienceTimer=setInterval(loadAudienceChat,20000)}}
function shareProfile(){if(artist?.canal)apiFetch('public/artist-signal',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({channel_id:artist.canal,type:'share',name:artist.nombre})}).catch(()=>{});const shareUrl=new URL('/artista.html',location.origin);shareUrl.searchParams.set('id',artist?.id||id);const url=shareUrl.toString();if(navigator.share){navigator.share({title:artist.nombre,text:`${artist.nombre} en ★ UADAV STREAM`,url}).catch(()=>{});}else{navigator.clipboard?.writeText(url);}}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closePlayer()});
async function loadAutoShorts(){autoShorts=[];if(!artist?.id&&!artist?.canal)return;try{const key=artist.id||artist.canal;const d=await api('public/artist-shorts?artist_id='+encodeURIComponent(key));if(Array.isArray(d))autoShorts=d}catch(e){console.warn('Shorts automáticos no disponibles',e)}}
async function detectAutoLive(){autoLive=null;if(!artist?.canal)return;try{const d=await api('youtube/channel_info?id='+encodeURIComponent(artist.canal));const vids=Array.isArray(d?.latestVideos)?d.latestVideos:[];const v=vids.find(x=>x?.liveNow===true||x?.isLive===true||String(x?.liveBroadcastContent||'').toLowerCase()==='live');if(v){const vid=String(v.videoId||v.id||'');if(vid)autoLive={video_id:vid,title:v.title||artist.nombre,provider:'youtube',url:'https://www.youtube.com/watch?v='+vid}}}catch(e){console.warn('Live automático no disponible',e)}}
function playAutoLive(){if(!autoLive?.video_id)return;const title=autoLive.title||artist?.nombre||'En vivo';if(typeof reproducirVideo==='function')return reproducirVideo(autoLive.video_id,title,'En vivo',artist?.nombre||'');window.open(autoLive.url,'_blank','noopener')}
async function loadMore(){try{const [legacy,universal,e]=await Promise.allSettled([api('artista/content?artist_id='+encodeURIComponent(artist.id)),api('content?artist_id='+encodeURIComponent(artist.id)),api('cartelera')]);const merged=Array.isArray(artist?.auto_content)?artist.auto_content.slice():[];for(const pack of [legacy,universal]){if(pack.status==='fulfilled'&&Array.isArray(pack.value))pack.value.forEach(x=>{if(!merged.some(y=>String(y.url||y.id)===String(x.url||x.id)))merged.push(x)})}events=e.status==='fulfilled'&&Array.isArray(e.value)?e.value:[];if(merged.length<4){try{const resolved=await api('public/discover-artist?q='+encodeURIComponent(artist.nombre||artist.nombre_artistico||''));const exact=resolved&&String(resolved.nombre||'').toLowerCase().includes(String(artist.nombre||artist.nombre_artistico||'').toLowerCase());if(exact&&Array.isArray(resolved.auto_content))resolved.auto_content.forEach(x=>{if(!merged.some(y=>String(y.url||y.id||y.external_id)===String(x.url||x.id||x.external_id)))merged.push(x)})}catch{}}content=merged.map(normalizeClientMedia);render()}catch{render()}}
async function boot(){try{artist=discoverQuery?await api('public/discover-artist?q='+encodeURIComponent(discoverQuery)):await api('public/artista?id='+encodeURIComponent(id));if(artist?.canal)apiFetch('public/artist-signal',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({channel_id:artist.canal,type:'view',name:artist.nombre})}).catch(()=>{});if(Array.isArray(artist?.auto_content)&&artist.auto_content.length){content=artist.auto_content.map(normalizeClientMedia);render()}await Promise.allSettled([detectAutoLive(),loadAutoShorts(),loadMore()])}catch(e){document.getElementById('app').innerHTML='<div class="empty" style="margin:25vh auto;width:min(560px,90vw)"><h2>Perfil no disponible</h2><p>'+esc(e.message)+'</p><p><a class="btn primary" href="/artistas.html">Volver al directorio</a></p></div>'}}
boot();
