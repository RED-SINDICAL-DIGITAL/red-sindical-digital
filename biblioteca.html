<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mi Biblioteca · ★ UADAV STREAM</title><style>:root{--bg:#05070b;--line:#202a39;--mut:#9ba9bc;--blue:#2f6df6}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font:15px/1.5 Inter,system-ui,sans-serif}button,a{font:inherit;color:inherit}.w{width:min(1180px,calc(100% - 28px));margin:auto}.top{height:68px;display:flex;align-items:center;justify-content:space-between}.hero{padding:44px 0 22px}.hero h1{font-size:clamp(40px,6vw,68px);margin:5px 0;letter-spacing:-.05em}.hero p{color:var(--mut)}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.tab{border:1px solid var(--line);background:#ffffff06;border-radius:999px;padding:9px 13px;cursor:pointer}.tab.on{background:var(--blue);color:#fff}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{border:1px solid var(--line);border-radius:18px;padding:18px;background:#ffffff05;min-height:130px}.card b{display:block}.card span{display:block;color:var(--mut);font-size:12px;margin-top:7px}.empty{grid-column:1/-1;padding:45px;border:1px dashed var(--line);border-radius:20px;color:var(--mut);text-align:center}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.grid{grid-template-columns:1fr}}</style></head><body><div class="w"><header class="top"><a href="/index-v117.html"><b>★ UADAV STREAM</b></a><a href="/mi-perfil.html">Mi perfil</a></header><main><section class="hero"><small style="color:#8eb0ff;font-weight:900">TU ESPACIO</small><h1>Mi Biblioteca</h1><p>Lo que guardás para volver cuando quieras: favoritos, playlists, artistas seguidos, ver más tarde e historial.</p></section><div class="tabs"><button class="tab on" data-kind="recent">Historial</button><button class="tab" data-kind="favorites">Favoritos</button><button class="tab" data-kind="later">Ver más tarde</button><button class="tab" data-kind="playlists">Playlists</button><button class="tab" data-kind="following">Artistas seguidos</button></div><section id="grid" class="grid"></section></main></div><script>const KEYS={recent:'uadav_recent_v11',favorites:'uadav_favorites_v1',later:'uadav_watch_later_v1',playlists:'uadav_playlists_v1',following:'uadav_following_v1'};const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));function read(k){try{const v=JSON.parse(localStorage.getItem(KEYS[k])||'[]');return Array.isArray(v)?v:[]}catch{return[]}}function render(k){const a=read(k),g=document.getElementById('grid');g.innerHTML=a.length?a.slice(0,80).map(x=>`<article class="card"><b>${esc(x.title||x.titulo||x.name||x.nombre||'Guardado')}</b><span>${esc(x.artist||x.autor||x.channelTitle||x.provider||'★ UADAV STREAM')}</span></article>`).join(''):`<div class="empty">Todavía no guardaste contenido en esta sección. A medida que usemos ♡, + Playlist y Ver más tarde, aparecerá acá.</div>`}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===b));render(b.dataset.kind)});render('recent');</script></body></html>
