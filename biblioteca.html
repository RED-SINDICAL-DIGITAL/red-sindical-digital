<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mi Biblioteca · ★ UADAV STREAM</title><style>:root{--bg:#05070b;--line:#202a39;--mut:#9ba9bc;--blue:#2f6df6}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font:15px/1.5 Inter,system-ui,sans-serif}button,a{font:inherit;color:inherit}.w{width:min(1180px,calc(100% - 28px));margin:auto}.top{height:68px;display:flex;align-items:center;justify-content:space-between}.hero{padding:44px 0 22px}.hero h1{font-size:clamp(40px,6vw,68px);margin:5px 0;letter-spacing:-.05em}.hero p{color:var(--mut)}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.tab,.action{border:1px solid var(--line);background:#ffffff06;border-radius:999px;padding:9px 13px;cursor:pointer}.tab.on,.action.primary{background:var(--blue);color:#fff;border-color:var(--blue)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{border:1px solid var(--line);border-radius:18px;padding:12px;background:#ffffff05;min-height:130px;overflow:hidden;transition:.18s}.card:hover{transform:translateY(-2px);border-color:#ffffff38}.card.following{display:flex;align-items:center;gap:14px;min-height:96px}.card.following .thumb{width:72px;height:72px;aspect-ratio:1;border-radius:50%;flex:0 0 auto}.card.following .artistcopy{min-width:0;flex:1}.card.following .artistcopy b{margin-top:0}.thumb{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:12px;background:#101722}.card b{display:block;margin-top:10px}.card span{display:block;color:var(--mut);font-size:12px;margin-top:5px}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.actions button{border:1px solid var(--line);background:#101722;color:#fff;border-radius:999px;padding:6px 9px;font-size:11px;cursor:pointer}.actions button.primary{background:var(--blue);border-color:var(--blue);color:#fff}.empty{grid-column:1/-1;padding:45px;border:1px dashed var(--line);border-radius:20px;color:var(--mut);text-align:center}.playlistbar{display:none;gap:8px;margin:0 0 16px}.playlistbar.on{display:flex}.playlistHead{grid-column:1/-1;display:flex;align-items:end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:4px}.playlistHead h2{font-size:clamp(30px,5vw,50px);margin:12px 0 0}.playlistHead p{color:var(--mut);margin:5px 0}.playlistTools{display:flex;gap:7px;flex-wrap:wrap}.playlistbar input{flex:1;min-width:0;background:#0c111a;border:1px solid var(--line);border-radius:12px;padding:11px;color:#fff}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.grid{grid-template-columns:1fr}}</style></head><body><div class="w"><header class="top"><a href="/index-v117.html"><b>★ UADAV STREAM</b></a><a href="/mi-perfil.html">Mi perfil</a></header><main><section class="hero"><small style="color:#8eb0ff;font-weight:900">TU ESPACIO</small><h1>Mi Biblioteca</h1><p>Favoritos, playlists, artistas seguidos, ver más tarde e historial. Esta etapa guarda el contenido en este dispositivo; la sincronización PC/móvil/TV llegará con la identidad de usuario.</p></section><div class="tabs"><button class="tab on" data-kind="recent">Historial</button><button class="tab" data-kind="favorites">Favoritos</button><button class="tab" data-kind="later">Ver más tarde</button><button class="tab" data-kind="playlists">Playlists</button><button class="tab" data-kind="following">Artistas seguidos</button><button class="tab" data-kind="radios">Radios favoritas</button></div><div id="playlistbar" class="playlistbar"><input id="playlistName" placeholder="Nombre de la nueva playlist"><button id="createPlaylist" class="action primary">＋ Crear playlist</button></div><section id="grid" class="grid"></section></main></div><script>const KEYS={recent:'uadav_recent_v11',favorites:'uadav_favorites_v1',later:'uadav_watch_later_v1',playlists:'uadav_playlists_v1',following:'uadav_following_v1',radios:'uadav_radio_favorites_v1'};let current='recent';const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));function read(k){try{const v=JSON.parse(localStorage.getItem(KEYS[k])||'[]');return Array.isArray(v)?v:[]}catch{return[]}}function write(k,v){localStorage.setItem(KEYS[k],JSON.stringify(v));window.dispatchEvent(new CustomEvent('uadav:library-change',{detail:{kind:k}}))}function key(x){return String(x.id||x.videoId||x.external_id||x.url||x.href||x.title||x.name||'')}function remove(k,id){write(k,read(k).filter(x=>key(x)!==id));render(k)}function host(){try{return parent!==window&&(parent.UADAVShellHost||parent.UADAV_APP||parent.UADAVShell)}catch{return null}}function nav(href){const h=host();if(h?.navigate)return h.navigate(href);if(parent!==window)return parent.postMessage({type:'uadav:navigate',href},location.origin);location.href=href}function play(x){const h=host();if(h?.playContent)return h.playContent(x);try{if(parent!==window)return parent.postMessage({type:'uadav:content-play',item:x},location.origin)}catch{}if(x?.url)window.open(x.url,'_blank','noopener')}function img(x){const id=x.videoId||x.youtube_id||x.external_id;return x.thumbnail||x.image||x.imagen||(id?'https://i.ytimg.com/vi/'+id+'/hqdefault.jpg':'')}function render(k){current=k;document.getElementById('playlistbar').classList.toggle('on',k==='playlists');const g=document.getElementById('grid'),a=read(k);if(k==='playlists'){g.innerHTML=a.length?a.map((p,i)=>`<article class="card"><b>${esc(p.name||'Playlist')}</b><span>${(p.items||[]).length} contenidos</span><div class="actions"><button data-openpl="${i}">Abrir</button><button data-delpl="${i}">Eliminar</button></div></article>`).join(''):`<div class="empty">Todavía no creaste playlists. Creá la primera arriba.</div>`;g.querySelectorAll('[data-delpl]').forEach(b=>b.onclick=()=>{const x=read('playlists');x.splice(+b.dataset.delpl,1);write('playlists',x);render('playlists')});g.querySelectorAll('[data-openpl]').forEach(b=>{b.onclick=()=>renderPlaylist(+b.dataset.openpl)});return}g.innerHTML=a.length?a.slice(0,80).map(x=>k==='radios'?`<article class="card following">${img(x)?`<img class="thumb" src="${esc(img(x))}" alt="" loading="lazy">`:''}<div class="artistcopy"><b>${esc(x.nombre||x.name||'Radio')}</b><span>Radio favorita</span><div class="actions"><button class="primary" data-radio="${esc(key(x))}">Abrir radio</button><button data-remove="${esc(key(x))}">Quitar</button></div></div></article>`:k==='following'?`<article class="card following">${img(x)?`<img class="thumb" src="${esc(img(x))}" alt="" loading="lazy">`:''}<div class="artistcopy"><b>${esc(x.nombre_artistico||x.nombre||x.title||'Artista')}</b><span>Artista seguido</span><div class="actions"><button class="primary" data-artist="${esc(key(x))}">Ver perfil</button><button data-remove="${esc(key(x))}">Dejar de seguir</button></div></div></article>`:`<article class="card">${img(x)?`<img class="thumb" src="${esc(img(x))}" alt="" loading="lazy">`:''}<b>${esc(x.title||x.titulo||x.name||x.nombre||'Guardado')}</b><span>${esc(x.artist||x.autor||x.channelTitle||x.provider||'★ UADAV STREAM')}</span><div class="actions"><button class="primary" data-play="${esc(key(x))}">▶ Reproducir</button>${k!=='recent'?`<button data-remove="${esc(key(x))}">Quitar</button>`:''}</div></article>`).join(''):`<div class="empty">Todavía no guardaste contenido en esta sección.</div>`;g.querySelectorAll('[data-play]').forEach(b=>b.onclick=()=>{const x=a.find(v=>key(v)===b.dataset.play);if(x)play(x)});g.querySelectorAll('[data-artist]').forEach(b=>b.onclick=()=>{const x=a.find(v=>key(v)===b.dataset.artist);if(!x)return;nav(x.url||('/artista.html?id='+encodeURIComponent(x.id||x.slug||key(x))))});g.querySelectorAll('[data-radio]').forEach(b=>b.onclick=()=>{const x=a.find(v=>key(v)===b.dataset.radio);if(x)nav('/radio.html?id='+encodeURIComponent(x.id||x.nombre||key(x))) });g.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>remove(k,b.dataset.remove))}function renderPlaylist(i){const all=read('playlists'),p=all[i],g=document.getElementById('grid');if(!p)return render('playlists');const items=Array.isArray(p.items)?p.items:[];g.innerHTML=`<div class="playlistHead"><div><button class="action" id="backPl">← Playlists</button><h2>${esc(p.name||'Playlist')}</h2><p>${items.length} contenidos</p></div><div class="playlistTools">${items.length?'<button class="action primary" id="playAll">▶ Reproducir</button>':''}<button class="action" id="renamePl">Renombrar</button></div></div>`+(items.length?items.map(x=>`<article class="card">${img(x)?`<img class="thumb" src="${esc(img(x))}" alt="" loading="lazy">`:''}<b>${esc(x.title||x.titulo||x.name||'Contenido')}</b><span>${esc(x.artist||x.autor||x.channelTitle||x.provider||'★ UADAV STREAM')}</span><div class="actions"><button class="primary" data-pitem="${esc(key(x))}">▶ Reproducir</button><button data-rmitem="${esc(key(x))}">Quitar</button></div></article>`).join(''):'<div class="empty">Esta playlist todavía está vacía. Agregá contenido desde el reproductor.</div>');document.getElementById('backPl').onclick=()=>render('playlists');document.getElementById('playAll')?.addEventListener('click',()=>{if(items[0])play(items[0])});document.getElementById('renamePl')?.addEventListener('click',()=>{const name=prompt('Nuevo nombre de la playlist:',p.name||'Playlist')?.trim();if(!name)return;all[i].name=name;write('playlists',all);renderPlaylist(i)});g.querySelectorAll('[data-pitem]').forEach(b=>b.onclick=()=>{const x=items.find(v=>key(v)===b.dataset.pitem);if(x)play(x)});g.querySelectorAll('[data-rmitem]').forEach(b=>b.onclick=()=>{all[i].items=items.filter(v=>key(v)!==b.dataset.rmitem);write('playlists',all);renderPlaylist(i)})}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===b));render(b.dataset.kind)});document.getElementById('createPlaylist').onclick=()=>{const input=document.getElementById('playlistName'),name=input.value.trim();if(!name)return;const a=read('playlists');a.unshift({id:'pl_'+Date.now(),name,items:[],created_at:Date.now()});write('playlists',a);input.value='';render('playlists')};render('recent');</script></body></html>
