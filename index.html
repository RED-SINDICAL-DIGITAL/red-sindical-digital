<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UADAVSTREAM | Entretenimiento Global</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root { --bg-primary: #0a0a0a; --bg-secondary: #141414; --accent: #e50914; --text-primary: #fff; --text-secondary: #b3b3b3; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: var(--bg-primary); color: var(--text-primary); }
    .header { position: fixed; top: 0; left: 0; right: 0; padding: 1rem 4%; display: flex; align-items: center; gap: 1rem; background: rgba(0,0,0,0.9); z-index: 1000; }
    .logo { font-family: 'Playfair Display', serif; font-size: 1.6rem; font-weight: 900; color: var(--accent); }
    .logo span { color: var(--text-primary); }
    .search-input { flex: 1; max-width: 500px; padding: 0.7rem 1rem; border-radius: 30px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.6); color: white; }
    .hero { margin-top: 80px; padding: 4rem 4%; background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('https://images.unsplash.com/photo-1503095392237-fc7852ad0458?w=1920&q=80') center/cover; min-height: 60vh; display: flex; align-items: center; }
    .hero h1 { font-family: 'Playfair Display', serif; font-size: 3rem; margin-bottom: 1rem; }
    .section { padding: 2rem 4%; }
    .section h2 { font-size: 1.5rem; margin-bottom: 1rem; display: flex; align-items: center; gap: 0.5rem; }
    .section h2 i { color: var(--accent); }
    .carousel { display: flex; gap: 1rem; overflow-x: auto; padding-bottom: 1rem; }
    .card { min-width: 280px; background: var(--bg-secondary); border-radius: 8px; overflow: hidden; cursor: pointer; transition: transform 0.3s; }
    .card:hover { transform: scale(1.05); }
    .card img { width: 100%; aspect-ratio: 16/9; object-fit: cover; }
    .card-content { padding: 1rem; }
    .card h3 { font-size: 1rem; margin-bottom: 0.3rem; }
    .card p { font-size: 0.85rem; color: var(--text-secondary); }
    .btn { padding: 0.8rem 1.5rem; border-radius: 8px; border: none; cursor: pointer; font-weight: 600; }
    .btn-primary { background: var(--accent); color: white; }
    .loader { text-align: center; padding: 2rem; color: var(--text-secondary); }
    @media (max-width: 768px) {
      .carousel { flex-direction: column; }
      .card { width: 100%; height: 60vh; }
      .card img { height: 100%; }
      .hero h1 { font-size: 2rem; }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="logo">UADAV<span>STREAM</span></div>
    <input type="text" class="search-input" id="searchInput" placeholder="Buscar artistas, obras, señales...">
  </header>

  <main>
    <section class="hero">
      <div>
        <h1>El Arte Escénico al Alcance de Todos</h1>
        <p>Teatro, circo, música y radio en vivo. 100% gratuito.</p>
      </div>
    </section>

    <section class="section" id="senales">
      <h2><i class="fas fa-broadcast-tower"></i> Señales Oficiales</h2>
      <div class="carousel" id="carousel-senales"><div class="loader">Cargando...</div></div>
    </section>

    <section class="section" id="radios">
      <h2><i class="fas fa-radio"></i> Radios Difusoras</h2>
      <div class="carousel" id="carousel-radios"><div class="loader">Cargando...</div></div>
    </section>

    <section class="section" id="artistas">
      <h2><i class="fas fa-microphone-alt"></i> Artistas Destacados</h2>
      <div class="carousel" id="carousel-artistas"><div class="loader">Cargando...</div></div>
    </section>

    <section class="section" id="cartelera">
      <h2><i class="fas fa-theater-masks"></i> Cartelera de Eventos</h2>
      <div class="carousel" id="carousel-cartelera"><div class="loader">Cargando...</div></div>
    </section>
  </main>

  <script>
    // CARGA DE DATOS
    async function cargarDatos() {
      const endpoints = [
        { id: 'carousel-senales', url: '/api/senales' },
        { id: 'carousel-radios', url: '/api/radios' },
        { id: 'carousel-artistas', url: '/api/artistas_uadav' },
        { id: 'carousel-cartelera', url: '/api/cartelera_shows' }
      ];

      for (const ep of endpoints) {
        try {
          const res = await fetch(ep.url);
          const datos = await res.json();
          const container = document.getElementById(ep.id);
          
          if (!datos || datos.length === 0) {
            container.innerHTML = '<p style="padding: 2rem; color: #666;">Próximamente...</p>';
            continue;
          }

          container.innerHTML = '';
          datos.slice(0, 10).forEach(item => {
            const card = document.createElement('div');
            card.className = 'card';
            const img = item.foto_portada || item.flyer || item.thumbnail || 'https://via.placeholder.com/400x225/1f1f1f/ffffff?text=UADAV';
            const titulo = item.titulo || item.nombre || 'Sin título';
            const desc = item.descripcion || item.rubro || item.lugar || '';
            
            card.innerHTML = `
              <img src="${img}" onerror="this.src='https://via.placeholder.com/400x225/1f1f1f/ffffff?text=Error'" alt="${titulo}">
              <div class="card-content">
                <h3>${titulo}</h3>
                <p>${desc}</p>
              </div>
            `;
            container.appendChild(card);
          });
        } catch (e) {
          console.error(`Error cargando ${ep.url}:`, e);
          document.getElementById(ep.id).innerHTML = '<p style="padding: 2rem; color: #f87171;">Error al cargar</p>';
        }
      }
    }

    // BUSCADOR
    let searchTimeout;
    document.getElementById('searchInput').addEventListener('input', (e) => {
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(async () => {
        const query = e.target.value.trim();
        if (query.length < 3) return;
        
        try {
          const res = await fetch(`/api/youtube/search?q=${encodeURIComponent(query)}`);
          const resultados = await res.json();
          console.log('Resultados:', resultados);
        } catch (e) {
          console.error('Error en búsqueda:', e);
        }
      }, 600);
    });

    // INICIAR
    document.addEventListener('DOMContentLoaded', () => {
      cargarDatos();
      fetch('/api/visits', { method: 'POST' }).catch(() => {});
    });
  </script>
</body>
</html>
