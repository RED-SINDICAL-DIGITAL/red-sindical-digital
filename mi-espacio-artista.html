async function call(path,opt={}){if(opt.method==='PUT'){const r=await fetch(API+'health',{cache:'no-store'}),h=await r.json();if(Number(h.build)<11736)throw Error('Para guardar la personalización, actualizá el Worker a 11736. Tu borrador sigue en esta pantalla.');}const c=new AbortController(),t=setTimeout(()=>c.abort(),15000);try{const r=await fetch(API+path,{...opt,headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},cache:'no-store',signal:c.signal});const d=await r.json();if(!r.ok)throw Error(d.error||'No se pudo completar');return d}finally{clearTimeout(t)}}
function render(){const c=$('content');if(tab==='promotion'){UADAVProBenefits.mount(c,{api:API,token});document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));return}if(tab==='kit'){c.innerHTML=`<h2>Mi presentación profesional</h2><p class="notice">${state.published?'Presentación publicada. Los cambios de este borrador se verán al volver a publicar.':'Borrador privado. Se podrá compartir después de publicar.'}</p>${state.presskit_enabled===false?'<p class="notice">El Press Kit está deshabilitado. Podés preparar tu borrador y habilitarlo desde Mi perfil y plan antes de publicar.</p>':''}<p class="muted">Tu web para enviar a productoras, salas y organizadores. Publicá tu presentación y tus espectáculos; no incluye precios base, clientes, presupuestos ni agenda.</p><button data-action="fillProfile" ${!profileForKit?'hidden':''}>Completar campos vacíos con mi perfil</button><div class="grid">${kitFields.map(f=>field(f,state.data.kit[f[0]],'k_')).join('')}${appearanceForm()}</div><div class="actions" style="margin-top:16px"><button data-action="previewKit">Vista previa de mi web / PDF</button><button data-action="publish" class="primary">Guardar y publicar presentación</button><button data-action="unpublish" ${!state.published?'hidden':''}>Retirar presentación pública</button></div>${state.published?`<p><a target="_blank" rel="noopener" href="/presskit.html?artist_id=${encodeURIComponent(state.artist_id)}">Abrir presentación compartible ↗</a> <button data-action="copyKit">Copiar enlace público</button> <button data-action="shareKit">Compartir Press Kit</button></p>`:''}`;c.querySelectorAll('input,textarea,select').forEach(e=>{e.disabled=!state.pro;e.oninput=mark})}else{const def=schema[tab],list=state.data[tab];c.innerHTML=`<h2>${def.title}</h2><p class="muted">${tab==='leads'?'Organizá tus contactos y próximos pasos. Los pedidos enviados desde tu perfil están en Consultas recibidas, que sigue siendo gratuito.':tab==='agenda
