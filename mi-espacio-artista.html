<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Mi espacio de artista</title><style>
:root{color-scheme:dark;--bg:#080b12;--panel:#111826;--line:#243047;--muted:#a4b1c6;--accent:#2f6df6}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font:15px/1.5 system-ui}a{color:#91b8ff}button,input,textarea,select{font:inherit}button,.btn{border:1px solid var(--line);border-radius:12px;background:#18243a;color:#fff;padding:10px 15px;cursor:pointer;text-decoration:none}button.primary{background:var(--accent)}button:disabled{opacity:.5;cursor:default}.shell{max-width:1300px;margin:auto;padding:24px}.top,.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.top{justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:18px}.layout{display:grid;grid-template-columns:230px 1fr;gap:24px;margin-top:24px}nav{display:flex;flex-direction:column;gap:8px}nav button{text-align:left}nav button.active{background:var(--accent)}.panel{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:24px}h1{font-size:32px;margin:0}h2{margin-top:0}.muted,small{color:var(--muted)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}label{display:block;font-size:13px;color:var(--muted)}input,textarea,select{width:100%;background:#080e19;border:1px solid var(--line);border-radius:10px;color:#fff;padding:11px;margin:5px 0}textarea{min-height:110px}.wide{grid-column:1/-1}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:13px 8px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-size:12px}.empty{padding:32px;text-align:center;color:var(--muted)}dialog{background:var(--panel);color:#fff;border:1px solid var(--line);border-radius:20px;width:min(800px,95vw);max-height:90vh}dialog::backdrop{background:#000a}.notice{padding:12px 16px;background:#152540;border-radius:12px;margin:16px 0}#status{min-height:24px}#preview{display:none}.preview{background:#fff;color:#142036;padding:40px;max-width:900px;margin:24px auto}.preview a{color:#164c9f}.preview img{max-width:200px;border-radius:16px}.preview pre{white-space:pre-wrap;font:inherit}@media(max-width:760px){.layout{grid-template-columns:1fr}nav{flex-direction:row;overflow:auto}nav button{white-space:nowrap}.grid{grid-template-columns:1fr}.shell{padding:14px}.panel{padding:16px}}@media print{body{background:white}body>*{display:none!important}#preview{display:block!important;margin:0;max-width:none;padding:20px}.noprint{display:none!important}}
</style><script src="/platform-brand-runtime.js" defer></script><link rel="stylesheet" href="/uadav-design-v118.css?v=12005"><link rel="stylesheet" href="/uadav-responsive-v120.css?v=12005"><link rel="stylesheet" href="/uadav-presskit-v128.css?v=12015"><script src="/uadav-presskit-v128.js?v=12015"></script><script src="/uadav-artist-account-v129.js?v=12017"></script></head><body data-page="mi-espacio-artista"><main class="shell"><header class="top"><div><small data-brand-name>UADAV STREAM</small><h1>Mi espacio de artista</h1></div><div class="actions"><a class="btn" href="/usuario.html">Mi cuenta</a><a class="btn" href="/gestionar-artista.html">Mi perfil y plan</a><button id="save" class="primary" disabled>Guardar cambios</button></div></header><p id="status" role="status" aria-live="polite">Comprobando tu acceso…</p><div class="layout" id="workspace" hidden><aside><div class="panel"><strong id="artistName"></strong><p id="plan" class="muted"></p><nav id="tabs"></nav></div><p class="muted">Tus presupuestos, agenda y consultas son privados. Sólo el Press Kit que publiques será compartible.</p></aside><section class="panel" id="content"></section></div></main><dialog id="editor"><form id="editForm"><h2 id="editTitle"></h2><div class="grid" id="editFields"></div><div class="actions" style="margin-top:16px"><button type="button" id="cancel">Cancelar</button><button class="primary">Aceptar cambios</button></div><p class="muted">Después pulsá Guardar cambios para sincronizar.</p></form></dialog><article id="preview" class="preview"></article><script>
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),API=window.PLATFORM_API_BASE||window.UADAV_API_BASE||'https://uadav-api.uadavstream.workers.dev/api/';let token='';try{token=localStorage.getItem('uadav_artist_access_token_v1')||''}catch{}let state,tab='kit',dirty=false,busy=false,editIndex=-1;
const schema={shows:{title:'Mis espectáculos',singular:'Espectáculo',fields:[['name','Nombre'],['duration','Duración'],['audience','Público recomendado'],['members','Integrantes'],['requirements','Necesidades técnicas','textarea'],['setup','Montaje y desmontaje'],['price','Precio base orientativo · privado']]},quotes:{title:'Propuestas y presupuestos',singular:'Propuesta',fields:[['client','Cliente'],['show','Espectáculo'],['date','Fecha','date'],['place','Lugar'],['fee','Honorarios ARS','number'],['travel','Traslado ARS','number'],['other','Otros gastos ARS','number'],['valid_until','Válido hasta','date'],['conditions','Condiciones','textarea'],['status','Estado','select',['Borrador','Enviado','Aceptado','Cerrado']],['deposit','Seña acordada ARS','number'],['paid','Total recibido ARS','number'],['payment_notes','Registro privado de pagos','textarea']]},agenda:{title:'Mi agenda',singular:'Fecha',fields:[['date','Fecha','date'],['time','Hora','time'],['show','Espectáculo'],['place','Lugar'],['status','Estado','select',['Disponible','Consultada','Reservada','Confirmada']],['notes','Notas privadas','textarea']]},leads:{title:'Seguimiento de consultas',singular:'Consulta',fields:[['client','Cliente'],['contact','Contacto'],['event','Evento'],['date','Fecha del evento','date'],['status','Estado','select',['Nueva','Respondida','Propuesta enviada','Confirmada','Cerrada']],['next_date','Próximo seguimiento','date'],['notes','Notas privadas','textarea']]}};
const kitFields=[['name','Nombre artístico'],['discipline','Disciplina'],['city','Ciudad'],['bio','Presentación','textarea'],['trajectory','Trayectoria','textarea'],['photo','Foto · URL','url'],['video','Video de presentación · URL','url'],['contact','Contacto que querés hacer público']];
function field([key,label,type='text',options],value='',prefix='f_'){return `<div class="${type==='textarea'?'wide':''}"><label for="${prefix+key}">${esc(label)}</label>${type==='textarea'?`<textarea id="${prefix+key}" maxlength="4000">${esc(value)}</textarea>`:type==='select'?`<select id="${prefix+key}">${options.map(o=>`<option ${o===value?'selected':''}>${esc(o)}</option>`).join('')}</select>`:`<input id="${prefix+key}" type="${type}" ${type==='number'?'min="0" step="0.01"':''} maxlength="4000" value="${esc(value)}">`}</div>`}
function mark(){dirty=true;$('status').textContent='Hay cambios sin guardar.'}function collectKit(){if(tab==='kit'&&$('k_name'))for(const [key] of kitFields)state.data.kit[key]=$('k_'+key).value.trim()}
async function call(path,opt={}){const c=new AbortController(),t=setTimeout(()=>c.abort(),15000);try{const r=await fetch(API+path,{...opt,headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},cache:'no-store',signal:c.signal});const d=await r.json();if(!r.ok)throw Error(d.error||'No se pudo completar');return d}finally{clearTimeout(t)}}
function render(){const c=$('content');if(tab==='kit'){c.innerHTML=`<h2>Mi Press Kit</h2>${state.presskit_enabled===false?'<p class="notice">El Press Kit está deshabilitado. Podés preparar tu borrador y habilitarlo desde Mi perfil y plan antes de publicar.</p>':''}<p class="muted">Prepará tu presentación. Publicar crea una copia que incluye esta información y las fichas de tus espectáculos; no incluye precios base, clientes, presupuestos ni agenda.</p><div class="grid">${kitFields.map(f=>field(f,state.data.kit[f[0]],'k_')).join('')}</div><div class="actions" style="margin-top:16px"><button data-action="previewKit">Vista previa / PDF</button><button data-action="publish" class="primary">Guardar y publicar presentación</button><button data-action="unpublish">Retirar presentación pública</button></div>${state.published?`<p><a target="_blank" rel="noopener" href="/presskit.html?artist_id=${encodeURIComponent(state.artist_id)}">Abrir presentación compartible</a></p>`:''}`;c.querySelectorAll('input,textarea').forEach(e=>{e.disabled=!state.pro;e.oninput=mark})}else{const def=schema[tab],list=state.data[tab];c.innerHTML=`<h2>${def.title}</h2><p class="muted">${tab==='leads'?'Registrá tus consultas. Este seguimiento no reemplaza ni bloquea las consultas gratuitas del perfil.':tab==='agenda'?'Una fecha consultada o reservada no es una contratación confirmada.':tab==='quotes'?'Importes en pesos. Las señas y pagos son anotaciones tuyas, sin verificación bancaria. Revisá la propuesta antes de compartirla; no se envía ni se acepta automáticamente.':'Las fichas se incorporan al Press Kit sólo cuando lo publicás.'}</p><button data-action="add" class="primary">+ ${def.singular}</button><div class="tablewrap">${list.length?`<table><thead><tr><th>Registro</th><th>Fecha / detalle</th><th>Estado</th><th>Acciones</th></tr></thead><tbody>${list.map((x,i)=>`<tr><td>${esc(x.name||x.client||x.show||x.date||'Registro')}</td><td>${esc(x.date||x.duration||'—')}</td><td>${esc(x.status||'—')}</td><td><button data-edit="${i}">Editar</button> ${tab==='quotes'?`<button data-print="${i}">Ver / PDF</button> <button data-copy="${i}">Duplicar</button> <button data-agenda="${i}">Pasar a agenda</button>`:''}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">Todavía no hay registros. Agregá el primero.</div>'}</div>`}c.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>edit(+b.dataset.edit));c.querySelectorAll('[data-print]').forEach(b=>b.onclick=()=>previewQuote(+b.dataset.print));c.querySelectorAll('[data-copy]').forEach(b=>{b.disabled=!state.pro;b.onclick=()=>{if(state.data.quotes.length>=200)return;state.data.quotes.push({...state.data.quotes[+b.dataset.copy],id:crypto.randomUUID(),status:'Borrador',paid:'0',payment_notes:''});mark();render()}});c.querySelectorAll('[data-agenda]').forEach(b=>{b.disabled=!state.pro;b.onclick=()=>{const q=state.data.quotes[+b.dataset.agenda];if(!q.date){$('status').textContent='Agregá una fecha al presupuesto antes de pasarlo a agenda.';return}if(state.data.agenda.length>=200)return;const id='quote-'+q.id;if(state.data.agenda.some(x=>x.id===id)){$('status').textContent='Este presupuesto ya está en tu agenda.';return}state.data.agenda.push({id,date:q.date,show:q.show,place:q.place,status:q.status==='Aceptado'?'Confirmada':'Consultada',notes:'Desde presupuesto · '+q.client});mark();$('status').textContent='Agregado a agenda. Guardá los cambios.'}});c.querySelectorAll('[data-action]').forEach(b=>{const a=b.dataset.action;b.disabled=busy||(a==='publish'&&state.presskit_enabled===false)||(!state.pro&&['add','publish','unpublish'].includes(a));b.onclick=()=>a==='add'?edit(-1):a==='previewKit'?previewKit():save(a==='publish'?'publish':'unpublish')});document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));}
function edit(i){if(busy)return;if(!state.pro)return void ($('status').textContent='La edición requiere PRO vigente.');editIndex=i;const def=schema[tab],x=state.data[tab][i]||{};$('editTitle').textContent=def.singular;$('editFields').innerHTML=def.fields.map(f=>field(f,x[f[0]])).join('');$('editor').showModal()}
$('cancel').onclick=()=>$('editor').close();$('editForm').onsubmit=e=>{e.preventDefault();const def=schema[tab],x={id:editIndex<0?crypto.randomUUID():state.data[tab][editIndex].id};for(const [key] of def.fields)x[key]=$('f_'+key).value.trim();if(!x[def.fields[0][0]])return;const list=state.data[tab];if(editIndex<0){if(list.length>=200)return void ($('status').textContent='Máximo 200 registros por herramienta.');list.push(x)}else list[editIndex]=x;mark();$('editor').close();render()};
async function save(publication){if(busy||!state.pro)return;collectKit();busy=true;document.querySelectorAll('#content input,#content textarea,#content select,#tabs button,[data-action],[data-edit],[data-copy],[data-agenda]').forEach(b=>b.disabled=true);$('save').disabled=true;$('status').textContent='Guardando…';try{const r=await call('artist/workspace',{method:'PUT',body:JSON.stringify({revision:state.revision,data:state.data,publication})});state.revision=r.revision;state.published=r.published;dirty=false;$('status').textContent=publication==='publish'?'Guardado y publicado.':publication==='unpublish'?'Guardado. Presentación retirada.':'Cambios guardados.';render()}catch(e){$('status').textContent=e.message+' Tus cambios permanecen en esta página.'}finally{busy=false;render();document.querySelectorAll('#tabs button').forEach(b=>b.disabled=false);$('save').disabled=!state.pro}}
$('save').onclick=()=>save();window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});
function showPreview(html){$('preview').innerHTML=`<div class="noprint actions"><button id="printPreview">Imprimir / guardar PDF</button><button id="closePreview">Cerrar vista previa</button></div>`+html;$('preview').style.display='block';$('preview').scrollIntoView({behavior:'smooth'});$('printPreview').onclick=()=>window.print();$('closePreview').onclick=()=>$('preview').style.display='none'}
function previewKit(){collectKit();showPreview(UADAVPressKit.render({kit:state.data.kit,shows:state.data.shows}));$('preview').querySelectorAll('img').forEach(img=>img.onerror=()=>img.hidden=true)}
function previewQuote(i){const x=state.data.quotes[i],k=state.data.kit,money=v=>Number(v||0).toLocaleString('es-AR',{style:'currency',currency:'ARS'}),total=['fee','travel','other'].reduce((a,f)=>a+Math.max(0,Number(x[f])||0),0);showPreview(`<h1>Propuesta artística</h1><p>${esc(k.name)} · ${esc(k.contact)}</p><h2>${esc(x.show)}</h2><p>Para: ${esc(x.client)}<br>Fecha: ${esc(x.date)} · Lugar: ${esc(x.place)}</p><p>Honorarios: ${money(x.fee)}<br>Traslado: ${money(x.travel)}<br>Otros gastos: ${money(x.other)}</p><h2>Total: ${money(total)}</h2><p>Seña acordada: ${money(x.deposit)}<br>Total recibido informado: ${money(x.paid)}<br>Saldo pendiente: ${money(Math.max(0,total-(Number(x.paid)||0)))}</p><p>Válido hasta: ${esc(x.valid_until||'A definir')}</p><pre>${esc(x.conditions)}</pre><p>Esta propuesta requiere confirmación entre las partes. No acredita pago ni contratación.</p>`)}
(async()=>{try{token=await UADAVArtistAccount.restore(token);if(!token)throw Error('Entrá primero desde tu acceso de artista en Mi perfil y plan.');state=await call('artist/workspace');$('workspace').hidden=false;$('artistName').textContent=state.name;$('plan').textContent=state.pro?'Artista PRO vigente':'Lectura de tus datos · PRO no vigente';$('save').disabled=!state.pro;$('tabs').innerHTML=[['kit','Press Kit'],...Object.entries(schema).map(([k,v])=>[k,v.title])].map(([k,v])=>`<button data-tab="${k}">${v}</button>`).join('');$('tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{collectKit();tab=b.dataset.tab;render()});$('status').textContent=state.pro?'Espacio privado cargado.':'PRO no vigente: podés consultar tus datos guardados. Tu perfil básico sigue siendo gratuito.';render()}catch(e){$('status').textContent=e.message;const help=document.createElement('p');help.innerHTML='<a class="btn" href="/gestionar-artista.html">Abrir mi acceso de artista</a> <a class="btn" href="/para-artistas.html">Crear o reclamar un perfil</a>';$('status').after(help)}})();
</script><script src="/uadav-responsive.js?v=12005"></script></body></html>
