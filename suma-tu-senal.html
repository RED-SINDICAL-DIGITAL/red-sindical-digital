<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090f1e"><title>Sumá tu señal · ★ UADAV STREAM</title><style>:root{color-scheme:dark;font-family:system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:#090f1e;color:#f5f7fc;padding:24px}main{max-width:690px;margin:auto}h1{font-size:clamp(2rem,5vw,3rem)}p{color:#b5c2d7;line-height:1.6}.panel{background:#15213a;border:1px solid #34445d;border-radius:20px;padding:24px}label{display:block;margin:15px 0 6px;font-weight:600}input,select,textarea,button{font:inherit}input,select,textarea{display:block;width:100%;padding:13px;background:#0a1325;color:#fff;border:1px solid #53627c;border-radius:10px}button{background:#3178ed;color:white;border:0;border-radius:12px;padding:14px 24px;margin-top:20px;cursor:pointer}button:disabled{opacity:.55;cursor:not-allowed}.check{display:flex;gap:10px;align-items:flex-start;margin-top:18px}.check input{width:auto;margin-top:6px}#notice{margin-top:18px;white-space:pre-wrap}a{color:#a9caff}</style></head><body><main><a href="/index.html">← ★ UADAV STREAM</a><h1>Sumá tu señal</h1><p>¿Tenés una radio o señal de televisión? Solicitá incorporarla a la plataforma. Todas las solicitudes son revisadas antes de publicarse.</p><section class="panel"><p id="state" role="status">Consultando inscripciones…</p><form id="form" hidden><label for="type">Tipo de señal</label><select id="type" required><option value="radio">Radio</option><option value="tv">TV / IPTV autorizada</option></select><label for="name">Nombre de la señal</label><input id="name" maxlength="120" required minlength="3"><label for="contact">Correo o contacto del responsable</label><input id="contact" maxlength="180" required minlength="5"><label for="stream">URL HTTPS de transmisión</label><input id="stream" type="url" pattern="https://.*" placeholder="https://…" required><label for="website">Sitio web (opcional)</label><input id="website" type="url"><label for="province">Provincia o región</label><input id="province" maxlength="100"><label for="description">Descripción</label><textarea id="description" rows="4" maxlength="900"></textarea><label class="check"><input id="rights" type="checkbox" required><span>Declaro que soy responsable de la señal o tengo autorización para solicitar su distribución en esta plataforma.</span></label><button id="submit" type="submit">Enviar solicitud</button></form><p id="notice" role="status"></p></section></main><script src="/uadav-api-config.js"></script><script>(()=>{'use strict';const api=(window.PLATFORM_API_BASE||window.UADAV_API_BASE||'https://uadav-api.uadavstream.workers.dev/api/').replace(/\/?$/,'/');const el=id=>document.getElementById(id);let config={};async function load(){try{const r=await fetch(api+'signal-onboarding/config',{cache:'no-store'});if(!r.ok)throw Error('No se pudo consultar la disponibilidad');config=await r.json();const allowed=[];if(config.radio)allowed.push('radio');if(config.tv)allowed.push('tv');el('type').innerHTML=allowed.map(x=>'<option value="'+x+'">'+(x==='radio'?'Radio':'TV / IPTV autorizada')+'</option>').join('');el('form').hidden=!allowed.length;el('state').textContent=allowed.length?'Inscripciones abiertas. La incorporación requiere aprobación.':config.closed_message||'Inscripciones cerradas.'}catch(e){el('state').textContent='El formulario no está disponible por el momento.'}}el('form').addEventListener('submit',async e=>{e.preventDefault();el('submit').disabled=true;el('notice').textContent='Enviando…';try{const payload={type:el('type').value,name:el('name').value,contact:el('contact').value,stream_url:el('stream').value,website:el('website').value,province:el('province').value,description:el('description').value,rights_confirmed:el('rights').checked};const r=await fetch(api+'signal-onboarding/apply',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const d=await r.json();if(!r.ok)throw Error(d.error||'No se pudo enviar');el('form').reset();el('notice').textContent='Solicitud recibida. Identificador: '+d.id+'. El equipo revisará tu señal.'}catch(err){el('notice').textContent=err.message}finally{el('submit').disabled=false}});load()})()</script></body></html>
