<link rel="stylesheet" href="/uadav-ui-v8.4.css?v=924"></head><body><main class="shell"><header class="top"><a class="brand" href="/"><span class="star">★</span><span>UADAV STREAM</span></a><div class="row"><a class="btn" href="/cartelera.html">← Cartelera</a><a class="btn primary" href="/publicar-evento.html">Publicar evento</a></div></header><div id="app"><div class="empty">Cargando evento…</div></div><div id="ticketModal" class="ticket-modal"><div class="ticket-card"><button class="btn" id="ticketClose" type="button" aria-label="Cerrar entradas" style="position:absolute;right:14px;top:14px">✕</button><h2>🎟 UADAV Tickets · Preacuerdo</h2><p>Esta etapa registra interés/consulta. No procesa pagos, no emite entrada ni QR y no confirma acceso hasta que UADAV y el organizador habiliten el circuito.</p><form id="ticketForm" class="ticket-form"><input name="buyer_name" placeholder="Nombre y apellido" required><input name="buyer_email" type="email" placeholder="Email" required><input name="buyer_phone" placeholder="WhatsApp / teléfono"><input name="quantity" type="number" min="1" max="20" value="1" placeholder="Cantidad"><div class="wide"><button class="btn primary" type="submit">Registrar interés</button><div id="ticketStatus" style="margin-top:10px;color:var(--muted);font-size:12px"></div></div></form></div></div><footer class="footer">★ UADAV STREAM · <a href="/terminos.html">Términos</a> · <a href="/privacidad.html">Privacidad</a></footer></main><script>
const API_REMOTE=window.UADAV_API_BASE||'https://uadav-api.uadavstream.workers.dev/api/',API_LOCAL=location.origin+'/api/',id=new URLSearchParams(location.search).get('id')||'';const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const FALLBACK='data:image/svg+xml;charset=UTF-8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000"><rect width="100%" height="100%" fill="#101824"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" fill="#8190a4" font-family="Arial" font-size="30">★ UADAV STREAM</text></svg>');
async function api(path){let err;for(const base of [...new Set([API_REMOTE,...(window.UADAV_USE_LOCAL_API===true?[API_LOCAL]:[])])]){try{const r=await fetch(base+path+(path.includes('?')?'&':'?')+'_='+Date.now(),{cache:'no-store'});const ct=r.headers.get('content-type')||'';if(!r.ok||!ct.includes('json')){err=new Error('API '+r.status);continue}return await r.json()}catch(e){err=e}}throw err||new Error('No disponible')}
function shell(){try{return window.parent!==window&&(window.parent.UADAVShellHost||window.parent.UADAV_APP||window.parent.UADAVShell)}catch{return null}}function playEventMedia(e,title,img){const url=e.video_url||e.youtube_url||e.trailer_url||e.media_url||'';if(!url)return false;const item={id:e.id||currentEventId,url,titulo:title,title,thumbnail:img||'',content_type:'video',tipo:'video',evento_id:e.id||currentEventId,provider:e.provider||''};const h=shell();if(h?.playContent){h.playContent(item);return true}if(window.parent!==window){try{window.parent.postMessage({type:'uadav:content-play',item},location.origin);return true}catch{}}window.open(url,'_blank','noopener');return true}const price=e=>{if(e.es_gratuito===true)return'Entrada gratuita';const a=e.precio_desde||e.precio,b=e.precio_hasta,c=e.moneda||'ARS';return a&&b?`${c} ${a} – ${b}`:a?`Desde ${c} ${a}`:'Consultar'};function functions(e){const arr=Array.isArray(e.funciones)?e.funciones:[];if(arr.length)return arr;return e.fecha?[{fecha:e.fecha,hora:e.hora||''}]:[]}
function linkBtn(url,label,cls=''){return url?`<a class="btn ${cls}" target="_blank" rel="noopener" href="${esc(url)}">${label}</a>`:''}
async function boot(){const app=document.getElementById('app');if(!id){app.innerHTML='<div class="empty">Evento no especificado.</div>';return}try{const e=await api('evento?id='+encodeURIComponent(id));const img=e.poster||e.imagen||e.portada||FALLBACK,title=e.titulo||e.nombre||'Evento',lead=e.descripcion_corta||String(e.descripcion||'').slice(0,220),meta=[e.fecha_inicio||e.fecha,e.lugar,e.ciudad,e.provincia,e.pais].filter(Boolean).join(' · '),showList=functions(e),gallery=Array.isArray(e.galeria)?e.galeria.filter(Boolean):[];document.title=title+' · ★ UADAV STREAM';const ticket=e.link_compra||e.link_ticketera||'',ownTickets=['uadav','uadav_interest'].includes(String(e.ticketing_mode||'').toLowerCase());const wa=e.whatsapp?('https://wa.me/'+String(e.whatsapp).replace(/\D/g,'')):'';app.innerHTML=`<section class="hero"><div class="bg" style="background-image:url('${esc(e.portada||img)}')"></div><div class="shade"></div><div class="hero-content"><img class="poster" src="${esc(img)}" alt="${esc(title)}" onerror="this.src=FALLBACK"><div class="copy"><div class="eyebrow">${e.destacado_pagado?'★ EVENTO DESTACADO':'CARTELERA · '+esc(e.categoria||'EVENTO')}</div><h1 class="title">${esc(title)}</h1><div class="lead">${esc(lead)}</div><div class="hero-meta">${esc(meta)}</div><div class="actions">${(e.video_url||e.youtube_url||e.trailer_url||e.media_url)?'<button class="btn primary" id="watchEvent">▶ Ver</button>':''}${ownTickets?'<button class="btn primary" type="button" data-open-ticket>🎟 Solicitar entradas</button>':linkBtn(ticket,'🎟 Entradas','primary')}<button class="btn" type="button" data-share-event>↗ Compartir</button>${linkBtn(wa,'WhatsApp')}</div></div></div></section><div class="grid"><div><section class="panel"><h2>Sobre el evento</h2><div class="desc">${esc(e.descripcion||lead||'Sin descripción disponible.')}</div><div class="tags">${e.categoria?`<span class="tag">${esc(e.categoria)}</span>`:''}${e.subcategoria?`<span class="tag">${esc(e.subcategoria)}</span>`:''}${e.es_gratuito===true?'<span class="tag green">Gratis</span>':'<span class="tag">Con entradas</span>'}${e.destacado_pagado?'<span class="tag gold">★ Destacado</span>':''}</div></section>${showList.length?`<section class="panel" style="margin-top:16px"><h2>Fechas y funciones</h2><div class="shows">${showList.map(f=>`<div class="show"><strong>${esc(f.fecha||f.date||'Fecha a confirmar')}</strong><span>${esc(f.hora||f.time||f.horario||'')}</span></div>`).join('')}</div></section>`:''}${gallery.length?`<section class="panel" style="margin-top:16px"><h2>Galería</h2><div class="gallery">${gallery.map(x=>`<img loading="lazy" src="${esc(typeof x==='string'?x:x.url||'')}" alt="${esc(title)}">`).join('')}</div></section>`:''}</div><aside><section class="panel"><h2>Información</h2><div class="details">${e.organizador?`<div class="detail"><div class="label">Organiza</div><div class="value">${esc(e.organizador)}</div></div>`:''}${e.lugar?`<div class="detail"><div class="label">Lugar</div><div class="value">${esc(e.lugar)}</div></div>`:''}${e.direccion?`<div class="detail"><div class="label">Dirección</div><div class="value">${esc(e.direccion)}</div></div>`:''}<div class="detail"><div class="label">Entradas</div><div class="value">${esc(price(e))}${e.ticketera?' · '+esc(e.ticketera):''}</div></div>${e.contacto_email?`<div class="detail"><div class="label">Contacto</div><div class="value"><a href="mailto:${esc(e.contacto_email)}">${esc(e.contacto_email)}</a></div></div>`:''}</div><div class="actions" style="margin-top:14px">${linkBtn(e.instagram,'Instagram')}${linkBtn(e.facebook,'Facebook')}${linkBtn(e.web,'Web')}</div></section></aside></div><section id="relatedMount" class="panel" style="margin-top:16px" hidden><h2>También te puede interesar</h2><div id="relatedGrid" class="related-grid"></div></section>${(ticket||ownTickets)?`<div class="sticky-ticket">${ownTickets?'<button class="btn primary" type="button" data-open-ticket>🎟 Entradas</button>':`<a class="btn primary" target="_blank" rel="noopener" href="${esc(ticket)}">🎟 Entradas</a>`}<button class="btn" type="button" data-share-event>Compartir</button></div>`:''}`;document.getElementById('watchEvent')?.addEventListener('click',()=>playEventMedia(e,title,img));document.querySelectorAll('[data-open-ticket]').forEach(b=>b.addEventListener('click',openTicket));document.querySelectorAll('[data-share-event]').forEach(b=>b.addEventListener('click',shareIt));loadRelated(e).catch(()=>{});const ld={"@context":"https://schema.org","@type":"Event",name:title,startDate:e.fecha_inicio||e.fecha||undefined,endDate:e.fecha_fin||undefined,description:e.descripcion||lead,image:[img],location:e.lugar?{"@type":"Place",name:e.lugar,address:[e.direccion,e.ciudad,e.provincia,e.pais].filter(Boolean).join(', ')}:undefined,organizer:e.organizador?{"@type":"Organization",name:e.organizador}:undefined};const sc=document.createElement('script');sc.type='application/ld+json';sc.textContent=JSON.stringify(ld);document.head.appendChild(sc)}catch(err){app.innerHTML=`<div class="empty"><h2>Evento no disponible</h2><p>${esc(err.message)}</p><a class="btn primary" href="/cartelera.html">Volver a Cartelera</a></div>`}}
async function loadRelated(current){try{const list=await api('cartelera');const arr=Array.isArray(list)?list:[];const cat=String(current.categoria||'').toLowerCase(),city=String(current.ciudad||'').toLowerCase();const rel=arr.filter(x=>String(x.id||'')!==String(current.id||'')&&x.estado!=='oculto').sort((a,b)=>{const sa=(String(a.categoria||'').toLowerCase()===cat?2:0)+(String(a.ciudad||'').toLowerCase()===city?1:0),sb=(String(b.categoria||'').toLowerCase()===cat?2:0)+(String(b.ciudad||'').toLowerCase()===city?1:0);return sb-sa}).slice(0,6);if(!rel.length)return;const mount=document.getElementById('relatedMount'),grid=document.getElementById('relatedGrid');if(!mount||!grid)return;grid.innerHTML=rel.map(x=>`<a class="related-card" data-shell-nav="1" href="/evento.html?id=${encodeURIComponent(x.id||'')}"><img loading="lazy" src="${esc(x.imagen||x.poster||x.portada||FALLBACK)}" alt="${esc(x.titulo||x.nombre||'Evento')}"><div><strong>${esc(x.titulo||x.nombre||'Evento')}</strong><span>${esc([x.fecha_inicio||x.fecha,x.ciudad].filter(Boolean).join(' · '))}</span></div></a>`).join('');mount.hidden=false}catch{}}
document.getElementById('relatedMount')?.addEventListener('click',ev=>{const a=ev.target.closest('a[data-shell-nav]');if(!a)return;const h=shell();if(h?.navigate||window.parent!==window){ev.preventDefault();if(h?.navigate)h.navigate(a.getAttribute('href'));else window.parent.postMessage({type:'uadav:navigate',href:a.getAttribute('href')},location.origin)}}); let currentEventId=id;document.getElementById('ticketClose')?.addEventListener('click',closeTicket);document.getElementById('ticketModal')?.addEventListener('click',e=>{if(e.target.id==='ticketModal')closeTicket()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.getElementById('ticketModal')?.classList.contains('active'))closeTicket()});function openTicket(){document.getElementById('ticketModal')?.classList.add('active')}function closeTicket(){document.getElementById('ticketModal')?.classList.remove('active')}document.getElementById('ticketForm')?.addEventListener('submit',async e=>{e.preventDefault();const st=document.getElementById('ticketStatus'),data=Object.fromEntries(new FormData(e.target));data.event_id=currentEventId;data.quantity=Number(data.quantity||1);st.textContent='Registrando…';try{let err;for(const base of [...new Set([API_REMOTE,...(window.UADAV_USE_LOCAL_API===true?[API_LOCAL]:[])])]){try{const r=await fetch(base+'ticketing/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'No se pudo registrar');st.textContent='✓ Interés registrado. Esto no constituye una entrada ni reserva confirmada; el organizador podrá contactarte.';e.target.reset();return}catch(x){err=x}}throw err}catch(x){st.textContent='No se pudo registrar: '+x.message}});
async function shareIt(){try{if(navigator.share)await navigator.share({title:document.title,url:location.href});else{await navigator.clipboard.writeText(location.href);alert('Enlace copiado')}}catch{}}boot();
