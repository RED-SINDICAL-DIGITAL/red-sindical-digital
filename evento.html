<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Ficha de evento · ★ UADAV STREAM"><title>Evento · ★ UADAV STREAM</title><style>
:root{--bg:#07090d;--panel:#10161f;--line:rgba(255,255,255,.1);--text:#fff;--muted:#98a5b5;--accent:#00e5ff;--purple:#8b5cf6;--gold:#ffd866}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0%,rgba(0,229,255,.09),transparent 28%),#07090d;color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}a{color:inherit;text-decoration:none}.wrap{width:min(1120px,94vw);margin:auto;padding:18px 0 70px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-bottom:18px}.brand{display:flex;align-items:center;gap:10px;font-weight:950}.star{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--purple));color:#061018}.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:rgba(255,255,255,.04);padding:11px 15px;border-radius:12px;font-weight:850}.btn.primary{background:#fff;color:#061018}.hero{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:28px;background:#0c1118;min-height:450px}.hero-bg{position:absolute;inset:0;background-size:cover;background-position:center;filter:blur(8px) saturate(.85);transform:scale(1.06);opacity:.38}.hero-shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(3,7,11,.97),rgba(3,7,11,.62),rgba(3,7,11,.16)),linear-gradient(0deg,rgba(3,7,11,.82),transparent 55%)}.hero-content{position:relative;padding:44px;display:flex;align-items:end;gap:26px;min-height:450px}.poster{width:250px;aspect-ratio:4/5;border-radius:18px;object-fit:cover;border:1px solid rgba(255,255,255,.12);box-shadow:0 20px 55px rgba(0,0,0,.35)}.copy{max-width:650px}.eyebrow{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#9defff;font-weight:900}.title{font-size:clamp(40px,7vw,74px);line-height:.95;letter-spacing:-.05em;margin:10px 0}.meta{color:#c4cedb;line-height:1.55}.desc{color:#b8c4d2;line-height:1.7;margin-top:16px;white-space:pre-line}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.grid{display:grid;grid-template-columns:2fr 1fr;gap:16px;margin-top:18px}.panel{border:1px solid var(--line);border-radius:20px;background:rgba(255,255,255,.025);padding:20px}.panel h2{margin-top:0}.row{display:flex;gap:10px;flex-wrap:wrap}.tag{display:inline-flex;padding:6px 9px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.04);font-size:11px;color:#dce5ef}.detail-list{display:grid;gap:10px}.detail{padding:12px;border-radius:12px;background:rgba(255,255,255,.03);border:1px solid var(--line)}.label{font-size:10px;color:#7f90a4;text-transform:uppercase;letter-spacing:.12em}.value{margin-top:4px}.empty{padding:50px 10px;text-align:center;color:var(--muted)}.footer{margin-top:30px;color:var(--muted);font-size:12px;padding-top:18px;border-top:1px solid var(--line)}@media(max-width:780px){.hero-content{padding:24px;flex-direction:column;align-items:flex-start}.poster{width:180px}.grid{grid-template-columns:1fr}}
</style></head><body><div class="wrap"><header class="top"><a class="brand" href="/index.html"><span class="star">★</span><span>UADAV STREAM</span></a><div class="row"><a class="btn" href="/cartelera.html">← Cartelera</a><a class="btn primary" href="/publicar-evento.html">Publicar evento</a></div></header><div id="app"><div class="empty">Cargando evento…</div></div><div class="footer">★ UADAV STREAM · Cartelera · <a href="/terminos.html">Términos</a> · <a href="/privacidad.html">Privacidad</a></div></div><script>
const API='https://uadav-api.uadavstream.workers.dev/api/';const id=new URLSearchParams(location.search).get('id')||'';const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));async function boot(){const app=document.getElementById('app');if(!id){app.innerHTML='<div class="empty">Evento no especificado.</div>';return}try{const r=await fetch(API+'evento?id='+encodeURIComponent(id),{cache:'no-store'});const e=await r.json();if(!r.ok)throw new Error(e.error||'Evento no encontrado');const img=e.imagen||e.poster||'https://via.placeholder.com/900x1100/0b1017/ffffff?text=UADAV+STREAM';const meta=[e.fecha||e.fecha_inicio,e.lugar,e.direccion,e.ciudad,e.provincia,e.pais].filter(Boolean).join(' · ');app.innerHTML=`<section class="hero"><div class="hero-bg" style="background-image:url('${esc(img)}')"></div><div class="hero-shade"></div><div class="hero-content"><img class="poster" src="${esc(img)}" alt="${esc(e.titulo||e.nombre||'Evento')}" onerror="this.src='https://via.placeholder.com/900x1100/0b1017/ffffff?text=UADAV+STREAM'"><div class="copy"><div class="eyebrow">${e.destacado_pagado?'★ EVENTO DESTACADO':'CARTELERA'}</div><h1 class="title">${esc(e.titulo||e.nombre||'Evento')}</h1><div class="meta">${esc(meta)}</div><div class="actions">${e.link_compra?`<a class="btn primary" target="_blank" rel="noopener" href="${esc(e.link_compra)}">🎟 Comprar / reservar</a>`:''}<button class="btn" onclick="shareIt()">↗ Compartir</button></div></div></div></section><div class="grid"><section class="panel"><h2>Sobre el evento</h2><div class="desc">${esc(e.descripcion||'Sin descripción disponible.')}</div>${e.categoria?`<div class="row" style="margin-top:16px"><span class="tag">${esc(e.categoria)}</span>${e.es_gratuito===true?'<span class="tag">Gratis</span>':'<span class="tag">Con entradas</span>'}</div>`:''}</section><aside class="panel"><h2>Información</h2><div class="detail-list">${e.lugar?`<div class="detail"><div class="label">Lugar</div><div class="value">${esc(e.lugar)}</div></div>`:''}${e.direccion?`<div class="detail"><div class="label">Dirección</div><div class="value">${esc(e.direccion)}</div></div>`:''}${e.fecha?`<div class="detail"><div class="label">Fecha / horario</div><div class="value">${esc(e.fecha)}</div></div>`:''}${e.precio?`<div class="detail"><div class="label">Entradas</div><div class="value">${esc(e.precio)}</div></div>`:''}${e.contacto?`<div class="detail"><div class="label">Contacto</div><div class="value">${esc(e.contacto)}</div></div>`:''}</div></aside></div>`}catch(err){app.innerHTML=`<div class="empty"><h2>Evento no disponible</h2><p>${esc(err.message)}</p><a class="btn primary" href="/cartelera.html">Volver a cartelera</a></div>`}}
async function shareIt(){try{if(navigator.share){await navigator.share({title:document.title,url:location.href})}else{await navigator.clipboard.writeText(location.href);alert('Enlace copiado')}}catch{}}boot();
</script></body></html>
