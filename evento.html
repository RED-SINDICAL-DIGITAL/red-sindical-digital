:root{--bg:#060910;--panel:#101827;--panel2:#151f31;--line:rgba(255,255,255,.09);--text:#fff;--muted:#95a4b8;--accent:#15d9f5;--purple:#8374ff;--gold:#ffc95c;--green:#50dda1}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0%,rgba(21,217,245,.09),transparent 25%),var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}a{color:inherit;text-decoration:none}.shell{width:min(1240px,94vw);margin:auto;padding:18px 0 80px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.brand{display:flex;align-items:center;gap:10px;font-weight:950}.star{width:42px;height:42px;display:grid;place-items:center;border-radius:13px;background:linear-gradient(135deg,var(--accent),var(--purple));color:#061018;font-size:22px}.row,.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:rgba(255,255,255,.045);color:#fff;border-radius:12px;padding:10px 14px;font-weight:850;display:inline-flex;align-items:center;justify-content:center;gap:7px;cursor:pointer}.btn.primary{background:#fff;color:#061018}.btn.accent{background:var(--accent);color:#051116;border-color:transparent}.hero{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:30px;min-height:520px;background:#0b111b}.bg{position:absolute;inset:0;background-size:cover;background-position:center;filter:blur(7px) saturate(.85);transform:scale(1.05);opacity:.34}.shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(4,8,13,.98) 8%,rgba(4,8,13,.75) 52%,rgba(4,8,13,.18)),linear-gradient(0deg,rgba(4,8,13,.88),transparent 54%)}.hero-content{position:relative;min-height:520px;padding:42px;display:flex;align-items:end;gap:28px}.poster{width:270px;aspect-ratio:4/5;border-radius:20px;object-fit:cover;background:#101826;border:1px solid rgba(255,255,255,.12);box-shadow:0 22px 70px rgba(0,0,0,.45)}.copy{max-width:720px}.eyebrow{font-size:10px;letter-spacing:.17em;text-transform:uppercase;color:#8eeafa;font-weight:950}.title{font-size:clamp(42px,7vw,82px);line-height:.92;letter-spacing:-.055em;margin:10px 0 14px}.lead{font-size:15px;line-height:1.6;color:#c4cedb;max-width:650px}.hero-meta{color:#aab7c7;font-size:12px;line-height:1.6;margin-top:9px}.grid{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(300px,.8fr);gap:16px;margin-top:17px}.panel{border:1px solid var(--line);border-radius:21px;background:rgba(255,255,255,.025);padding:21px}.panel h2{margin:0 0 14px;font-size:20px}.desc{white-space:pre-line;color:#bdc8d6;line-height:1.75}.tags{display:flex;gap:7px;flex-wrap:wrap;margin-top:15px}.tag{border:1px solid var(--line);border-radius:999px;padding:6px 9px;font-size:10px;font-weight:800;color:#cdd7e3}.tag.gold{border-color:rgba(255,201,92,.35);color:#ffe1a0}.tag.green{border-color:rgba(80,221,161,.35);color:#8cf0bd}.details{display:grid;gap:9px}.detail{padding:12px 13px;background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:13px}.label{font-size:9px;text-transform:uppercase;letter-spacing:.13em;color:#75859a;font-weight:900}.value{margin-top:4px;font-size:13px;line-height:1.45}.shows{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.show{padding:12px;border-radius:13px;background:#0b1320;border:1px solid var(--line)}.show strong{display:block;font-size:13px}.show span{font-size:11px;color:var(--muted)}.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.gallery img{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:12px}.footer{margin-top:35px;padding-top:20px;border-top:1px solid var(--line);color:var(--muted);font-size:11px}.empty{padding:70px 10px;text-align:center;color:var(--muted)}@media(max-width:820px){.hero{min-height:0}.hero-content{min-height:0;padding:24px;flex-direction:column;align-items:flex-start}.poster{width:190px}.grid{grid-template-columns:1fr}.title{font-size:48px}.shows{grid-template-columns:1fr}.gallery{grid-template-columns:repeat(2,1fr)}}@media(max-width:480px){.shell{width:calc(100% - 24px)}.top .row .btn.primary{display:none}.hero{border-radius:22px}.hero-content{padding:20px}.poster{width:150px}.title{font-size:39px}.actions{display:grid;grid-template-columns:1fr 1fr;width:100%}.actions .btn:first-child{grid-column:1/-1}.gallery{grid-template-columns:1fr}}

</head><body><main class="shell"><header class="top"><a class="brand" href="/"><span class="star">★</span><span>UADAV STREAM</span></a><div class="row"><a class="btn" href="/cartelera.html">← Cartelera</a><a class="btn primary" href="/publicar-evento.html">Publicar evento</a></div></header><div id="app"><div class="empty">Cargando evento…</div></div><footer class="footer">★ UADAV STREAM · <a href="/terminos.html">Términos</a> · <a href="/privacidad.html">Privacidad</a></footer></main><script>
const API_REMOTE=window.UADAV_API_BASE||'https://uadav-api.uadavstream.workers.dev/api/',API_LOCAL=location.origin+'/api/',id=new URLSearchParams(location.search).get('id')||'';const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const FALLBACK='data:image/svg+xml;charset=UTF-8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000"><rect width="100%" height="100%" fill="#101824"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" fill="#8190a4" font-family="Arial" font-size="30">★ UADAV STREAM</text></svg>');
async function api(path){let err;for(const base of [...new Set([API_REMOTE,...(window.UADAV_USE_LOCAL_API===true?[API_LOCAL]:[])])]){try{const r=await fetch(base+path+(path.includes('?')?'&':'?')+'_='+Date.now(),{cache:'no-store'});const ct=r.headers.get('content-type')||'';if(!r.ok||!ct.includes('json')){err=new Error('API '+r.status);continue}return await r.json()}catch(e){err=e}}throw err||new Error('No disponible')}
const price=e=>{if(e.es_gratuito===true)return'Entrada gratuita';const a=e.precio_desde||e.precio,b=e.precio_hasta,c=e.moneda||'ARS';return a&&b?`${c} ${a} – ${b}`:a?`Desde ${c} ${a}`:'Consultar'};function functions(e){const arr=Array.isArray(e.funciones)?e.funciones:[];if(arr.length)return arr;return e.fecha?[{fecha:e.fecha,hora:e.hora||''}]:[]}
function linkBtn(url,label,cls=''){return url?`<a class="btn ${cls}" target="_blank" rel="noopener" href="${esc(url)}">${label}</a>`:''}
async function boot(){const app=document.getElementById('app');if(!id){app.innerHTML='<div class="empty">Evento no especificado.</div>';return}try{const e=await api('evento?id='+encodeURIComponent(id));const img=e.poster||e.imagen||e.portada||FALLBACK,title=e.titulo||e.nombre||'Evento',lead=e.descripcion_corta||String(e.descripcion||'').slice(0,220),meta=[e.fecha_inicio||e.fecha,e.lugar,e.ciudad,e.provincia,e.pais].filter(Boolean).join(' · '),showList=functions(e),gallery=Array.isArray(e.galeria)?e.galeria.filter(Boolean):[];document.title=title+' · ★ UADAV STREAM';const ticket=e.link_compra||e.link_ticketera||'';const wa=e.whatsapp?('https://wa.me/'+String(e.whatsapp).replace(/\D/g,'')):'';app.innerHTML=`<section class="hero"><div class="bg" style="background-image:url('${esc(e.portada||img)}')"></div><div class="shade"></div><div class="hero-content"><img class="poster" src="${esc(img)}" alt="${esc(title)}" onerror="this.src=FALLBACK"><div class="copy"><div class="eyebrow">${e.destacado_pagado?'★ EVENTO DESTACADO':'CARTELERA · '+esc(e.categoria||'EVENTO')}</div><h1 class="title">${esc(title)}</h1><div class="lead">${esc(lead)}</div><div class="hero-meta">${esc(meta)}</div><div class="actions">${linkBtn(ticket,'🎟 Entradas','primary')}<button class="btn" onclick="shareIt()">↗ Compartir</button>${linkBtn(wa,'WhatsApp')}</div></div></div></section><div class="grid"><div><section class="panel"><h2>Sobre el evento</h2><div class="desc">${esc(e.descripcion||lead||'Sin descripción disponible.')}</div><div class="tags">${e.categoria?`<span class="tag">${esc(e.categoria)}</span>`:''}${e.subcategoria?`<span class="tag">${esc(e.subcategoria)}</span>`:''}${e.es_gratuito===true?'<span class="tag green">Gratis</span>':'<span class="tag">Con entradas</span>'}${e.destacado_pagado?'<span class="tag gold">★ Destacado</span>':''}</div></section>${showList.length?`<section class="panel" style="margin-top:16px"><h2>Fechas y funciones</h2><div class="shows">${showList.map(f=>`<div class="show"><strong>${esc(f.fecha||f.date||'Fecha a confirmar')}</strong><span>${esc(f.hora||f.time||f.horario||'')}</span></div>`).join('')}</div></section>`:''}${gallery.length?`<section class="panel" style="margin-top:16px"><h2>Galería</h2><div class="gallery">${gallery.map(x=>`<img loading="lazy" src="${esc(typeof x==='string'?x:x.url||'')}" alt="${esc(title)}">`).join('')}</div></section>`:''}</div><aside><section class="panel"><h2>Información</h2><div class="details">${e.organizador?`<div class="detail"><div class="label">Organiza</div><div class="value">${esc(e.organizador)}</div></div>`:''}${e.lugar?`<div class="detail"><div class="label">Lugar</div><div class="value">${esc(e.lugar)}</div></div>`:''}${e.direccion?`<div class="detail"><div class="label">Dirección</div><div class="value">${esc(e.direccion)}</div></div>`:''}<div class="detail"><div class="label">Entradas</div><div class="value">${esc(price(e))}${e.ticketera?' · '+esc(e.ticketera):''}</div></div>${e.contacto_email?`<div class="detail"><div class="label">Contacto</div><div class="value"><a href="mailto:${esc(e.contacto_email)}">${esc(e.contacto_email)}</a></div></div>`:''}</div><div class="actions" style="margin-top:14px">${linkBtn(e.instagram,'Instagram')}${linkBtn(e.facebook,'Facebook')}${linkBtn(e.web,'Web')}</div></section></aside></div>`;const ld={"@context":"https://schema.org","@type":"Event",name:title,startDate:e.fecha_inicio||e.fecha||undefined,endDate:e.fecha_fin||undefined,description:e.descripcion||lead,image:[img],location:e.lugar?{"@type":"Place",name:e.lugar,address:[e.direccion,e.ciudad,e.provincia,e.pais].filter(Boolean).join(', ')}:undefined,organizer:e.organizador?{"@type":"Organization",name:e.organizador}:undefined};const sc=document.createElement('script');sc.type='application/ld+json';sc.textContent=JSON.stringify(ld);document.head.appendChild(sc)}catch(err){app.innerHTML=`<div class="empty"><h2>Evento no disponible</h2><p>${esc(err.message)}</p><a class="btn primary" href="/cartelera.html">Volver a Cartelera</a></div>`}}
async function shareIt(){try{if(navigator.share)await navigator.share({title:document.title,url:location.href});else{await navigator.clipboard.writeText(location.href);alert('Enlace copiado')}}catch{}}boot();
</script><script src="/uadav-shell-bridge.js"></script></body></html>
