<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Control - UADAV STREAM</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: { uadav: { accent: '#00e5ff', dark: '#050505', card: '#0f0f13', border: '#1f1f26' } }, fontFamily: { sans: ['Outfit', 'sans-serif'] } } } }
  </script>
  <style>
    body { background-color: #050505; color: #E2E8F0; font-family: 'Outfit', sans-serif; }
    input, textarea, select { background: #0a0a0c; border: 1px solid #1f1f26; border-radius: 8px; padding: 8px; width: 100%; color: white; margin-bottom: 8px; }
    label { font-size: 11px; text-transform: uppercase; color: #64748b; margin-bottom: 4px; display: block; }
    .btn { padding: 8px 16px; border-radius: 8px; font-weight: 700; font-size: 12px; cursor: pointer; }
    .btn-save { background: #00e5ff; color: #050505; }
    .btn-del { background: #dc2626; color: white; }
    .btn-edit { background: #3b82f6; color: white; }
    .item-box { background: #0f0f13; border: 1px solid #1f1f26; padding: 15px; border-radius: 12px; margin-bottom: 10px; }
  </style>
</head>
<body class="p-4 sm:p-8 min-h-screen">
  <div class="max-w-5xl mx-auto">
    <div class="flex justify-between items-center mb-8 border-b border-uadav-border pb-4">
      <h1 class="text-2xl font-black text-white">UADAV <span class="text-uadav-accent">STREAM</span> - Panel Admin</h1>
      <div class="flex gap-2">
        <input type="password" id="adminKeyInput" placeholder="Pegar ADMIN_KEY..." class="w-64">
        <button onclick="conectar()" class="btn bg-uadav-accent text-black">Conectar</button>
      </div>
    </div>

    <div id="panelContent" class="hidden space-y-8">
      
      <!-- Gestor de Secciones -->
      <div class="border border-uadav-border rounded-xl p-4">
        <h2 class="text-xl font-black mb-4 text-uadav-accent">Gestor de Secciones</h2>
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-4">
          <div><label>ID (sin espacios)</label><input id="nuevoSecId" placeholder="humor"></div>
          <div><label>Nombre Visible</label><input id="nuevoSecNombre" placeholder="Humoristas"></div>
          <div><label>Icono (FontAwesome)</label><input id="nuevoSecIcono" placeholder="fa-face-laugh"></div>
          <div><label>Query (si es Auto)</label><input id="nuevoSecQuery" placeholder="humoristas en vivo"></div>
        </div>
        <button onclick="agregarNuevaSeccion()" class="btn btn-save mb-4">+ Agregar Sección</button>
        <div id="seccionesList" class="space-y-2"></div>
      </div>

      <!-- Gestor de Radios -->
      <div class="border border-uadav-border rounded-xl p-4">
        <h2 class="text-xl font-black mb-4 text-uadav-accent">Gestor de Radios</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
          <div><label>Nombre Radio</label><input id="radioNombre" placeholder="Beat Digital Radio"></div>
          <div><label>URL del Stream</label><input id="radioStream" placeholder="https://stream.zeno.fm/..."></div>
          <div><label>Logo / Carátula</label><input id="radioLogo" placeholder="https://..."></div>
          <div><label>Ubicación</label><input id="radioUbicacion" placeholder="Rosario, AR"></div>
          <div><label>Bitrate</label><input id="radioBitrate" placeholder="320 kbps"></div>
          <div><label>Descripción</label><input id="radioDesc" placeholder="Música 24/7"></div>
          <div><label>Tema Actual (Metadato)</label><input id="radioTema" placeholder="Midnight City"></div>
          <div><label>Artista Actual (Metadato)</label><input id="radioArtista" placeholder="M83"></div>
          <div><label>¿Emisora Oficial?</label><select id="radioOficial"><option value="true">Sí</option><option value="false">No</option></select></div>
        </div>
        <button onclick="guardarRadio()" class="btn btn-save mb-4">Agregar/Actualizar Radio</button>
        <div id="radiosList"></div>
      </div>

      <!-- Gestor de Señales LIVE -->
      <div class="border border-uadav-border rounded-xl p-4">
        <h2 class="text-xl font-black mb-4 text-uadav-accent">Gestor de Señales (Live Stream)</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
          <div><label>Nombre de la Señal</label><input id="senalNombre" placeholder="SEÑAL OFICIAL UADAVSTREAM TV"></div>
          <div><label>URL (YouTube, Twitch, Kick, OK, RTMP)</label><input id="senalUrl" placeholder="https://www.youtube.com/watch?v=..."></div>
          <div><label>Logo</label><input id="senalLogo" placeholder="https://..."></div>
          <div><label>Tipo</label><select id="senalTipo"><option value="youtube">YouTube</option><option value="twitch">Twitch</option><option value="kick">Kick</option><option value="okru">OK.ru</option><option value="hls">RTMP/HLS</option><option value="audio">Audio (Radio)</option></select></div>
          <div><label>Descripción</label><input id="senalDesc" placeholder="Transmisión oficial 24/7"></div>
          <div><label>¿Señal Principal?</label><select id="senalPrincipal"><option value="true">Sí</option><option value="false">No</option></select></div>
        </div>
        <button onclick="guardarSenal()" class="btn btn-save mb-4">Agregar/Actualizar Señal</button>
        <div id="senalesList"></div>
      </div>

      <!-- Configuración del Hero (Portada) -->
      <div class="border border-uadav-border rounded-xl p-4">
        <h2 class="text-xl font-black mb-4 text-uadav-accent">Configuración del Hero (Portada)</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div><label>Título Grande</label><input id="heroTitulo" placeholder="SEÑAL OFICIAL"></div>
          <div><label>Subtítulo (Color Neón)</label><input id="heroSubTitulo" placeholder="UADAVSTREAM TV"></div>
          <div class="md:col-span-2"><label>Texto de Apoyo</label><textarea id="heroTexto" rows="2" placeholder="Sintoniza nuestra transmisión..."></textarea></div>
          <div><label>Texto Botón 1</label><input id="heroBoton1Texto" placeholder="Ver SEÑAL OFICIAL"></div>
          <div><label>URL Botón 1</label><input id="heroBoton1Url" placeholder="https://..."></div>
          <div><label>Texto Botón 2 (Vacío para ocultar)</label><input id="heroBoton2Texto" placeholder=""></div>
          <div><label>URL Botón 2</label><input id="heroBoton2Url" placeholder=""></div>
        </div>
        <button onclick="guardarHero()" class="btn btn-save mt-4">Guardar Hero</button>
      </div>

      <!-- Configuración General -->
      <div class="border border-uadav-border rounded-xl p-4">
        <h2 class="text-xl font-black mb-4 text-uadav-accent">Configuración General</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
           <div><label>País Tendencias</label><input id="configPais" placeholder="Auto"></div>
           <div><label>Mostrar País (IP)</label><select id="configShowCountry"><option value="true">Sí</option><option value="false">No</option></select></div>
           <div><label>Contador Base</label><input type="number" id="configVisitas" placeholder="0"></div>
           <div class="md:col-span-2"><label>Texto Legal</label><textarea id="configLegal" rows="3">UADAV STREAM es un desarrollo de Beat Digital Medios.</textarea></div>
        </div>
        <button onclick="guardarConfig()" class="btn btn-save mt-4">Guardar Configuración</button>
      </div>

      <div class="fixed bottom-4 right-4">
        <button onclick="guardarTodo()" class="btn btn-save text-base shadow-2xl px-6 py-4">GUARDAR CAMBIOS EN LA NUBE</button>
      </div>
    </div>
  </div>

  <script>
    const API_URL = 'https://uadav-api.uadavstream.workers.dev/api/';
    let ADMIN_KEY = '';
    let seccionesData = [], radiosData = [], senalesData = [], artistasData = [], editandoId = null;

    function conectar() {
      ADMIN_KEY = document.getElementById('adminKeyInput').value;
      if (!ADMIN_KEY) return alert("Poné la clave");
      
      fetch(API_URL + 'secciones').then(r => r.json()).then(data => {
        document.getElementById('panelContent').classList.remove('hidden');
        seccionesData = data; renderSecciones();
        
        fetch(API_URL + 'radios').then(r => r.json()).then(renderRadios);
        fetch(API_URL + 'senales_oficiales').then(r => r.json()).then(renderSenales);
        fetch(API_URL + 'artistas_uadav').then(r => r.json()).then(renderArtistas);
        fetch(API_URL + 'config').then(r => r.json()).then(renderConfig);
        fetch(API_URL + 'contadores').then(r => r.json()).then(c => { document.getElementById('configVisitas').value = c.visitas_totales || 0; });
      }).catch(err => alert("Error: " + err));
    }

    // === RADIOS ===
    function renderRadios(data) {
      radiosData = data || [];
      const list = document.getElementById('radiosList'); list.innerHTML = '';
      radiosData.forEach(r => {
        list.innerHTML += `<div class="item-box flex justify-between"><div><h4 class="font-bold">${r.nombre}</h4><p class="text-xs">${r.tema_actual || 'Sin tema'}</p></div><div class="flex gap-2"><button onclick="editarRadio('${r.id}')" class="btn btn-edit">Editar</button><button onclick="eliminarRadio('${r.id}')" class="btn btn-del">Eliminar</button></div></div>`;
      });
    }

    function editarRadio(id) {
      const r = radiosData.find(x => x.id === id); if (!r) return;
      document.getElementById('radioNombre').value = r.nombre;
      document.getElementById('radioStream').value = r.stream_url;
      document.getElementById('radioLogo').value = r.logo;
      document.getElementById('radioUbicacion').value = r.ubicacion || '';
      document.getElementById('radioBitrate').value = r.bitrate || '';
      document.getElementById('radioDesc').value = r.descripcion || '';
      document.getElementById('radioTema').value = r.tema_actual || '';
      document.getElementById('radioArtista').value = r.artista_actual || '';
      document.getElementById('radioOficial').value = r.es_oficial ? 'true' : 'false';
    }

    function eliminarRadio(id) {
      if (!confirm("¿Eliminar radio?")) return;
      radiosData = radiosData.filter(r => r.id !== id);
      renderRadios(radiosData);
    }

    function guardarRadio() {
      const id = editandoRadioId || 'radio-' + Date.now();
      const nuevaRadio = { id, nombre: document.getElementById('radioNombre').value, stream_url: document.getElementById('radioStream').value, logo: document.getElementById('radioLogo').value, ubicacion: document.getElementById('radioUbicacion').value, bitrate: document.getElementById('radioBitrate').value, descripcion: document.getElementById('radioDesc').value, tema_actual: document.getElementById('radioTema').value, artista_actual: document.getElementById('radioArtista').value, es_oficial: document.getElementById('radioOficial').value === 'true' };
      const index = radiosData.findIndex(r => r.id === id);
      if (index !== -1) radiosData[index] = nuevaRadio; else radiosData.push(nuevaRadio);
      renderRadios(radiosData);
      alert("Radio guardada.");
    }

    // === SEÑALES ===
    function renderSenales(data) {
      senalesData = data || [];
      const list = document.getElementById('senalesList'); list.innerHTML = '';
      senalesData.forEach(s => {
        list.innerHTML += `<div class="item-box flex justify-between"><div><h4 class="font-bold">${s.nombre}</h4><p class="text-xs">${s.tipo} - ${s.descripcion || ''}</p></div><div class="flex gap-2"><button onclick="editarSenal('${s.id}')" class="btn btn-edit">Editar</button><button onclick="eliminarSenal('${s.id}')" class="btn btn-del">Eliminar</button></div></div>`;
      });
    }

    function editarSenal(id) {
      const s = senalesData.find(x => x.id === id); if (!s) return;
      document.getElementById('senalNombre').value = s.nombre;
      document.getElementById('senalUrl').value = s.url;
      document.getElementById('senalLogo').value = s.logo;
      document.getElementById('senalTipo').value = s.tipo;
      document.getElementById('senalDesc').value = s.descripcion || '';
      document.getElementById('senalPrincipal').value = s.es_principal ? 'true' : 'false';
    }

    function eliminarSenal(id) {
      if (!confirm("¿Eliminar señal?")) return;
      senalesData = senalesData.filter(s => s.id !== id);
      renderSenales(senalesData);
    }

    function guardarSenal() {
      const id = 'senal-' + Date.now();
      const nuevaSenal = { id, nombre: document.getElementById('senalNombre').value, url: document.getElementById('senalUrl').value, logo: document.getElementById('senalLogo').value, tipo: document.getElementById('senalTipo').value, descripcion: document.getElementById('senalDesc').value, es_principal: document.getElementById('senalPrincipal').value === 'true' };
      senalesData.push(nuevaSenal);
      renderSenales(senalesData);
      alert("Señal agregada.");
    }

    // === SECCIONES ===
    function agregarNuevaSeccion() {
      const id = document.getElementById('nuevoSecId').value.trim();
      const nombre = document.getElementById('nuevoSecNombre').value.trim();
      const icono = document.getElementById('nuevoSecIcono').value.trim() || 'fa-circle';
      const query = document.getElementById('nuevoSecQuery').value.trim();
      if (!id || !nombre) return alert("Poné el ID y el Nombre");
      if (seccionesData.find(s => s.id === id)) return alert("Ya existe");
      seccionesData.push({ id, nombre, icono, activa: true, modo: 'auto', query, ids_manuales: [] });
      renderSecciones();
    }

    function renderSecciones() {
      const list = document.getElementById('seccionesList'); list.innerHTML = '';
      seccionesData.forEach((sec, index) => {
        list.innerHTML += `<div class="item-box">
          <div class="flex justify-between items-center mb-2"><span class="font-bold"><i class="fa-solid ${sec.icono || 'fa-circle'} text-uadav-accent mr-2"></i>${sec.nombre}</span><label><input type="checkbox" ${sec.activa ? 'checked' : ''} onchange="seccionesData[${index}].activa = this.checked"> Activa</label></div>
          <div class="grid grid-cols-3 gap-2">
            <div><label>Modo</label><select onchange="seccionesData[${index}].modo = this.value"><option value="auto" ${sec.modo === 'auto' ? 'selected' : ''}>Auto</option><option value="manual" ${sec.modo === 'manual' ? 'selected' : ''}>Manual</option></select></div>
            <div><label>Query</label><input value="${sec.query || ''}" oninput="seccionesData[${index}].query = this.value"></div>
            <div><label>IDs</label><input value="${(sec.ids_manuales || []).join(',')}" oninput="seccionesData[${index}].ids_manuales = this.value.split(',').map(i => i.trim()).filter(i => i)"></div>
          </div>
        </div>`;
      });
    }

    // === ARTISTAS ===
    function renderArtistas(data) {
      artistasData = data || [];
      const list = document.getElementById('artistasList'); list.innerHTML = '';
      artistasData.forEach(a => {
        list.innerHTML += `<div class="item-box flex justify-between"><div><h4 class="font-bold">${a.nombre}</h4><p class="text-xs">${a.rubro || ''}</p></div><div><button onclick="eliminarArtista('${a.id}')" class="btn btn-del">Eliminar</button></div></div>`;
      });
    }

    function eliminarArtista(id) {
      if (!confirm("¿Eliminar artista?")) return;
      artistasData = artistasData.filter(a => a.id !== id);
      renderArtistas(artistasData);
    }

    // === HERO ===
    function renderConfig(data) {
      document.getElementById('heroTitulo').value = data.hero_titulo || '';
      document.getElementById('heroSubTitulo').value = data.hero_subtitulo || '';
      document.getElementById('heroTexto').value = data.hero_texto || '';
      document.getElementById('heroBoton1Texto').value = data.boton_1_texto || '';
      document.getElementById('heroBoton1Url').value = data.boton_1_url || '';
      document.getElementById('heroBoton2Texto').value = data.boton_2_texto || '';
      document.getElementById('heroBoton2Url').value = data.boton_2_url || '';
      document.getElementById('configPais').value = data.pais_trending || 'Auto';
      document.getElementById('configShowCountry').value = data.mostrar_ip ? 'true' : 'false';
      document.getElementById('configLegal').value = data.texto_legal || '';
    }

    function guardarHero() {
      const config = {
        hero_titulo: document.getElementById('heroTitulo').value,
        hero_subtitulo: document.getElementById('heroSubTitulo').value,
        hero_texto: document.getElementById('heroTexto').value,
        boton_1_texto: document.getElementById('heroBoton1Texto').value,
        boton_1_url: document.getElementById('heroBoton1Url').value,
        boton_2_texto: document.getElementById('heroBoton2Texto').value,
        boton_2_url: document.getElementById('heroBoton2Url').value,
        pais_trending: document.getElementById('configPais').value.trim() || 'Auto',
        mostrar_ip: document.getElementById('configShowCountry').value === 'true',
        texto_legal: document.getElementById('configLegal').value
      };
      fetch(API_URL + 'config', { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + ADMIN_KEY }, body: JSON.stringify(config) })
      .then(() => alert("Hero guardado correctamente."));
    }

    function guardarConfig() {
      const config = {
        pais_trending: document.getElementById('configPais').value.trim() || 'Auto',
        mostrar_ip: document.getElementById('configShowCountry').value === 'true',
        texto_legal: document.getElementById('configLegal').value
      };
      fetch(API_URL + 'config', { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + ADMIN_KEY }, body: JSON.stringify(config) })
      .then(() => {
        const contadores = { visitas_totales: parseInt(document.getElementById('configVisitas').value) || 0, descargas_app: 0 };
        return fetch(API_URL + 'contadores', { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + ADMIN_KEY }, body: JSON.stringify(contadores) });
      }).then(() => alert("Configuración guardada"));
    }

    function guardarTodo() {
      if (!ADMIN_KEY) return alert("Conectate primero");
      guardarConfig();
      fetch(API_URL + 'secciones', { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + ADMIN_KEY }, body: JSON.stringify(seccionesData) });
      fetch(API_URL + 'radios', { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + ADMIN_KEY }, body: JSON.stringify(radiosData) });
      fetch(API_URL + 'senales_oficiales', { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + ADMIN_KEY }, body: JSON.stringify(senalesData) });
      fetch(API_URL + 'artistas_uadav', { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + ADMIN_KEY }, body: JSON.stringify(artistasData) }).then(() => alert("✅ Todo guardado en la nube"));
    }
  </script>
</body>
</html>
