<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Ultra UADAVSTREAM</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background: #050505; color: #E2E8F0; font-family: 'Outfit', sans-serif; }
    input, textarea, select { background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 10px; width: 100%; color: white; margin-bottom: 10px; }
    label { font-size: 11px; text-transform: uppercase; color: #94a3b8; margin-bottom: 4px; display: block; font-weight: 700; }
    .btn { padding: 10px 16px; border-radius: 10px; font-weight: 700; font-size: 12px; cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; gap: 6px; border: none; }
    .btn-save { background: #00e5ff; color: #050505; }
    .btn-del { background: #ef4444; color: white; }
    .btn-edit { background: #3b82f6; color: white; }
    .btn-move { background: #334155; color: white; }
    .item-box { background: #1e293b; border: 1px solid #334155; padding: 16px; border-radius: 12px; margin-bottom: 12px; }
    .content-video-box { background: #0f172a; border: 1px solid #334155; border-radius: 10px; padding: 10px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
    details { margin-bottom: 20px; border: 1px solid #334155; border-radius: 16px; background: #1e293b; padding: 10px; }
    summary { font-weight: 800; cursor: pointer; color: #00e5ff; font-size: 18px; padding: 10px; display: flex; align-items: center; gap: 10px; }
    .pro-header { background: #0f172a; border-bottom: 1px solid #334155; position: sticky; top: 0; z-index: 50; padding: 10px; border-radius: 16px; margin-bottom: 10px; }
    .status-msg { font-size: 12px; margin-top: 6px; padding: 6px; border-radius: 6px; }
    .status-msg.success { background: #064e3b; color: #6ee7b7; }
    .status-msg.error { background: #7f1d1d; color: #fca5a5; }
  </style>
</head>
<body class="p-4 sm:p-8 min-h-screen">
  <div class="max-w-6xl mx-auto">
    <div class="pro-header flex justify-between items-center mb-8">
      <h1 class="text-2xl font-black text-white">UADAV <span class="text-[#00e5ff]">STREAM</span> <span class="text-sm bg-slate-800 px-2 py-1 rounded-full">Panel Ultra</span></h1>
      <div class="flex gap-2">
        <input type="password" id="adminKeyInput" placeholder="Clave Admin" class="w-64" onkeydown="if(event.key === 'Enter') conectar()">
        <button onclick="conectar()" class="btn btn-save"><i class="fa-solid fa-unlock"></i> Conectar</button>
        <button onclick="desconectar()" id="btnLogout" class="btn btn-del hidden"><i class="fa-solid fa-right-from-bracket"></i> Cerrar sesión</button>
      </div>
    </div>

    <div id="panelContent" class="hidden space-y-6">

      <!-- 0. NUEVA SECCIÓN: ESTADO DEL SITIO -->
      <details open>
        <summary><i class="fa-solid fa-gear text-2xl"></i> Estado del Sitio (Normal, Mantenimiento, Landing)</summary>
        <div class="p-4">
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label>Modo Sitio</label>
              <select id="estadoModo" onchange="toggleEstadoCampos()">
                <option value="normal">Normal (Web App Completa)</option>
                <option value="mantenimiento">Mantenimiento (En Construcción)</option>
                <option value="landing">Landing (Redirigir a otra URL)</option>
              </select>
            </div>
            <div id="landingUrlDiv" style="display:none;">
              <label>URL de Landing</label>
              <input id="estadoLandingUrl" placeholder="https://...">
            </div>
          </div>
          <button onclick="guardarEstadoSitio()" class="btn btn-save mt-4">Guardar Estado</button>
          <div id="estadoStatus" class="status-msg mt-2"></div>
        </div>
      </details>

      <!-- 1. SECCIONES DINÁMICAS -->
      <details>
        <summary><i class="fa-solid fa-layer-group text-2xl"></i> Secciones Dinámicas y Contenido</summary>
        <div class="p-4">
          <div class="grid grid-cols-1 md:grid-cols-5 gap-4 mb-6 p-4 bg-slate-900/50 rounded-xl">
            <div><label>ID (sin espacios)</label><input id="nuevoSecId" placeholder="teatros"></div>
            <div><label>Nombre</label><input id="nuevoSecNombre" placeholder="Teatros"></div>
            <div><label>Ícono</label><input id="nuevoSecIcono" placeholder="fa-masks-theater"></div>
            <div><label>Tipo de Contenido</label>
              <select id="nuevoSecTipo">
                <option value="videos">Videos / Playlists</option>
                <option value="perfiles">Perfiles (Artistas, Teatros, Circos)</option>
                <option value="eventos">Eventos / Cartelera</option>
              </select>
            </div>
            <div><label>Query Auto</label><input id="nuevoSecQuery" placeholder="obras de teatro"></div>
            <div class="md:col-span-5"><button onclick="agregarNuevaSeccion()" class="btn btn-save">+ Agregar Sección</button></div>
          </div>
          <div id="seccionesList" class="space-y-2"></div>
          <hr class="border-slate-700 my-6">
          <div class="font-bold text-white mb-4 text-lg">🎬 Agregar / Editar Contenido</div>
          <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4 p-4 bg-slate-900/50 rounded-xl">
            <div class="md:col-span-2"><label>Seleccionar Sección</label><select id="selectSeccionManual" onchange="actualizarFormularioYLista()"></select></div>
            <div id="divTipoContenido"><label>Tipo de Video</label><select id="tipoContenido" onchange="toggleCamposDinamicos()"><option value="youtube">YouTube</option><option value="mp4">MP4 / URL</option><option value="m3u8">M3U8</option><option value="twitch">Twitch</option><option value="kick">Kick</option></select></div>
            <div id="camposArtista" class="hidden md:col-span-3 grid grid-cols-1 md:grid-cols-2 gap-4">
              <div><label>Nombre</label><input id="artNombre" placeholder="URO"></div><div><label>Rubro</label><input id="artRubro" placeholder="Música"></div>
              <div><label>Foto URL</label><input id="artFoto" placeholder="https://..."></div><div><label>Bio</label><textarea id="artBio"></textarea></div>
              <div><label>ID Canal YouTube</label><input id="artCanal" placeholder="UC..."></div><div><label>Contacto</label><input id="artContacto" placeholder="341..."></div>
              <div class="md:col-span-2"><button onclick="cargarCanalMasivo()" class="btn btn-edit w-full">🚀 Importar Perfil y Videos</button></div>
            </div>
            <div id="camposCartelera" class="hidden md:col-span-3 grid grid-cols-1 md:grid-cols-3 gap-4">
              <div><label>Nombre Evento</label><input id="evNombre" placeholder="Obra"></div><div><label>Fecha</label><input id="evFecha" placeholder="15/08/2026"></div>
              <div><label>Lugar</label><input id="evLugar" placeholder="Teatro"></div><div class="md:col-span-2"><label>Imagen</label><input id="evImg" placeholder="https://..."></div>
              <div><label>Trailer ID</label><input id="evTrailer" placeholder="dQw4w9WgXcQ"></div><div><label>Precio</label><input id="evPrecio" placeholder="15000"></div>
              <div><label>Link Compra</label><input id="evLink" placeholder="https://..."></div><div class="md:col-span-3"><label>Descripción</label><input id="evDesc" placeholder="Único show"></div>
            </div>
            <div id="camposVideo" class="grid md:col-span-3 grid-cols-1 md:grid-cols-2 gap-4">
              <div class="md:col-span-2"><label>URL o ID</label><input id="vidUrl" placeholder="dQw4w9WgXcQ"></div>
              <div><label>Título</label><input id="vidTitulo" placeholder="Opcional"></div><div><label>Imagen</label><input id="vidImg" placeholder="Opcional"></div>
            </div>
            <div class="md:col-span-3 flex gap-2">
              <button onclick="agregarItem()" id="btnAgregarItem" class="btn btn-edit w-full">➕ Agregar</button>
              <button onclick="cancelarEdicion()" id="btnCancelarEdicion" class="btn btn-del w-1/3 hidden">✕ Cancelar</button>
            </div>
          </div>
          <div id="contenidoManualList" class="space-y-2"></div>
        </div>
      </details>

      <!-- 2. APARIENCIA Y BANNERS -->
      <details>
        <summary><i class="fa-solid fa-palette text-2xl"></i> Apariencia y Banners</summary>
        <div class="p-4">
           <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div><label>Título Sitio</label><input id="marcaTitulo" placeholder="UADAVSTREAM"></div>
              <div><label>Eslogan</label><input id="marcaEslogan" placeholder="Teatro y Espectáculos"></div>
              <div><label>Color Acento</label><input type="color" id="marcaColorAcento" value="#00e5ff"></div>
              <div><label>Color Fondo</label><input type="color" id="marcaColorFondo" value="#050505"></div>
           </div>
           <div class="grid grid-cols-1 gap-4 mt-4">
              <div><label>Banner Superior</label><textarea id="bannerTopHTML" rows="2"></textarea></div>
              <div><label>Banner Intermedio</label><textarea id="bannerInfeedHTML" rows="2"></textarea></div>
              <div><label>Banner Footer</label><textarea id="bannerFooterHTML" rows="2"></textarea></div>
           </div>
           <button onclick="guardarExtras()" class="btn btn-save mt-4">Guardar Apariencia</button>
        </div>
      </details>

      <!-- 3. FOOTER Y REDES -->
      <details>
        <summary><i class="fa-solid fa-shoe-prints text-2xl"></i> Footer y Redes Sociales</summary>
        <div class="p-4">
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div><label>Título Principal del Footer</label><input id="footerTitulo" placeholder="Disfrutá UADAVSTREAM"></div>
            <div><label>Subtítulo</label><input id="footerSubtitulo" placeholder="El mejor teatro y música."></div>
            <div class="md:col-span-2"><label>Texto de Copyright</label><input id="footerCopyright" placeholder="© 2026 UADAVSTREAM"></div>
          </div>
          <hr class="border-slate-700 my-4">
          <h3 class="text-white font-bold mb-2">Redes Sociales</h3>
          <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div><label>Instagram</label><input id="redInstagram"></div>
            <div><label>Facebook</label><input id="redFacebook"></div>
            <div><label>X</label><input id="redTwitter"></div>
            <div><label>YouTube</label><input id="redYoutube"></div>
            <div><label>TikTok</label><input id="redTiktok"></div>
            <div><label>WhatsApp</label><input id="redWhatsapp"></div>
          </div>
          <button onclick="guardarFooter()" class="btn btn-save mt-4">Guardar Footer</button>
        </div>
      </details>

      <!-- 4. SEÑALES Y RADIOS -->
      <details>
        <summary><i class="fa-solid fa-tower-broadcast text-2xl"></i> Señales y Radios</summary>
        <div class="p-4 grid grid-cols-1 md:grid-cols-2 gap-8">
          <div><h3 class="text-white font-bold mb-4">Señales (Streams)</h3><div id="senalesList"></div></div>
          <div><h3 class="text-white font-bold mb-4">Radios</h3><div id="radiosList"></div></div>
        </div>
      </details>

      <div class="fixed bottom-6 right-6">
        <button onclick="guardarTodo()" class="btn btn-save text-lg shadow-2xl px-8 py-5 rounded-full"><i class="fa-solid fa-cloud-arrow-up"></i> GUARDAR TODO</button>
      </div>
    </div>
  </div>

  <script>
    // ⚠️ CAMBIADO A UADAV
    const API_URL = 'https://uadav-api.uadavstream.workers.dev/api/';
    let ADMIN_KEY = '', seccionesData = [], senalesData = [], radiosData = [], footerConfig = {};
    let editandoItemIndex = null;

    function desconectar() {
      localStorage.removeItem('uadavstream_admin_key');
      ADMIN_KEY = '';
      document.getElementById('panelContent').classList.add('hidden');
      document.getElementById('btnLogout').classList.add('hidden');
    }

    function conectar() {
      ADMIN_KEY = document.getElementById('adminKeyInput').value;
      fetch(API_URL + 'admin_check', { headers: { 'Authorization': 'Bearer ' + ADMIN_KEY } })
      .then(res => { 
        if (res.status !== 200) return alert("Clave incorrecta"); 
        localStorage.setItem('uadavstream_admin_key', ADMIN_KEY);
        document.getElementById('panelContent').classList.remove('hidden');
        document.getElementById('btnLogout').classList.remove('hidden');
        cargarDatos(); 
      });
    }

    async function cargarDatos() {
      const [secRes, apRes, banRes, estRes, senRes, radRes, footRes] = await Promise.all([
        fetch(API_URL + 'secciones').then(r => r.json()).catch(() => []),
        fetch(API_URL + 'apariencia').then(r => r.json()).catch(() => ({})),
        fetch(API_URL + 'banners').then(r => r.json()).catch(() => ({})),
        fetch(API_URL + 'estado_sitio').then(r => r.json()).catch(() => ({})),
        fetch(API_URL + 'senales_oficiales').then(r => r.json()).catch(() => []),
        fetch(API_URL + 'radios').then(r => r.json()).catch(() => []),
        fetch(API_URL + 'footer_config').then(r => r.json()).catch(() => ({}))
      ]);

      if (Array.isArray(secRes)) {
        const uniqueMap = new Map(secRes.map(s => [s.id, s]));
        seccionesData = Array.from(uniqueMap.values());
      } else { seccionesData = []; }

      senalesData = Array.isArray(senRes) ? senRes : [];
      radiosData = Array.isArray(radRes) ? radRes : [];
      footerConfig = footRes || {};
      
      if (!seccionesData.find(s => s.id === 'senales')) seccionesData.unshift({ id: 'senales', nombre: 'Señales', icono: 'fa-tower-broadcast', activa: true, tipo_contenido: 'videos', modo: 'manual', items: [] });
      if (!seccionesData.find(s => s.id === 'radios')) seccionesData.push({ id: 'radios', nombre: 'Radios', icono: 'fa-radio', activa: true, tipo_contenido: 'videos', modo: 'manual', items: [] });
      if (!seccionesData.find(s => s.id === 'teatros')) seccionesData.push({ id: 'teatros', nombre: 'Teatros', icono: 'fa-masks-theater', activa: true, tipo_contenido: 'videos', modo: 'auto', query: 'obra de teatro completa', items: [] });
      if (!seccionesData.find(s => s.id === 'artistas')) seccionesData.push({ id: 'artistas', nombre: 'Artistas', icono: 'fa-user-group', activa: true, tipo_contenido: 'perfiles', modo: 'manual', items: [] });
      if (!seccionesData.find(s => s.id === 'cartelera')) seccionesData.push({ id: 'cartelera', nombre: 'Cartelera', icono: 'fa-ticket', activa: true, tipo_contenido: 'eventos', modo: 'manual', items: [] });

      renderSecciones();
      actualizarFormularioYLista();
      renderSenales(); renderRadios();
      
      document.getElementById('marcaTitulo').value = apRes.titulo_sitio || 'UADAVSTREAM';
      document.getElementById('marcaEslogan').value = apRes.eslogan || 'Teatro y Espectáculos';
      document.getElementById('marcaColorAcento').value = apRes.color_acento || '#00e5ff';
      document.getElementById('marcaColorFondo').value = apRes.color_fondo || '#050505';
      document.getElementById('bannerTopHTML').value = banRes.top?.html || '';
      document.getElementById('bannerInfeedHTML').value = banRes.infeed?.html || '';
      document.getElementById('bannerFooterHTML').value = banRes.footer?.html || '';
      
      // Estado
      document.getElementById('estadoModo').value = estRes.modo || 'normal';
      document.getElementById('estadoLandingUrl').value = estRes.landing_url || '';
      toggleEstadoCampos();

      // Footer
      document.getElementById('footerTitulo').value = footerConfig.titulo || '';
      document.getElementById('footerSubtitulo').value = footerConfig.subtitulo || '';
      document.getElementById('footerCopyright').value = footerConfig.copyright || '';
      document.getElementById('redInstagram').value = footerConfig.instagram || '';
      document.getElementById('redFacebook').value = footerConfig.facebook || '';
      document.getElementById('redTwitter').value = footerConfig.twitter || '';
      document.getElementById('redYoutube').value = footerConfig.youtube || '';
      document.getElementById('redTiktok').value = footerConfig.tiktok || '';
      document.getElementById('redWhatsapp').value = footerConfig.whatsapp || '';
    }

    // ⭐ NUEVAS FUNCIONES PARA ESTADO DEL SITIO
    function toggleEstadoCampos() {
      const modo = document.getElementById('estadoModo').value;
      document.getElementById('landingUrlDiv').style.display = modo === 'landing' ? 'block' : 'none';
    }

    function guardarEstadoSitio() {
      const estado = {
        modo: document.getElementById('estadoModo').value,
        landing_url: document.getElementById('estadoLandingUrl').value
      };
      fetch(API_URL + 'estado_sitio', { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + ADMIN_KEY }, body: JSON.stringify(estado) })
      .then(() => mostrarStatus('estadoStatus', '✅ Estado guardado correctamente', 'success'))
      .catch(err => mostrarStatus('estadoStatus', '❌ Error: ' + err.message, 'error'));
    }

    function mostrarStatus(id, mensaje, tipo) {
      const el = document.getElementById(id);
      if (!el) return;
      el.className = 'status-msg ' + (tipo === 'success' ? 'success' : 'error');
      el.innerText = mensaje;
      setTimeout(() => { el.className = 'status-msg'; el.innerText = ''; }, 5000);
    }

    function renderSecciones() {
      const list = document.getElementById('seccionesList');
      list.innerHTML = '';
      seccionesData.forEach((sec, index) => {
        list.innerHTML += `
          <div class="item-box">
            <div class="flex justify-between items-center mb-2">
              <div class="flex gap-2">
                <button onclick="moverSeccion(${index}, -1)" class="btn btn-move">⬆️</button>
                <button onclick="moverSeccion(${index}, 1)" class="btn btn-move">⬇️</button>
                <button onclick="eliminarSeccion(${index})" class="btn btn-del">Eliminar</button>
              </div>
              <label><input type="checkbox" ${sec.activa ? 'checked' : ''} onchange="seccionesData[${index}].activa = this.checked"> Activa</label>
            </div>
            <div class="grid grid-cols-4 gap-2">
              <div><label>Nombre</label><input value="${sec.nombre}" oninput="seccionesData[${index}].nombre = this.value"></div>
              <div><label>Ícono</label><input value="${sec.icono || 'fa-circle'}" oninput="seccionesData[${index}].icono = this.value"></div>
              <div><label>Tipo</label>
                <select onchange="seccionesData[${index}].tipo_contenido = this.value; actualizarFormularioYLista();">
                  <option value="videos" ${sec.tipo_contenido === 'videos' || !sec.tipo_contenido ? 'selected' : ''}>Videos</option>
                  <option value="perfiles" ${sec.tipo_contenido === 'perfiles' ? 'selected' : ''}>Perfiles</option>
                  <option value="eventos" ${sec.tipo_contenido === 'eventos' ? 'selected' : ''}>Eventos</option>
                </select>
              </div>
              <div><label>Modo</label><select onchange="seccionesData[${index}].modo = this.value; actualizarFormularioYLista();"><option value="auto" ${sec.modo === 'auto' ? 'selected' : ''}>Auto</option><option value="manual" ${sec.modo === 'manual' ? 'selected' : ''}>Manual</option></select></div>
            </div>
          </div>
        `;
      });
      actualizarFormularioYLista();
    }

    function moverSeccion(index, dir) { const n = index + dir; if (n < 0 || n >= seccionesData.length) return; [seccionesData[index], seccionesData[n]] = [seccionesData[n], seccionesData[index]]; renderSecciones(); }
    function eliminarSeccion(index) { if (!confirm("¿Eliminar sección?")) return; seccionesData.splice(index, 1); renderSecciones(); }
    function agregarNuevaSeccion() {
      const id = document.getElementById('nuevoSecId').value.trim().replace(/\s+/g, '_');
      const nombre = document.getElementById('nuevoSecNombre').value.trim();
      const tipo = document.getElementById('nuevoSecTipo').value;
      if (!id || !nombre) return alert("ID y Nombre requeridos");
      if (seccionesData.find(s => s.id === id)) return alert("ID ya existe");
      seccionesData.push({ id, nombre, icono: document.getElementById('nuevoSecIcono').value || 'fa-circle', tipo_contenido: tipo, activa: true, modo: 'auto', query: document.getElementById('nuevoSecQuery').value || nombre, items: [] });
      renderSecciones();
    }

    function actualizarFormularioYLista() {
      const select = document.getElementById('selectSeccionManual');
      const val = select.value;
      select.innerHTML = '';
      seccionesData.forEach((sec, index) => {
        if (sec.id !== 'radios' && sec.id !== 'senales') select.innerHTML += `<option value="${index}">${sec.nombre} (${sec.tipo_contenido || 'videos'})</option>`;
      });
      if (val && select.querySelector(`option[value="${val}"]`)) select.value = val;
      toggleCamposDinamicos();
      renderLista();
    }

    function toggleCamposDinamicos() {
      const secIndex = document.getElementById('selectSeccionManual').value;
      const sec = seccionesData[secIndex];
      document.getElementById('camposVideo').classList.add('hidden');
      document.getElementById('camposArtista').classList.add('hidden');
      document.getElementById('camposCartelera').classList.add('hidden');
      document.getElementById('divTipoContenido').classList.remove('hidden');
      if (sec && sec.tipo_contenido === 'perfiles') { document.getElementById('camposArtista').classList.remove('hidden'); document.getElementById('divTipoContenido').classList.add('hidden'); }
      else if (sec && sec.tipo_contenido === 'eventos') { document.getElementById('camposCartelera').classList.remove('hidden'); document.getElementById('divTipoContenido').classList.add('hidden'); }
      else { document.getElementById('camposVideo').classList.remove('hidden'); }
    }

    async function cargarCanalMasivo() {
      const idCanal = prompt("Ingresa el ID del Canal (UC...) o el link del canal de YouTube:");
      if (!idCanal) return;
      const btn = document.getElementById('btnAgregarItem');
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Cargando...';
      try {
        let channelId = idCanal;
        if (channelId.includes('channel_id=')) channelId = channelId.split('channel_id=')[1].split('&')[0];
        else if (channelId.includes('/channel/')) channelId = channelId.split('/channel/')[1].split('/')[0];
        else if (channelId.includes('/@')) channelId = channelId.split('/@')[1].split('/')[0];
        const res = await fetch(`${API_URL}channel_videos?channel_id=${channelId}`);
        const videos = await res.json();
        if (!videos || videos.length === 0) { alert("No se encontraron videos."); btn.innerHTML = '➕ Agregar'; return; }
        const nombreArtista = prompt("¿Cómo se llama el Artista?", "Artista Importado");
        const nuevoArtista = { tipo: 'artista', nombre: nombreArtista || "Artista Importado", rubro: "YouTube", foto: "https://i.ytimg.com/vi/" + videos[0].id + "/hqdefault.jpg", bio: "Artista importado.", canal: channelId, contacto: "", videos: videos };
        const secIndex = document.getElementById('selectSeccionManual').value;
        if (secIndex === '') return alert("Selecciona sección");
        seccionesData[secIndex].items.push(nuevoArtista);
        renderLista();
        alert(`✅ Importado con ${videos.length} videos.`);
      } catch (e) { alert("Error al conectar."); } finally { btn.innerHTML = '➕ Agregar'; }
    }

    function agregarItem() {
      const secIndex = document.getElementById('selectSeccionManual').value;
      if (secIndex === '') return alert("Selecciona una sección");
      const sec = seccionesData[secIndex];
      if (!sec.items) sec.items = [];
      if (sec.modo !== 'manual') { sec.modo = 'manual'; renderSecciones(); }

      let newItem = {};
      if (sec.tipo_contenido === 'perfiles') {
        newItem = { tipo: 'artista', nombre: document.getElementById('artNombre').value, rubro: document.getElementById('artRubro').value, foto: document.getElementById('artFoto').value, bio: document.getElementById('artBio').value, canal: document.getElementById('artCanal').value, contacto: document.getElementById('artContacto').value };
        if (!newItem.nombre) return alert("El nombre es obligatorio");
      } else if (sec.tipo_contenido === 'eventos') {
        newItem = { tipo: 'evento', nombre: document.getElementById('evNombre').value, fecha: document.getElementById('evFecha').value, lugar: document.getElementById('evLugar').value, imagen: document.getElementById('evImg').value, trailer: document.getElementById('evTrailer').value, precio: document.getElementById('evPrecio').value, link_compra: document.getElementById('evLink').value, descripcion: document.getElementById('evDesc').value };
        if (!newItem.nombre) return alert("El nombre del evento es obligatorio");
      } else {
        const tipo = document.getElementById('tipoContenido').value;
        newItem = { tipo: tipo, url: document.getElementById('vidUrl').value, titulo: document.getElementById('vidTitulo').value || 'Contenido', imagen: document.getElementById('vidImg').value };
        if (!newItem.url) return alert("La URL del video es obligatoria");
      }

      if (editandoItemIndex !== null) { sec.items[editandoItemIndex] = newItem; cancelarEdicion(); }
      else { sec.items.push(newItem); }
      renderLista();
      document.getElementById('vidUrl').value = ''; document.getElementById('vidTitulo').value = ''; document.getElementById('vidImg').value = '';
      document.getElementById('artNombre').value = ''; document.getElementById('artBio').value = '';
      document.getElementById('evNombre').value = ''; document.getElementById('evImg').value = '';
    }

    function editarItem(secIndex, itemIndex) {
      const sec = seccionesData[secIndex];
      const item = sec.items[itemIndex];
      editandoItemIndex = itemIndex;
      if (item.tipo === 'artista') { document.getElementById('artNombre').value = item.nombre; document.getElementById('artRubro').value = item.rubro; document.getElementById('artFoto').value = item.foto; document.getElementById('artBio').value = item.bio; document.getElementById('artCanal').value = item.canal; document.getElementById('artContacto').value = item.contacto; }
      else if (item.tipo === 'evento') { document.getElementById('evNombre').value = item.nombre; document.getElementById('evFecha').value = item.fecha; document.getElementById('evLugar').value = item.lugar; document.getElementById('evImg').value = item.imagen; document.getElementById('evTrailer').value = item.trailer; document.getElementById('evPrecio').value = item.precio; document.getElementById('evLink').value = item.link_compra; document.getElementById('evDesc').value = item.descripcion; }
      else { document.getElementById('vidUrl').value = item.url; document.getElementById('vidTitulo').value = item.titulo; document.getElementById('vidImg').value = item.imagen; document.getElementById('tipoContenido').value = item.tipo; }
      document.getElementById('btnAgregarItem').innerHTML = '💾 Actualizar';
      document.getElementById('btnCancelarEdicion').classList.remove('hidden');
    }

    function cancelarEdicion() {
      editandoItemIndex = null;
      document.getElementById('btnAgregarItem').innerHTML = '➕ Agregar';
      document.getElementById('btnCancelarEdicion').classList.add('hidden');
      document.getElementById('vidUrl').value = ''; document.getElementById('vidTitulo').value = ''; document.getElementById('vidImg').value = '';
      document.getElementById('artNombre').value = ''; document.getElementById('artBio').value = '';
      document.getElementById('evNombre').value = ''; document.getElementById('evImg').value = '';
    }

    function renderLista() {
      const list = document.getElementById('contenidoManualList');
      list.innerHTML = '';
      const secIndex = document.getElementById('selectSeccionManual').value;
      if (secIndex === '') return;
      const sec = seccionesData[secIndex];
      if (sec.items && sec.items.length > 0) {
        sec.items.forEach((item, i) => {
          let img = ''; let titulo = '';
          if (item.tipo === 'artista') { img = item.foto; titulo = item.nombre; }
          else if (item.tipo === 'evento') { img = item.imagen || 'https://i.ytimg.com/vi/aqz-KE-bpKQ/hqdefault.jpg'; titulo = `${item.nombre} - ${item.fecha || ''}`; }
          else { img = item.imagen || `https://i.ytimg.com/vi/${item.url}/mqdefault.jpg`; titulo = item.titulo; }
          list.innerHTML += `<div class="content-video-box"><img src="${img}" class="w-16 h-10 rounded object-cover"><span class="flex-1 px-2 text-sm truncate font-mono">${titulo}</span><button onclick="moverItem(${secIndex}, ${i}, -1)" class="btn btn-move">⬆️</button><button onclick="moverItem(${secIndex}, ${i}, 1)" class="btn btn-move">⬇️</button><button onclick="editarItem(${secIndex}, ${i})" class="btn btn-edit"><i class="fa-solid fa-pen"></i></button><button onclick="eliminarItem(${secIndex}, ${i})" class="btn btn-del">✕</button></div>`;
        });
      } else { list.innerHTML = '<div class="text-slate-500 text-sm p-4 border border-dashed border-slate-700 rounded-xl">No hay ítems.</div>'; }
    }

    function moverItem(secIdx, itemIdx, dir) { const n = itemIdx + dir; if (n < 0 || n >= seccionesData[secIdx].items.length) return; [seccionesData[secIdx].items[itemIdx], seccionesData[secIdx].items[n]] = [seccionesData[secIdx].items[n], seccionesData[secIdx].items[itemIdx]]; renderLista(); }
    function eliminarItem(secIdx, itemIdx) { seccionesData[secIdx].items.splice(itemIdx, 1); renderLista(); }

    function renderSenales() { const l = document.getElementById('senalesList'); l.innerHTML=''; senalesData.forEach((s,i)=> l.innerHTML += `<div class="item-box flex justify-between"><div><h4 class="font-bold text-white">${s.nombre}</h4><p class="text-xs text-slate-400">${s.url}</p></div><button onclick="senalesData.splice(${i},1); renderSenales();" class="btn btn-del">Eliminar</button></div>`); l.innerHTML += `<div class="grid grid-cols-1 gap-2 mt-2"><input id="newSenalNombre" placeholder="Nombre"><input id="newSenalUrl" placeholder="URL (RTMP, m3u8, YouTube)"><button onclick="senalesData.push({id:'s'+Date.now(), nombre:document.getElementById('newSenalNombre').value, url:document.getElementById('newSenalUrl').value}); renderSenales();" class="btn btn-edit">Agregar</button></div>`; }
    function renderRadios() { const l = document.getElementById('radiosList'); l.innerHTML=''; radiosData.forEach((r,i)=> l.innerHTML += `<div class="item-box flex justify-between"><div><h4 class="font-bold text-white">${r.nombre}</h4><p class="text-xs text-slate-400">${r.stream_url}</p></div><button onclick="radiosData.splice(${i},1); renderRadios();" class="btn btn-del">Eliminar</button></div>`); l.innerHTML += `<div class="grid grid-cols-1 gap-2 mt-2"><input id="newRadioNombre" placeholder="Nombre"><input id="newRadioUrl" placeholder="URL Stream"><button onclick="radiosData.push({id:'r'+Date.now(), nombre:document.getElementById('newRadioNombre').value, stream_url:document.getElementById('newRadioUrl').value}); renderRadios();" class="btn btn-edit">Agregar</button></div>`; }

    function guardarExtras() {
      fetch(API_URL + 'apariencia', { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + ADMIN_KEY }, body: JSON.stringify({ titulo_sitio: document.getElementById('marcaTitulo').value, eslogan: document.getElementById('marcaEslogan').value, color_acento: document.getElementById('marcaColorAcento').value, color_fondo: document.getElementById('marcaColorFondo').value }) });
      fetch(API_URL + 'banners', { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + ADMIN_KEY }, body: JSON.stringify({ top:{activo:true, html:document.getElementById('bannerTopHTML').value}, infeed:{activo:true, html:document.getElementById('bannerInfeedHTML').value}, footer:{activo:true, html:document.getElementById('bannerFooterHTML').value} }) });
    }

    function guardarFooter() {
      const footer = { titulo: document.getElementById('footerTitulo').value, subtitulo: document.getElementById('footerSubtitulo').value, copyright: document.getElementById('footerCopyright').value, instagram: document.getElementById('redInstagram').value, facebook: document.getElementById('redFacebook').value, twitter: document.getElementById('redTwitter').value, youtube: document.getElementById('redYoutube').value, tiktok: document.getElementById('redTiktok').value, whatsapp: document.getElementById('redWhatsapp').value };
      fetch(API_URL + 'footer_config', { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + ADMIN_KEY }, body: JSON.stringify(footer) });
    }

    async function guardarTodo() {
      guardarEstadoSitio();
      guardarExtras(); guardarFooter();
      await fetch(API_URL + 'secciones', { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + ADMIN_KEY }, body: JSON.stringify(seccionesData) });
      await fetch(API_URL + 'senales_oficiales', { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + ADMIN_KEY }, body: JSON.stringify(senalesData) });
      await fetch(API_URL + 'radios', { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + ADMIN_KEY }, body: JSON.stringify(radiosData) });
      alert('✅ Todo guardado en la nube');
    }

    window.onload = () => {
      const saved = localStorage.getItem('uadavstream_admin_key');
      if (saved) { document.getElementById('adminKeyInput').value = saved; conectar(); }
    };
  </script>
</body>
</html>
