 {g:'Plataforma',items:[['dashboard','◫','Resumen'],['home','⌂','Home y secciones'],['content','▶','Contenido y colecciones'],['pages','▤','Identidad, SEO y páginas']]},

];

function fmtDate(v){if(!v)return'—';try{return new Intl.DateTimeFormat('es-AR',{dateStyle:'medium'}).format(new Date(v))}catch{return String(v)}}
function statusBadge(v){const s=String(v||'').toLowerCase();const c=['active','activo','published','publicado','aprobado','approved','ok','pagado'].includes(s)?'ok':['pending','pendiente','revision','pendiente_revision','catalogo'].includes(s)?'warn':['rejected','rechazado','suspendido','oculto','hidden','cancelado'].includes(s)?'bad':'info';return `<span class="badge ${c}">${esc(v||'—')}</span>`}
function img(url,round=false){return `<img class="thumb ${round?'round':''}" src="${esc(url||FALLBACK)}" onerror="this.src='${FALLBACK}'" alt="">`}

async function api(path,opt={}){
  const method=opt.method||'GET', headers={Accept:'application/json',...(opt.headers||{})};
  const key=opt.keyOverride!==undefined?opt.keyOverride:ADMIN_KEY;
  if(opt.auth!==false && key)headers.Authorization='Bearer '+key;
  let body=opt.body;
  if(body!==undefined && !(body instanceof FormData) && typeof body!=='string'){headers['Content-Type']='application/json';body=JSON.stringify(body)}
  const bases=[...new Set([API_ACTIVE,API_LOCAL,API_REMOTE].filter(Boolean))];
  let lastErr=null;
  for(const base of bases){
    try{
      const res=await fetch(base+path,{method,headers,body,cache:'no-store'});
      const ct=res.headers.get('content-type')||'';
      if(base===API_LOCAL && (res.status===404 || !ct.includes('json'))){ if(method==='GET'||method==='HEAD'||res.status===404)continue; }
      if(res.ok)API_ACTIVE=base;
      if(opt.raw)return res;
      const data=ct.includes('json')?await res.json().catch(()=>({})):await res.text();
      if(!res.ok){if(res.status===401&&ADMIN_KEY)toast('Sesión no autorizada. Revisá la clave ADMIN_KEY.','bad');throw new Error((data&&data.error)||data||`HTTP ${res.status}`)}
      return data;
    }catch(e){lastErr=e;continue;}
  }
  throw lastErr||new Error('No se pudo conectar con la API');
}

lecciones ${cols.length}</button></div></div>${body}`;applySearch()}
window.editContent=i=>{const x=i>=0?S.cache.contentItems[i]:{};modal(i>=0?'Editar contenido':'Nuevo contenido',`<div class="form-grid">${f('cUrl','URL',x.url||'','url','span-2')}${f('cTitle','Título',x.titulo||'')}${f('cArtist','ID artista',x.artist_id||'')}${f('cProvider','Proveedor',x.provider||'auto')}${f('cType','Tipo',x.content_type||x.tipo||'auto')}${f('cThumb','Miniatura',x.thumbnail||'','url')}${f('cCategory','Categoría',x.categoria||'')}${sel('cVisible','Visible',x.visible===false?'false':'true',[['true','Sí'],['false','No']])}${ta('cDesc','Descripción',x.descripcion||'','span-2')}</div><div class="actions" style="margin-top:12px"><button class="btn btn-secondary" onclick="resolveContentUrl()">Detectar plataforma</button><span id="cResolveInfo" style="color:var(--muted)"></span></div>`,`<button class="btn btn-ghost" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="saveContent(${i})">Guardar</button>`)};

function normalizeImportRow(r,entity){const visible=$('importVisible')?.value==='true',origin=$('importOrigin')?.value?.trim()||'Importación Admin';const val=(...ks)=>{for(const k of ks)if(r[k]!==undefined&&r[k]!==null&&String(r[k]).trim()!=='')return r[k];return ''};if(entity==='content')return {id:val('id'),url:val('url','URL','link','Link'),titulo:val('titulo','Titulo','Título','title'),artist_id:val('artist_id','artista_id'),categoria:val('categoria','Categoria'),thumbnail:val('thumbnail','imagen'),provider:val('provider'),content_type:val('content_type','tipo'),origen:origin,visible};if(entity==='producers')return {id:val('id'),nombre:val('nombre','Nombre','productora','Productora'),email:val('email','Email'),whatsapp:val('whatsapp','WhatsApp'),contacto:val('contacto','Contacto'),ciudad:val('ciudad','Ciudad'),provincia:val('provincia','Provincia'),pais:val('pais','Pais','País')||'Argentina',convenio:/^(si|sí|true|1)$/i.test(String(val('convenio','Convenio'))),origen:origin};if(entity==='radios')return {id:val('id'),nombre:val('nombre','Nombre','radio','Radio'),stream_url:val('stream_url','stream','url','URL'),metadata_url:val('metadata_url','meta_url'),logo:val('logo','imagen'),portada:val('portada'),ciudad:val('ciudad','Ciudad'),provincia:val('provincia','Provincia'),pais:val('pais','Pais','País')||'Argentina',pauta_status:val('pauta_status')||'sin_pauta',origen:origin};if(entity==='events')return {id:val('id'),titulo:val('titulo','Titulo','Título','nombre','Nombre'),categoria:val('categoria','Categoria')||'Eventos',fecha_inicio:val('fecha_inicio','fecha','Fecha'),fecha_fin:val('fecha_fin'),lugar:val('lugar','Lugar'),direccion:val('direccion','Dirección'),ciudad:val('ciudad','Ciudad'),provincia:val('provincia','Provincia'),pais:val('pais','Pais','País')||'Argentina',descripcion:val('descripcion','Descripción'),imagen:val('imagen','poster'),ticket_url:val('ticket_url','link_compra'),origen:origin};if(entity==='jobs')return {id:val('id'),titulo:val('titulo','Titulo','Título'),rubro:val('rubro','Rubro'),tipo:val('tipo'),empresa:val('empresa','entidad'),modalidad:val('modalidad'),ciudad:val('ciudad','Ciudad'),provincia:val('provincia','Provincia'),pais:val('pais','Pais','País')||'Argentina',fecha:val('fecha','Fecha'),fecha_limite:val('fecha_limite'),remuneracion:val('remuneracion'),descripcion:val('descripcion','Descripción'),requisitos:val('requisitos'),contacto:val('contacto','Contacto','email','Email','whatsapp','WhatsApp'),email:val('email','Email'),whatsapp:val('whatsapp','WhatsApp'),origen:origin};return {id:val('id')||nowId('ART'),nombre:val('nombre','Nombre','artista','Artista'),nombre_artistico:val('nombre_artistico','Nombre artístico','Nombre Artistico','nombre','Nombre'),rubro:val('rubro','Rubro','categoria','Categoria'),ciudad:val('ciudad','Ciudad'),provincia:val('provincia','Provincia'),pais:val('pais','Pais','País')||'Argentina',email:val('email','Email'),whatsapp:val('whatsapp','WhatsApp'),canal:val('canal','youtube','YouTube'),origen:origin,visible,estado:'catalogo'}}
window.previewImport=async()=>{const file=$('importFile').files?.[0];if(!file)return toast('Seleccioná un archivo','bad');let rows=[];try{if(/\.json$/i.test(file.name)){rows=JSON.parse(await file.text())}else if(window.XLSX){const buf=await file.arrayBuffer();const wb=XLSX.read(buf,{type:'array'});rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''})}else{throw new Error('No se pudo cargar el lector de Excel')}}catch(e){return toast('No se pudo leer el archivo: '+e.message,'bad')}if(!Array.isArray(rows))rows=[];const entity=$('importEntity').value;const norm=rows.map(r=>normalizeImportRow(r,entity)).filter(x=>entity==='content'?x.url:entity==='events'?x.titulo:entity==='jobs'?x.titulo:entity==='radios'?(x.nombre&&x.stream_url):(x.nombre_artistico||x.nombre));let existing=[];try{if(entity==='artists')existing=arr(await api('artistas'));if(entity==='content')existing=arr(await api('content?all=true'));if(entity==='producers')existing=arr(await api('productoras'));if(entity==='radios')existing=arr(await api('radios'));if(entity==='events')existing=arr(await api('cartelera'));if(entity==='jobs')existing=arr(await api('bolsa_trabajo'))}catch{}const key=x=>entity==='content'?String(x.url||'').toLowerCase():entity==='radios'?String(x.stream_url||x.url||'').toLowerCase():entity==='events'?[x.titulo||x.nombre,x.fecha_inicio||x.fecha,x.ciudad].join('|').toLowerCase():entity==='jobs'?[x.titulo,x.ciudad,x.fecha].join('|').toLowerCase():entity==='producers'?String(x.email||[x.nombre,x.ciudad].join('|')).toLowerCase():[x.nombre_artistico||x.nombre,x.ciudad].join('|').toLowerCase();const keys=new Set(existing.map(key));const duplicates=norm.filter(x=>keys.has(key(x))).length;S.importRows=norm;$('importPreview').textContent=JSON.stringify({archivo:file.name,tipo:entity,filas:rows.length,importables:norm.length,posibles_actualizaciones:duplicates,muestra:norm.slice(0,6)},null,2);$('importCommit').disabled=!norm.length};
window.commitImport=async()=>{if(!S.importRows.length)return;const entity=$('importEntity').value;if(!confirm(`¿Procesar ${S.importRows.length} registros de ${entity}?`))return;const d=await api('admin/import',{method:'POST',body:{entity,rows:S.importRows}});toast(`Importación lista: ${d.created||0} nuevos · ${d.updated||0} actualizados`);S.importRows=[];$('importCommit').disabled=true;$('importPreview').textContent=JSON.stringify(d,null,2);delete S.cache.artists;delete S.cache.contentItems};
window.exportXLSX=async type=>{if(!window.XLSX)return toast('Lector Excel no disponible','bad');let data=[];if(type==='artists')data=await api('artistas');if(type==='producers')data=await api('productoras');if(type==='radios')data=await api('radios');if(type==='events')data=await api('cartelera');if(type==='content')data=await api('content?all=true');if(type==='collections')data=await api('collections?all=true');if(type==='jobs')data=await api('bolsa_trabajo');data=arr(data).map(x=>{const o={};for(const [k,v] of Object.entries(x||{}))o[k]=typeof v==='object'&&v!==null?JSON.stringify(v):v;return o});const wb=XLSX.utils.book_new();const ws=XLSX.utils.json_to_sheet(data);XLSX.utils.book_append_sheet(wb,ws,(type||'Datos').slice(0,31));XLSX.writeFile(wb,`UADAV STREAM-${type}-${new Date().toISOString().slice(0,10)}.xlsx`)};

lass="badge warn">API YouTube habilitada como último fallback</span>':'<span class="badge">Fallback YouTube apagado</span>'}</p><p style="color:var(--muted)">La API oficial solo se consume si Invidious no devuelve candidatos suficientes.</p></section><section class="card card-pad"><div class="section-title"><h2>Automatización</h2></div><p style="color:var(--muted)">Automatización = tareas que ocurren solas: vencimientos, destacados, reintentos y notificaciones. Email seguirá OFF hasta configurar Gmail/Apps Script. No impide trabajar normalmente.</p><div class="actions" style="margin:10px 0"><button class="btn btn-secondary" onclick="runMaintenance()">Ejecutar mantenimiento ahora</button></div><div class="json-box">${esc(JSON.stringify(h.automation||{},null,2))}</div></section></div>`};

window.exportCurrent=async type=>{let data=[];if(type==='artists')data=await api('artistas');if(type==='radios')data=await api('radios');if(type==='events')data=await api('cartelera');downloadBlob(new Blob([toCSV(arr(data))],{type:'text/csv'}),type+'.csv')};
function toCSV(list){if(!list.length)return'';const keys=Array.from(new Set(list.flatMap(x=>Object.keys(x)))).filter(k=>typeof list.find(x=>x[k]!==undefined)?.[k]!=='object');return [keys.join(','),...list.map(x=>keys.map(k=>'"'+String(x[k]??'').replace(/"/g,'""')+'"').join(','))].join('\n')}function downloadBlob(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}

VIEWS.diagnostics=async()=>{const [h,d1,search]=await Promise.all([api('health',{auth:false}),api('admin/d1/status'),api('admin/search-diagnostic?q=UADAV STREAM').catch(e=>({status:'ERROR',error:e.message}))]);$('main').innerHTML=head('Diagnóstico','Estado real del Worker, D1 y búsqueda.',`<button class="btn btn-primary" onclick="go('diagnostics',true)">Ejecutar de nuevo</button>`)+`<div class="grid" style="grid-template-columns:repeat(3,minmax(0,1fr))"><section class="card card-pad"><div class="section-title"><h2>Worker</h2>${h.ok?'<span class="badge ok">OK</span>':'<span class="badge bad">ERROR</span>'}</div><div class="json-box">${esc(JSON.stringify(h,null,2))}</div></section><section class="card card-pad"><div class="section-title"><h2>D1</h2>${d1.configured?'<span class="badge ok">OK</span>':'<span class="badge warn">NO</span>'}</div><div class="json-box">${esc(JSON.stringify(d1,null,2))}</div></section><section class="card card-pad"><div class="section-title"><h2>Búsqueda</h2>${search.status==='OK'?'<span class="badge ok">OK</span>':'<span class="badge warn">Revisar</span>'}</div><div class="json-box">${esc(JSON.stringify(search,null,2))}</div></section></div>`};

function applySearch(){const q=$('globalSearch').value.trim().toLowerCase();document.querySelectorAll('tbody tr[data-search]').forEach(tr=>tr.style.display=!q||tr.dataset.search.includes(q)?'':'none')}

$('loginBtn').onclick=login;$('loginKey').onkeydown=e=>{if(e.key==='Enter')login()};$('logoutTop').onclick=$('logoutSide').onclick=logout;$('navFilter').oninput=renderNav;$('globalSearch').oninput=applySearch;$('mobileMenu').onclick=()=>toggleSidebar(true);$('mobileBackdrop').onclick=()=>toggleSidebar(false);
window.go=go;window.S=S;window.toast=toast;window.refreshSystemPills=refreshSystemPills;window.renderArtists=renderArtists;window.renderEvents=renderEvents;window.renderJobs=renderJobs;
publicHealth().then(()=>{if(ADMIN_KEY)enterApp()});
})();
