async function api(path,opt={}){
  const method=opt.method||'GET', headers={Accept:'application/json',...(opt.headers||{})};
  const key=opt.keyOverride!==undefined?opt.keyOverride:ADMIN_KEY;
  if(opt.auth!==false && key)headers.Authorization='Bearer '+key;
  let body=opt.body;
  if(body!==undefined && !(body instanceof FormData) && typeof body!=='string'){headers['Content-Type']='application/json';body=JSON.stringify(body)}
  const bases=[...new Set([API_ACTIVE,API_REMOTE,API_USE_LOCAL?API_LOCAL:null].filter(Boolean))];
  let lastErr=null;
  for(const base of bases){
    try{
      const res=await fetch(base+path,{method,headers,body,cache:'no-store'});
      const ct=res.headers.get('content-type')||'';
      if(base===API_LOCAL && (res.status===404 || !ct.includes('json'))){ if(method==='GET'||method==='HEAD'||res.status===404)continue; }
      if(res.ok)API_ACTIVE=base;
      if(opt.raw)return res;
      const data=ct.includes('json')?await res.json().catch(()=>({})):await res.text();
      if(!res.ok){if(res.status===401&&ADMIN_KEY)toast('Sesión no autorizada. Revisá la clave ADMIN_KEY.','bad');throw new Error((data&&data.error)||data||`HTTP ${res.status}`)}
      return data;
    }catch(e){lastErr=e;continue;}
  }
  throw lastErr||new Error('No se pudo conectar con la API');
}

VIEWS.events=async(force)=>{
  const results=await Promise.allSettled([
    cache('eventsPub',()=>api('cartelera'),force),
    cache('pendingEvents',()=>api('eventos'),force)
  ]);
  const errors=[];
  if(results[0].status==='fulfilled')S.cache.eventsPub=results[0].value;
  else{S.cache.eventsPub=S.cache.eventsPub||[];errors.push('No se pudieron cargar los eventos publicados: '+(results[0].reason?.message||'error de conexión'))}
  if(results[1].status==='fulfilled')S.cache.pendingEvents=results[1].value;
  else{S.cache.pendingEvents=S.cache.pendingEvents||[];errors.push('No se pudieron cargar los destaques pendientes: '+(results[1].reason?.message||'error de conexión'))}
  S.eventLoadErrors=errors;
  S.eventTab=S.eventTab||'published';
  renderEvents()
};
function renderEvents(){const pub=arr(S.cache.eventsPub),pend=arr(S.cache.pendingEvents),featured=pub.filter(e=>e.destacado_pagado===true),tab=S.eventTab||'published';let body='';

window.editCarteleraSlider=async()=>{const cfg=obj(await api('cartelera_slider'));S.cache.carteleraSlider=cfg;modal('Portada de Cartelera',`<p style="color:var(--muted)">Recomendado: combinar slides propios con destacados. Si no hay ninguno, aparece la portada genérica. Imágenes por URL: formato horizontal 1920 × 1080, sin textos pegados a los bordes.</p><div class="form-grid">${sel('csMode','Qué mostrar',cfg.mode||'mixed',[['mixed','Slides propios + destacados'],['featured','Solo destacados'],['custom','Solo slides propios'],['generic','Solo portada genérica'],['off','Sin portada']])}${f('csSeconds','Segundos por slide (8 a 30)',cfg.seconds||12,'number')}</div>${Array.from({length:6},(_,i)=>{const x=arr(cfg.slides)[i]||{};return `<section class="card card-pad" style="margin-top:14px"><h3>Slide ${i+1}</h3><div class="form-grid">${sel('csActive'+i,'Estado',x.active===false?'false':'true',[['true','Activo'],['false','Oculto']])}${f('csTitle'+i,'Título',x.title||'')}${f('csImage'+i,'Imagen horizontal · URL',x.image||'','url','span-2')}${f('csDescription'+i,'Descripción breve',x.description||'','text','span-2')}${f('csButton'+i,'Texto del botón',x.button||'Conocer más')}${f('csLink'+i,'Destino del botón',x.link||'')}</div></section>`}).join('')}`,`<button class="btn btn-ghost" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="saveCarteleraSlider()">Guardar portada</button>`)};

window.saveEvent=async i=>{const funciones=collectEventShows();const data={titulo:$('eTitle').value.trim(),categoria:$('eCategory').value.trim(),subcategoria:$('eSubcategory').value.trim(),organizador:$('eOrganizer').value.trim(),fecha:$('eDate').value,fecha_inicio:$('eDate').value,fecha_fin:$('eEndDate').value,lugar:$('eVenue').value.trim(),direccion:$('eAddress').value.trim(),ciudad:$('eCity').value.trim(),provincia:$('eProvince').value.trim(),pais:$('eCountry').value.trim(),poster:$('ePoster').value.trim(),imagen:$('ePoster').value.trim(),portada:$('eCover').value.trim(),es_gratuito:$('eFree').value==='true',precio_desde:$('ePriceFrom').value.trim(),precio_hasta:$('ePriceTo').value.trim(),moneda:$('eCurrency').value.trim(),ticketing_mode:$('eTicketMode').value,ticket_capacity:Number($('eCapacity').value||0)||null,ticketera:$('eTicketing').value.trim(),link_ticketera:$('eTickets').value.trim(),link_compra:$('eTickets').value.trim(),contacto_email:$('eEmail').value.trim(),whatsapp:$('eWhatsapp').value.trim(),contacto:$('eWhatsapp').value.trim(),instagram:$('eInstagram').value.trim(),web:$('eWeb').value.trim(),trailer:$('eTrailer').value.trim(),destacado_pagado:$('eFeature').value==='true',destacado_hasta:$('eFeatureUntil').value,descripcion_corta:$('eShort').value.trim(),descripcion:$('eDesc').value.trim(),funciones};if(data.es_gratuito){data.precio_desde='';data.precio_hasta=''}if(!moduleEnabled('ticketing')&&['platform_interest','uadav_interest','uadav'].includes(data.ticketing_mode))return toast('Las solicitudes internas están deshabilitadas. Elegí ticketera externa o sin ticketing.','bad');if(!data.titulo||!data.fecha||!data.lugar)return toast('Título, fecha y lugar son obligatorios','bad');if(i>=0){data.id=S.cache.eventsPub[i].id;await api('cartelera',{method:'PUT',body:data})}else await api('cartelera',{method:'POST',body:data});delete S.cache.eventsPub;closeModal();toast('Evento guardado');go('events',true)};

function renderMedia(){const list=arr(S.cache.mediaTitles),seasons=arr(S.cache.mediaSeasons),episodes=arr(S.cache.mediaEpisodes);$('main').innerHTML=head('Películas y Series','Catálogo audiovisual con temporadas y episodios. Solo URLs/embeds autorizados; UADAV STREAM no aloja archivos.',`<button class="btn btn-primary" onclick="editMedia(-1)">+ Título</button>`)+`<div class="grid stats-grid">${stat('▶','Películas',list.filter(x=>(x.media_type||x.tipo)==='movie').length,'Catálogo','stat-cyan')}${stat('▤','Series',list.filter(x=>(x.media_type||x.tipo)==='series').length,'Catálogo','stat-violet')}${stat('S','Temporadas',seasons.length,'Organización','stat-green')}${stat('E','Episodios',episodes.length,'Reproducibles','stat-yellow')}</div>`+table(['Título','Tipo','Año','Géneros','Destacado','Estado','Acciones'],list.map((x,i)=>`<tr><td><div class="entity">${img(x.poster||x.imagen)}<div><strong>${esc(x.titulo||x.title||'Sin título')}</strong><small>${esc(x.provider||x.source_url||'')}</small></div></div></td><td>${statusBadge(x.media_type||x.tipo||'movie')}</td><td>${esc(x.year||'—')}</td><td>${esc(arr(x.generos).join(', ')||'—')}</td><td>${x.featured?'<span class="badge info">★ Sí</span>':'No'}</td><td>${x.visible===false?'<span class="badge bad">Oculto</span>':'<span class="badge ok">Visible</span>'}</td><td><div class="actions"><button class="btn btn-secondary btn-sm" onclick="editMedia(${i})">Editar</button><button class="btn btn-secondary btn-sm" onclick="manageEpisodes(${i})">Temporadas</button><button class="btn btn-danger btn-sm" onclick="deleteMedia(${i})">Eliminar</button></div></td></tr>`))};

function renderCommercialPolicy(){const c=obj(S.cache.commercialPolicy);return `<section class="card card-pad" style="margin-bottom:16px"><h2>Modelo aprobado · Gratis + Artista PRO</h2><p>Gratis: perfil, reclamo, Bolsa, Marketplace y contratación sin comisión. STREAM+ retirado. Ticketera interna deshabilitada hasta una futura decisión. Convenios sindicales separados de PRO.</p><p><strong>PRO: USD 3,99 mensual / USD 30 anual.</strong> Las mismas herramientas en ambos planes. Destacados: $5.000 / 7 días, $10.000 / 15 días y $20.000 / 30 días.</p><div class="form-grid">${f('officialRate','Dólar oficial vendedor · ARS por USD',c.official_rate||'','number')}${f('officialRateDate','Fecha de cotización',c.rate_date||'','date')}${f('officialRateSource','Fuente de cotización',c.rate_source||'Banco Nación · vendedor')}${f('officialRateNote','Observación',c.note||'')}</div><p style="color:var(--muted)">Carga manual verificada. No hay actualización automática. La cotización de hoy convierte los nuevos pedidos; las órdenes emitidas conservan su importe. Sin cotización válida ni datos bancarios, mantené cobros apagados.</p><div class="actions"><button class="btn btn-secondary" onclick="applyOfficialProRate()">Calcular importes PRO en pesos</button><button class="btn btn-primary" onclick="saveCommercialPolicy()">Guardar referencia</button><button class="btn btn-secondary" onclick="editBenefitAgreements()">Convenios y beneficios</button></div><p>Mi espacio de artista: Press Kit, fichas técnicas, presupuestos, agenda, seguimiento, estadísticas y convenios. Herramientas nuevas en construcción; no venderlas como entregadas.</p></section>`}
function officialProAmounts(rate){const r=Number(rate);if(!Number.isFinite(r)||r<=0)throw Error('Ingresá una cotización válida');return {monthly:Math.round(r*3.99*100)/100,annual:Math.round(r*30*100)/100}}
window.applyOfficialProRate=()=>{try{const date=$('officialRateDate').value,today=new Date().toLocaleDateString('en-CA',{timeZone:'America/Argentina/Buenos_Aires'});if(date!==today)return toast('Usá la cotización verificada de hoy','bad');const amounts=officialProAmounts($('officialRate').value);$('proPayCurrency').value='ARS';$('proPayMonthly').value=amounts.monthly;$('proPayAmount').value=amounts.annual;$('proPayQuarterly').value=0;$('proPaySemiannual').value=0;toast('Importes calculados. Revisalos y guardá la configuración de transferencia.')}catch(e){toast(e.message,'bad')}};
window.saveCommercialPolicy=async()=>{const rate=Number($('officialRate').value||0);if(rate&&!Number.isFinite(rate)||rate<0)return toast('Cotización inválida','bad');const data={...obj(S.cache.commercialPolicy),pro_monthly_usd:3.99,pro_annual_usd:30,official_rate:rate||null,rate_date:$('officialRateDate').value,rate_source:$('officialRateSource').value.trim(),note:$('officialRateNote').value.trim(),stream_plus:false,ticketing:false,free_jobs:true,free_marketplace:true};await saveJSON('commercial_policy',data);S.cache.commercialPolicy=data;toast('Referencia comercial guardada; no activa cobros ni módulos')};
window.editBenefitAgreements=async()=>{S.cache.benefitAgreements=arr(await api('benefit_agreements'));showBenefitAgreements()};
function showBenefitAgreements(){modal('Convenios y beneficios',`<p>Cargá acuerdos confirmados. No confundas un convenio sindical con un beneficio comercial PRO.</p>${table(['Proveedor','Beneficio','Acceso','Vigencia','Estado','Acción'],arr(S.cache.benefitAgreements).map((x,i)=>`<tr><td>${esc(x.provider)}</td><td>${esc(x.benefit)}</td><td>${esc(x.audience)}</td><td>${esc(x.until||'A confirmar')}</td><td>${x.active?'Activo':'Borrador'}</td><td><button class="btn btn-secondary btn-sm" onclick="editBenefitAgreement(${i})">Editar</button></td></tr>`))}`,`<button class="btn btn-primary" onclick="editBenefitAgreement(-1)">+ Convenio</button><button class="btn btn-ghost" onclick="closeModal()">Cerrar</button>`)}
window.editBenefitAgreement=i=>{const x=arr(S.cache.benefitAgreements)[i]||{};modal('Convenio',`<div class="form-grid">${f('baProvider','Proveedor',x.provider||'')}${f('baBenefit','Beneficio real',x.benefit||'')}${sel('baAudience','Para quién',x.audience||'pro',[['pro','Artista PRO'],['union','Afiliados sindicales'],['shared','Afiliados y PRO'],['public','Público general']])}${f('baCity','Ciudad / alcance',x.city||'')}${f('baUntil','Vigente hasta',x.until||'','date')}${f('baLink','Enlace del proveedor',x.link||'','url')}${sel('baActive','Estado',x.active?'true':'false',[['false','Borrador'],['true','Acuerdo confirmado']])}${ta('baConditions','Condiciones y cómo solicitarlo',x.conditions||'')}</div>`,`<button class="btn btn-ghost" onclick="showBenefitAgreements()">Volver</button><button class="btn btn-primary" onclick="saveBenefitAgreement(${i})">Guardar</button>`)};
window.saveBenefitAgreement=async i=>{const list=arr(S.cache.benefitAgreements).slice(),old=list[i]||{},x={...old,id:old.id||nowId('CONV'),provider:$('baProvider').value.trim(),benefit:$('baBenefit').value.trim(),audience:$('baAudience').value,city:$('baCity').value.trim(),until:$('baUntil').value,link:$('baLink').value.trim(),active:$('baActive').value==='true',conditions:$('baConditions').value.trim()};if(!x.provider||!x.benefit)return toast('Proveedor y beneficio son obligatorios','bad');if(x.link&&!/^https?:\/\//i.test(x.link))return toast('Enlace http/https requerido','bad');if(x.active&&(!x.conditions||!x.until))return toast('Un acuerdo activo necesita condiciones y vencimiento','bad');if(i<0)list.push(x);else list[i]=x;await saveJSON('benefit_agreements',list);S.cache.benefitAgreements=list;showBenefitAgreements();toast('Convenio guardado')};
function renderMonetization(){const p=arr(S.cache.monProducts),c=arr(S.cache.monCampaigns),o=arr(S.cache.proOrders),ps=S.cache.paySettings||{};$('main').innerHTML=head('Monetización','Qué vendemos, a quién y durante cuánto tiempo. Producto = paquete comercial; Campaña = una contratación concreta.',`<button class="btn btn-primary" onclick="editMonProduct(-1)">+ Producto</button><button class="btn btn-secondary" onclick="editCampaign(-1)">+ Campaña</button>`)+renderCommercialPolicy()+`<div class="grid stats-grid">${stat('$','Productos',p.length,'Oferta comercial','stat-cyan')}${stat('★','Campañas',c.length,'Total','stat-violet')}${stat('✓','Activas',c.filter(x=>x.status==='active').length,'En curso','stat-green')}${stat('!','Pendientes',c.filter(x=>x.payment_status!=='paid').length,'Pago/revisión','stat-yellow')}</div><section class="card card-pad"><div class="section-title"><h2>Cómo se usa</h2><button class="btn btn-secondary" onclick="seedMonetizationProducts()">Crear productos base recomendados</button></div><div class="manual-grid"><div class="manual-item"><b>Artista PRO</b><span>USD 3,99 mensual o USD 30 anual, cobrados en pesos al dólar oficial vendedor configurado. Herramientas y convenios PRO; perfil, Trabajo, Marketplace y contratación gratuitos.</span></div><div class="manual-item"><b>1 · Creá el producto</b><span>Ej.: “Evento destacado · Slider Cartelera · 7 días”. No es un cliente todavía; es lo que vendés.</span></div><div class="manual-item"><b>2 · Creá la campaña</b><span>Elegí el evento, artista, radio, película/serie o marca que compró ese espacio.</span></div><div class="manual-item"><b>3 · Confirmá el pago</b><span>Hasta que Pago = paid y Estado = active, no debería ocupar el espacio premium.</span></div><div class="manual-item"><b>4 · Vence solo</b><span>Inicio/fin permiten retirar destacados automáticamente con mantenimiento/Cron.</span></div></div><div class="placement-grid"><div><strong>Inicio · Entre colecciones</strong><small>Banner identificado, sin tapar contenido ni reproducción.</small></div><div><strong>Cartelera · Slider</strong><small>Evento destacado pago; la publicación normal sigue siendo gratuita.</small></div><div><strong>Artistas · En foco</strong><small>Impulso temporal de un perfil o productora.</small></div><div><strong>Radio · Convenios</strong><small>Presencia y patrocinio según acuerdo; sin tarifa automática.</small></div><div><strong>Radio Partner</strong><small>Convenio promocional + difusión de artistas/eventos UADAV.</small></div><div><strong>Entre secciones</strong><small>Banner o campaña de marca sin alterar el catálogo.</small></div></div></section><section class="card card-pad" style="margin-top:16px"><div class="section-title"><h2>Productos</h2><small>Definí precio cuando quieras; puede quedar “A convenir”.</small></div>${table(['Nombre','Entidad','Ubicación','Duración','Precio','Estado'],p.map(x=>`<tr><td><strong>${esc(x.name)}</strong></td><td>${esc(x.entity_type)}</td><td>${esc(x.placement)}</td><td>${Number(x.duration_days||7)} días</td><td>${esc(x.price_label||'A convenir')}</td><td>${x.active===false?'<span class="badge bad">Oculto</span>':'<span class="badge ok">Activo</span>'}</td></tr>`))}</section><section class="card card-pad" style="margin-top:16px"><div class="section-title"><h2>Campañas</h2><small>Cada campaña es un cliente/entidad usando un producto.</small></div>${table(['Entidad','Ubicación','Pago','Estado','Inicio','Fin','Acciones'],c.map((x,i)=>`<tr><td>${esc(x.entity_type)} · <strong>${esc(x.entity_id)}</strong></td><td>${esc(x.placement)}</td><td>${statusBadge(x.payment_status)}</td><td>${statusBadge(x.status)}</td><td>${esc(x.starts_at||'—')}</td><td>${esc(x.ends_at||'—')}</td><td><button class="btn btn-secondary btn-sm" onclick="editCampaign(${i})">Editar</button></td></tr>`))}</section><section class="card card-pad" style="margin-top:16px"><div class="section-title"><h2>Cobro PRO · transferencia directa</h2><small>Configuración administrable. No requiere editar código.</small></div><div class="form-grid"><div class="field"><label>Habilitado</label><select id="proPayEnabled" class="select"><option value="0" ${ps.enabled?'':'selected'}>No</option><option value="1" ${ps.enabled?'selected':''}>Sí</option></select></div><div class="field"><label>Moneda</label><input id="proPayCurrency" class="input" value="${esc(ps.currency||'ARS')}"></div><div class="field"><label>Importe mensual</label><input id="proPayMonthly" class="input" type="number" min="0" step="0.01" value="${esc(ps.monthly_amount||'')}"></div><div class="field"><label>Importe trimestral · legado</label><input id="proPayQuarterly" class="input" type="number" min="0" step="0.01" value="${esc(ps.quarterly_amount||'')}"></div><div class="field"><label>Importe semestral · legado</label><input id="proPaySemiannual" class="input" type="number" min="0" step="0.01" value="${esc(ps.semiannual_amount||'')}"></div><div class="field"><label>Importe anual</label><input id="proPayAmount" class="input" type="number" min="0" step="0.01" value="${esc(ps.annual_amount||'')}"></div><div class="field"><label>Titular</label><input id="proPayHolder" class="input" value="${esc(ps.account_holder||'')}"></div><div class="field"><label>Alias</label><input id="proPayAlias" class="input" value="${esc(ps.alias||'')}"></div><div class="field"><label>CBU / CVU</label><input id="proPayCbu" class="input" value="${esc(ps.cbu_cvu||'')}"></div><div class="field" style="grid-column:1/-1"><label>Instrucciones</label><textarea id="proPayInstructions" class="textarea" placeholder="Ej.: incluí el número de orden al informar el pago.">${esc(ps.instructions||'')}</textarea></div></div><div class="actions" style="margin-top:12px"><button class="btn btn-primary" onclick="saveProPaymentSettings()">Guardar configuración</button></div><p style="color:var(--muted);margin-top:10px">Estos datos se muestran al artista sólo cuando el cobro está habilitado. La aprobación sigue siendo manual después de verificar el ingreso real.</p></section><section class="card card-pad" style="margin-top:16px"><div class="section-title"><h2>Transferencias · Artista PRO</h2><small>Orden mensual o anual generada por esta instalación. Aprobar sólo después de verificar el ingreso real.</small></div>${table(['Orden','Artista','Plan','Importe','Estado','Informado','Acciones'],o.map(x=>`<tr><td><strong>${esc(x.id)}</strong></td><td>${esc(x.artist_id)}</td><td>${Number(x.duration_days||365)} días</td><td>${x.amount?esc(x.currency)+' '+Number(x.amount).toLocaleString('es-AR'):'A definir'}</td><td>${statusBadge(x.status)}</td><td>${esc(x.reported_at?String(x.reported_at).slice(0,16).replace('T',' '):'—')}</td><td><div class="actions">${x.status==='reported'?'<button class="btn btn-primary btn-sm" onclick="reviewProOrder(\''+esc(x.id)+'\',\'approve\')">Aprobar</button><button class="btn btn-danger btn-sm" onclick="reviewProOrder(\''+esc(x.id)+'\',\'reject\')">Rechazar</button>':'—'}</div></td></tr>`))}</section>`}
window.saveProPaymentSettings=async()=>{const body={enabled:$('proPayEnabled').value==='1',currency:$('proPayCurrency').value.trim()||'ARS',monthly_amount:Number($('proPayMonthly').value||0),quarterly_amount:Number($('proPayQuarterly').value||0),semiannual_amount:Number($('proPaySemiannual').value||0),annual_amount:Number($('proPayAmount').value||0),account_holder:$('proPayHolder').value.trim(),alias:$('proPayAlias').value.trim(),cbu_cvu:$('proPayCbu').value.trim(),instructions:$('proPayInstructions').value.trim()};await api('admin/pro-payment-settings',{method:'PUT',body});delete S.cache.paySettings;toast('Configuración de transferencia guardada');go('monetization',true)};
window.reviewProOrder=async(id,decision)=>{if(decision==='approve'&&!confirm('¿Verificaste que la transferencia '+id+' ingresó realmente?'))return;await api('admin/pro-payment-orders/review',{method:'POST',body:{order_id:id,decision}});delete S.cache.proOrders;delete S.cache.artists;toast(decision==='approve'?'Pago aprobado · PRO activado':'Pago rechazado');go('monetization',true)};
window.seedMonetizationProducts=async()=>{const base=[['Cartelera · Destacado · 7 días','event','cartelera_slider',7,'ARS 5.000'],['Cartelera · Destacado · 15 días','event','cartelera_slider',15,'ARS 10.000'],['Cartelera · Destacado · 30 días','event','cartelera_slider',30,'ARS 20.000'],['Artista PRO · mensual','artist','artist_pro',30,'USD 3,99 · pesos al oficial'],['Artista PRO · anual','artist','artist_pro',365,'USD 30 · pesos al oficial'],['Publicidad · Inicio entre colecciones','brand','infeed',7,'A convenir'],['Patrocinio de Cartelera','brand','cartelera_sponsor',30,'A convenir']];const existing=new Set(arr(S.cache.monProducts).map(x=>String(x.name).toLowerCase()));for(const [name,entity_type,placement,duration_days,price_label] of base)if(!existing.has(name.toLowerCase()))await api('monetization/products',{method:'POST',body:{name,entity_type,placement,duration_days,price_label,active:false}});delete S.cache.monProducts;toast('Catálogo preparado, productos inactivos hasta revisar entrega y cobros');go('monetization',true)};
window.editMonProduct=i=>{const x=i>=0?S.cache.monProducts[i]:{};modal(i>=0?'Editar producto':'Nuevo producto',`<div class="form-grid">${f('mpName','Nombre',x.name||'')}${sel('mpEntity','Entidad',x.entity_type||'event',[['event','Evento'],['artist','Artista'],['radio','Radio'],['media','Película/Serie'],['brand','Marca']])}${sel('mpPlacement','Ubicación',x.placement||'featured',[['artist_pro','Artista PRO · suscripción'],['hero','Hero'],['featured','Destacado'],['infeed','Entre secciones'],['radio_partner','Radio Partner'],['cartelera_slider','Slider Cartelera']])}${f('mpDays','Días',x.duration_days||7,'number')}${f('mpPrice','Precio / leyenda',x.price_label||'A convenir')}${sel('mpActive','Activo',x.active===false?'false':'true',[['true','Sí'],['false','No']])}</div>`,`<button class="btn btn-ghost" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="saveMonProduct(${i})">Guardar</button>`)};
window.saveMonProduct=async i=>{const old=i>=0?S.cache.monProducts[i]:{};const d={...old,name:$('mpName').value.trim(),entity_type:$('mpEntity').value,placement:$('mpPlacement').value,duration_days:Number($('mpDays').value||7),price_label:$('mpPrice').value.trim(),active:$('mpActive').value==='true'};if(i>=0){d.id=old.id;await api('monetization/products',{method:'PUT',body:d})}else await api('monetization/products',{method:'POST',body:d});delete S.cache.monProducts;closeModal();go('monetization',true)};
window.editCampaign=i=>{const x=i>=0?S.cache.monCampaigns[i]:{};modal(i>=0?'Editar campaña':'Nueva campaña',`<div class="form-grid">${f('mcEntityId','ID de entidad',x.entity_id||'')}${sel('mcEntity','Tipo',x.entity_type||'event',[['event','Evento'],['artist','Artista'],['radio','Radio'],['media','Película/Serie'],['brand','Marca']])}${sel('mcPlacement','Ubicación',x.placement||'featured',[['artist_pro','Artista PRO · suscripción'],['hero','Hero'],['featured','Destacado'],['infeed','Entre secciones'],['radio_partner','Radio Partner'],['cartelera_slider','Slider Cartelera']])}${sel('mcPay','Pago',x.payment_status||'pending',[['pending','Pendiente'],['paid','Pagado'],['waived','Bonificado']])}${sel('mcStatus','Estado',x.status||'pending',[['pending','Pendiente'],['active','Activa'],['paused','Pausada'],['expired','Vencida']])}${f('mcStart','Inicio',x.starts_at||'','date')}${f('mcEnd','Fin',x.ends_at||'','date')}${ta('mcNotes','Notas',x.notes||'','span-2')}</div>`,`<button class="btn btn-ghost" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="saveCampaign(${i})">Guardar</button>`)};
window.saveCampaign=async i=>{const old=i>=0?S.cache.monCampaigns[i]:{};const d={...old,entity_id:$('mcEntityId').value.trim(),entity_type:$('mcEntity').value,placement:$('mcPlacement').value,payment_status:$('mcPay').value,status:$('mcStatus').value,starts_at:$('mcStart').value,ends_at:$('mcEnd').value,notes:$('mcNotes').value.trim()};if(i>=0){d.id=old.id;await api('monetization/campaigns',{method:'PUT',body:d})}else await api('monetization/campaigns',{method:'POST',body:d});delete S.cache.monCampaigns;closeModal();go('monetization',true)};

VIEWS.jobs=async(force)=>{const [jobs,apps]=await Promise.all([cache('jobs',()=>api('bolsa_trabajo'),force),moduleCache('jobs','jobApps','bolsa_trabajo/postulaciones',force)]);S.jobTab=S.jobTab||'jobs';renderJobs()};
function renderJobs(){const jobs=arr(S.cache.jobs),apps=arr(S.cache.jobApps),tab=S.jobTab||'jobs';const body=tab==='jobs'?table(['Oportunidad','Rubro','Ciudad','Fecha','Estado','Acciones'],jobs.map((j,i)=>`<tr><td><strong>${esc(j.titulo)}</strong><small style="display:block;color:var(--muted)">${esc(j.creado_por||'')}</small></td><td>${esc(j.rubro||'—')}</td><td>${esc(j.ciudad||'—')}</td><td>${esc(j.fecha||'—')}</td><td>${j.activo!==false?'<span class="badge ok">Activa</span>':'<span class="badge bad">Oculta</span>'}</td><td><div class="actions"><button class="btn btn-secondary btn-sm" onclick="editJob(${i})">Editar</button><button class="btn btn-danger btn-sm" onclick="deleteJob(${i})">Eliminar</button></div></td></tr>`)):table(['Oportunidad','Artista','Contacto','Fecha','Estado'],apps.map(a=>`<tr><td>${esc(a.job_id)}</td><td><strong>${esc(a.artist_nombre||a.nombre||'—')}</strong></td><td>${esc(a.email||'—')}</td><td>${fmtDate(a.creado)}</td><td>${statusBadge(a.estado||'pendiente')}</td></tr>`));$('main').innerHTML=head('Bolsa de trabajo','Oportunidades abiertas al público; postulación reservada a afiliados verificados.',`<button class="btn btn-primary" onclick="editJob(-1)">+ Publicar oportunidad</button>`)+`<div class="toolbar"><div class="tabs"><button class="tab ${tab==='jobs'?'active':''}" onclick="S.jobTab='jobs';renderJobs()">Oportunidades ${jobs.length}</button><button class="tab ${tab==='apps'?'active':''}" onclick="S.jobTab='apps';renderJobs()">Postulaciones ${apps.length}</button></div></div>${body}`}
window.editJob=i=>{const j=i>=0?S.cache.jobs[i]:{};modal(i>=0?'Editar oportunidad':'Nueva oportunidad',`<div class="form-grid">${f('jTitle','Título',j.titulo||'')}${sel('jType','Tipo',j.tipo||'busqueda_artista',[['busqueda_artista','Búsqueda de artista'],['casting','Casting'],['musico','Músico'],['locutor','Locutor / conductor'],['tecnico','Técnico'],['produccion','Producción'],['servicio','Servicio'],['otro','Otro']])}${f('jRubro','Rubro / perfil buscado',j.rubro||'')}${sel('jClientType','Contratante',j.contratante_tipo||'productora',[['productora','Productora'],['empresa','Empresa'],['particular','Particular'],['sindicato','Sindicato'],['espacio','Espacio cultural']])}${f('jCompany','Empresa / Productora',j.empresa||'')}${sel('jMode','Modalidad',j.modalidad||'presencial',[['presencial','Presencial'],['remoto','Remoto'],['hibrido','Híbrido']])}${f('jCity','Ciudad',j.ciudad||'')}${f('jProvince','Provincia',j.provincia||'')}${f('jDate','Fecha de trabajo',j.fecha||'','date')}${f('jDeadline','Fecha límite',j.fecha_limite||'','date')}${sel('jPay','Remuneración',j.remuneracion||'a_convenir',[['a_convenir','A convenir'],['remunerado','Remunerado'],['canje','Canje / colaboración']])}${f('jEmail','Email',j.contacto_email||'','email')}${f('jWhatsapp','WhatsApp',j.whatsapp||'')}${f('jContact','Contacto / URL',j.contacto||'','','span-2')}${ta('jReq','Requisitos',j.requisitos||'','span-2')}${ta('jDesc','Descripción',j.descripcion||'','span-2')}${sel('jActive','Estado',j.activo===false?'false':'true',[['true','Activa'],['false','Oculta']])}</div>`,`<button class="btn btn-ghost" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="saveJob(${i})">Guardar</button>`)};

VIEWS.cct=async(force)=>{const [cfg,scales,assess,artists,financial,records]=await Promise.all([api('cct/categories',{auth:false}),cache('cctScales',()=>api('admin/cct/scales'),force).catch(()=>[]),cache('cctAssess',()=>api('admin/cct/assessments'),force).catch(()=>[]),cache('artistsAdmin',()=>api('admin/artistas'),force).catch(()=>[]),api('admin/cct/config').catch(()=>({registration_fee_mode:'manual'})),cache('cctRecords',()=>api('admin/cct/contracts'),force).catch(()=>[])]);S.cache.cctFinancial=financial;S.cache.cctCfg=cfg;S.cache.cctScales=scales;const cats=arr(cfg.categories),venues=arr(cfg.venues);const catOpts=cats.map(x=>`<option value="${esc(x.code)}">${esc(x.group)} · ${esc(x.label)}</option>`).join(''),venueOpts=venues.map(x=>`<option value="${esc(x.code)}">${esc(x.label)}</option>`).join(''),artistOpts=arr(artists).map(x=>{const p=x.nombre_artistico||x.nombre||x.stage_name||x.name||x.id;return `<option value="${esc(x.id||'')}">${esc(p)}</option>`}).join('');$('main').innerHTML=head('Convenio y fiscalización','CCT 340/75 ordenado por tarea: convenio, categorías, escalas vigentes, fiscalización y documentación. Las escalas vigentes se cargan manualmente; no usamos importes históricos del convenio.',`<button class="btn btn-secondary" onclick="editCctFinancial()">Arancel registro</button><button class="btn btn-primary" onclick="editCctScale()">+ Escala vigente</button>`)+`<div class="quick-grid" style="margin-bottom:16px"><a class="card quick-card" href="#cct-orientacion"><span class="qicon">⚖</span><span><strong>Convenio</strong><small>Orientación y encuadre del CCT 340/75.</small></span></a><a class="card quick-card" href="#cct-categorias"><span class="qicon">▦</span><span><strong>Categorías</strong><small>Especialidades y establecimientos.</small></span></a><a class="card quick-card" href="#cct-escalas"><span class="qicon">$</span><span><strong>Escalas vigentes</strong><small>Valores administrados, sin históricos automáticos.</small></span></a><a class="card quick-card" href="#cct-fiscalizacion"><span class="qicon">✓</span><span><strong>Fiscalización</strong><small>Contratos, controles y registros.</small></span></a></div>`+`<div class="grid" style="grid-template-columns:minmax(0,1.2fr) minmax(360px,.8fr)"><section id="cct-orientacion" class="card card-pad"><div class="section-title"><div><h2>Orientación del convenio</h2><small>Trabajo en vivo + contrato + aporte sindical + SADAIC/AADI cuando corresponda.</small></div></div><div class="form-grid"><div class="field"><label>Artista (opcional)</label><select id="cctArtist" class="select"><option value="">Caso sin artista vinculado</option>${artistOpts}</select></div><div class="field"><label>Categoría CCT</label><select id="cctCategory" class="select">${catOpts}</select></div><div class="field"><label>Tipo de establecimiento</label><select id="cctVenue" class="select">${venueOpts}</select></div><div class="field"><label>Categoría del local / escala</label><select id="cctVenueCat" class="select"><option value="general">General</option><option value="1ra">1ra categoría</option><option value="2da">2da categoría</option><option value="unica">Categoría única</option><option value="especial">Especial</option></select></div><div class="field"><label>Modalidad contractual</label><select id="cctContractType" class="select"><option value="actuacion">Por actuación</option><option value="plazo_fijo">Plazo fijo</option><option value="permanente">Tiempo indeterminado</option></select></div><div class="field"><label>Exclusividad</label><select id="cctExclusive" class="select"><option value="false">Sin exclusividad</option><option value="true">Con exclusividad</option></select></div><div class="field"><label>Día</label><select id="cctDay" class="select"><option value="weekday">Hábil</option><option value="weekend_holiday">Sábado / domingo / feriado / víspera</option></select></div><div class="field"><label>Cantidad de funciones</label><input id="cctFunctions" class="input" type="number" min="1" value="1"></div><div class="field"><label>Monto contractual bruto</label><input id="cctAmount" class="input" type="number" min="0" step="0.01" placeholder="ARS"></div><div class="field"><label>Valor contractual de una función</label><input id="cctPerFunction" class="input" type="number" min="0" step="0.01" placeholder="Solo si aplica"></div><div class="field"><label>Horas de permanencia</label><input id="cctHours" class="input" type="number" min="0" step="0.5"></div><div class="field"><label>Distancia desde residencia (km)</label><input id="cctDistance" class="input" type="number" min="0"></div><div class="field"><label>Empresario / contratante</label><input id="cctEmployer" class="input"></div><div class="field"><label>ID evento (opcional)</label><input id="cctEvent" class="input"></div></div><div class="check-grid" style="margin-top:14px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px"><label><input id="cctUadav" type="checkbox" checked> Artista inscripto/habilitado UADAV</label><label><input id="cctRegistered" type="checkbox"> Contrato registrado UADAV</label><label><input id="cctDays" type="checkbox"> Contrato indica días/horarios</label><label><input id="cctPay" type="checkbox"> Contrato indica remuneración</label><label><input id="cctPlace" type="checkbox"> Contrato indica lugar</label><label><input id="cctRecord" type="checkbox"> Habrá grabación/retransmisión</label><label><input id="cctRecordClause" type="checkbox"> Cláusula específica de grabación/retransmisión</label><label><input id="cctThird" type="checkbox"> Interviene tercero/contratista</label><label><input id="cctTour" type="checkbox"> Es gira</label><label><input id="cctComposer" type="checkbox"> Compone/escribe obras</label><label><input id="cctSadaic" type="checkbox"> SADAIC regularizado</label><label><input id="cctSetlist" type="checkbox"> Planilla de ejecución preparada</label><label><input id="cctPerformer" type="checkbox"> Intérprete en fonogramas</label><label><input id="cctAadi" type="checkbox"> AADI regularizado</label><label><input id="cctPhono" type="checkbox"> Fonogramas declarados</label><label><input id="cctCreateRecord" type="checkbox"> Guardar registro para fiscalización / recaudación</label></div><div class="actions" style="margin-top:16px"><button class="btn btn-primary" onclick="runCctAdmin()">Resolver y guardar</button></div><div id="cctResult" style="margin-top:14px"></div></section><section class="card card-pad"><div class="section-title"><div><h2>Qué controla UADAV</h2><small>Checklist operativo</small></div></div><div class="manual-grid"><div class="manual-item"><b>1 · Encuadramiento</b><span>Especialidad y modalidad comprendida por el CCT.</span></div><div class="manual-item"><b>2 · Contrato</b><span>Días, horarios, remuneración, lugar y grabación/retransmisión cuando exista.</span></div><div class="manual-item"><b>3 · Registro</b><span>Control del registro contractual y trazabilidad sindical.</span></div><div class="manual-item"><b>4 · Aporte sindical</b><span>El motor estima el 3% sobre el total informado/calculado para control, sujeto a validación.</span></div><div class="manual-item"><b>5 · Derechos musicales</b><span>SADAIC para autor/compositor y AADI/AADI-CAPIF para intérprete grabado, como circuitos separados.</span></div><div class="manual-item"><b>6 · Fiscalización</b><span>Guarda casos para inspectoría y seguimiento; no reemplaza dictamen gremial.</span></div></div></section></div><section class="card card-pad" style="margin-top:16px"><div class="section-title"><div><h2>Escalas vigentes cargadas por UADAV</h2><small>Los valores de 1975 son históricos; cargá aquí los mínimos actuales.</small></div></div>${table(['Categoría','Local','Exclusividad','Monto','Desde','Nota'],arr(scales).filter(x=>x.active!==0&&x.active!==false).map(x=>`<tr><td>${esc(cats.find(c=>c.code===x.category_code)?.label||x.category_code)}</td><td>${esc(x.venue_category||'general')}</td><td>${esc(x.exclusivity||'—')}</td><td><strong>${esc(x.currency||'ARS')} ${esc(x.amount||0)}</strong></td><td>${esc(x.effective_from||'—')}</td><td>${esc(x.note||'')}</td></tr>`))}</section><section class="card card-pad" style="margin-top:16px"><div class="section-title"><h2>Casos recientes</h2><small>${arr(assess).length} orientaciones guardadas</small></div>${table(['Fecha','Artista','Categoría','Cumplimiento','Alertas'],arr(assess).slice(0,50).map(x=>`<tr><td>${fmtDate(x.created_at)}</td><td>${esc(x.artist_id||'—')}</td><td>${esc(cats.find(c=>c.code===x.category_code)?.label||x.category_code||'—')}</td><td>${esc(x.result?.compliance_score??'—')}%</td><td>${esc((x.result?.alerts||[]).length)}</td></tr>`))}</section><section class="card card-pad" style="margin-top:16px"><div class="section-title"><h2>Registro de fiscalización / recaudación</h2><small>${arr(records).length} registros</small></div>${table(['Fecha','Artista','Contratante','Contrato','Aporte 3%','Registro','Inspección'],arr(records).slice(0,80).map(x=>`<tr><td>${fmtDate(x.created_at)}</td><td>${esc(x.artist_id||'—')}</td><td>${esc(x.employer_name||'—')}</td><td>${esc(x.contract_amount||0)}</td><td>${esc(x.union_contribution||0)}</td><td>${statusBadge(x.registration_status||'pendiente')}</td><td>${statusBadge(x.inspection_status||'pendiente')}</td></tr>`))}</section>`};

window.runCctAdmin=async()=>{const b={artist_id:$('cctArtist').value,category_code:$('cctCategory').value,venue_type:$('cctVenue').value,venue_category:$('cctVenueCat').value,contract_type:$('cctContractType').value,exclusive:$('cctExclusive').value==='true',day_type:$('cctDay').value,functions:Number($('cctFunctions').value||1),contract_amount:Number($('cctAmount').value||0),base_function_amount:Number($('cctPerFunction').value||0),hours:Number($('cctHours').value||0),distance_km:Number($('cctDistance').value||0),uadav_registered_artist:$('cctUadav').checked,contract_registered:$('cctRegistered').checked,contract_has_days_hours:$('cctDays').checked,contract_has_compensation:$('cctPay').checked,contract_has_place:$('cctPlace').checked,recording_or_retransmission:$('cctRecord').checked,recording_clause:$('cctRecordClause').checked,third_party_contract:$('cctThird').checked,is_tour:$('cctTour').checked,is_composer:$('cctComposer').checked,sadaic_registered:$('cctSadaic').checked,sadaic_setlist:$('cctSetlist').checked,is_recorded_performer:$('cctPerformer').checked,aadi_registered:$('cctAadi').checked,phonograms_declared:$('cctPhono').checked,employer_name:$('cctEmployer').value.trim(),event_id:$('cctEvent').value.trim(),create_contract_record:$('cctCreateRecord').checked,save:true};const d=await api('admin/cct/resolve',{method:'POST',body:b});const r=d.result||{};$('cctResult').innerHTML=`<div class="callout"><strong>Resultado orientativo · ${esc(r.compliance_score||0)}% de checklist</strong><br>Total estimado: <b>${esc(r.calculation?.total_estimated||0)}</b> · Aporte sindical estimado 3%: <b>${esc(r.calculation?.union_contribution_estimated||0)}</b> · Arancel registro: <b>${r.calculation?.registration_fee_estimated==null?'validar manualmente':esc(r.calculation.registration_fee_estimated)}</b></div><div class="grid" style="grid-template-columns:1fr 1fr;margin-top:10px"><div class="json-box"><b>Acciones</b>\n${esc((r.actions||[]).map(x=>'• '+x).join('\n')||'Sin acciones pendientes')}</div><div class="json-box"><b>Alertas / contrato</b>\n${esc([...(r.alerts||[]),...(r.contract_checks||[])].map(x=>'• '+x).join('\n')||'Sin alertas')}</div></div><div class="json-box" style="margin-top:10px"><b>Canales de cobro/derechos</b>\n${esc(JSON.stringify(r.rights||[],null,2))}</div>`;delete S.cache.cctAssess;delete S.cache.cctRecords;toast('Orientación CCT guardada')};
window.editCctFinancial=()=>{const c=S.cache.cctFinancial||{};modal('CCT · Arancel de registro vigente',`<div class="form-grid">${sel('cfMode','Modo',c.registration_fee_mode||'manual',[['manual','Validación manual / sin cálculo automático'],['percent','Porcentaje sobre contrato'],['fixed','Monto fijo']])}${f('cfPct','Porcentaje',c.registration_fee_pct||0,'number')}${f('cfFixed','Monto fijo',c.registration_fee_fixed||0,'number')}${f('cfCurrency','Moneda',c.currency||'ARS')}${ta('cfNote','Nota / resolución / criterio vigente',c.note||'','span-2')}</div><div class="callout" style="margin-top:12px"><b>Aporte sindical del artista:</b> el Asistente mantiene 3% como referencia del Art. 40 del CCT. El arancel de registro se configura aparte porque los importes/umbrales impresos en 1975 son históricos.</div>`,`<button class="btn btn-ghost" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="saveCctFinancial()">Guardar</button>`)};

window.editCctScale=()=>{const cfg=S.cache.cctCfg||{},cats=arr(cfg.categories);modal('Nueva escala vigente',`<div class="form-grid"><div class="field"><label>Categoría</label><select id="csCategory" class="select">${cats.map(x=>`<option value="${esc(x.code)}">${esc(x.label)}</option>`).join('')}</select></div>${sel('csVenue','Categoría del local','general',[['general','General'],['1ra','1ra categoría'],['2da','2da categoría'],['unica','Categoría única'],['especial','Especial']])}${sel('csExclusive','Exclusividad','',[['','Cualquiera'],['exclusive','Con exclusividad'],['nonexclusive','Sin exclusividad']])}${f('csAmount','Monto vigente','','number')}${f('csCurrency','Moneda','ARS')}${f('csFrom','Vigente desde','','date')}${ta('csNote','Nota / resolución / fuente interna','','span-2')}</div>`,`<button class="btn btn-ghost" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="saveCctScale()">Guardar escala</button>`)};

VIEWS.prospecting=async(force)=>{const [cfg,yt]=await Promise.all([cache('prosCfg',()=>api('admin/prospecting/config'),force),cache('ytProvider',()=>api('admin/youtube-provider'),force)]);$('main').innerHTML=head('Prospección','Descubrimiento controlado. Invidious es la fuente normal; YouTube oficial se usa únicamente si Invidious no devuelve resultados.',`<button class="btn btn-secondary" onclick="checkInvidious()">Probar Invidious</button>`)+`<section class="card card-pad"><div class="section-title"><div><h2>¿Qué querés descubrir?</h2><small>Música, artes escénicas, espacios, industria y creadores se mantienen separados.</small></div></div><div class="actions" style="margin-bottom:14px;flex-wrap:wrap">${[['music','Música'],['theatre','Teatro'],['circus','Circo'],['dance','Danza'],['humor','Humor'],['venues','Salas'],['producers','Productoras'],['creators','Creadores']].map(([k,t])=>`<button class="btn btn-ghost btn-sm" onclick="setProspectingPreset('${k}')">${t}</button>`).join('')}</div><div class="form-grid">${f('prosQ','Búsqueda / nombre / género','')}${sel('prosCat','Categoría','all',[['all','General'],['music','Música / artistas'],['solista','Solistas'],['banda','Bandas / grupos'],['rock','Rock'],['pop','Pop'],['tropical','Tropical / Cumbia'],['folklore','Folklore'],['tango','Tango'],['urbano','Urbano'],['dj','DJ'],['theatre','Teatro'],['circus','Circo'],['dance','Danza'],['magic','Magia'],['humor','Humor'],['locucion','Locución / conducción'],['grupo','Compañías / elencos'],['creators','Creadores / YouTubers'],['venues','Salas / espacios'],['producers','Productoras']])}${sel('prosType','Tipo de recurso','channel,video',[['channel,video','Canales + videos'],['channel','Solo canales'],['video','Solo videos']])}<div class="field"><label>&nbsp;</label><button class="btn btn-primary" onclick="runProspecting()">⌕ Buscar candidatos</button></div></div><div style="margin-top:14px;display:flex;gap:10px;flex-wrap:wrap"><span class="badge ok">Invidious · prioritario</span>${yt.enabled?'<span class="badge warn">YouTube API · último fallback</span>':'<span class="badge">YouTube API desactivada</span>'}<span class="badge info">Guardar → Artistas / Prospectos</span></div></section><div id="prosSummary" style="margin:16px 0;color:var(--muted)"></div><div id="prosResults" class="grid prospect-grid"><div class="empty card">Ejecutá una búsqueda para ver candidatos.</div></div>`};
window.setProspectingPreset=k=>{const map={music:'música artistas bandas Argentina',theatre:'teatro actores compañías Argentina',circus:'circo artistas circenses Argentina',dance:'danza bailarines compañías Argentina',humor:'humor comediantes Argentina',venues:'salas teatros espacios culturales Argentina',producers:'productoras espectáculos Argentina',creators:'creadores youtubers streamers Argentina'};$('prosCat').value=k;$('prosQ').value=map[k]||''};
window.runProspecting=async()=>{const box=$('prosResults'),sum=$('prosSummary');box.innerHTML='<div class="card card-pad loading">Buscando primero en Invidious…</div>';sum.textContent='';try{const qs=new URLSearchParams({q:$('prosQ').value.trim(),category:$('prosCat').value,type:$('prosType').value,limit:'24'});const d=await api('admin/prospecting/search?'+qs);S.prospectResults=arr(d.results);const sources={};S.prospectResults.forEach(r=>sources[r.source]=(sources[r.source]||0)+1);sum.textContent=`${S.prospectResults.length} candidatos · ${Object.entries(sources).map(([k,v])=>k+': '+v).join(' · ')}`;box.innerHTML=S.prospectResults.map((r,i)=>{const isVideo=r.resource_type==='video';const primary=isVideo?(r.channel_name||r.title):(r.title||r.channel_name);const secondary=isVideo?`Video detectado: ${r.title}`:(r.category||'Canal');return `<article class="card prospect-card"><img src="${esc(r.thumbnail||FALLBACK)}" onerror="this.src='${FALLBACK}'"><div class="prospect-body"><div class="source">${esc(r.source||'invidious')} · ${esc(r.resource_type||'')}</div><h3>${esc(primary||'Candidato')}</h3><p>${esc(secondary||'')}</p><div class="actions"><button class="btn btn-primary btn-sm" onclick="saveProspectByIndex(${i})">Guardar prospecto</button>${r.channel_id||r.resource_type==='channel'?`<button class="btn btn-secondary btn-sm" onclick="importProspectProfile(${i})">Crear perfil completo</button>`:''}<button class="btn btn-ghost btn-sm" onclick="restrictProspectByIndex(${i})">Restringir</button></div></div></article>`}).join('')||'<div class="empty card">Sin resultados.</div>'}catch(e){box.innerHTML=`<div class="empty card">No se pudo completar la búsqueda: ${esc(e.message)}</div>`;toast(e.message,'bad')}};

window.previewImport=async()=>{const file=$('importFile').files?.[0];if(!file)return toast('Seleccioná un archivo','bad');S.importBatches=[];try{if(/\.json$/i.test(file.name)){const data=JSON.parse(await file.text());const entity=$('importEntity').value==='auto'?'artists':$('importEntity').value;const rows=(Array.isArray(data)?data:(data.rows||[])).map(r=>normalizeImportRow(r,entity)).filter(x=>importValid(entity,x));S.importBatches=[{entity,rows,sheet:'JSON'}]}else if(window.XLSX){const buf=await file.arrayBuffer(),wb=XLSX.read(buf,{type:'array'}),chosen=$('importEntity').value;if(chosen==='auto'){for(const name of wb.SheetNames){const entity=sheetEntity(name);if(!entity)continue;const raw=XLSX.utils.sheet_to_json(wb.Sheets[name],{defval:''});const rows=raw.map(r=>normalizeImportRow(r,entity)).filter(x=>importValid(entity,x));if(rows.length)S.importBatches.push({entity,rows,sheet:name})}}else{const name=wb.SheetNames[0],raw=XLSX.utils.sheet_to_json(wb.Sheets[name],{defval:''}),rows=raw.map(r=>normalizeImportRow(r,chosen)).filter(x=>importValid(chosen,x));S.importBatches=[{entity:chosen,rows,sheet:name}]}}else throw new Error('No se pudo cargar el lector de Excel')}catch(e){return toast('No se pudo leer el archivo: '+e.message,'bad')}S.importRows=S.importBatches.flatMap(b=>b.rows);const summary={archivo:file.name,total:S.importRows.length,lotes:S.importBatches.map(b=>({hoja:b.sheet,tipo:b.entity,registros:b.rows.length,muestra:b.rows.slice(0,2)}))};$('importPreview').textContent=JSON.stringify(summary,null,2);$('importCommit').disabled=!S.importRows.length};

window.exportArtistProfilesXLSX=async()=>{if(!window.XLSX)return toast('Excel no disponible','bad');const [artists,content,events]=await Promise.all([api('artistas'),api('content?all=true').catch(()=>[]),api('cartelera').catch(()=>[])]);const cl=arr(content),ev=arr(events),clean=v=>decodeImportText(v||'');const rows=arr(artists).map(a=>{const id=String(a.id||''),ac=cl.filter(x=>String(x.artist_id||'')===id),ae=ev.filter(x=>String(x.artista_id||'')===id||String(x.artistas||'').includes(id));return{ID:id,Nombre:clean(a.nombre_artistico||a.nombre),Rubro:a.rubro,Ciudad:a.ciudad,Provincia:a.provincia,Pais:a.pais,Email:a.email,WhatsApp:a.whatsapp,Canal:a.canal||a.youtube_id,Spotify:a.spotify_url,Web:a.web,Foto:a.foto,Portada:a.portada,Bio:clean(a.bio),Origen:a.origen||a.source,Visible:a.visible!==false,Afiliado_verificado:a.afiliado_verificado===true,Perfil_reclamado:a.claimed===true,Suscriptores_YouTube:a.stats?.youtube_subscribers||'',Vistas_YouTube:a.stats?.youtube_views||'',Contenido:ac.length,Eventos:ae.length,Redes:JSON.stringify(a.redes||{})}});const flat=x=>{const o={...x};for(const k in o){if(typeof o[k]==='object'&&o[k]!==null)o[k]=JSON.stringify(o[k]);else if(typeof o[k]==='string')o[k]=clean(o[k])}return o};const playlists=cl.filter(x=>String(x.content_type||x.tipo||'').toLowerCase()==='playlist'),podcasts=cl.filter(x=>/podcast|episode|rss/i.test(String(x.content_type||x.tipo||x.categoria||''))),fuentes=arr(artists).flatMap(a=>{const base={artist_id:a.id,artista:clean(a.nombre_artistico||a.nombre)};return Object.entries({...a.redes,web:a.web,youtube:a.canal||a.youtube_id,spotify:a.spotify_url}).filter(([,v])=>v).map(([tipo,url])=>({...base,tipo,url}))}),quality=arr(artists).map(a=>{const issues=[];if(!a.foto)issues.push('Sin foto');if(!a.portada)issues.push('Sin portada');if(!a.bio)issues.push('Sin bio');if(!a.canal&&!a.youtube_id)issues.push('Sin canal');if(!a.rubro)issues.push('Sin rubro');const score=Math.max(0,100-issues.length*20);return{ID:a.id,Artista:clean(a.nombre_artistico||a.nombre),Completitud:score+'%',Pendientes:issues.join(' · ')||'Completo'}});const wb=XLSX.utils.book_new();for(const [name,data] of [['Perfiles',rows],['Contenido',cl.map(flat)],['Playlists',playlists.map(flat)],['Podcast',podcasts.map(flat)],['Eventos',ev.map(flat)],['Fuentes',fuentes],['Calidad',quality]])XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(data),name);XLSX.writeFile(wb,`UADAV STREAM-perfiles-completos-${new Date().toISOString().slice(0,10)}.xlsx`)};

VIEWS.manuals=async()=>{$('main').innerHTML=head('Ayuda y manuales','Guía práctica de cada módulo. La idea es que puedas trabajar sin recordar detalles técnicos.')+`<div class="actions" style="margin-bottom:14px"><a class="btn btn-primary" href="/manual.html" target="_blank">Abrir manual completo</a></div><div class="manual-grid full"><div class="manual-item"><b>Resumen</b><span>Usalo para ver pendientes y actividad. Tu trabajo diario debería empezar acá.</span></div><div class="manual-item"><b>Home y secciones</b><span>Creá filas manuales, automáticas o híbridas. Manual = elegís todo; automática = reglas; híbrida = fijos + relleno automático.</span></div><div class="manual-item"><b>Artistas</b><span>Catálogo central. Crear manualmente, importar Excel, prospectar, reclamar perfiles o enriquecer desde canal. Afiliación se controla aparte.</span></div><div class="manual-item"><b>Productoras</b><span>Registrá convenio, contacto y origen. Podés importar sus artistas desde la plantilla Productora.</span></div><div class="manual-item"><b>Radios</b><span>Nombre + Stream son mínimos. Metadata permite “Ahora suena” y carátulas. Pauta/destacada controla la capa comercial.</span></div><div class="manual-item"><b>Eventos / Cartelera</b><span>Evento normal se publica. Si solicita destaque, la campaña premium se revisa/paga y ocupa slider/Hero por tiempo.</span></div><div class="manual-item"><b>Películas y Series</b><span>Guardamos metadata + URL/embeds autorizados. Series: título → temporadas → episodios.</span></div><div class="manual-item"><b>Bolsa de trabajo</b><span>Publicación abierta; administración puede ocultar/eliminar. Postulación de artista queda según reglas UADAV.</span></div><div class="manual-item"><b>Prospección</b><span>Invidious primero, YouTube oficial último fallback. Guardar prospecto NO publica: va a Artistas → Prospectos.</span></div><div class="manual-item"><b>Contenido / Playlists / Podcast</b><span>Biblioteca universal por URL. No alojamos archivos. Relacioná contenido con artist_id cuando corresponda.</span></div><div class="manual-item"><b>Importar / exportar</b><span>Usá “Todo / detectar hojas” con la plantilla completa. Primero analizar, luego importar. Exportá perfiles completos para respaldo operativo.</span></div><div class="manual-item"><b>Monetización</b><span>Producto = lo que vendés. Campaña = quién lo compró. Confirmá pago + fecha inicio/fin; el sistema puede vencerlo solo.</span></div><div class="manual-item"><b>CCT 340/75 / Derechos</b><span>Usá el Asistente CCT para clasificar especialidad, revisar contrato, funciones, aporte sindical y circuitos SADAIC/AADI. Las escalas vigentes se cargan desde Admin; los importes históricos no se usan.</span></div><div class="manual-item"><b>D1 / IA / automatización</b><span>D1 ordena registros; KV queda como respaldo/config. Gemini ayuda a clasificar y detectar faltantes, nunca decide afiliación/pagos.</span></div><div class="manual-item"><b>Auditoría</b><span>Revisá quién/qué cambió y exportá copias. Antes de cambios grandes, hacé Backup D1 JSON.</span></div></div><section class="card card-pad" style="margin-top:16px"><div class="section-title"><h2>Flujo recomendado diario</h2></div><ol class="manual-steps"><li>Resumen → revisar pendientes.</li><li>Resolver reclamos/destacados/pedidos excepcionales.</li><li>Importar nuevas listas si llegaron.</li><li>Enriquecer perfiles incompletos.</li><li>Revisar campañas con vencimiento.</li><li>Backup periódico.</li></ol></section>`};

VIEWS.system=async(force)=>{const [h,d1,yt,cfg]=await Promise.all([api('v7/health',{auth:false}),api('admin/d1/status'),api('admin/youtube-provider'),cache('config',()=>api('config'),force)]);S.cache.config=cfg;const mods=effectiveModules(cfg);$('main').innerHTML=head('Sistema','Centro de configuración, módulos, base de datos, proveedores y automatización.',`<button class="btn btn-secondary" onclick="refreshSystemPills();go('system',true)">↻ Actualizar</button>`)+`<div class="toolbar"><div class="tabs">${[['setup','Nueva instalación'],['modules','Módulos'],['database','Base de datos'],['providers','Proveedores'],['automation','Automatización']].map(([id,t])=>`<button class="tab ${(S.systemTab||'modules')===id?'active':''}" onclick="S.systemTab='${id}';go('system')">${t}</button>`).join('')}</div></div><div class="grid stats-grid">${stat('DB','D1',d1.configured?'OK':'NO',d1.configured?`${arr(d1.tables).length} tablas`:'No configurada','stat-green')}${stat('◇','Gemini',h.ai?.gemini?'ON':'OFF','IA principal','stat-violet')}${stat('▶','YouTube',yt.enabled?'Fallback ON':'Fallback OFF','Invidious primero','stat-cyan')}${stat('✉','Email',h.automation?.email?'ON':'OFF','Automatización','stat-yellow')}</div>${renderSystemTab(mods,d1,h,yt)}`};
function renderSystemTab(mods,d1,h,yt){const tab=S.systemTab||'setup';if(tab==='setup')return renderSetupChecklist(mods,d1,h,yt);if(tab==='modules')return `<section class="card card-pad"><div class="section-title"><div><h2>Módulos de esta marca</h2><small>Activá sólo las funciones que necesita esta instalación white-label.</small></div></div><div class="form-grid">${[['artists','Artistas'],['radio','Radio'],['podcasts','Podcast'],['iptv','Live / IPTV'],['events','Cartelera'],['jobs','Bolsa de trabajo'],['marketplace','Marketplace'],['ticketing','Solicitudes de entradas'],['pro','Artista PRO'],['ads','Publicidad'],['union','Sindicato / CCT']].map(([k,t])=>sel('sysmod_'+k,t,mods[k]===false?'false':'true',[['true','Activo'],['false','Oculto']])).join('')}</div><div class="actions" style="margin-top:16px"><button class="btn btn-primary" onclick="saveSystemModules()">Guardar módulos</button></div><p style="color:var(--muted)">Ocultar un módulo no elimina sus datos. Sindicato / CCT permanece separado del CORE y está apagado por defecto en una instalación nueva.</p></section>`;if(tab==='database')return `<section class="card card-pad"><div class="section-title"><div><h2>Base de datos D1</h2><small>Inicialización, migración, diagnóstico y copia de seguridad sin editar SQL manualmente.</small></div></div><div class="actions"><button class="btn btn-secondary" onclick="initD1()">Reparar / inicializar D1</button><button class="btn btn-primary" onclick="migrateD1()">Migrar KV → D1</button><button class="btn btn-secondary" onclick="exportAll()">Backup D1 JSON</button><button class="btn btn-ghost" onclick="go('diagnostics')">Diagnóstico</button></div><div class="json-box" style="margin-top:14px">${esc(JSON.stringify(d1,null,2))}</div></section>`;if(tab==='providers')return `<div class="grid" style="grid-template-columns:1fr 1fr"><section class="card card-pad"><div class="section-title"><h2>YouTube / Invidious</h2></div><p><span class="badge ok">Invidious siempre primero</span></p><p>${yt.enabled?'<span class="badge warn">API YouTube como último fallback</span>':'<span class="badge">Fallback YouTube apagado</span>'}</p></section><section class="card card-pad"><div class="section-title"><h2>Asistente IA</h2></div><p>Gemini: ${h.ai?.gemini?'<span class="badge ok">Activo</span>':'<span class="badge">No disponible</span>'} · Groq: ${h.ai?.groq?'<span class="badge ok">Activo</span>':'<span class="badge">No disponible</span>'}</p><textarea id="aiQuestion" class="textarea" placeholder="Ej.: ¿Qué tareas pendientes debería revisar primero?"></textarea><button class="btn btn-primary" style="margin-top:10px" onclick="askAI()">Analizar</button><div id="aiAnswer" class="json-box" style="margin-top:14px">La IA nunca ejecuta acciones por sí sola.</div></section></div>`;return `<section class="card card-pad"><div class="section-title"><h2>Automatización</h2></div><p style="color:var(--muted)">Vencimientos, destacados, reintentos y notificaciones. Email puede permanecer apagado sin impedir el funcionamiento normal.</p><div class="actions"><button class="btn btn-secondary" onclick="runMaintenance()">Ejecutar mantenimiento ahora</button></div><div class="json-box" style="margin-top:14px">${esc(JSON.stringify(h.automation||{},null,2))}</div></section>`}
function renderSetupChecklist(mods,d1,h,yt){const c=obj(S.cache.config),b=obj(c.branding||c.platform),seo=obj(c.seo),checks=[['Identidad',!!b.name&&!!b.logo_url,'Nombre y logo de la marca'],['Color y soporte',!!b.primary_color&&!!b.support_email,'Color principal y email de soporte'],['Dominio',/^https?:\/\//.test(String(seo.canonical_origin||'')),'Dominio canónico'],['SEO',!!seo.title&&!!seo.description,'Título y descripción'],['Buscadores',!!seo.google_site_verification||!!seo.msvalidate_01,'Google o Bing verificado'],['Base D1',d1.configured===true,'D1 enlazada y accesible'],['Módulos',Object.values(mods).some(Boolean),'Funciones elegidas'],['Prefijos',!!obj(c.commerce).order_prefix&&!!obj(c.security).artist_token_prefix,'Órdenes y acceso de artistas'],['Proveedor multimedia',true,'Invidious base; YouTube fallback opcional'],['IA opcional',true,h.ai?.gemini?'Gemini disponible':'Puede quedar desactivada']];const done=checks.filter(x=>x[1]).length,pct=Math.round(done/checks.length*100);return `<section class="card card-pad"><div class="section-title"><div><h2>Nueva instalación / Puesta en marcha</h2><small>Checklist de esta marca. No crea recursos de Cloudflare: verifica que la instalación esté preparada.</small></div><span class="badge ${pct===100?'ok':'warn'}">${done}/${checks.length} · ${pct}%</span></div><div style="height:10px;background:#0f1729;border-radius:99px;overflow:hidden;margin:12px 0 20px"><div style="height:100%;width:${pct}%;background:var(--platform-primary,#2f6df6)"></div></div><div class="manual-list">${checks.map(x=>`<div class="manual-item"><b>${x[1]?'✓':'○'} ${esc(x[0])}</b><span>${esc(x[2])}</span></div>`).join('')}</div><div class="actions" style="margin-top:18px"><button class="btn btn-primary" onclick="go('pages')">Configurar identidad y SEO</button><button class="btn btn-secondary" onclick="S.systemTab='modules';go('system')">Elegir módulos</button><button class="btn btn-secondary" onclick="S.systemTab='database';go('system')">Revisar D1</button></div><div class="json-box" style="margin-top:16px"><b>Fuera del Admin:</b> cada marca debe tener repo, Pages, Worker, D1, KV, dominio y secretos independientes. El Admin configura la aplicación; no debe simular que creó esos recursos externos.</div></section>`}
window.saveSystemModules=async()=>{const cfg={...obj(S.cache.config),modules:moduleValues('sysmod_')};await saveJSON('config',cfg);S.cache.config=cfg;renderNav();toast('Módulos de la marca guardados');go('system',true)};

window.runMaintenance=async()=>{const d=await api('admin/maintenance',{method:'POST'});toast(`Mantenimiento: ${d.expiredFeatures||0} destacados vencidos · ${d.expiredJobs||0} oportunidades cerradas`);go('system',true)};
window.initD1=async()=>{if(!confirm('¿Inicializar las tablas D1 faltantes?'))return;const d=await api('admin/d1/init',{method:'POST'});toast('D1 inicializada · '+(d.queries||0)+' consultas');go('system',true)};window.migrateD1=async()=>{if(!confirm('¿Copiar registros compatibles de KV a D1? KV no será eliminado.'))return;await api('v7/migrate_kv',{method:'POST'});toast('Migración KV → D1 completada');go('system',true)};window.askAI=async()=>{const q=$('aiQuestion').value.trim();if(!q)return;const box=$('aiAnswer');box.textContent='Analizando…';const d=await api('v7/ai/assistant',{method:'POST',body:{question:q,context:{stats:S.cache.stats||{},view:S.view}}});box.textContent=JSON.stringify(d.result||d,null,2)};

VIEWS.audit=async(force)=>{S.cache.audit=await cache('audit',()=>api('admin/audit-log'),force);$('main').innerHTML=head('Auditoría y exportación','Trazabilidad central y copias descargables.',`<button class="btn btn-primary" onclick="exportAll()">Exportar D1 JSON</button>`)+`<section class="card card-pad"><div class="section-title"><h2>Actividad reciente</h2><small>Últimos 100 registros</small></div>${table(['Acción','Entidad','ID','Fecha'],arr(S.cache.audit).map(a=>`<tr><td><strong>${esc(a.action||'—')}</strong></td><td>${esc(a.entity_type||'—')}</td><td>${esc(a.entity_id||'—')}</td><td>${fmtDate(a.created_at||a.fecha)}</td></tr>`))}</section><section class="card card-pad" style="margin-top:16px"><div class="section-title"><h2>Exportaciones rápidas</h2></div><div class="actions"><button class="btn btn-secondary" onclick="exportCurrent('artists')">Artistas CSV</button><button class="btn btn-secondary" onclick="exportCurrent('radios')">Radios CSV</button><button class="btn btn-secondary" onclick="exportCurrent('events')">Eventos CSV</button><button class="btn btn-secondary" onclick="downloadRights()">SADAIC / AADI / CAPIF</button></div></section>`};
window.exportAll=async()=>{const r=await api('v7/export',{raw:true});if(!r.ok)throw new Error('No se pudo exportar');downloadBlob(await r.blob(),String(S.cache.config?.branding?.name||'platform').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')+'-d1-backup-'+new Date().toISOString().slice(0,10)+'.json')};
window.downloadRights=async()=>{const r=await api('admin/rights-export?month='+new Date().toISOString().slice(0,7),{raw:true});downloadBlob(await r.blob(),'uadav-rights.csv')};
window.exportCurrent=async type=>{let data=[];if(type==='artists')data=await api('artistas');if(type==='radios')data=await api('radios');if(type==='events')data=await api('cartelera');downloadBlob(new Blob([toCSV(arr(data))],{type:'text/csv'}),type+'.csv')};
function toCSV(list){if(!list.length)return'';const keys=Array.from(new Set(list.flatMap(x=>Object.keys(x)))).filter(k=>typeof list.find(x=>x[k]!==undefined)?.[k]!=='object');return [keys.join(','),...list.map(x=>keys.map(k=>'"'+String(x[k]??'').replace(/"/g,'""')+'"').join(','))].join('\n')}function downloadBlob(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}

VIEWS.diagnostics=async()=>{const [h,d1,search]=await Promise.all([api('health',{auth:false}),api('admin/d1/status'),api('admin/search-diagnostic?q=UADAV STREAM').catch(e=>({status:'ERROR',error:e.message}))]);$('main').innerHTML=head('Diagnóstico','Estado real del Worker, D1 y búsqueda.',`<button class="btn btn-primary" onclick="go('diagnostics',true)">Ejecutar de nuevo</button>`)+`<div class="grid" style="grid-template-columns:repeat(3,minmax(0,1fr))"><section class="card card-pad"><div class="section-title"><h2>Worker</h2>${h.ok?'<span class="badge ok">OK</span>':'<span class="badge bad">ERROR</span>'}</div><div class="json-box">${esc(JSON.stringify(h,null,2))}</div></section><section class="card card-pad"><div class="section-title"><h2>D1</h2>${d1.configured?'<span class="badge ok">OK</span>':'<span class="badge warn">NO</span>'}</div><div class="json-box">${esc(JSON.stringify(d1,null,2))}</div></section><section class="card card-pad"><div class="section-title"><h2>Búsqueda</h2>${search.status==='OK'?'<span class="badge ok">OK</span>':'<span class="badge warn">Revisar</span>'}</div><div class="json-box">${esc(JSON.stringify(search,null,2))}</div></section></div>`};
