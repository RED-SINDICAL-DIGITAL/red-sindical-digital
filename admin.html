<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Control - BEATPLAY / UADAVSTREAM</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: { uadav: { accent: '#00e5ff', dark: '#050505', card: '#0f0f13', border: '#1f1f26' } }, fontFamily: { sans: ['Outfit', 'sans-serif'] } } } }
  </script>
  <style>
    body { background-color: #050505; color: #E2E8F0; font-family: 'Outfit', sans-serif; }
    input, textarea, select { background: #0a0a0c; border: 1px solid #1f1f26; border-radius: 8px; padding: 8px; width: 100%; color: white; margin-bottom: 8px; }
    label { font-size: 11px; text-transform: uppercase; color: #64748b; margin-bottom: 4px; display: block; }
    .btn { padding: 8px 16px; border-radius: 8px; font-weight: 700; font-size: 12px; cursor: pointer; }
    .btn-save { background: #00e5ff; color: #050505; }
    .btn-del { background: #dc2626; color: white; }
    .btn-edit { background: #3b82f6; color: white; }
    .item-box { background: #0f0f13; border: 1px solid #1f1f26; padding: 15px; border-radius: 12px; margin-bottom: 10px; }
  </style>
</head>
<body class="p-4 sm:p-8 min-h-screen">
  <div class="max-w-5xl mx-auto">
    <div class="flex justify-between items-center mb-8 border-b border-uadav-border pb-4">
      <h1 class="text-2xl font-black text-white">Panel de Control</h1>
      <div class="flex gap-2">
        <input type="password" id="adminKeyInput" placeholder="Pegar ADMIN_KEY aquí..." class="w-64">
        <button onclick="conectar()" class="btn bg-uadav-accent text-black">Conectar</button>
      </div>
    </div>

    <div id="panelContent" class="hidden space-y-8">

      <!-- APARIENCIA Y MARCA -->
      <div class="border border-uadav-border rounded-xl p-4">
        <h2 class="text-xl font-black mb-4 text-uadav-accent">🎨 Apariencia y Marca</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div><label>Logo (URL de imagen)</label><input id="marcaLogo" placeholder="https://..."></div>
          <div><label>Título del Sitio</label><input id="marcaTitulo" placeholder="UADAVSTREAM o BEATPLAY"></div>
          <div><label>Eslogan / Subtítulo</label><input id="marcaEslogan" placeholder="Entretenimiento, Teatros & Música Global"></div>
          <div><label>Color Principal (Acento)</label><input type="color" id="marcaColorAcento" value="#00e5ff"></div>
          <div><label>Color de Fondo</label><input type="color" id="marcaColorFondo" value="#050505"></div>
          <div><label>Color de Tarjetas</label><input type="color" id="marcaColorTarjetas" value="#0f0f13"></div>
        </div>
        <button onclick="guardarApariencia()" class="btn btn-save mt-4">Guardar Apariencia</button>
      </div>

      <!-- Gestor de Secciones -->
      <div class="border border-uadav-border rounded-xl p-4">
        <h2 class="text-xl font-black mb-4 text-uadav-accent">Gestor de Secciones</h2>
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-4">
          <div><label>ID</label><input id="nuevoSecId" placeholder="humor"></div>
          <div><label>Nombre</label><input id="nuevoSecNombre" placeholder="Humoristas"></div>
          <div><label>Icono</label><input id="nuevoSecIcono" placeholder="fa-face-laugh"></div>
          <div><label>Query</label><input id="nuevoSecQuery" placeholder="humoristas en vivo"></div>
        </div>
        <button onclick="agregarNuevaSeccion()" class="btn btn-save mb-4">+ Agregar Sección</button>
        <div id="seccionesList" class="space-y-2"></div>
      </div>

      <!-- Gestor de Señales -->
      <div class="border border-uadav-border rounded-xl p-4">
        <h2 class="text-xl font-black mb-4 text-uadav-accent">Gestor de Señales (Live Streams)</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
          <div><label>Nombre</label><input id="senalNombre" placeholder="Señal UADAV TV"></div>
          <div><label>URL del Stream</label><input id="senalUrl" placeholder="https://..."></div>
          <div><label>Logo / Imagen</label><input id="senalLogo" placeholder="https://..."></div>
          <div><label>Tipo (auto, youtube, twitch, kick)</label><input id="senalTipo" placeholder="auto"></div>
          <div><label>Descripción</label><input id="senalDesc" placeholder="Transmisión oficial"></div>
          <div><label>¿Es Principal?</label><select id="senalPrincipal"><option value="true">Sí</option><option value="false">No</option></select></div>
        </div>
        <button onclick="guardarSenal()" class="btn btn-save mb-4">Agregar/Actualizar Señal</button>
        <div id="senalesList"></div>
      </div>

      <!-- Gestor de Radios -->
      <div class="border border-uadav-border rounded-xl p-4">
        <h2 class="text-xl font-black mb-4 text-uadav-accent">Gestor de Radios</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
          <div><label>Nombre</label><input id="radioNombre" placeholder="Beat Digital"></div>
          <div><label>URL Stream</label><input id="radioStream" placeholder="https://stream.zeno.fm/..."></div>
          <div><label>Logo</label><input id="radioLogo" placeholder="https://..."></div>
          <div><label>Ubicación</label><input id="radioUbicacion" placeholder="Rosario, AR"></div>
          <div><label>Descripción</label><input id="radioDesc" placeholder="Música 24/7"></div>
          <div><label>Tema Actual</label><input id="radioTema" placeholder="Midnight City"></div>
          <div><label>Artista Actual</label><input id="radioArtista" placeholder="M83"></div>
          <div><label>¿Mostrar como Emisora Oficial (Hero)?</label><select id="radioOficial"><option value="true">Sí (Hero grande)</option><option value="false">No (Mini card)</option></select></div>
        </div>
        <button onclick="guardarRadio()" class="btn btn-save mb-4">Agregar/Actualizar Radio</button>
        <div id="radiosList"></div>
      </div>

      <!-- Gestor de Artistas -->
      <div class="border border-uadav-border rounded-xl p-4">
        <h2 class="text-xl font-black mb-4 text-uadav-accent">Gestor de Artistas</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
          <div><label>Nombre</label><input id="artNombre" placeholder="Circo Servian"></div>
          <div><label>Rubro</label><input id="artRubro" placeholder="Circo"></div>
          <div><label>Foto</label><input id="artFoto" placeholder="https://..."></div>
          <div><label>Portada</label><input id="artPortada" placeholder="https://..."></div>
          <div><label>Bio</label><textarea id="artBio"></textarea></div>
          <div><label>Tiene YouTube</label><select id="artTieneYT"><option value="true">Sí</option><option value="false">No</option></select></div>
          <div><label>ID Canal</label><input id="artLink" placeholder="UC..."></div>
          <div><label>Contacto</label><input id="artContacto" placeholder="WhatsApp"></div>
          <div class="md:col-span-2"><label>Videos Manuales (IDs)</label><textarea id="artVideos"></textarea></div>
        </div>
        <button onclick="guardarArtista()" id="btnGuardarArtista" class="btn btn-save mb-4">Agregar Artista</button>
        <button onclick="cancelarEdicion()" id="btnCancelarEdicion" class="btn bg-slate-600 text-white mb-4 hidden">Cancelar</button>
        <div id="artistasList" class="text-sm"></div>
      </div>

      <!-- Configuración General y Hero -->
      <div class="border border-uadav-border rounded-xl p-4">
        <h2 class="text-xl font-black mb-4 text-uadav-accent">Configuración General y Hero</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
           <div><label>País Tendencias</label><input id="configPais" placeholder="Auto"></div>
           <div><label>Mostrar País (IP)</label><select id="configShowCountry"><option value="true">Sí</option><option value="false">No</option></select></div>
           <div><label>Título Hero</label><input id="heroTitulo" placeholder="SEÑAL OFICIAL"></div>
           <div><label>Subtítulo Hero</label><input id="heroSub" placeholder="UADAVSTREAM TV"></div>
           <div><label>Texto Botón Hero</label><input id="heroBtnTexto" placeholder="Ver SEÑAL OFICIAL"></div>
           <div><label>ID Video del Botón</label><input id="heroBtnUrl" placeholder="-479TZi-EAs"></div>
           <div><label>Contador Base</label><input type="number" id="configVisitas" placeholder="0"></div>
           <div class="md:col-span-2"><label>Texto Legal</label><textarea id="configLegal" rows="2">UADAV STREAM es un desarrollo de Beat Digital Medios.</textarea></div>
        </div>
        <button onclick="guardarConfig()" class="btn btn-save mt-4">Guardar Configuración</button>
      </div>

      <div class="fixed bottom-4 right-4">
        <button onclick="guardarTodo()" class="btn btn-save text-base shadow-2xl px-6 py-4">GUARDAR CAMBIOS EN LA NUBE</button>
      </div>
    </div>
  </div>

  <script>
    // IMPORTANTE: Configurar aquí la URL de la plataforma que querés editar
    // Para UADAVSTREAM: 'https://uadav-api.uadavstream.workers.dev/api/'
    // Para BEATPLAY: 'https://beat-digital-api.beatdigitalradiorosario.workers.dev/api/'
    const API_URL = 'https://beat-digital-api.beatdigitalradiorosario.workers.dev/api/'; 
    
    let ADMIN_KEY = '', seccionesData = [], artistasData = [], radiosData = [], senalesData = [], editandoRadioId = null, editandoSenalId = null, editandoId = null;
    let isDataLoadedSuccessfully = false;

    function conectar() {
      ADMIN_KEY = document.getElementById('adminKeyInput').value;
      if (!ADMIN_KEY) return alert("Poné la clave");
      isDataLoadedSuccessfully = false;
      
      Promise.all([
        fetch(API_URL + 'secciones').then(r => r.json()).catch(() => []),
        fetch(API_URL + 'senales_oficiales').then(r => r.json()).catch(() => []),
        fetch(API_URL + 'radios').then(r => r.json()).catch(() => []),
        fetch(API_URL + 'artistas_uadav').then(r => r.json()).catch(() => []),
        fetch(API_URL + 'config').then(r => r.json()).catch(() => ({})),
        fetch(API_URL + 'contadores').then(r => r.json()).catch(() => ({})),
        fetch(API_URL + 'apariencia').then(r => r.json()).catch(() => ({}))
      ]).then(([sec, sen, rad, art, conf, cont, apariencia]) => {
        document.getElementById('panelContent').classList.remove('hidden');
        
        seccionesData = Array.isArray(sec) ? sec : [];
        renderSecciones();
        senalesData = Array.isArray(sen) ? sen : [];
        renderSenales();
        radiosData = Array.isArray(rad) ? rad : [];
        renderRadios();
        artistasData = Array.isArray(art) ? art : [];
        renderArtistas();
        renderConfig(conf);
        renderApariencia(apariencia);
        document.getElementById('configVisitas').value = cont.visitas_totales || 0;
        
        isDataLoadedSuccessfully = true;
      }).catch(err => {
        isDataLoadedSuccessfully = false;
        alert("⚠️ Error al conectar. Revisá la URL de API en el código del admin o los JSON.");
      });
    }

    // === APARIENCIA ===
    function renderApariencia(data) {
      document.getElementById('marcaLogo').value = data.logo_url || '';
      document.getElementById('marcaTitulo').value = data.titulo_sitio || '';
      document.getElementById('marcaEslogan').value = data.eslogan || '';
      document.getElementById('marcaColorAcento').value = data.color_acento || '#00e5ff';
      document.getElementById('marcaColorFondo').value = data.color_fondo || '#050505';
      document.getElementById('marcaColorTarjetas').value = data.color_tarjetas || '#0f0f13';
    }

    function guardarApariencia() {
      const apariencia = {
        logo_url: document.getElementById('marcaLogo').value,
        titulo_sitio: document.getElementById('marcaTitulo').value,
        eslogan: document.getElementById('marcaEslogan').value,
        color_acento: document.getElementById('marcaColorAcento').value,
        color_fondo: document.getElementById('marcaColorFondo').value,
        color_tarjetas: document.getElementById('marcaColorTarjetas').value
      };
      fetch(API_URL + 'apariencia', { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + ADMIN_KEY }, body: JSON.stringify(apariencia) })
      .then(() => alert("Apariencia guardada. Ahora hacé click en GUARDAR TODO."));
    }

    // === SEÑALES, RADIOS, SECCIONES, ARTISTAS Y CONFIG (Funciones existentes) ===
    function renderSenales() { /* ... Copiar funciones existentes ... */ }
    function editarSenal(id) { /* ... */ }
    function eliminarSenal(id) { /* ... */ }
    function guardarSenal() { /* ... */ }

    function renderRadios() { /* ... */ }
    function editarRadio(id) { /* ... */ }
    function eliminarRadio(id) { /* ... */ }
    function guardarRadio() { /* ... */ }

    function agregarNuevaSeccion() { /* ... */ }
    function renderSecciones() { /* ... */ }

    function renderArtistas() { /* ... */ }
    function editarArtista(id) { /* ... */ }
    function cancelarEdicion() { /* ... */ }
    function guardarArtista() { /* ... */ }
    function eliminarArtista(id) { /* ... */ }

    function renderConfig(data) { /* ... */ }
    function guardarConfig() { /* ... */ }

    function guardarTodo() {
      if (!ADMIN_KEY) return alert("Conectate primero");
      if (!isDataLoadedSuccessfully) {
        alert("⚠️ Error: Los datos no se cargaron correctamente. NO se guardarán cambios.");
        return;
      }
      guardarApariencia(); // Guardar apariencia
      guardarConfig();
      fetch(API_URL + 'secciones', { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + ADMIN_KEY }, body: JSON.stringify(seccionesData) });
      fetch(API_URL + 'senales_oficiales', { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + ADMIN_KEY }, body: JSON.stringify(senalesData) });
      fetch(API_URL + 'radios', { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + ADMIN_KEY }, body: JSON.stringify(radiosData) });
      fetch(API_URL + 'artistas_uadav', { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + ADMIN_KEY }, body: JSON.stringify(artistasData) })
      .then(() => alert("✅ Todo guardado en la nube"));
    }
  </script>
</body>
</html>
