<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Control - UADAV STREAM</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: { uadav: { accent: '#00e5ff', dark: '#050505', card: '#0f0f13', border: '#1f1f26' } }, fontFamily: { sans: ['Outfit', 'sans-serif'] } } } }
  </script>
  <style>
    body { background-color: #050505; color: #E2E8F0; font-family: 'Outfit', sans-serif; }
    input, textarea, select { background: #0a0a0c; border: 1px solid #1f1f26; border-radius: 8px; padding: 8px; width: 100%; color: white; margin-bottom: 8px; }
    label { font-size: 11px; text-transform: uppercase; color: #64748b; margin-bottom: 4px; display: block; }
    .btn { padding: 8px 16px; border-radius: 8px; font-weight: 700; font-size: 12px; cursor: pointer; }
    .btn-save { background: #00e5ff; color: #050505; }
    .btn-del { background: #dc2626; color: white; }
    .btn-edit { background: #3b82f6; color: white; }
    .item-box { background: #0f0f13; border: 1px solid #1f1f26; padding: 15px; border-radius: 12px; margin-bottom: 10px; }
  </style>
</head>
<body class="p-4 sm:p-8 min-h-screen">
  <div class="max-w-5xl mx-auto">
    <div class="flex justify-between items-center mb-8 border-b border-uadav-border pb-4">
      <h1 class="text-2xl font-black text-white">UADAV <span class="text-uadav-accent">STREAM</span> - Panel Admin</h1>
      <div class="flex gap-2">
        <input type="password" id="adminKeyInput" placeholder="Pegar ADMIN_KEY aquí..." class="w-64">
        <button onclick="conectar()" class="btn bg-uadav-accent text-black">Conectar</button>
      </div>
    </div>

    <div id="panelContent" class="hidden space-y-8">
      
      <!-- Secciones -->
      <div class="border border-uadav-border rounded-xl p-4">
        <h2 class="text-xl font-black mb-4 text-uadav-accent">Gestor de Secciones</h2>
        <div id="seccionesList" class="space-y-2"></div>
      </div>

      <!-- Artistas -->
      <div class="border border-uadav-border rounded-xl p-4">
        <h2 class="text-xl font-black mb-4 text-uadav-accent">Gestor de Artistas</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
          <div><label>Nombre</label><input id="artNombre" placeholder="Ej: Circo Servian"></div>
          <div><label>Rubro</label><input id="artRubro" placeholder="Ej: Circo / Magia / Música"></div>
          <div><label>Foto de Perfil (URL)</label><input id="artFoto" placeholder="https://..."></div>
          <div><label>Foto de Portada / Banner (URL)</label><input id="artPortada" placeholder="https://..."></div>
          <div class="md:col-span-2"><label>Bio</label><textarea id="artBio" placeholder="Descripción"></textarea></div>
          <div><label>Tiene YouTube?</label><select id="artTieneYT"><option value="true">Sí</option><option value="false">No</option></select></div>
          <div><label>ID Canal YouTube</label><input id="artLink" placeholder="UC..."></div>
          <div><label>Contacto</label><input id="artContacto" placeholder="WhatsApp"></div>
          <div class="md:col-span-2"><label>Videos Manuales (IDs o links de VIDEO, no canal)</label><textarea id="artVideos" rows="3" placeholder="ID_11_CARACTERES"></textarea></div>
        </div>
        <button onclick="guardarArtista()" id="btnGuardarArtista" class="btn btn-save mb-4">Agregar Artista</button>
        <button onclick="cancelarEdicion()" id="btnCancelarEdicion" class="btn bg-slate-600 text-white mb-4 hidden">Cancelar Edición</button>
        <div id="artistasList"></div>
      </div>

      <!-- Configuración General -->
      <div class="border border-uadav-border rounded-xl p-4">
        <h2 class="text-xl font-black mb-4 text-uadav-accent">Configuración General</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
           <div><label>Mostrar País (IP)</label><select id="configShowCountry"><option value="true">Sí</option><option value="false">No</option></select></div>
           <div><label>Contador Base (editable)</label><input type="number" id="configVisitas" placeholder="0"></div>
           <div class="md:col-span-2"><label>Texto Legal (Footer)</label><textarea id="configLegal" rows="3">UADAV STREAM es un desarrollo de Beat Digital Medios. No hospeda contenido, solo indexa señales públicas.</textarea></div>
        </div>
        <button onclick="guardarConfig()" class="btn btn-save mt-4">Guardar Configuración</button>
      </div>

      <!-- Guardar Todo -->
      <div class="fixed bottom-4 right-4">
        <button onclick="guardarTodo()" class="btn btn-save text-base shadow-2xl px-6 py-4">GUARDAR CAMBIOS EN LA NUBE</button>
      </div>
    </div>
  </div>

  <script>
    const API_URL = 'https://uadav-api.uadavstream.workers.dev/api/';
    let ADMIN_KEY = '', seccionesData = [], artistasData = [], editandoId = null;

    function conectar() {
      ADMIN_KEY = document.getElementById('adminKeyInput').value;
      if (!ADMIN_KEY) return alert("Poné la clave");
      fetch(API_URL + 'secciones').then(r => r.json()).then(data => {
        document.getElementById('panelContent').classList.remove('hidden');
        seccionesData = data; renderSecciones();
        fetch(API_URL + 'artistas_uadav').then(r => r.json()).then(renderArtistas);
        fetch(API_URL + 'config').then(r => r.json()).then(renderConfig);
        fetch(API_URL + 'contadores').then(r => r.json()).then(c => { document.getElementById('configVisitas').value = c.visitas_totales || 0; });
      }).catch(err => alert("Error: " + err));
    }

    function renderConfig(data) {
      document.getElementById('configShowCountry').value = data.mostrar_ip ? 'true' : 'false';
      document.getElementById('configLegal').value = data.texto_legal || '';
    }

    function guardarConfig() {
      const config = {
        mostrar_ip: document.getElementById('configShowCountry').value === 'true',
        texto_legal: document.getElementById('configLegal').value
      };
      // Usar POST para config
      fetch(API_URL + 'config', {
        method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + ADMIN_KEY },
        body: JSON.stringify(config)
      }).then(() => {
        // Guardar el contador editado
        const contadores = { visitas_totales: parseInt(document.getElementById('configVisitas').value) || 0, descargas_app: 0 };
        return fetch(API_URL + 'contadores', {
          method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + ADMIN_KEY },
          body: JSON.stringify(contadores)
        });
      }).then(() => alert("Configuración guardada"));
    }

    function renderSecciones() {
      const list = document.getElementById('seccionesList'); list.innerHTML = '';
      seccionesData.forEach((sec, index) => {
        list.innerHTML += `<div class="item-box">
          <div class="flex justify-between items-center mb-2"><span class="font-bold text-sm">${sec.nombre}</span><label class="flex items-center gap-2 text-xs text-slate-400"><input type="checkbox" ${sec.activa ? 'checked' : ''} onchange="seccionesData[${index}].activa = this.checked"> Activa</label></div>
          <div class="grid grid-cols-3 gap-2">
            <div><label>Modo</label><select onchange="seccionesData[${index}].modo = this.value"><option value="auto" ${sec.modo === 'auto' ? 'selected' : ''}>Auto</option><option value="manual" ${sec.modo === 'manual' ? 'selected' : ''}>Manual</option></select></div>
            <div><label>Query</label><input value="${sec.query || ''}" oninput="seccionesData[${index}].query = this.value"></div>
            <div><label>IDs</label><input value="${(sec.ids_manuales || []).join(',')}" oninput="seccionesData[${index}].ids_manuales = this.value.split(',').map(i => i.trim()).filter(i => i)"></div>
          </div>
        </div>`;
      });
    }

    function editarArtista(id) { /* Igual que antes */ 
      const a = artistasData.find(x => x.id === id); if (!a) return;
      editandoId = id;
      document.getElementById('artNombre').value = a.nombre;
      document.getElementById('artRubro').value = a.rubro || '';
      document.getElementById('artFoto').value = a.foto || '';
      document.getElementById('artPortada').value = a.portada || '';
      document.getElementById('artBio').value = a.bio || '';
      document.getElementById('artTieneYT').value = a.tiene_youtube ? 'true' : 'false';
      document.getElementById('artLink').value = a.youtube_channel_id || '';
      document.getElementById('artContacto').value = a.contacto || '';
      document.getElementById('artVideos').value = (a.videos_manuales || []).map(v => v.url).join('\n');
      document.getElementById('btnGuardarArtista').innerText = "Actualizar Artista"; document.getElementById('btnGuardarArtista').classList.add('bg-blue-500');
      document.getElementById('btnCancelarEdicion').classList.remove('hidden');
      window.scrollTo({ top: 300, behavior: 'smooth' });
    }

    function cancelarEdicion() { /* Igual que antes */
      editandoId = null;
      ['artNombre','artRubro','artFoto','artPortada','artBio','artLink','artContacto','artVideos'].forEach(id => document.getElementById(id).value = '');
      document.getElementById('artTieneYT').value = 'true';
      document.getElementById('btnGuardarArtista').innerText = "Agregar Artista"; document.getElementById('btnGuardarArtista').classList.remove('bg-blue-500');
      document.getElementById('btnCancelarEdicion').classList.add('hidden');
    }

    function guardarArtista() {
      const videosRaw = document.getElementById('artVideos').value.trim();
      const videos = videosRaw ? videosRaw.split('\n').map(line => {
        let trimmed = line.trim(); if (!trimmed) return null;
        if (trimmed.startsWith('UC') && trimmed.length > 20) return null;
        if (/^[a-zA-Z0-9_-]{11}$/.test(trimmed)) return { tipo: 'youtube', url: trimmed };
        if (trimmed.includes('youtube.com') || trimmed.includes('youtu.be')) { let id = trimmed.split('v=')[1] || trimmed.split('/').pop(); if(id.includes('&')) id = id.split('&')[0]; if (id && id.length === 11) return { tipo: 'youtube', url: id }; }
        return { tipo: 'mp4', url: trimmed };
      }).filter(v => v) : [];

      let channelIdInput = document.getElementById('artLink').value.trim();
      if (channelIdInput.includes('channel_id=')) channelIdInput = channelIdInput.split('channel_id=')[1].split('&')[0];
      else if (channelIdInput.includes('/channel/')) channelIdInput = channelIdInput.split('/channel/')[1].split('/')[0];
      else if (channelIdInput.includes('/@')) channelIdInput = channelIdInput.split('/@')[1].split('/')[0];
      else if (channelIdInput.includes('youtube.com')) channelIdInput = channelIdInput.split('/').pop().split('?')[0];
      if (!channelIdInput.startsWith('UC')) channelIdInput = '';

      const dataArtista = {
        id: editandoId || 'art-' + Date.now(), nombre: document.getElementById('artNombre').value,
        rubro: document.getElementById('artRubro').value, foto: document.getElementById('artFoto').value,
        portada: document.getElementById('artPortada').value, bio: document.getElementById('artBio').value,
        tiene_youtube: document.getElementById('artTieneYT').value === 'true',
        youtube_channel_id: channelIdInput, videos_manuales: videos,
        contacto: document.getElementById('artContacto').value
      };
      if (!dataArtista.nombre) return alert("Poné el nombre");
      if (editandoId) { const index = artistasData.findIndex(a => a.id === editandoId); if (index !== -1) artistasData[index] = dataArtista; cancelarEdicion(); }
      else artistasData.push(dataArtista);
      
      renderArtistas(artistasData); alert("Listo. Ahora click en GUARDAR CAMBIOS.");
    }

    function renderArtistas(data) {
      artistasData = data || [];
      const list = document.getElementById('artistasList'); list.innerHTML = '';
      artistasData.forEach(a => list.innerHTML += `<div class="item-box flex justify-between"><div><h4 class="font-bold">${a.nombre}</h4><p class="text-xs text-slate-400">${a.rubro || ''} - ${a.tiene_youtube ? 'Con YouTube' : 'Link Directo'} (${(a.videos_manuales||[]).length} videos)</p></div><div class="flex gap-2"><button onclick="editarArtista('${a.id}')" class="btn btn-edit">Editar</button><button onclick="eliminarArtista('${a.id}')" class="btn btn-del">Eliminar</button></div></div>`);
    }

    function eliminarArtista(id) { if (!confirm("¿Eliminar?")) return; if (editandoId === id) cancelarEdicion(); artistasData = artistasData.filter(a => a.id !== id); renderArtistas(artistasData); }

    function guardarTodo() {
      if (!ADMIN_KEY) return alert("Conectate primero");
      guardarConfig(); // Guarda config y contadores
      fetch(API_URL + 'secciones', { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + ADMIN_KEY }, body: JSON.stringify(seccionesData) });
      fetch(API_URL + 'artistas_uadav', { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + ADMIN_KEY }, body: JSON.stringify(artistasData) }).then(() => alert("✅ Todo guardado en la nube"));
    }
  </script>
</body>
</html>
