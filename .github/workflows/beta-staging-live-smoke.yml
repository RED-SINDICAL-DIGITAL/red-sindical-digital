name: Beta staging live read-only verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/beta-staging-profile-20261108
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check staging Pages and Worker (GET only)
        run: node scripts/check-beta-staging-live.mjs
