name: Crear Estructura
on: workflow_dispatch

# PASO CLAVE: Forzamos de forma nativa el permiso de escritura del repositorio
permissions:
  contents: write

jobs:
  crear-carpetas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Usamos el token nativo del proceso con sus nuevos permisos explícitos
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generar carpetas y archivos temporales
        run: |
          mkdir -p apps/{public-site,core-system,admin-console} packages/{ui,database,auth,qr,printing,chatbot,validation,offline-sync} configs/{uadav,uadav-santafe} assets/{logos,videos,branding} docs
          find . -type d -not -path '*/.*' -exec touch {}/.gitkeep \;

      - name: Subir cambios a GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          
          # Evita fallos si no hay cambios reales
          git diff-index --quiet HEAD || git commit -m "Estructura de directorios generada automáticamente"
          
          git push origin HEAD:${{ github.ref_name }}
