name: Crear Estructura
on: workflow_dispatch

# Forza los permisos de escritura nativos en el repositorio
permissions:
  contents: write

jobs:
  crear-carpetas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generar carpetas y archivos temporales
        run: |
          mkdir -p apps/{public-site,core-system,admin-console} packages/{ui,database,auth,qr,printing,chatbot,validation,offline-sync} configs/{uadav,uadav-santafe} assets/{logos,videos,branding} docs
          find . -type d -not -path '*/.*' -exec touch {}/.gitkeep \;

      - name: Subir cambios a GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@://github.com"
          git add .
          
          # Realiza el commit solo si detecta los nuevos archivos .gitkeep
          git diff-index --quiet HEAD || git commit -m "Estructura de directorios generada automáticamente"
          
          # Sube los cambios forzando la sincronización para evitar el rechazo de historial
          git push --force origin HEAD:${{ github.ref_name }}
