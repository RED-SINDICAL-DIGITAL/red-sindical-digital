name: Reconcile isolated staging mail QA embed in beta Worker
on:
  push:
    branches:
      - feat/beta-staging-profile-20261108
    paths:
      - .github/workflows/beta-reconcile-mail-embed.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  reconcile-mail-embed:
    if: github.ref == 'refs/heads/feat/beta-staging-profile-20261108'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/beta-staging-profile-20261108
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate private QA embed from versioned source modules only
        run: |
          node scripts/embed-job-mail-live.mjs
          node scripts/embed-job-backup.mjs
          node scripts/embed-job-mail-live.mjs --check
          node scripts/embed-job-backup.mjs --check
          node scripts/package-job-backup.mjs --check
          node scripts/package-job-mail-live.mjs --check
          node --check worker.js
          git diff --check
      - name: Commit only changed beta Worker source (never deploy)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- worker.js
          if git diff --cached --quiet; then
            echo "Isolated mail QA embed already matches source."
          else
            git commit -m "build(beta qa): synchronize private mail test embed from frozen sources"
            git push origin HEAD:feat/beta-staging-profile-20261108
          fi
