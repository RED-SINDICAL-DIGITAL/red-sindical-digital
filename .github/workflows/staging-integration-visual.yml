      - scripts/functional-qa-staging-shell.mjs
      - scripts/qa-staging-synthetic-playback.mjs
      - scripts/qa-staging-profile-subviews.mjs
      - scripts/qa-staging-radio-studio-operator.mjs
      - scripts/qa-staging-admin-anonymous.mjs
      - scripts/qa-staging-admin-mock-auth.mjs
      - tests/staging-profile-preservation.test.cjs
      - .github/workflows/staging-integration-visual.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-browser:
    runs-on: ubuntu-24.04
    container:
      # Browser and OS dependencies are baked in; avoid apt mirror DNS failures.
      image: mcr.microsoft.com/playwright:v1.58.2-noble
      options: --ipc=host
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check private event session changes
        run: node --test tests/profile-owner-session.test.cjs tests/profile-owned-events.test.cjs tests/jobs-account-ui.test.cjs tests/public-footer.test.cjs
      - name: Check artist directory recovery
        run: node --test tests/artist-directory-loading.test.cjs tests/artist-directory-state.test.cjs tests/artist-search-return.test.cjs
      - name: Install isolated Chromium QA tools
        run: |
          npm install --no-save --no-package-lock playwright@1.58.2
      - name: Start local static server and check responsive profile
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/uadav-static-qa.log 2>&1 &
          # Each independent browser check has its own bounded execution.
          # A timeout is a real failure; never report the suite as successful.
          run_qa() {
            script="$1"
            echo "::group::QA $script"
            echo "START $script"
            timeout --signal=TERM --kill-after=10s 120s node "$script" || {
              code="$?"
              echo "::error file=$script::QA failed (exit $code; 124 means per-script timeout)"
              echo "Server diagnostics:"
              tail -n 25 /tmp/uadav-static-qa.log || true
              echo "::endgroup::"
              exit "$code"
            }
            echo "PASS $script"
            echo "::endgroup::"
          }
          run_qa scripts/qa-staging-catalog-detail.mjs
          run_qa scripts/qa-staging-library-layout.mjs
          run_qa scripts/qa-staging-entry-layout.mjs
          run_qa scripts/qa-staging-discovery-layout.mjs
          run_qa scripts/qa-staging-publication.mjs
          run_qa scripts/qa-staging-footer.mjs
          run_qa scripts/qa-staging-unified-radio.mjs
          run_qa scripts/qa-staging-artist-presentation.mjs
          run_qa scripts/qa-staging-playback-landing.mjs
          run_qa scripts/qa-staging-section-artwork.mjs
          run_qa scripts/visual-qa-staging-integration.mjs
          run_qa scripts/functional-qa-staging-shell.mjs
          run_qa scripts/qa-staging-synthetic-playback.mjs
          run_qa scripts/qa-staging-profile-subviews.mjs
          run_qa scripts/qa-staging-public-screens.mjs
          run_qa scripts/qa-staging-home-stage.mjs
          run_qa scripts/qa-staging-popular-artists.mjs
          run_qa scripts/qa-staging-visual-launch.mjs
          run_qa scripts/qa-staging-radio-studio-operator.mjs
          run_qa scripts/qa-staging-admin-anonymous.mjs
          run_qa scripts/qa-staging-admin-mock-auth.mjs
      - name: Upload screenshots for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-integration-profile-visual
          path: artifacts/staging-integration-visual/*.png
          if-no-files-found: ignore
          retention-days: 7
