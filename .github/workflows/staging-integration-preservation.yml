name: Staging integration preservation checks
on:
  push:
    branches:
      - integration/staging-preserve-beta-20261109
  pull_request:
    paths:
      - uadav-api-config.js
      - usuario.html
      - app.html
      - tests/staging-profile-preservation.test.cjs
      - tests/staging-integration-api-routing.test.cjs
      - tests/staging-backup-verification.test.mjs
      - scripts/verify-staging-backup.mjs
      - scripts/qa-staging-health-readonly.mjs
      - tests/staging-health-readonly.test.mjs
      - .github/workflows/staging-integration-preservation.yml
permissions:
  contents: read
jobs:
  api-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: node --check uadav-api-config.js
      - name: Verify isolation and original production behavior
        run: node --test tests/staging-integration-api-routing.test.cjs tests/staging-profile-preservation.test.cjs tests/staging-backup-verification.test.mjs tests/staging-health-readonly.test.mjs
