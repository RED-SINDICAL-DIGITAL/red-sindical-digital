name: Bolsa staging policy checks
on:
  workflow_dispatch:
  push:
    branches:
      - release/radio-studio-staging-rc-20261020
    paths:
      - 'worker.js'
      - 'tests/bolsa-public-policy.test.cjs'
      - 'tests/job-store-integration.test.mjs'
      - 'tests/job-account-integration.test.mjs'
      - 'tests/job-store-schema.test.mjs'
      - 'tests/job-application-integration.mjs'
      - 'tests/sqlite-d1.mjs'
      - 'tests/load-worker.mjs'
      - 'scripts/job-store-runtime.js'
      - 'scripts/job-account-runtime.js'
      - 'scripts/job-expiry-runtime.js'
      - 'scripts/job-cron-runtime.js'
      - 'tests/job-cron-staging.test.mjs'
      - 'releases/uadav-api-staging-11762.zip'
      - 'scripts/job-external-runtime.js'
      - 'tests/job-external-security.test.mjs'
      - 'scripts/test-job-external-workerd.mjs'
      - 'scripts/job-restore-qa-runtime.js'
      - 'scripts/build-job-restore-qa.mjs'
      - 'releases/uadav-bolsa-restore-qa-11762.js'
      - 'tests/job-restore-qa.test.mjs'
      - 'releases/uadav-api-staging-11764.zip'
      - 'releases/uadav-bolsa-lab-11764.js'
      - 'releases/uadav-bolsa-lab-11764.zip'
      - 'scripts/build-job-lab.mjs'
      - 'scripts/job-lab-runtime.js'
      - 'tests/job-lab.test.mjs'
      - 'scripts/job-recovery-outbox.mjs'
      - 'scripts/access-mail-message.mjs'
      - 'scripts/brevo-staging-mail.mjs'
      - 'scripts/brevo-recovery-message.mjs'
      - 'tests/brevo-recovery-message.test.mjs'
      - 'scripts/build-job-mail-lab.mjs'
      - 'scripts/job-mail-lab-runtime.js'
      - 'scripts/job-mail-lab-page.html'
      - 'tests/job-mail-lab.test.mjs'
      - 'releases/uadav-bolsa-mail-lab-11766.js'
      - 'releases/uadav-bolsa-mail-lab-11766.zip'
      - 'scripts/brevo-request.mjs'
      - 'scripts/brevo-probe-runtime.js'
      - 'scripts/brevo-probe-page.html'
      - 'scripts/brevo-delivery-runtime.js'
      - 'scripts/brevo-delivery-page.html'
      - 'tests/brevo-delivery.test.mjs'
      - 'releases/uadav-api-staging-11766.zip'
      - 'scripts/embed-brevo-probe.mjs'
      - 'tests/brevo-probe.test.mjs'
      - 'releases/uadav-api-staging-11765.zip'
      - 'tests/access-mail-staging.test.mjs'
      - 'tests/job-recovery-outbox.test.mjs'
      - 'tests/job-expiry-integration.test.mjs'
      - 'scripts/embed-job-store.mjs'
      - 'migrations/staging/*.sql'
      - '.github/workflows/bolsa-staging-policy.yml'
  pull_request:
    paths:
      - 'worker.js'
      - 'tests/bolsa-public-policy.test.cjs'
      - 'tests/job-store-integration.test.mjs'
      - 'tests/job-account-integration.test.mjs'
      - 'tests/job-store-schema.test.mjs'
      - 'tests/job-application-integration.mjs'
      - 'tests/sqlite-d1.mjs'
      - 'tests/load-worker.mjs'
      - 'scripts/job-store-runtime.js'
      - 'scripts/job-account-runtime.js'
      - 'scripts/job-expiry-runtime.js'
      - 'scripts/job-cron-runtime.js'
      - 'tests/job-cron-staging.test.mjs'
      - 'releases/uadav-api-staging-11762.zip'
      - 'scripts/job-external-runtime.js'
      - 'tests/job-external-security.test.mjs'
      - 'scripts/test-job-external-workerd.mjs'
      - 'scripts/job-restore-qa-runtime.js'
      - 'scripts/build-job-restore-qa.mjs'
      - 'releases/uadav-bolsa-restore-qa-11762.js'
      - 'tests/job-restore-qa.test.mjs'
      - 'releases/uadav-api-staging-11764.zip'
      - 'releases/uadav-bolsa-lab-11764.js'
      - 'releases/uadav-bolsa-lab-11764.zip'
      - 'scripts/build-job-lab.mjs'
      - 'scripts/job-lab-runtime.js'
      - 'tests/job-lab.test.mjs'
      - 'scripts/job-recovery-outbox.mjs'
      - 'scripts/access-mail-message.mjs'
      - 'scripts/brevo-staging-mail.mjs'
      - 'scripts/brevo-recovery-message.mjs'
      - 'tests/brevo-recovery-message.test.mjs'
      - 'scripts/build-job-mail-lab.mjs'
      - 'scripts/job-mail-lab-runtime.js'
      - 'scripts/job-mail-lab-page.html'
      - 'tests/job-mail-lab.test.mjs'
      - 'releases/uadav-bolsa-mail-lab-11766.js'
      - 'releases/uadav-bolsa-mail-lab-11766.zip'
      - 'scripts/brevo-request.mjs'
      - 'scripts/brevo-probe-runtime.js'
      - 'scripts/brevo-probe-page.html'
      - 'scripts/brevo-delivery-runtime.js'
      - 'scripts/brevo-delivery-page.html'
      - 'tests/brevo-delivery.test.mjs'
      - 'releases/uadav-api-staging-11766.zip'
      - 'scripts/embed-brevo-probe.mjs'
      - 'tests/brevo-probe.test.mjs'
      - 'releases/uadav-api-staging-11765.zip'
      - 'tests/access-mail-staging.test.mjs'
      - 'tests/job-recovery-outbox.test.mjs'
      - 'tests/job-expiry-integration.test.mjs'
      - 'scripts/embed-job-store.mjs'
      - 'migrations/staging/*.sql'
      - '.github/workflows/bolsa-staging-policy.yml'
permissions:
  contents: read
jobs:
  public-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate worker JavaScript
        run: node --check worker.js
      - name: Verify standalone source is current
        run: node scripts/embed-job-store.mjs --check
      - name: Verify private staging sandbox and receipt diagnostics
        run: node scripts/embed-brevo-probe.mjs --check
      - name: Verify isolated restoration QA source
        run: node scripts/build-job-restore-qa.mjs --check && node --check releases/uadav-bolsa-restore-qa-11762.js
      - name: Verify isolated synthetic Bolsa lab source
        run: node scripts/build-job-lab.mjs --check && node --check releases/uadav-bolsa-lab-11764.js
      - name: Verify isolated synthetic email recovery lab source
        run: node scripts/build-job-mail-lab.mjs --check && node --check releases/uadav-bolsa-mail-lab-11766.js
      - name: Validate preparatory recovery outbox engine (not deployed)
        run: node --check scripts/job-recovery-outbox.mjs
      - name: Validate preparatory email messages and Brevo transport (not deployed)
        run: node --check scripts/access-mail-message.mjs && node --check scripts/brevo-staging-mail.mjs && node --check scripts/brevo-request.mjs
      - name: Run public Bolsa regression tests
        run: node tests/bolsa-public-policy.test.cjs
      - name: Install pinned Cloudflare test engine (no package scripts)
        run: npm install --prefix "$RUNNER_TEMP/uadav-workerd" --ignore-scripts --no-package-lock --no-audit --no-fund @cloudflare/workerd-linux-64@1.20261025.1
      - name: Run standalone external-source checks inside Cloudflare engine
        run: UADAV_WORKERD_BIN="$RUNNER_TEMP/uadav-workerd/node_modules/@cloudflare/workerd-linux-64/bin/workerd" node scripts/test-job-external-workerd.mjs
      - name: Run SQLite transaction, concurrency, migration and recovery checks
        run: node --test tests/job-store-integration.test.mjs tests/job-store-schema.test.mjs tests/job-account-integration.test.mjs tests/job-expiry-integration.test.mjs tests/job-external-security.test.mjs tests/job-restore-qa.test.mjs tests/job-cron-staging.test.mjs tests/job-lab.test.mjs tests/job-recovery-outbox.test.mjs tests/access-mail-staging.test.mjs tests/brevo-probe.test.mjs tests/brevo-delivery.test.mjs tests/brevo-recovery-message.test.mjs tests/job-mail-lab.test.mjs
      - name: Run KV compatibility checks with current publication policy
        run: node tests/job-application-integration.mjs
