name: Bolsa staging policy checks
on:
  workflow_dispatch:
  push:
    branches:
      - release/radio-studio-staging-rc-20261020
    paths:
      - 'worker.js'
      - 'tests/bolsa-public-policy.test.cjs'
      - 'tests/job-store-integration.test.mjs'
      - 'tests/job-account-integration.test.mjs'
      - 'tests/job-store-schema.test.mjs'
      - 'tests/job-application-integration.mjs'
      - 'tests/sqlite-d1.mjs'
      - 'tests/load-worker.mjs'
      - 'scripts/job-store-runtime.js'
      - 'scripts/job-account-runtime.js'
      - 'scripts/job-expiry-runtime.js'
      - 'scripts/job-external-runtime.js'
      - 'tests/job-external-security.test.mjs'
      - 'scripts/test-job-external-workerd.mjs'
      - 'scripts/job-restore-qa-runtime.js'
      - 'scripts/build-job-restore-qa.mjs'
      - 'releases/uadav-bolsa-restore-qa-11762.js'
      - 'tests/job-restore-qa.test.mjs'
      - 'tests/job-expiry-integration.test.mjs'
      - 'scripts/embed-job-store.mjs'
      - 'migrations/staging/*.sql'
      - '.github/workflows/bolsa-staging-policy.yml'
  pull_request:
    paths:
      - 'worker.js'
      - 'tests/bolsa-public-policy.test.cjs'
      - 'tests/job-store-integration.test.mjs'
      - 'tests/job-account-integration.test.mjs'
      - 'tests/job-store-schema.test.mjs'
      - 'tests/job-application-integration.mjs'
      - 'tests/sqlite-d1.mjs'
      - 'tests/load-worker.mjs'
      - 'scripts/job-store-runtime.js'
      - 'scripts/job-account-runtime.js'
      - 'scripts/job-expiry-runtime.js'
      - 'scripts/job-external-runtime.js'
      - 'tests/job-external-security.test.mjs'
      - 'scripts/test-job-external-workerd.mjs'
      - 'scripts/job-restore-qa-runtime.js'
      - 'scripts/build-job-restore-qa.mjs'
      - 'releases/uadav-bolsa-restore-qa-11762.js'
      - 'tests/job-restore-qa.test.mjs'
      - 'tests/job-expiry-integration.test.mjs'
      - 'scripts/embed-job-store.mjs'
      - 'migrations/staging/*.sql'
      - '.github/workflows/bolsa-staging-policy.yml'
permissions:
  contents: read
jobs:
  public-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate worker JavaScript
        run: node --check worker.js
      - name: Verify standalone source is current
        run: node scripts/embed-job-store.mjs --check
      - name: Verify isolated restoration QA source
        run: node scripts/build-job-restore-qa.mjs --check && node --check releases/uadav-bolsa-restore-qa-11762.js
      - name: Run public Bolsa regression tests
        run: node tests/bolsa-public-policy.test.cjs
      - name: Install pinned Cloudflare test engine (no package scripts)
        run: npm install --prefix "$RUNNER_TEMP/uadav-workerd" --ignore-scripts --no-package-lock --no-audit --no-fund @cloudflare/workerd-linux-64@1.20261025.1
      - name: Run standalone external-source checks inside Cloudflare engine
        run: UADAV_WORKERD_BIN="$RUNNER_TEMP/uadav-workerd/node_modules/@cloudflare/workerd-linux-64/bin/workerd" node scripts/test-job-external-workerd.mjs
      - name: Run SQLite transaction, concurrency, migration and recovery checks
        run: node --test tests/job-store-integration.test.mjs tests/job-store-schema.test.mjs tests/job-account-integration.test.mjs tests/job-expiry-integration.test.mjs tests/job-external-security.test.mjs tests/job-restore-qa.test.mjs
      - name: Run KV compatibility checks with current publication policy
        run: node tests/job-application-integration.mjs
