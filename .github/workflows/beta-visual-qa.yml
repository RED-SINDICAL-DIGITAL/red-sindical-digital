name: Beta visual QA — mobile and desktop
on:
  push:
    branches:
      - feat/beta-staging-profile-20261108
    paths:
      - scripts/visual-qa-beta.mjs
      - .github/workflows/beta-visual-qa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium-responsive:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser test dependencies
        run: |
          npm install --no-save --no-package-lock playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Anonymous responsive QA against Cloudflare beta Preview
        run: node scripts/visual-qa-beta.mjs
      - name: Preserve desktop/mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beta-responsive-screenshots
          path: artifacts/beta-visual/*.png
          if-no-files-found: ignore
          retention-days: 7
