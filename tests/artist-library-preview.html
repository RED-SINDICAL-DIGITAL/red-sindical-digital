<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Biblioteca del artista · prueba</title><style>body{background:#080b12;color:#fff;font:16px/1.5 system-ui;margin:0}main{max-width:980px;margin:auto;padding:24px}.tabs{display:flex;gap:10px;flex-wrap:wrap}.tab,.btn,.youtube-playlist{color:white;background:#172640;border:1px solid #ffffff22;border-radius:14px;padding:12px;font:inherit;cursor:pointer}.tab.active{background:#2f6df6}.panel{padding:20px 0}.youtube-playlists{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}.youtube-playlist strong,.youtube-playlist span{display:block}.youtube-playlist img{width:100%;aspect-ratio:16/9;object-fit:cover}.youtube-playlist span{font-size:13px;color:#b1bfd3}[hidden]{display:none!important}</style><script src="/uadav-artist-library-v134.js?v=12023"></script></head><body><main><p>Prueba con datos ficticios. No reproduce contenido real.</p><h1>Biblioteca de Artista de ejemplo</h1><nav class="tabs"><button class="tab" data-tab="inicio">Inicio</button><button class="tab" data-tab="videos">Videos</button></nav><div class="main"><section id="tab-inicio"><h2>Videos, playlists y álbumes del canal</h2><p>Explorá las colecciones públicas y consultá más páginas.</p></section><section id="tab-videos" hidden><div id="videoCount"></div></section></div></main><script>let page=0;const image=location.origin+'/assets/uadav-share-card.png';window.UADAVProfileDisplay={normalize:()=>({videos:true,playlists:true})};window.fetch=async raw=>{const u=new URL(raw);if(!u.pathname.endsWith('/youtube/channel_library'))throw Error('Prueba aislada');if(u.searchParams.get('kind')==='videos')return{ok:true,json:async()=>({items:[{id:'video-demo'}],next_cursor:null})};const next=u.searchParams.get('cursor');return{ok:true,json:async()=>({items:next?[{id:'album2',titulo:'Segundo álbum',thumbnail:image,url:'https://www.youtube.com/playlist?list=DEMO2'}]:[{id:'album1',titulo:'Mi álbum completo',thumbnail:image,url:'https://www.youtube.com/playlist?list=DEMO1'},{id:'mix',titulo:'Mis favoritos',thumbnail:image}],next_cursor:next?null:'PAGE_TWO'})}};const artist={id:'demo',nombre:'Artista de ejemplo',canal:'UC1234567890123456789012'};const onVideos=items=>{document.getElementById('videoCount').textContent=items.length+' video público cargado';UADAVArtistLibrary.mount({artist,onVideos})};UADAVArtistLibrary.mount({artist,onVideos});</script></body></html>
