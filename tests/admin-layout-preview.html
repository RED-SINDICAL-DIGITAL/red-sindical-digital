*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}

.login-brand{display:flex;gap:14px;align-items:center;margin-bottom:28px}.brand-mark{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;color:#fff;background:#2f6df6;font-size:24px;font-weight:1000;box-shadow:0 12px 30px rgba(32,216,242,.18)}

.main{padding:24px;max-width:1600px;margin:0 auto}.view-head{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;margin-bottom:20px}.view-head h1{margin:0;font-size:27px;letter-spacing:-.03em}.view-head p{margin:5px 0 0;color:var(--muted)}.view-actions{display:flex;gap:9px;flex-wrap:wrap}

/* COMPONENTS */
.card{background:linear-gradient(180deg,rgba(25,34,60,.94),rgba(20,29,52,.94));border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 10px 30px rgba(0,0,0,.14)}.card-pad{padding:18px}.grid{display:grid;gap:16px}.stats-grid{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:18px}.stat-card{min-height:132px;padding:18px;position:relative;overflow:hidden}.stat-card:after{content:"";position:absolute;width:90px;height:90px;border-radius:50%;right:-28px;top:-34px;background:currentColor;opacity:.07}.stat-card .stat-top{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:11px;font-weight:850;text-transform:uppercase;letter-spacing:.07em}.stat-icon{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:rgba(255,255,255,.07);color:inherit;font-size:18px}.stat-value{font-size:34px;font-weight:950;margin-top:18px;line-height:1}.stat-note{margin-top:7px;color:var(--muted);font-size:11px}.stat-cyan{color:var(--cyan)}.stat-violet{color:#9d91ff}.stat-green{color:var(--green)}.stat-yellow{color:var(--yellow)}
.dashboard-grid{grid-template-columns:minmax(0,1.55fr) minmax(310px,.75fr)}.section-title{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:14px}.section-title h2{font-size:15px;margin:0}.section-title small{color:var(--muted)}

.bar-list{display:grid;gap:12px}.bar-row{display:grid;grid-template-columns:120px minmax(0,1fr) 42px;align-items:center;gap:10px;font-size:11px;color:#c3cee0}.bar{height:8px;background:#10172b;border-radius:99px;overflow:hidden}.bar>i{height:100%;display:block;border-radius:99px;background:linear-gradient(90deg,var(--cyan),var(--violet))}
.quick-grid{grid-template-columns:repeat(3,minmax(0,1fr));margin-top:16px}.quick-card{padding:15px;display:flex;gap:12px;align-items:center;transition:.16s}.quick-card:hover{transform:translateY(-2px);border-color:#42547d}.quick-card .qicon{width:42px;height:42px;border-radius:12px;background:#202d4e;display:grid;place-items:center;color:var(--cyan);font-size:18px}.quick-card strong{display:block}.quick-card small{color:var(--muted)}

.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.form-grid .span-2{grid-column:1/-1}.switch-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.05)}.switch{width:42px;height:24px;border-radius:99px;background:#2b3855;border:0;position:relative;padding:0}.switch:after{content:"";position:absolute;width:18px;height:18px;border-radius:50%;background:white;left:3px;top:3px;transition:.18s}.switch.on{background:var(--cyan)}.switch.on:after{left:21px}.json-box{font:12px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre-wrap;background:#0c1324;border:1px solid var(--line);border-radius:12px;padding:12px;color:#c5d0e1;max-height:320px;overflow:auto}

/* MODAL */
dialog{width:min(720px,calc(100vw - 30px));max-height:88vh;border:1px solid var(--line);border-radius:20px;background:#151e36;color:var(--text);box-shadow:0 35px 100px rgba(0,0,0,.55);padding:0}dialog::backdrop{background:rgba(4,7,14,.72);backdrop-filter:blur(5px)}.modal-head,.modal-foot{padding:16px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line)}.modal-foot{border-bottom:0;border-top:1px solid var(--line);justify-content:flex-end}.modal-body{padding:18px;overflow:auto;max-height:66vh}.modal-head h2{margin:0;font-size:17px}

<dialog id="modal" aria-labelledby="modalTitle"><div class="modal-head"><h2 id="modalTitle">Editar</h2><button type="button" class="icon-btn" aria-label="Cerrar edición" onclick="closeModal()">×</button></div><div id="modalBody" class="modal-body"></div><div id="modalFoot" class="modal-foot"></div></dialog>

<script>
const main=document.getElementById('main');
const dashboard=`<div class="view-head"><div><h1>Visión general</h1><p>Vista de prueba sin conexión. No muestra ni modifica registros reales.</p></div><div class="view-actions"><button class="btn btn-primary" onclick="editPreview()">Probar edición</button><button class="btn btn-secondary" onclick="renderPreview('artists')">Ver tabla</button></div></div><div class="grid stats-grid">${['Artistas','Eventos','Convocatorias','Radios'].map(name=>`<div class="card stat-card"><div class="stat-top">${name}</div><div class="stat-value">—</div><div class="stat-note">Datos de prueba</div></div>`).join('')}</div><div class="grid dashboard-grid"><section class="card card-pad"><div class="section-title"><h2>Actividad y revisión</h2></div>${['Perfil pendiente de revisión','Pago informado por un anunciante','Contenido enviado por un artista'].map(x=>`<div class="activity"><span class="activity-icon">◎</span><div><strong>${x}</strong><small>Ejemplo de una actividad con texto largo para revisar el ajuste.</small></div><button class="btn btn-sm" onclick="editPreview()">Revisar</button></div>`).join('')}</section><section class="card card-pad"><h2>Accesos</h2><div class="grid"><button class="btn" onclick="renderPreview('artists')">Artistas y perfiles</button><button class="btn" onclick="renderPreview('settings')">Configuración</button></div></section></div>`;
function renderPreview(view){document.getElementById('topTitle').textContent=view==='artists'?'Artistas y perfiles':view==='settings'?'Configuración':'Visión general';main.innerHTML=view==='dashboard'?dashboard:view==='artists'?`<div class="view-head"><div><h1>Artistas y perfiles</h1><p>Prueba visual de la tabla, sin datos reales.</p></div><div class="view-actions"><button class="btn btn-primary" onclick="editPreview()">Agregar artista</button><button class="btn btn-secondary">Importar CSV</button><button class="btn btn-ghost">Exportar</button></div></div><div class="toolbar"><input class="input grow" aria-label="Buscar artista" placeholder="Buscar artista…"><select class="select" aria-label="Estado" style="width:180px"><option>Todos los estados</option></select></div><div class="table-wrap"><table class="table"><thead><tr>${['Artista','Categoría','Ciudad','Estado','Plan','Canal','Acciones'].map(x=>'<th>'+x+'</th>').join('')}</tr></thead><tbody>${['Artista de variedades de prueba','Compañía con un nombre artístico largo'].map(x=>`<tr><td><div class="entity"><div><strong>${x}</strong><small>Perfil de ejemplo</small></div></div></td><td>Magia y espectáculos</td><td>Rosario, Santa Fe</td><td><span class="badge ok">Publicado</span></td><td>Gratuito</td><td>https://www.youtube.com/@canal_de_ejemplo_con_nombre_largo</td><td><div class="actions"><button class="btn btn-sm" onclick="editPreview()">Editar</button><button class="btn btn-sm">Ver perfil</button></div></td></tr>`).join('')}</tbody></table></div>`:`<div class="view-head"><div><h1>Configuración</h1><p>Ejemplo de formularios y opciones de administración.</p></div></div><section class="card card-pad"><div class="form-grid">${['Nombre de la plataforma','Sitio web','Email de contacto','Ciudad','Provincia','Identidad visual'].map((x,i)=>`<div class="field"><label for="setting-${i}">${x}</label><input class="input" id="setting-${i}" value="Dato de prueba"></div>`).join('')}<div class="field span-2"><label for="desc">Descripción</label><textarea id="desc" class="textarea">Texto de ejemplo para revisar formularios de configuración.</textarea></div></div><div class="view-actions" style="margin-top:16px"><button class="btn btn-primary" onclick="editPreview()">Probar ventana</button></div></section>`;window.UADAVAdminLayout?.setMenu(false)};
function editPreview(){document.getElementById('modalTitle').textContent='Editar artista · prueba visual';document.getElementById('modalBody').innerHTML='<p>Esta ventana no guarda información. Revisá campos, desplazamiento y botones.</p><div class="form-grid">'+['Nombre artístico','Categoría','Ciudad','Provincia','País','Canal de YouTube','Foto URL','Portada URL'].map((x,i)=>'<div class="field"><label for="preview-field-'+i+'">'+x+'</label><input id="preview-field-'+i+'" class="input" value="Dato de prueba"></div>').join('')+window.UADAVProfileDisplay.form({},'previewDisplay')+'<div class="field span-2"><label for="preview-bio">Biografía</label><textarea id="preview-bio" class="textarea">Biografía de prueba.</textarea></div>'+['Estado','Visibilidad','Plan','Apoyo','Comunidad','Contratación'].map((x,i)=>'<div class="field"><label for="preview-select-'+i+'">'+x+'</label><select id="preview-select-'+i+'" class="select"><option>Opción de prueba</option></select></div>').join('')+'</div>';document.getElementById('modalFoot').innerHTML='<button class="btn btn-ghost" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="closeModal()">Cerrar prueba</button>';document.getElementById('modal').showModal()}
function closeModal(){document.getElementById('modal').close()}
document.querySelectorAll('[data-preview]').forEach(b=>b.onclick=()=>renderPreview(b.dataset.preview));document.getElementById('mobileMenu').onclick=()=>window.UADAVAdminLayout.setMenu(true);document.getElementById('mobileBackdrop').onclick=()=>window.UADAVAdminLayout.setMenu(false);renderPreview('dashboard');
</script><script src="/uadav-responsive.js?v=12005"></script><script src="/uadav-admin-v126.js?v=12012"></script></body></html>
