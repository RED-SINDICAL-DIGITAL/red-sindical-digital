<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Compartir perfil · prueba</title><link rel="stylesheet" href="/uadav-share-v132.css?v=12022"><style>body{background:#080b12;color:#fff;font:16px/1.5 system-ui;margin:0}main{max-width:640px;margin:7vh auto;padding:24px}button{background:#2f6df6;border:0;border-radius:12px;padding:14px;color:#fff;font:inherit;cursor:pointer}.note{color:#a4b1c6}</style><script src="/uadav-share-v136.js?v=12022"></script></head><body><main><p class="note">Prueba con datos ficticios. No modifica perfiles reales.</p><h1>Compartir tu propuesta</h1><p>Elegí el perfil público o la presentación artística publicada.</p><button id="artist">Compartir perfil</button> <button id="kit">Compartir Press Kit</button></main><script>const demo={id:'DEMO',nombre:'Artista de ejemplo',rubro:'Magia y humor',ciudad:'Rosario',bio:'Un espectáculo participativo para toda la familia.',foto:location.origin+'/assets/uadav-share-card.png'};window.fetch=async u=>{const url=new URL(u);if(url.pathname!='/api/public/share-link')throw Error('Prueba aislada');const link=new URL(url.searchParams.get('kind')==='kit'?'/share/presskit':'/share/artista','https://uadav-api.uadavstream.workers.dev');link.searchParams.set('id',url.searchParams.get('id'));return {ok:true,json:async()=>({url:link.href})}};document.getElementById('artist').onclick=()=>UADAVShare.open('artist',demo);document.getElementById('kit').onclick=()=>UADAVShare.open('kit',{name:'Artista de ejemplo',artist_id:'DEMO',bio:'Un espectáculo participativo para toda la familia.',photo:demo.foto});</script></body></html>
