<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Playlists · ★ UADAV STREAM</title><script src="/uadav-api-config.js?v=928"></script><style>body{margin:0;background:#05080d;color:#fff;font-family:Inter,system-ui}.shell{width:min(1300px,92vw);margin:auto;padding:24px 0}.top{display:flex;gap:10px;align-items:center}.btn{border:1px solid #ffffff18;background:#ffffff0b;color:#fff;padding:10px 13px;border-radius:12px;text-decoration:none;font-weight:800}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:22px}.card{border:1px solid #ffffff18;background:#0d141e;border-radius:18px;overflow:hidden}.card img{width:100%;aspect-ratio:1/1;object-fit:cover;background:#111}.copy{padding:12px}.muted{color:#94a3b7;font-size:12px}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.grid{grid-template-columns:1fr}}button,input{font:inherit}.btn,.card{min-height:44px}#playlistSearch{display:block;width:100%;margin-top:8px;min-height:48px;border:1px solid #475569;border-radius:12px;padding:12px;background:#101722;color:#fff}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #8eb0ff;outline-offset:3px}</style><link rel="stylesheet" href="/uadav-ui-v8.4.css?v=928"><script src="/uadav-content-player-v928.js" defer></script></head><body><main class="shell"><div class="top"><button class="btn" onclick="history.back()">← Volver</button><a class="btn" href="/index.html">★ UADAV STREAM</a></div><h1>Playlists</h1><p class="muted">Listas de reproducción de artistas y colecciones.</p><label for="playlistSearch">Buscar una playlist</label><input id="playlistSearch" type="search" placeholder="Nombre o fuente" autocomplete="off"><p id="catalogStatus" role="status" aria-live="polite"></p><button id="retryCatalog" class="btn" hidden>Volver a intentar</button><div id="grid" class="grid"></div></main><script>
const API=window.UADAV_API_BASE||'https://uadav-api.uadavstream.workers.dev/api/',$=id=>document.getElementById(id);
let catalog=[],busy=false;
function render(){const q=$('playlistSearch').value.trim().normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase(),items=catalog.filter(x=>String((x.titulo||x.title||'')+' '+(x.provider||'')).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().includes(q));$('grid').replaceChildren();$('catalogStatus').textContent=items.length+' '+(items.length===1?'playlist':'playlists');if(!items.length){const p=document.createElement('p');p.className='muted';p.textContent=q?'No encontramos playlists con esa búsqueda.':'Todavía no hay playlists publicadas.';$('grid').append(p);return}
for(const x of items){const b=document.createElement('button');b.className='card';b.type='button';b.style.cssText='color:inherit;text-align:left;padding:0;cursor:pointer';const img=document.createElement('img');img.alt='';img.loading='lazy';let image='/media-fallback.svg';try{const u=new URL(x.thumbnail||'',location.origin);if(['https:','http:'].includes(u.protocol))image=u.href}catch{}img.src=image;img.onerror=()=>{img.onerror=null;img.src='/media-fallback.svg'};const copy=document.createElement('div');copy.className='copy';const title=document.createElement('strong');title.textContent=x.titulo||x.title||'Playlist';const meta=document.createElement('div');meta.className='muted';meta.textContent=x.provider||'';copy.append(title,meta);b.append(img,copy);b.setAttribute('aria-label','Abrir playlist: '+title.textContent);b.onclick=()=>{try{const host=parent!==window&&parent.UADAVShellHost;if(host?.playContent)return host.playContent(x)}catch{}window.UADAVContentPlayer?.open(x)};$('grid').append(b)}}
async function load(){if(busy)return;busy=true;$('retryCatalog').hidden=true;$('catalogStatus').textContent='Cargando playlists…';const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),12000);try{const r=await fetch(API+'content?_='+Date.now(),{signal:controller.signal,cache:'no-store'});if(!r.ok)throw Error('catalog');const d=await r.json(),a=Array.isArray(d)?d:Array.isArray(d?.items)?d.items:Array.isArray(d?.content)?d.content:null;if(!a)throw Error('format');catalog=a.filter(x=>x&&typeof x==='object'&&String(x.content_type||x.tipo||'').toLowerCase()==='playlist');render()}catch{$('catalogStatus').textContent='No pudimos cargar las playlists. Intentá de nuevo.';$('retryCatalog').hidden=false}finally{clearTimeout(timer);busy=false}}
$('playlistSearch').addEventListener('input',render);$('retryCatalog').onclick=load;load();
</script><script src="/uadav-ui-v8.4.js?v=928"></script><script src="/uadav-app-bridge-v104.js"></script>
</body></html>
