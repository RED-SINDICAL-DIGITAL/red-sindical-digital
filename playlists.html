<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Playlists · ★ UADAV STREAM</title><script src="/uadav-api-config.js?v=928"></script><style>body{margin:0;background:#05080d;color:#fff;font-family:Inter,system-ui}.shell{width:min(1300px,92vw);margin:auto;padding:24px 0}.top{display:flex;gap:10px;align-items:center}.btn{border:1px solid #ffffff18;background:#ffffff0b;color:#fff;padding:10px 13px;border-radius:12px;text-decoration:none;font-weight:800}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:22px}.card{border:1px solid #ffffff18;background:#0d141e;border-radius:18px;overflow:hidden}.card img{width:100%;aspect-ratio:1/1;object-fit:cover;background:#111}.copy{padding:12px}.muted{color:#94a3b7;font-size:12px}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.grid{grid-template-columns:1fr}}</style><link rel="stylesheet" href="/uadav-ui-v8.4.css?v=928"><script src="/uadav-content-player-v928.js" defer></script></head><body><main class="shell"><div class="top"><button class="btn" onclick="history.back()">← Volver</button><a class="btn" href="/index.html">★ UADAV STREAM</a></div><h1>Playlists</h1><p class="muted">Listas de reproducción de artistas y colecciones.</p><div id="grid" class="grid"></div></main><script>const API=window.UADAV_API_BASE||'https://uadav-api.uadavstream.workers.dev/api/',$=id=>document.getElementById(id);async function load(){try{const a=await fetch(API+'content?_='+Date.now()).then(r=>r.json());const list=(Array.isArray(a)?a:[]).filter(x=>String(x.content_type||x.tipo||'').toLowerCase()==='playlist');$('grid').innerHTML=list.map((x,i)=>`<button class="card" type="button" data-i="${i}" style="color:inherit;text-align:left;padding:0;cursor:pointer"><img src="${x.thumbnail||''}" alt=""><div class="copy"><strong>${x.titulo||'Playlist'}</strong><div class="muted">${x.provider||''}</div></div></button>`).join('')||'<p class="muted">Todavía no hay playlists.</p>';$('grid').querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>window.UADAVContentPlayer?.open(list[Number(b.dataset.i)||0]))}catch{$('grid').innerHTML='<p class="muted">No disponible.</p>'}}load()</script><script src="/uadav-shell-bridge-v928.js"></script><script src="/uadav-ui-v8.4.js?v=928"></script></body></html>
